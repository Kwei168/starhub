der_3", "name": "知乎日报anyfeeder", "cat": "news", "color": "#d32f2f", "items": [{"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "为什么书法界会排斥「江湖体」？", "title_zh": "为什么书法界会排斥「江湖体」？", "summary": "为什么书法界会排斥“江湖体”？\n\n\n\n\n\n花落书香，卖沉香的、业余书法家，传武、中医爱好者。沉香交流：byxm2024\n查看知乎原文\n\n\n\n大多数搞传统书法的书友，会将“江湖书法”归为不学无术，认为不临帖，拿起笔乱写就是市面上常见的“江湖体”！\n不是的，没有这么简单！\n市面上被网友称为“江湖书法”的作品，其实叫“商业书法”更为合理，可以对标绘画里面的“行画”。\n我年轻时候写的江湖体\n江湖书法也是成体系，有非常多的从业者，占据绝大部分的低端市场；因为商业模式的不同，“江湖书法”大概分两大类从业者：\n一是流水线一样，师傅带徒弟的模式，写一笔书的“龙”“虎”“福”“寿”等大字作品，或是“春夏秋冬”“梅兰竹菊”等条屏，写法、用墨，老师傅会有一定的规定。\n年轻人入行先给老师傅打下手，独立练习几个月后，可以尝试写一些简单的，单字的，再逐步写一些中堂配对联，四条屏等，我结识的不少从业者，他们干了很多年，只会写同一幅字，像电子厂工人一样，每天重复性书写。\n对于较为复杂的作品，比如四条屏配画，往往多人配合完成，大字一个人，小字一个人，画则又是另一个人。", "summary_zh": "为什么书法界会排斥“江湖体”？\n\n\n\n\n\n花落书香，卖沉香的、业余书法家，传武、中医爱好者。沉香交流：byxm2024\n查看知乎原文\n\n\n\n大多数搞传统书法的书友，会将“江湖书法”归为不学无术，认为不临帖，拿起笔乱写就是市面上常见的“江湖体”！\n不是的，没有这么简单！\n市面上被网友称为“江湖书法”的作品，其实叫“商业书法”更为合理，可以对标绘画里面的“行画”。\n我年轻时候写的江湖体\n江湖书法也是成体系，有非常多的从业者，占据绝大部分的低端市场；因为商业模式的不同，“江湖书法”大概分两大类从业者：\n一是流水线一样，师傅带徒弟的模式，写一笔书的“龙”“虎”“福”“寿”等大字作品，或是“春夏秋冬”“梅兰竹菊”等条屏，写法、用墨，老师傅会有一定的规定。\n年轻人入行先给老师傅打下手，独立练习几个月后，可以尝试写一些简单的，单字的，再逐步写一些中堂配对联，四条屏等，我结识的不少从业者，他们干了很多年，只会写同一幅字，像电子厂工人一样，每天重复性书写。\n对于较为复杂的作品，比如四条屏配画，往往多人配合完成，大字一个人，小字一个人，画则又是另一个人。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "野外河沟里的蚊子吸谁的血？", "title_zh": "野外河沟里的蚊子吸谁的血？", "summary": "斜绿天蛾，点进主页你会发现，这人真就只在乎虫子\n查看知乎原文\n\n\n\n这个问题体现了一些大众对蚊子的常见误会。\n首先……第一个误会是，以为蚊子要吸血才能活。\n其实如果蚊子只是要维持生命，是不需要吸血的。\n蚊子的主食是含糖液体，在野外，这些液体的来源主要是花蜜；它们也可以吃地面上水果的果汁，或是半翅目昆虫分泌的蜜露。在室内它们还会喝人类的含糖饮料。\n蚊子在野外吃花蜜。图中是一只雌虫\n糖才是维持生命活动的基本物质。而血液，主要是用来补充蛋白质的，只有雌性蚊子繁殖时才需要吸血，血液对它们来说可以算是特定时期的营养品。\n……甚至，其实蚊子吸血后，寿命会有所缩短。消化血液的过程和启动繁殖的流程都会对它们的身体带来消耗。\n完全不吃东西的情况下，如果气温较低，蚊子也可以休眠并存活几个月的时间（一些物种可以在中途随时醒来）\n虽然说呢，现实中大多数物种的蚊子，确实需要至少吸血一次，才能顺利产卵。所以，如果要维持种群，还是需要环境中有一些动物可吸的\n但是……一般来说，“河沟里”这种环境，可不存在“动物不多见”这种情况呀。\n嗯，第二个误区是……认为蚊子只吸人血或某些大型动物的血。\n没有人类完全无所谓。", "summary_zh": "斜绿天蛾，点进主页你会发现，这人真就只在乎虫子\n查看知乎原文\n\n\n\n这个问题体现了一些大众对蚊子的常见误会。\n首先……第一个误会是，以为蚊子要吸血才能活。\n其实如果蚊子只是要维持生命，是不需要吸血的。\n蚊子的主食是含糖液体，在野外，这些液体的来源主要是花蜜；它们也可以吃地面上水果的果汁，或是半翅目昆虫分泌的蜜露。在室内它们还会喝人类的含糖饮料。\n蚊子在野外吃花蜜。图中是一只雌虫\n糖才是维持生命活动的基本物质。而血液，主要是用来补充蛋白质的，只有雌性蚊子繁殖时才需要吸血，血液对它们来说可以算是特定时期的营养品。\n……甚至，其实蚊子吸血后，寿命会有所缩短。消化血液的过程和启动繁殖的流程都会对它们的身体带来消耗。\n完全不吃东西的情况下，如果气温较低，蚊子也可以休眠并存活几个月的时间（一些物种可以在中途随时醒来）\n虽然说呢，现实中大多数物种的蚊子，确实需要至少吸血一次，才能顺利产卵。所以，如果要维持种群，还是需要环境中有一些动物可吸的\n但是……一般来说，“河沟里”这种环境，可不存在“动物不多见”这种情况呀。\n嗯，第二个误区是……认为蚊子只吸人血或某些大型动物的血。\n没有人类完全无所谓。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "历史上的每个朝代都有哪些烂大街的名字?", "title_zh": "历史上的每个朝代都有哪些烂大街的名字?", "summary": "宁南左侯，太极生二姨\n查看知乎原文\n\n\n\n明朝后期的“承恩”啊，大规模出现在嘉靖后期和万历时期，所以到万历中后期开始广泛出现在各个战线上。\n府军前卫就有实授百户李承恩，万历三十一年八年袭职，时年四十四岁。\n\n百户徐承恩，万历三年承袭，时年二十四岁。\n\n试百户卢承恩，嘉靖四十一年承袭，时年三十一岁。\n\n百户刘承恩，嘉靖四十四年承袭，时年十岁。\n\n百户刘承恩 2.0，隆庆三年承袭，时年二十三岁。\n\n百户李承恩 2.0，万历二十一年承袭，时年二十一岁。\n\n副千户杨承恩，万历二十年承袭，时年十九岁。\n\n百户刘承恩 3.0，万历十年承袭，时年十六岁。\n\n试百户张承恩 2.0，万历二十四年承袭，时年一岁。\n\n除此之外，还有锦衣卫指挥使安承恩、海承恩、白承恩，指挥同知裴承恩、王承恩，指挥佥事奚承恩、郤承恩、张承恩，千户马承恩、王承恩，副千户刘承恩、吴承恩，百户胡承恩、张承恩，镇抚马承恩、赵承恩。宁远卫千户王承恩，副千户徐承恩、袁承恩、余承恩，试百户崔承恩。青州左卫副千户赵承恩。羽林前卫副千户王承恩，百户黄承恩。", "summary_zh": "宁南左侯，太极生二姨\n查看知乎原文\n\n\n\n明朝后期的“承恩”啊，大规模出现在嘉靖后期和万历时期，所以到万历中后期开始广泛出现在各个战线上。\n府军前卫就有实授百户李承恩，万历三十一年八年袭职，时年四十四岁。\n\n百户徐承恩，万历三年承袭，时年二十四岁。\n\n试百户卢承恩，嘉靖四十一年承袭，时年三十一岁。\n\n百户刘承恩，嘉靖四十四年承袭，时年十岁。\n\n百户刘承恩 2.0，隆庆三年承袭，时年二十三岁。\n\n百户李承恩 2.0，万历二十一年承袭，时年二十一岁。\n\n副千户杨承恩，万历二十年承袭，时年十九岁。\n\n百户刘承恩 3.0，万历十年承袭，时年十六岁。\n\n试百户张承恩 2.0，万历二十四年承袭，时年一岁。\n\n除此之外，还有锦衣卫指挥使安承恩、海承恩、白承恩，指挥同知裴承恩、王承恩，指挥佥事奚承恩、郤承恩、张承恩，千户马承恩、王承恩，副千户刘承恩、吴承恩，百户胡承恩、张承恩，镇抚马承恩、赵承恩。宁远卫千户王承恩，副千户徐承恩、袁承恩、余承恩，试百户崔承恩。青州左卫副千户赵承恩。羽林前卫副千户王承恩，百户黄承恩。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "瞎扯 · 如何正确地吐槽", "title_zh": "瞎扯 · 如何正确地吐槽", "summary": "瞎扯 · 诸葛亮在四川有着怎样的地位？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ： 诸葛亮在四川有着怎样的地位？\n\n@境外势力\n ：之前去武侯祠玩 吓哭了\n\n\n\n\n\n\n\n\n\nQ：有哪些非常冷门的冷知识？\n\n@何锐锐\n ： 1 、基围虾：基地围场的养殖虾。2 、砂糖橘：砂糖村产的橘子，故名，与甜度无关。3 、口蘑：全称「张家口蘑菇」，内蒙古的蘑菇拉到张家口售卖而得名。4 、蛇果，美国红苹果，英文名叫 red delicious apple ，香港音译过来叫红地厘蛇苹果，简称蛇果。5 、巴西松子：来自巴基斯坦，巴西其实是「巴基斯坦西部」的缩写。6 、九尺鹅肠：起源于四川省成都市彭州市九尺镇，故名。7 、车厘子：就是欧洲甜樱桃，名字来源于樱桃「 cherries 」的音译。\nQ：你见过的真正的 Photoshop 高手是什么样的？\n\n@太谷很能打\n ：在影楼，老板叫修图的小姑娘做个表格，小姑娘不会 Excel ，硬是用 PS 画了一个表格。\nQ：如果一门课程的作业可以用 AI 完成，这门课该不该取消？", "summary_zh": "瞎扯 · 诸葛亮在四川有着怎样的地位？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ： 诸葛亮在四川有着怎样的地位？\n\n@境外势力\n ：之前去武侯祠玩 吓哭了\n\n\n\n\n\n\n\n\n\nQ：有哪些非常冷门的冷知识？\n\n@何锐锐\n ： 1 、基围虾：基地围场的养殖虾。2 、砂糖橘：砂糖村产的橘子，故名，与甜度无关。3 、口蘑：全称「张家口蘑菇」，内蒙古的蘑菇拉到张家口售卖而得名。4 、蛇果，美国红苹果，英文名叫 red delicious apple ，香港音译过来叫红地厘蛇苹果，简称蛇果。5 、巴西松子：来自巴基斯坦，巴西其实是「巴基斯坦西部」的缩写。6 、九尺鹅肠：起源于四川省成都市彭州市九尺镇，故名。7 、车厘子：就是欧洲甜樱桃，名字来源于樱桃「 cherries 」的音译。\nQ：你见过的真正的 Photoshop 高手是什么样的？\n\n@太谷很能打\n ：在影楼，老板叫修图的小姑娘做个表格，小姑娘不会 Excel ，硬是用 PS 画了一个表格。\nQ：如果一门课程的作业可以用 AI 完成，这门课该不该取消？", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "《寄生虫》里的豪宅，看起来没什么东西，豪在哪里？", "title_zh": "《寄生虫》里的豪宅，看起来没什么东西，豪在哪里？", "summary": "李毅二一个，美食电器｜智能家居｜新能源车主\n查看知乎原文\n\n\n\n贫穷，是被迫把空间塞满；真正的富裕，是拥有大量可以白白浪费的空间\n先把两组关键数据摆出来，电影《寄生虫》中：\n金家 4 口人，半地下室套内约 26㎡，人均 6.5㎡\n朴家 4 口人，豪宅室内套内约 450㎡，地块总占地 1983㎡，套内人均 112.5㎡，地块人均 495.8 ㎡\n朴家人均室内居住空间，是金家的 17 倍，地块人均使用空间是金家的约 76 倍\n\n\n要知道金家人均只有 6.5㎡\n厨房、睡觉、吃饭、洗衣服全部挤在同一个空间\n杂物、衣架、纸箱堆满角落，马桶高高架起，过道仅容一人通过\n他们不是不想留白，而是没有资格留白，任何一块空地，都必须用来堆放物品、承载生活功能。\n在金家的认知里：屋子必须摆满东西，空间才算物尽其用\n这也是观众下意识的评判标准——我们习惯用物品多少衡量房屋档次\n\n而朴社长的豪宅家具寥寥，不是没钱添置装饰，而是不需要靠杂物填满空间。\n客厅巨大挑空、超长落地玻璃窗，大片区域没有摆放任何柜体、大型家具；宽阔走廊、空置休息区、开放式餐厨，大量区域不承担硬性生活功能。", "summary_zh": "李毅二一个，美食电器｜智能家居｜新能源车主\n查看知乎原文\n\n\n\n贫穷，是被迫把空间塞满；真正的富裕，是拥有大量可以白白浪费的空间\n先把两组关键数据摆出来，电影《寄生虫》中：\n金家 4 口人，半地下室套内约 26㎡，人均 6.5㎡\n朴家 4 口人，豪宅室内套内约 450㎡，地块总占地 1983㎡，套内人均 112.5㎡，地块人均 495.8 ㎡\n朴家人均室内居住空间，是金家的 17 倍，地块人均使用空间是金家的约 76 倍\n\n\n要知道金家人均只有 6.5㎡\n厨房、睡觉、吃饭、洗衣服全部挤在同一个空间\n杂物、衣架、纸箱堆满角落，马桶高高架起，过道仅容一人通过\n他们不是不想留白，而是没有资格留白，任何一块空地，都必须用来堆放物品、承载生活功能。\n在金家的认知里：屋子必须摆满东西，空间才算物尽其用\n这也是观众下意识的评判标准——我们习惯用物品多少衡量房屋档次\n\n而朴社长的豪宅家具寥寥，不是没钱添置装饰，而是不需要靠杂物填满空间。\n客厅巨大挑空、超长落地玻璃窗，大片区域没有摆放任何柜体、大型家具；宽阔走廊、空置休息区、开放式餐厨，大量区域不承担硬性生活功能。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "为什么有时候天空中的云朵会有比较清晰的边界？", "title_zh": "为什么有时候天空中的云朵会有比较清晰的边界？", "summary": "西风带，气象/宏观生物学爱好者，KSP玩家，喜欢太空\n查看知乎原文\n\n\n\n高赞 @Devymex Wang 的解释几乎完全是错误的。\n正确了一半的部分：“由于自由扩散作用的存在，在一定空间内水汽浓度的变化是相对平缓的。”\n错误的部分：之后所有的步骤\n下面我将从云微物理学的角度回答这个问题。\n大气科学 第二版 ISBN：9787030225955\n\n先问是不是：所有云的边界都是清晰的吗？\n先看几张图：\n积云 https://cloudatlas.wmo.int/zh-hans/search-image-gallery.html 图像 ID：5977\n在夏天经常能看见的积云，它的边界是清晰的。\n层云组成的云海 https://cloudatlas.wmo.int/zh-hans/search-image-gallery.html 图像 ID：6063\n湿润的天气经常能见到的层云，虽然从地面上看它是糊成一片的，但是它的上表面和下表面仍然是基本清晰的。", "summary_zh": "西风带，气象/宏观生物学爱好者，KSP玩家，喜欢太空\n查看知乎原文\n\n\n\n高赞 @Devymex Wang 的解释几乎完全是错误的。\n正确了一半的部分：“由于自由扩散作用的存在，在一定空间内水汽浓度的变化是相对平缓的。”\n错误的部分：之后所有的步骤\n下面我将从云微物理学的角度回答这个问题。\n大气科学 第二版 ISBN：9787030225955\n\n先问是不是：所有云的边界都是清晰的吗？\n先看几张图：\n积云 https://cloudatlas.wmo.int/zh-hans/search-image-gallery.html 图像 ID：5977\n在夏天经常能看见的积云，它的边界是清晰的。\n层云组成的云海 https://cloudatlas.wmo.int/zh-hans/search-image-gallery.html 图像 ID：6063\n湿润的天气经常能见到的层云，虽然从地面上看它是糊成一片的，但是它的上表面和下表面仍然是基本清晰的。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "红伞白点的蘑菇为什么成了全世界最经典的蘑菇形象？", "title_zh": "红伞白点的蘑菇为什么成了全世界最经典的蘑菇形象？", "summary": "知乎用户，嗜猫事猫是猫\n查看知乎原文\n\n\n\n因为这种白杆、红伞还缀满浅色疣点的蘑菇，特征过于明显，可能是古人类标记的第一种毒蘑菇：毒蝇鹅膏 （毒蝇伞 Amanita muscaria），并在欧美为主的文化、宗教甚至生活中承担了不可或缺的角色，比如已知的人类第一种生物杀虫剂，就是将毒蝇鹅膏伞盖捣碎了混入厨余、果渣和牛奶中，用来毒杀前来舔舐的苍蝇等小飞虫，这也是俗称“毒蝇伞 Fly Agaric‌”的由来。\n毒蝇鹅膏各生长阶段形态\n毒蝇鹅膏含有蝇蕈醇、鹅膏蕈氨酸和毒蕈碱等神经活性物质，生食可致命，即使烹调加热后食用，毒性只会减弱，仍然会导致恶心、呕吐、幻觉、抽搐、癫痫等；所以在古人类还没发展出原始农业的采集渔猎时代，毒蝇鹅膏这种颜色鲜艳、特征鲜明的毒菇，形成了流传至今、有一定局限性的蘑菇识别方式之一：颜色鲜艳的蘑菇有毒，越鲜艳越有毒。\n最常见的毒蝇鹅膏形象\n毒蝇鹅膏几乎在全球每个角落都有分布，因其属于可致幻的神经毒性蘑菇，在各个国家的原始宗教中常被用来“通神”，又被赋予了神秘主义神性的光环，经常作为宗教人士或巫师“通灵”的必备品；", "summary_zh": "知乎用户，嗜猫事猫是猫\n查看知乎原文\n\n\n\n因为这种白杆、红伞还缀满浅色疣点的蘑菇，特征过于明显，可能是古人类标记的第一种毒蘑菇：毒蝇鹅膏 （毒蝇伞 Amanita muscaria），并在欧美为主的文化、宗教甚至生活中承担了不可或缺的角色，比如已知的人类第一种生物杀虫剂，就是将毒蝇鹅膏伞盖捣碎了混入厨余、果渣和牛奶中，用来毒杀前来舔舐的苍蝇等小飞虫，这也是俗称“毒蝇伞 Fly Agaric‌”的由来。\n毒蝇鹅膏各生长阶段形态\n毒蝇鹅膏含有蝇蕈醇、鹅膏蕈氨酸和毒蕈碱等神经活性物质，生食可致命，即使烹调加热后食用，毒性只会减弱，仍然会导致恶心、呕吐、幻觉、抽搐、癫痫等；所以在古人类还没发展出原始农业的采集渔猎时代，毒蝇鹅膏这种颜色鲜艳、特征鲜明的毒菇，形成了流传至今、有一定局限性的蘑菇识别方式之一：颜色鲜艳的蘑菇有毒，越鲜艳越有毒。\n最常见的毒蝇鹅膏形象\n毒蝇鹅膏几乎在全球每个角落都有分布，因其属于可致幻的神经毒性蘑菇，在各个国家的原始宗教中常被用来“通神”，又被赋予了神秘主义神性的光环，经常作为宗教人士或巫师“通灵”的必备品；", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "瞎扯 · 如何正确地吐槽", "title_zh": "瞎扯 · 如何正确地吐槽", "summary": "瞎扯 · 你见过最不会点菜的人是什么样子的？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：你见过最不会点菜的人是什么样子的？\n\n@子侯\n ：一个寝室四个人每人点一个，分别是咸烧白，甜烧白，东坡肘子，红烧肉。\nQ：我十四岁的孩子不吃我做的饭，怎么办？\n\n@闰土当年万户侯\n ：老婆给我做的排骨汤，我一句话不敢说。\n\n\n\nQ： 在国外旅行时，你发现过哪些中国符号？\n\n@念诗的人\n ：去年 3 月 29 号在东京上野的某个路灯杆上\n\n\n\nQ：有哪些童言童行惊艳到你？\n\n@windy\n ：五一玩疯了，到家之后小侄子说：「妈妈，我的腿像果冻一样了。」   \nQ：搞科研的人，有哪些专用的表情包？\n\n@Aurelia Nova\n ：看看咱们组的：\n\n\n\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "summary_zh": "瞎扯 · 你见过最不会点菜的人是什么样子的？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：你见过最不会点菜的人是什么样子的？\n\n@子侯\n ：一个寝室四个人每人点一个，分别是咸烧白，甜烧白，东坡肘子，红烧肉。\nQ：我十四岁的孩子不吃我做的饭，怎么办？\n\n@闰土当年万户侯\n ：老婆给我做的排骨汤，我一句话不敢说。\n\n\n\nQ： 在国外旅行时，你发现过哪些中国符号？\n\n@念诗的人\n ：去年 3 月 29 号在东京上野的某个路灯杆上\n\n\n\nQ：有哪些童言童行惊艳到你？\n\n@windy\n ：五一玩疯了，到家之后小侄子说：「妈妈，我的腿像果冻一样了。」   \nQ：搞科研的人，有哪些专用的表情包？\n\n@Aurelia Nova\n ：看看咱们组的：\n\n\n\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "蘑菇界有哪些特别的存在？", "title_zh": "蘑菇界有哪些特别的存在？", "summary": "小星有鬼，自然博物写作者，在鸟兽草木间寻找诗意和真相。\n查看知乎原文\n\n\n\n小菇科小菇属 （Mycena）有一些造型可爱的菌子，譬如暗蓝小菇 （Mycena lazulina）：\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇，有多小这就很明显了\n同样是蓝色的靛藍小菇（ Mycena indigotica）\n靛藍小菇\n靛藍小菇\n靛藍小菇\n靛藍小菇\n同样是蓝色的近蓝盖小菇 （Mycena subcyanocephala）\n近蓝盖小菇\n近蓝盖小菇\n近蓝盖小菇\n近蓝盖小菇\n近蓝盖小菇，可见其有多小\n此外，还有炫蓝蘑菇（Mycena interrupta）\n炫蓝蘑菇\n炫蓝蘑菇\n炫蓝蘑菇\n这也是一种特别小的蘑菇，菌盖直径通常在 0.6 至 2 厘米之间，菌柄高度也只有 1 至 2 厘米左右。刚刚长出来的子实体呈现晶莹的蓝色，慢慢的从菌盖边缘开始褪色，成熟后颜色会从边缘开始逐渐褪淡，变成蓝白色或灰白色。\n炫蓝蘑菇是一种腐生真菌，喜欢生长在在雨林、桉树林等潮湿环境中的腐木上，主要分布在澳大利亚、新西兰和智利等地。在中国湖南炎陵地区也曾有过罕见记录的报道。", "summary_zh": "小星有鬼，自然博物写作者，在鸟兽草木间寻找诗意和真相。\n查看知乎原文\n\n\n\n小菇科小菇属 （Mycena）有一些造型可爱的菌子，譬如暗蓝小菇 （Mycena lazulina）：\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇\n暗蓝小菇，有多小这就很明显了\n同样是蓝色的靛藍小菇（ Mycena indigotica）\n靛藍小菇\n靛藍小菇\n靛藍小菇\n靛藍小菇\n同样是蓝色的近蓝盖小菇 （Mycena subcyanocephala）\n近蓝盖小菇\n近蓝盖小菇\n近蓝盖小菇\n近蓝盖小菇\n近蓝盖小菇，可见其有多小\n此外，还有炫蓝蘑菇（Mycena interrupta）\n炫蓝蘑菇\n炫蓝蘑菇\n炫蓝蘑菇\n这也是一种特别小的蘑菇，菌盖直径通常在 0.6 至 2 厘米之间，菌柄高度也只有 1 至 2 厘米左右。刚刚长出来的子实体呈现晶莹的蓝色，慢慢的从菌盖边缘开始褪色，成熟后颜色会从边缘开始逐渐褪淡，变成蓝白色或灰白色。\n炫蓝蘑菇是一种腐生真菌，喜欢生长在在雨林、桉树林等潮湿环境中的腐木上，主要分布在澳大利亚、新西兰和智利等地。在中国湖南炎陵地区也曾有过罕见记录的报道。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "为什么西方人起名动辄使用天使、圣徒的名字？他们都不知道要避讳吗？", "title_zh": "为什么西方人起名动辄使用天使、圣徒的名字？他们都不知道要避讳吗？", "summary": "知乎用户，宁静慎独，讷于言，敏于行。\n查看知乎原文\n\n\n\n因为欧洲人的名字被秦制大一统了，法律规定只能从教会限定的词库里选。\n不然为什么满大街的约翰、彼得、保罗、玛丽？\n他们的祖先可不是这样命名的。\n皈依基督教之前，欧洲蛮族更习惯将带有美好或凶猛寓意的词素进行拼接，最常使用的是代表野兽（狼、熊）、武器（矛、盾）或美德（荣耀、高贵）的词素，带有浓厚的日耳曼多神教、尚武和自然崇拜色彩。\n贝尔德温：Bealdwine (Baldwin) = 勇敢 (Bold) + 朋友 (Friend)\n赫罗德伯特：Hreodbeorht (Robert) = 荣耀 (Glory) + 闪耀 (Bright)\n伍尔夫西格：Wulfsige = 狼 (Wolf) + 胜利 (Victory)\n法兰克王国开国君主克洛维一世，他的名字 Chlodovech（克洛多维希）由词根 Chlod（荣耀）和 Vech（战士）拼接而来。\n圣雷米吉乌斯为克洛维一世施洗\n这时候的名字自由度其实相当高，就是像汉语中双字名字，选两个寓意好的字进行组合。\n汉语中的单字，等于一个词素，重名情况自然相对较少。", "summary_zh": "知乎用户，宁静慎独，讷于言，敏于行。\n查看知乎原文\n\n\n\n因为欧洲人的名字被秦制大一统了，法律规定只能从教会限定的词库里选。\n不然为什么满大街的约翰、彼得、保罗、玛丽？\n他们的祖先可不是这样命名的。\n皈依基督教之前，欧洲蛮族更习惯将带有美好或凶猛寓意的词素进行拼接，最常使用的是代表野兽（狼、熊）、武器（矛、盾）或美德（荣耀、高贵）的词素，带有浓厚的日耳曼多神教、尚武和自然崇拜色彩。\n贝尔德温：Bealdwine (Baldwin) = 勇敢 (Bold) + 朋友 (Friend)\n赫罗德伯特：Hreodbeorht (Robert) = 荣耀 (Glory) + 闪耀 (Bright)\n伍尔夫西格：Wulfsige = 狼 (Wolf) + 胜利 (Victory)\n法兰克王国开国君主克洛维一世，他的名字 Chlodovech（克洛多维希）由词根 Chlod（荣耀）和 Vech（战士）拼接而来。\n圣雷米吉乌斯为克洛维一世施洗\n这时候的名字自由度其实相当高，就是像汉语中双字名字，选两个寓意好的字进行组合。\n汉语中的单字，等于一个词素，重名情况自然相对较少。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "河狸的牙齿为什么是橙色的？", "title_zh": "河狸的牙齿为什么是橙色的？", "summary": "苏澄宇，自然科学/分享动物们的小秘密/Animalonearth\n查看知乎原文\n\n\n\n2021 年 4 月，加拿大不列颠哥伦比亚省的小镇坦布勒里奇突然断网[1]。\n运营商沿着线路排查，最后发现光纤断了。犯案的正是河狸。\n\n它们沿着溪边挖到地下约 90 厘米深处，先咬穿保护光缆的粗导管，再把里面的光纤咬坏了好几处。\n事故现场照，CBS 使用的现场照片能直接看到维修人员挖开的泥沟和通信线，比普通河狸啃树图强很多。\n大约 900 名互联网用户和 60 名电视用户受到影响。\n咬的原因大抵是为了磨牙。\n\n河狸门牙会终生生长，也会在啃木头时不断磨损。\n2023 年的一项研究发现[2]，它保持锋利并不只是因为“外硬内软”。门牙内外两种牙釉质硬度其实差不多，但内层磨损速度大约是外层的 2.5 倍。\n\n不同的微观结构控制裂纹扩展，于是牙齿一边被磨掉，一边把刃口重新磨出来。\n不过光看它的牙齿，最显眼的倒不是它多锋利，而是它的颜色。\n河狸的门牙为什么是橙褐色的？\n\n\n过去最常见的答案很简单：因为牙齿里有铁。\n确实，河狸和不少啮齿动物的门牙外层富含铁。", "summary_zh": "苏澄宇，自然科学/分享动物们的小秘密/Animalonearth\n查看知乎原文\n\n\n\n2021 年 4 月，加拿大不列颠哥伦比亚省的小镇坦布勒里奇突然断网[1]。\n运营商沿着线路排查，最后发现光纤断了。犯案的正是河狸。\n\n它们沿着溪边挖到地下约 90 厘米深处，先咬穿保护光缆的粗导管，再把里面的光纤咬坏了好几处。\n事故现场照，CBS 使用的现场照片能直接看到维修人员挖开的泥沟和通信线，比普通河狸啃树图强很多。\n大约 900 名互联网用户和 60 名电视用户受到影响。\n咬的原因大抵是为了磨牙。\n\n河狸门牙会终生生长，也会在啃木头时不断磨损。\n2023 年的一项研究发现[2]，它保持锋利并不只是因为“外硬内软”。门牙内外两种牙釉质硬度其实差不多，但内层磨损速度大约是外层的 2.5 倍。\n\n不同的微观结构控制裂纹扩展，于是牙齿一边被磨掉，一边把刃口重新磨出来。\n不过光看它的牙齿，最显眼的倒不是它多锋利，而是它的颜色。\n河狸的门牙为什么是橙褐色的？\n\n\n过去最常见的答案很简单：因为牙齿里有铁。\n确实，河狸和不少啮齿动物的门牙外层富含铁。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "瞎扯 · 如何正确地吐槽", "title_zh": "瞎扯 · 如何正确地吐槽", "summary": "瞎扯 · 你见过最反人类的设计是什么？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：你见过最反人类的设计是什么？\n\n@WhatTheDuck\n ：糖三角，几十年了都没想明白怎么吃才不会让糖撒出来\nQ：掉 san 究竟是一种怎样的体验？\n\n@这次一定\n ：猪眼睛砂锅饭还越加越多真顶不住\n\n\n\nQ：最令你醍醐灌顶的一句话是什么？\n\n@冰箱菌\n ：今天刚看到的：好想把这张图设置成头像，又怕被领导打死。算了算了。\n\n\n\nQ：为什么有些猫咪不喜欢被抱？\n\n@一苇奈何\n ：看人。。我家猫只允许我抱 15 秒，时间卡的很准，一超时，马上开始挣扎。。除非你抱它去看鱼。。只有抱着它看鱼的时候，它才老实。。眼神清澈， 专注。。还伸着脖子。。同时全身蠕动，对你发出信号：可以抱的再靠前些，孤要伸爪子抓鱼了。。\n Q：为什么说《名侦探柯南》崩了？\n\n@冯虚御风\n ：水的太久了，久的让人已经忘记了，黑衣组织把人变小到底是为什么？\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "summary_zh": "瞎扯 · 你见过最反人类的设计是什么？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：你见过最反人类的设计是什么？\n\n@WhatTheDuck\n ：糖三角，几十年了都没想明白怎么吃才不会让糖撒出来\nQ：掉 san 究竟是一种怎样的体验？\n\n@这次一定\n ：猪眼睛砂锅饭还越加越多真顶不住\n\n\n\nQ：最令你醍醐灌顶的一句话是什么？\n\n@冰箱菌\n ：今天刚看到的：好想把这张图设置成头像，又怕被领导打死。算了算了。\n\n\n\nQ：为什么有些猫咪不喜欢被抱？\n\n@一苇奈何\n ：看人。。我家猫只允许我抱 15 秒，时间卡的很准，一超时，马上开始挣扎。。除非你抱它去看鱼。。只有抱着它看鱼的时候，它才老实。。眼神清澈， 专注。。还伸着脖子。。同时全身蠕动，对你发出信号：可以抱的再靠前些，孤要伸爪子抓鱼了。。\n Q：为什么说《名侦探柯南》崩了？\n\n@冯虚御风\n ：水的太久了，久的让人已经忘记了，黑衣组织把人变小到底是为什么？\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "概率（Probability）的本质是什么？", "title_zh": "概率（Probability）的本质是什么？", "summary": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n恭喜，当你思考起关于“概率”的问题，并发出疑惑时，你应该已经开始认识到，这绝不是一个简单的事情了。事实上，如果你展开探究的话，最终会发现这是一个深不见底的大坑。直到今天，科学家和哲学家们仍然在为这个问题苦苦思索。\n什么是“概率”？如果你去问数学家的话，他们会抛出一连串晦涩的名词，诸如样本空间、σ函数、勒贝格积分或者概率测度之类，不过，我们在这里不需要深入细节，只需要知道这个东西在数学上有着完善的定义即可。\n但问题是，数学上定义良好的东西，未必在现实里存在。比方说数学上可以定义一个完美的正圆，但它显然并不存在于物理世界。从历史上看，“概率”的概念起源于赌场里的经验，我们无法预测一颗骰子投掷的具体结果，但直觉告诉我们，可以把它分成 6 种“均等的可能性”。因此，不妨假设每种可能性的“概率”都是 1/6。基于这种简单的理念，卡尔达诺、帕斯卡、费马、伯努利、棣莫弗等人前仆后继，为概率的数学理论打下了基础，最终由拉普拉斯集而大成，建立起了古典概率论的完整大厦。\n“概率”起源于赌博\n然而，我们的核心问题仍然没有得到回答。", "summary_zh": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n恭喜，当你思考起关于“概率”的问题，并发出疑惑时，你应该已经开始认识到，这绝不是一个简单的事情了。事实上，如果你展开探究的话，最终会发现这是一个深不见底的大坑。直到今天，科学家和哲学家们仍然在为这个问题苦苦思索。\n什么是“概率”？如果你去问数学家的话，他们会抛出一连串晦涩的名词，诸如样本空间、σ函数、勒贝格积分或者概率测度之类，不过，我们在这里不需要深入细节，只需要知道这个东西在数学上有着完善的定义即可。\n但问题是，数学上定义良好的东西，未必在现实里存在。比方说数学上可以定义一个完美的正圆，但它显然并不存在于物理世界。从历史上看，“概率”的概念起源于赌场里的经验，我们无法预测一颗骰子投掷的具体结果，但直觉告诉我们，可以把它分成 6 种“均等的可能性”。因此，不妨假设每种可能性的“概率”都是 1/6。基于这种简单的理念，卡尔达诺、帕斯卡、费马、伯努利、棣莫弗等人前仆后继，为概率的数学理论打下了基础，最终由拉普拉斯集而大成，建立起了古典概率论的完整大厦。\n“概率”起源于赌博\n然而，我们的核心问题仍然没有得到回答。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "在选择和使用止痛药时，普通人有哪些常见误区？", "title_zh": "在选择和使用止痛药时，普通人有哪些常见误区？", "summary": "庄有猫，知乎医学话题优秀答主\n查看知乎原文\n\n\n\n对乙酰氨基酚和布洛芬虽然是很多人常用的解热镇痛药，但是它俩的差异其实非常大。\n上周末我重看谍影重重 4，看到女主买药时药店老板娘特地交代，说这个扑热息痛（对乙酰氨基酚）要饭后吃，我立马想这是错的！不要误导人家！\n\n咱们今天就聊聊这个话题，讲点干货以及怎么用。\n1.先说最基础的一个知识。布洛芬属于 NSAIDs（非甾体类抗炎药），同属 NSAIDs 并且常用的还有阿司匹林、塞来昔布、双氯芬酸、吲哚美辛和洛索洛芬等。\n可能有人要问它们叫「非甾体」，那甾体类抗炎药是什么？在抗炎药这个语境下，甾体类抗炎药就是糖皮质激素，就是你见过那些名字后面带「松」或者「龙」的（比如地塞米松、泼尼松、甲泼尼龙等）。\nNSAIDs 和糖皮质激素的作用机制核心差异在于前者抑制 COX 酶（环氧合酶），后者影响基因表达，调控几百个炎症通路，所以糖皮质激素的抗炎作用极强，副作用也明显更多，这是一般解热镇痛更常使用 NSAIDs 的原因。\n而对乙酰氨基酚则是很独特的一个存在，首先它并不属于 NSAIDs，其次因为它的抗炎作用非常弱，主要作用部位在中枢神经系统。", "summary_zh": "庄有猫，知乎医学话题优秀答主\n查看知乎原文\n\n\n\n对乙酰氨基酚和布洛芬虽然是很多人常用的解热镇痛药，但是它俩的差异其实非常大。\n上周末我重看谍影重重 4，看到女主买药时药店老板娘特地交代，说这个扑热息痛（对乙酰氨基酚）要饭后吃，我立马想这是错的！不要误导人家！\n\n咱们今天就聊聊这个话题，讲点干货以及怎么用。\n1.先说最基础的一个知识。布洛芬属于 NSAIDs（非甾体类抗炎药），同属 NSAIDs 并且常用的还有阿司匹林、塞来昔布、双氯芬酸、吲哚美辛和洛索洛芬等。\n可能有人要问它们叫「非甾体」，那甾体类抗炎药是什么？在抗炎药这个语境下，甾体类抗炎药就是糖皮质激素，就是你见过那些名字后面带「松」或者「龙」的（比如地塞米松、泼尼松、甲泼尼龙等）。\nNSAIDs 和糖皮质激素的作用机制核心差异在于前者抑制 COX 酶（环氧合酶），后者影响基因表达，调控几百个炎症通路，所以糖皮质激素的抗炎作用极强，副作用也明显更多，这是一般解热镇痛更常使用 NSAIDs 的原因。\n而对乙酰氨基酚则是很独特的一个存在，首先它并不属于 NSAIDs，其次因为它的抗炎作用非常弱，主要作用部位在中枢神经系统。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "亚里士多德提出的「物体下落速度和重量成正比」的理论是怎么存在了一千多年的？", "title_zh": "亚里士多德提出的「物体下落速度和重量成正比」的理论是怎么存在了一千多年的？", "summary": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n因为很多人完全误解了亚里士多德，尤其是把他哲学体系中特有的概念“重性”、“轻性”和现代意义上的“重量”相混淆。实际上，亚里士多德根本没有说过（现代人理解意义上的）“重量和下落速度成正比”。\n为此，我们需要先简单地了解一下亚里士多德的哲学观念。在亚里士多德看来，世间万物都有两种固有的属性，一种叫做“重”（gravitas），一种叫做“轻”（levitas），有时也翻译成“重性”和“轻性”。在《论天》中，亚里士多德详细地讨论了这两种性质，在他看来，所谓的“重”，就是“向着宇宙中心运动”，而“轻”则正好相反，是“远离宇宙中心运动”。\n“绝对的轻，我意指向上和朝着边缘被移动的东西；绝对的重，则指向下和朝着中心被移动的东西。”【1】（《论天》第四卷：1，308a15，译文均引自苗力田版译本，后面不再赘述）\n亚里士多德认为，地球上有四大元素：火、气、水、土，它们都由“重”和“轻”组成。其中火元素只有“轻”，而没有“重”，所以它是所有元素当中最“轻”的，永远朝着“上方”，也就是是远离宇宙中心运动。", "summary_zh": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n因为很多人完全误解了亚里士多德，尤其是把他哲学体系中特有的概念“重性”、“轻性”和现代意义上的“重量”相混淆。实际上，亚里士多德根本没有说过（现代人理解意义上的）“重量和下落速度成正比”。\n为此，我们需要先简单地了解一下亚里士多德的哲学观念。在亚里士多德看来，世间万物都有两种固有的属性，一种叫做“重”（gravitas），一种叫做“轻”（levitas），有时也翻译成“重性”和“轻性”。在《论天》中，亚里士多德详细地讨论了这两种性质，在他看来，所谓的“重”，就是“向着宇宙中心运动”，而“轻”则正好相反，是“远离宇宙中心运动”。\n“绝对的轻，我意指向上和朝着边缘被移动的东西；绝对的重，则指向下和朝着中心被移动的东西。”【1】（《论天》第四卷：1，308a15，译文均引自苗力田版译本，后面不再赘述）\n亚里士多德认为，地球上有四大元素：火、气、水、土，它们都由“重”和“轻”组成。其中火元素只有“轻”，而没有“重”，所以它是所有元素当中最“轻”的，永远朝着“上方”，也就是是远离宇宙中心运动。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "古代偷偷晒海水难道不可以少量自制盐吗？", "title_zh": "古代偷偷晒海水难道不可以少量自制盐吗？", "summary": "晴耕雨读的浣熊君，在知乎撂地的闲散科普创作者，争取每周双更\n查看知乎原文\n\n\n\n其实这个问题反而解释出来了一点，那就是食盐这种生活必需品，他在产地本身就不贵重。\n而古代吃盐之所以贵，之所以有人贩私盐，是因为成本与利润绝大部分不来自于生产过程和原料，而是来自于跨地域运输，以及消费地无法生产的天然垄断。\n那垄断就会产生巨额的税收，这也是自古以来盐业被朝廷长期把控的主要原因，盐铁并称山泽之利也是因为这个。\n至于说能吃的食盐，制作也不算非常困难。\n大家可以去看《熬波图》中的描述，问题中将海水晾晒只是第一步“制卤”，这一步制作出来的卤水可以用于点豆腐，也就是作为蛋白质凝固剂使用，但还远远不能用于食用，直接喝可就要喝死人了。\n从现代科学角度上说，这一步的目的不是直接晒干然后就是食盐了，而是要将自然界浓度在 3%的海水浓缩到 25%左右，并让卤水变成接近饱和状态，我们要想方设法进行浓缩。\n《宋史·食货志》 记载：“鬻海为盐，曰京东、河北、两浙、淮南、福建、广南，凡六路。其鬻盐之地曰亭场，民曰亭户，或谓之灶户。", "summary_zh": "晴耕雨读的浣熊君，在知乎撂地的闲散科普创作者，争取每周双更\n查看知乎原文\n\n\n\n其实这个问题反而解释出来了一点，那就是食盐这种生活必需品，他在产地本身就不贵重。\n而古代吃盐之所以贵，之所以有人贩私盐，是因为成本与利润绝大部分不来自于生产过程和原料，而是来自于跨地域运输，以及消费地无法生产的天然垄断。\n那垄断就会产生巨额的税收，这也是自古以来盐业被朝廷长期把控的主要原因，盐铁并称山泽之利也是因为这个。\n至于说能吃的食盐，制作也不算非常困难。\n大家可以去看《熬波图》中的描述，问题中将海水晾晒只是第一步“制卤”，这一步制作出来的卤水可以用于点豆腐，也就是作为蛋白质凝固剂使用，但还远远不能用于食用，直接喝可就要喝死人了。\n从现代科学角度上说，这一步的目的不是直接晒干然后就是食盐了，而是要将自然界浓度在 3%的海水浓缩到 25%左右，并让卤水变成接近饱和状态，我们要想方设法进行浓缩。\n《宋史·食货志》 记载：“鬻海为盐，曰京东、河北、两浙、淮南、福建、广南，凡六路。其鬻盐之地曰亭场，民曰亭户，或谓之灶户。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "瞎扯 · 如何正确地吐槽", "title_zh": "瞎扯 · 如何正确地吐槽", "summary": "瞎扯 · 你见过哪些奇特的真实名字？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：你见过哪些奇特的真实名字？\n\n@叄罣灋蓍\n ：求求各位家长起名字的时候，自己用普通话念一遍，用当地方言念一遍，最后让亲戚朋友帮忙念一遍。\nQ：什么台词让你记住了一整部游戏?\n\n@丁真珍珠先生\n ：换手枪永远比换子弹更快一句话影响了我玩所有 fps 类游戏的习惯\nQ：为什么西瓜这么甜却没人用它制糖？\n\n@JustWe\n ：致敬传奇高糖水果红枣大帝，某些品种含糖量有 70% 以上\n\n\n\nQ：说话也有恐怖谷效应吗？\n\n@托马斯潘恩之冠\n ：不知道这个算不算：第三遍他终于意识到我就是我\n\n\n\nQ：大家真的能接受猫咪上床吗？\n\n@婆娑\n ：我可以接受猫窝在床上。然后我拱进去和猫咪一起睡。\n\n\n\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "summary_zh": " 妨举个例子。\n这是古代一个跪坐的女子，膝盖着地，双手交叠，上身笔直。\n\n如果你把她的形态简略的话出来，你大概会得到这个样子：\n\n而这个描绘的形态，正好就是甲骨文「女」字。\n甲骨文「女」字\n别小看这个姿势，它可以开启与女性有关的「文字」。\n上古时期，遍地毒蛇猛兽，女子体力吃亏，野地里不安全，只有躲进屋子里才叫安稳。\n于是「女」被关进「宀」（房屋）里，就成了「安」，本义就是平静、不受侵扰。\n甲骨文「安」字\n被圈在屋里，总得找点事做，打扮自己就成了日常。\n在床（「爿」）前梳妆，这就是「妆」字的来处，从女从爿，读音也借了「爿」的声。\n甲骨文「妆」字\n有个部落崇拜羊，于是女子打扮自己的时候，头上会戴一顶羊形图腾，彰显自己的身份，这个形象后来固定下来，成了姓氏「姜」。\n甲骨文「姜」字\n当然，除了族徽，女子脖子上还会再挂一圈贝壳项链，这个项链就是「婴」，类似于现代的项链。\n因为婴要系在颈子上，所以引申出环绕、遭受等义。", "summary_zh": "黄佳智，公众号：在练\n查看知乎原文\n\n\n\n因为缺乏想象和对古人的共情能力。\n我们去看那些已经释读出来的文字，明白了其中的意义，你发现还是很好辨认的。\n我们不妨举个例子。\n这是古代一个跪坐的女子，膝盖着地，双手交叠，上身笔直。\n\n如果你把她的形态简略的话出来，你大概会得到这个样子：\n\n而这个描绘的形态，正好就是甲骨文「女」字。\n甲骨文「女」字\n别小看这个姿势，它可以开启与女性有关的「文字」。\n上古时期，遍地毒蛇猛兽，女子体力吃亏，野地里不安全，只有躲进屋子里才叫安稳。\n于是「女」被关进「宀」（房屋）里，就成了「安」，本义就是平静、不受侵扰。\n甲骨文「安」字\n被圈在屋里，总得找点事做，打扮自己就成了日常。\n在床（「爿」）前梳妆，这就是「妆」字的来处，从女从爿，读音也借了「爿」的声。\n甲骨文「妆」字\n有个部落崇拜羊，于是女子打扮自己的时候，头上会戴一顶羊形图腾，彰显自己的身份，这个形象后来固定下来，成了姓氏「姜」。\n甲骨文「姜」字\n当然，除了族徽，女子脖子上还会再挂一圈贝壳项链，这个项链就是「婴」，类似于现代的项链。\n因为婴要系在颈子上，所以引申出环绕、遭受等义。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "我们看天上的太阳是8分钟前的太阳，还是此时的太阳？如果是8分钟前的，那么是否代表我们可以亲眼看到历史？", "title_zh": "我们看天上的太阳是8分钟前的太阳，还是此时的太阳？如果是8分钟前的，那么是否代表我们可以亲眼看到历史？", "summary": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n所谓“我们看到的是 8 分钟之前的太阳”，从科普简化的角度来说当然是没问题的，不过，如果你想稍微深入探究的话，这里面其实有不少有趣的门道。在这里，我们来简单地普及一些关于相对论的知识。\n相比牛顿力学，相对论最重要的思想之一就是：时间和空间不是“绝对”的，它们在不同的地方有可能“不一样”，因此，两地时间不能直接拿来比较。假如小李在太阳上（先忽略如何生存的问题），他手里持有一台时钟，让我们称其为“太阳钟”，并在其计时后面加上字母 S 表示，比如 9:00S，表示小李看到的“太阳当地时间”为 9 点整。然后，小明在地球上，他也有一台时钟，称为“地球钟”，后面加上 E 表示，比如 10:00E，表示小明看到的“地球当地时间”为 10 点整。\n太阳钟和地球钟本来分别各自计时，我们并不知道它们之间的关系。如果没有其他信息，你凭空问地球上的小明：地球钟 10:00E 和太阳钟 9:00S 究竟“谁早谁晚”？那小明是完全答不上来的。为了让这两台时钟能够互相比较，我们需要先建立起一个全局的“公共时间”，作为比较的标准，这在相对论里称为“对钟”。", "summary_zh": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n所谓“我们看到的是 8 分钟之前的太阳”，从科普简化的角度来说当然是没问题的，不过，如果你想稍微深入探究的话，这里面其实有不少有趣的门道。在这里，我们来简单地普及一些关于相对论的知识。\n相比牛顿力学，相对论最重要的思想之一就是：时间和空间不是“绝对”的，它们在不同的地方有可能“不一样”，因此，两地时间不能直接拿来比较。假如小李在太阳上（先忽略如何生存的问题），他手里持有一台时钟，让我们称其为“太阳钟”，并在其计时后面加上字母 S 表示，比如 9:00S，表示小李看到的“太阳当地时间”为 9 点整。然后，小明在地球上，他也有一台时钟，称为“地球钟”，后面加上 E 表示，比如 10:00E，表示小明看到的“地球当地时间”为 10 点整。\n太阳钟和地球钟本来分别各自计时，我们并不知道它们之间的关系。如果没有其他信息，你凭空问地球上的小明：地球钟 10:00E 和太阳钟 9:00S 究竟“谁早谁晚”？那小明是完全答不上来的。为了让这两台时钟能够互相比较，我们需要先建立起一个全局的“公共时间”，作为比较的标准，这在相对论里称为“对钟”。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "瞎扯 · 如何正确地吐槽", "title_zh": "瞎扯 · 如何正确地吐槽", "summary": "瞎扯 · 见过哪些离大谱的翻译？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：见过哪些离大谱的翻译？\n\n@安在\n ：相信所有在烟台待过的人，都知道这个梗\n\n\n\nQ：你见过最惊艳的公司名称是什么？\n \n@李相霖\n ：惊不惊艳的不好说，但是多少是有点儿文化。\n\n\n\n\n\n\nQ：是只有中国影视剧的服化道不严谨吗？还是全世界都这样？\n\n@陈立金\n ：历史上的罗马士兵\n\n\n\n影视剧里的罗马士兵\n\n\n\nQ：有哪些脑残的产品设计？\n\n@李小斌\n ： sony 手机混成这样也是有原因的\n\n\n\nQ：钓鱼佬最接受不了什么？\n\n@朝仓左卫门督义景\n :我在日本这里，有一次出去爱媛那边海钓，钓了俩小时啥都没有，正好来了个大叔问我上鱼情况咋样，我说这块可能没鱼。结果大叔居然回车里拿来个水下相机放到水底下拍了拍，然后我就看到了屏幕上茫茫多的各种鱼，还有几条巨大的黑鲷。「鱼很多呢」（魚いっぱいおるんじゃ）——不知名的钓鱼佬大叔\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "summary_zh": "瞎扯 · 见过哪些离大谱的翻译？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：见过哪些离大谱的翻译？\n\n@安在\n ：相信所有在烟台待过的人，都知道这个梗\n\n\n\nQ：你见过最惊艳的公司名称是什么？\n \n@李相霖\n ：惊不惊艳的不好说，但是多少是有点儿文化。\n\n\n\n\n\n\nQ：是只有中国影视剧的服化道不严谨吗？还是全世界都这样？\n\n@陈立金\n ：历史上的罗马士兵\n\n\n\n影视剧里的罗马士兵\n\n\n\nQ：有哪些脑残的产品设计？\n\n@李小斌\n ： sony 手机混成这样也是有原因的\n\n\n\nQ：钓鱼佬最接受不了什么？\n\n@朝仓左卫门督义景\n :我在日本这里，有一次出去爱媛那边海钓，钓了俩小时啥都没有，正好来了个大叔问我上鱼情况咋样，我说这块可能没鱼。结果大叔居然回车里拿来个水下相机放到水底下拍了拍，然后我就看到了屏幕上茫茫多的各种鱼，还有几条巨大的黑鲷。「鱼很多呢」（魚いっぱいおるんじゃ）——不知名的钓鱼佬大叔\n\n✨恭喜你发现了（即将成为）知乎最好笑的地方，加入「扯点好笑的」圈子，每天看点段子梗图神回复，一起一本正经地胡说八道吧！\n扯点好笑的", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "为什么高端狼人杀已经公式化了？", "title_zh": "为什么高端狼人杀已经公式化了？", "summary": "司马懿，三国英雄士，四朝经济臣\n查看知乎原文\n\n\n\n狼人杀是在现实中基本上很少遇到的，需要短时间内在无数的贝叶斯均衡中试图实施其中一个相对较好的均衡的例子。\n什么是贝叶斯均衡呢？说白了就是群体的信念和行为的自洽。\n比如说市场期待美联储降息 25 个点，已经开始做了各种各样的准备，然后美联储一看，既然市场都这么认为了，如果我偏离了好像就会造成市场更大的恐慌，那我就降 25 个点吧。这个过程中市场的信念，和美联储的行为互相契合，达成了一致。\n像这种信念 - 行为契合的均衡，往往会有无数个。比如说，如果整个市场都认为美联储应该降 50 个点，那么美联储降到 25 ，同样会形成短期的恐慌、砸盘。\n虽然都是一种稳定的均衡，但是这不代表每个均衡给所有人带来的收益是一样的，25 个点，50 个点，75 个点，都可能形成均衡，但是他们最终对经济造成的影响可能有高有低。\n并且，对于单个人而言，并不是事后看来社会最优的信念就一定有优势。全世界都认为降 50 个点最好，你自己通过某个正确的模型发现降低 25 个点对社会经济最有利，这个是毫无用处的。", "summary_zh": "司马懿，三国英雄士，四朝经济臣\n查看知乎原文\n\n\n\n狼人杀是在现实中基本上很少遇到的，需要短时间内在无数的贝叶斯均衡中试图实施其中一个相对较好的均衡的例子。\n什么是贝叶斯均衡呢？说白了就是群体的信念和行为的自洽。\n比如说市场期待美联储降息 25 个点，已经开始做了各种各样的准备，然后美联储一看，既然市场都这么认为了，如果我偏离了好像就会造成市场更大的恐慌，那我就降 25 个点吧。这个过程中市场的信念，和美联储的行为互相契合，达成了一致。\n像这种信念 - 行为契合的均衡，往往会有无数个。比如说，如果整个市场都认为美联储应该降 50 个点，那么美联储降到 25 ，同样会形成短期的恐慌、砸盘。\n虽然都是一种稳定的均衡，但是这不代表每个均衡给所有人带来的收益是一样的，25 个点，50 个点，75 个点，都可能形成均衡，但是他们最终对经济造成的影响可能有高有低。\n并且，对于单个人而言，并不是事后看来社会最优的信念就一定有优势。全世界都认为降 50 个点最好，你自己通过某个正确的模型发现降低 25 个点对社会经济最有利，这个是毫无用处的。", "pub_date": null, "time_str": ""}, {"source": "知乎日报anyfeeder", "source_key": "知乎日报anyfeeder_3", "cat": "news", "color": "#d32f2f", "title": "黑洞的内部是什么样子的？", "title_zh": "黑洞的内部是什么样子的？", "summary": "Bright Summer，徜徉于自然科学之海\n查看知乎原文\n\n\n\n这是一个很有趣的问题。广义相对论场方程能够告诉我们时空如何因引力而弯曲，黑洞也是其所预言的产物，因此通过求解场方程理论上可以获得关于时空结构的一切信息。我们甚至可以据此分析出，进入黑洞的旅行会是一场怎样的经历。\n为了把事情说得清楚和便于理解，彭罗斯图是一个很好的可视化工具。在引入彭罗斯图之前我们先回顾一下经典的时空图（熟悉的读者可以跳到第二小节）。\n时空图\n\n我们生活的宇宙包含 3 个空间维度 +1 个时间维度，在平面上表示四维时空是不现实的。因此画图时我们不得不舍弃两个空间维度，只考虑一个  轴，以及时间  轴。在不存在引力造成的时空扭曲时，我们习惯于画坐标轴相互垂直且刻度均匀的时空图，如上图所示。\n在图中，每个物体在每一时刻  对应着一个位置  ，因此可以画出一条轨迹线，称为世界线。易见匀速运动的物体的世界线是直线。我们调整距离和时间的单位使得  线能够表示光的轨迹，并称之为类光世界线（如图中棕色直线所示）。", "summary_zh": "Bright Summer，徜徉于自然科学之海\n查看知乎原文\n\n\n\n这是一个很有趣的问题。广义相对论场方程能够告诉我们时空如何因引力而弯曲，黑洞也是其所预言的产物，因此通过求解场方程理论上可以获得关于时空结构的一切信息。我们甚至可以据此分析出，进入黑洞的旅行会是一场怎样的经历。\n为了把事情说得清楚和便于理解，彭罗斯图是一个很好的可视化工具。在引入彭罗斯图之前我们先回顾一下经典的时空图（熟悉的读者可以跳到第二小节）。\n时空图\n\n我们生活的宇宙包含 3 个空间维度 +1 个时间维度，在平面上表示四维时空是不现实的。因此画图时我们不得不舍弃两个空间维度，只考虑一个  轴，以及时间  轴。在不存在引力造成的时空扭曲时，我们习惯于画坐标轴相互垂直且刻度均匀的时空图，如上图所示。\n在图中，每个物体在每一时刻  对应着一个位置  ，因此可以画出一条轨迹线，称为世界线。易见匀速运动的物体的世界线是直线。我们调整距离和时间的单位使得  线能够表示光的轨迹，并称之为类光世界线（如图中棕色直线所示）。", "pub_date": null, "time_str": ""}]}, {"key": "法广中文_4", "name": "法广中文", "cat": "news", "color": "#1a1a1a", "items": [{"source": "法广中文", "source_key": "法广中文_4", "cat": : "法广中文_4", "cat": "news", "color": "#1a1a1a", "title": "中国终止逾30年优惠政策 9月1日起外籍个人股息红利不再免征个税 - RFI - 法国国际广播电台", "title_zh": "中国终止逾30年优惠政策 9月1日起外籍个人股息红利不再免征个税 - RFI - 法国国际广播电台", "summary": "01/09/2026 - 16:05\n                        中国财政部、税务总局周一对外发布公告，明确自9月1日起，外籍个人从外商投资企业取得的股息红利所得，应按照20%税率缴纳个人所得税。        \n                                            中国财政部、税务总局当天发布的《关于外籍个人股息红利个人所得税政策有关事项的公告》（下称《公告》）写道：“一、外籍个人从外商投资企业取得的股息红利所得，按照‘利息、股息、红利所得’缴纳个人所得税，适用20%税率”。 《公告》指出：“二、外商投资企业向外籍个人支付股息红利时，应当代扣代缴税款，并于支付所得的次月15日内申报纳税。外商投资企业未扣缴税款的，取得股息红利的外籍个人应当在取得所得的次年6月30日前缴纳税款；税务机关通知限期缴纳的，外籍个人应当按照期限缴纳税款”。 《公告》续指：“三、本公告自2026年9月1日起执行，《财政部 国家税务总局关于个人所得税若干政策问题的通知》（财税字〔1994〕20号）第二条第（八）项同时废止”。", "summary_zh": "01/09/2026 - 16:05\n                        中国财政部、税务总局周一对外发布公告，明确自9月1日起，外籍个人从外商投资企业取得的股息红利所得，应按照20%税率缴纳个人所得税。        \n                                            中国财政部、税务总局当天发布的《关于外籍个人股息红利个人所得税政策有关事项的公告》（下称《公告》）写道：“一、外籍个人从外商投资企业取得的股息红利所得，按照‘利息、股息、红利所得’缴纳个人所得税，适用20%税率”。 《公告》指出：“二、外商投资企业向外籍个人支付股息红利时，应当代扣代缴税款，并于支付所得的次月15日内申报纳税。外商投资企业未扣缴税款的，取得股息红利的外籍个人应当在取得所得的次年6月30日前缴纳税款；税务机关通知限期缴纳的，外籍个人应当按照期限缴纳税款”。 《公告》续指：“三、本公告自2026年9月1日起执行，《财政部 国家税务总局关于个人所得税若干政策问题的通知》（财税字〔1994〕20号）第二条第（八）项同时废止”。", "pub_date": "2026-09-01T14:15:03+00:00", "time_str": "15小时前"}]}, {"key": "bbc中文_5", "name": "BBC中文", "cat": "news", "color": "#cc0000", "items": [{"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "黃之鋒「勾結外國勢力危害國家安全」案認罪，最高可囚終身", "title_zh": "黃之鋒「勾結外國勢力危害國家安全」案認罪，最高可囚終身", "summary": "OLIVIER DOULIERY/AFP via Getty Images / 黄之锋因“47人”案被以“串谋颠覆”罪判囚4年8个月，原本预计2027年刑满出狱。香港民主派活动人士黄之锋被控告中国《香港国安法》下的“串谋勾结外国势力危害国家安全”罪开庭，黄之锋认罪。香港高等法院原将周三（9月2日）聆讯列为答辩及判刑（Plea and Sentence），但判刑押后至另日进行。根据《香港国安法》，“串谋勾结外国势力”罪最高可被判处终身监禁。去年12月，香港壹传媒创办人黎智英被高等法院以“串谋勾结外国势力”等罪判囚20年。现年29岁的黄之锋涉及多宗案件，他自2020年底，因包围警总案、47人案的还押及认罪判囚，至今已失去自由逾2,100天。他原有望于2027年1月刑满出狱，如今“串谋勾结”案认罪后未知刑期长短。控方罗列国安法前“国际游说”行程Albert Bonsfills/Anadolu Agency/Getty Images / 黄之锋被控与罗冠聪及其他身份不详的人一同串谋勾结外国势力案件于10:00（格林尼治标准时间02:00）在香港高等法院开庭。", "summary_zh": "OLIV 股市首秀表現疲弱", "title_zh": "Shein香港上市首日股價下跌 期待已久的股市首秀表現疲弱", "summary": "Reuters / 许仰天（右）于2008年创立Shein。快时尚巨头Shein历经漫长上市之路后，于周二（9月1日）在香港挂牌上市，其备受期待的股票市场首秀中，股价下跌近8%。此前，Shein曾尝试赴美国及英国上市，但均未成功，原因包括外界对其劳工待遇及环境影响等问题的担忧。Shein曾被估值接近1,000亿美元（6,720亿元人民币；3.17兆元新台币），如今市值约仅为当时的四分之一。该公司同时面临激烈竞争及贸易紧张等其他挑战。由于能够透过中国庞大的工厂网络，以极低价格迅速供应最新流行服饰，Shein获得巨大人气，尤其受到年轻族群欢迎。在上市庆祝仪式上，首席财务官桂镭（Leigh Gui）表示，公司以大量小额订单和快速支付选项为核心的商业模式，如今已覆盖全球约160个市场。他表示：“让全球消费者享受时尚之声。”周一（8月31日），Shein将发行价定为每股48.56港元，透过此次上市募集136亿港元（17.4亿美元；116.6亿元人民币；549.6亿元新台币）。这使公司股票市值达到263亿美元。周二上午早盘交易期间，Shein股价报每股44.8港元。", "summary_zh": "Reuters / 许仰天（右）于2008年创立Shein。快时尚巨头Shein历经漫长上市之路后，于周二（9月1日）在香港挂牌上市，其备受期待的股票市场首秀中，股价下跌近8%。此前，Shein曾尝试赴美国及英国上市，但均未成功，原因包括外界对其劳工待遇及环境影响等问题的担忧。Shein曾被估值接近1,000亿美元（6,720亿元人民币；3.17兆元新台币），如今市值约仅为当时的四分之一。该公司同时面临激烈竞争及贸易紧张等其他挑战。由于能够透过中国庞大的工厂网络，以极低价格迅速供应最新流行服饰，Shein获得巨大人气，尤其受到年轻族群欢迎。在上市庆祝仪式上，首席财务官桂镭（Leigh Gui）表示，公司以大量小额订单和快速支付选项为核心的商业模式，如今已覆盖全球约160个市场。他表示：“让全球消费者享受时尚之声。”周一（8月31日），Shein将发行价定为每股48.56港元，透过此次上市募集136亿港元（17.4亿美元；116.6亿元人民币；549.6亿元新台币）。这使公司股票市值达到263亿美元。周二上午早盘交易期间，Shein股价报每股44.8港元。", "pub_date": "2026-09-01T05:24:58+00:00", "time_str": "1天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "尼泊爾—西藏泥石流：吉隆口岸為何是朝聖之路上的重要關口？", "title_zh": "尼泊爾—西藏泥石流：吉隆口岸為何是朝聖之路上的重要關口？", "summary": "Getty Images8月26日，尼泊尔发生泥石流，一段洪灾冲击西藏吉隆口岸的影片随后在网上广泛传播：片中的人起初一切如常，在口岸前走动，然后洪灾冲过口岸，几秒间将一切淹没。截至8月31日，两国死亡人数增至950人、近4500人失踪——当中包括不少朝圣者。吉隆口岸位于喜马拉雅山脉中段，是中国和尼泊尔之间重要的陆路口岸，也是朝圣者通往冈仁波齐峰的重要关口。位于西藏西部的冈仁波齐峰是唯一跨越四大宗教的共同圣山：印度教、藏传佛教、苯教和耆那教。在印度教眼中，冈仁波齐峰是湿婆神的居所；藏传佛教与耆那教信徒则奉其为圣地。每年有数以万计旅客经由尼泊尔前往朝圣，而8月更是朝圣者出发的旺季。BBC印度语曾报导，目前至少有290名印度人失踪，许多都正在参加朝圣之旅。Getty Images / 2026年8月30日，重型挖土机正在清理泥石流灾区通往吉隆口岸的道路。这趟朝圣之旅在海拔超过4500公尺的地区进行，朝圣者要在氧气稀薄、严寒、崎岖地形的挑战下，完成52公里转山。2020年，中印边界冲突升级，再加上新冠疫情影响，两国民航航线遭切断，冈仁波齐峰—玛旁雍错朝圣之旅亦因此中断，朝圣者接近六年无法出行。", "summary_zh": "Getty Images8月26日，尼泊尔发生泥石流，一段洪灾冲击西藏吉隆口岸的影片随后在网上广泛传播：片中的人起初一切如常，在口岸前走动，然后洪灾冲过口岸，几秒间将一切淹没。截至8月31日，两国死亡人数增至950人、近4500人失踪——当中包括不少朝圣者。吉隆口岸位于喜马拉雅山脉中段，是中国和尼泊尔之间重要的陆路口岸，也是朝圣者通往冈仁波齐峰的重要关口。位于西藏西部的冈 前往受灾严重的努瓦科特（Nuwakot）地区，搜寻医院并查阅死者名单。之后，她听到了来自幸存者的叙述，让她重新燃起希望。“从水力发电工地回来的人说，隧道里还有人，”她告诉 BBC尼泊尔语（BBC News Nepali）。“所以仍有希望，如果军队能迅速到达他们身边，就能把他们救出来。”Priya Kharel / 米兰·卡雷尔（家属提供照片）和米兰一样，在喜马拉雅山区部分冰川崩塌后，数百名水力发电工人至今下落不明。冰川崩塌引发灾难性的山洪暴发，洪水冲入下方山谷。这一事件威力之强，最初甚至被记录为地震。", "summary_zh": "EPA/Shutterstock / 近300名工人已从水力发电隧道中自行逃出或被救出，但据信仍有数百人受困地下。普莉雅·卡雷尔（Priya Kharel） 希望她身处隧道之中的兄弟仍然活着。尽管听起来令人恐惧，但这意味着他可能在尼泊尔史上最致命的自然灾害之一中幸存下来。米兰（Milan Kharel）是一名工程师，在靠近西藏边境的一个水力发电项目工作。自上周三（8月26日）喜马拉雅山区爆发冰冷洪水、泥浆与瓦砾洪流以来，他一直失联。为了确认他是否幸存，普莉雅前往受灾严重的努瓦科特（Nuwakot）地区，搜寻医院并查阅死者名单。之后，她听到了来自幸存者的叙述，让她重新燃起希望。“从水力发电工地回来的人说，隧道里还有人，”她告诉 BBC尼泊尔语（BBC News Nepali）。“所以仍有希望，如果军队能迅速到达他们身边，就能把他们救出来。”Priya Kharel / 米兰·卡雷尔（家属提供照片）和米兰一样，在喜马拉雅山区部分冰川崩塌后，数百名水力发电工人至今下落不明。冰川崩塌引发灾难性的山洪暴发，洪水冲入下方山谷。这一事件威力之强，最初甚至被记录为地震。", "pub_date": "2026-09-01T04:44:45+00:00", "time_str": "1天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "星巴克咖啡就算了吧——Z世代喜歡喝冰飲", "title_zh": "星巴克咖啡就算了吧——Z世代喜歡喝冰飲", "summary": "Elaine Ling / 伊莲的时间主要在纽约和加州之间分配，但无论她在哪里需要咖啡，她都不会去星巴克。凌伊莲（Elaine Ling；音译）的时间主要在纽约和加州之间分配，但无论她在哪里需要来杯咖啡时，她都不会去星巴克。她去那里只买冷饮。她喝的“真正的咖啡”都是从当地咖啡馆买的。“我不太喜欢去星巴克（Starbucks）喝咖啡。我觉得他们的咖啡太甜了，”这位21岁的女子告诉BBC。 “如果要我去星巴克，我更喜欢喝清爽型的饮品。”星巴克虽然50多年前以咖啡店起家，但该公司表示，如今每售出四杯饮品中就有三杯是冷饮。例如冰镇水果饮料、蛋白奶昔以及所谓的“脏苏打”（dirty sodas）——一种由泡沫、糖浆和果汁混合而成的饮品。伊莲的喜好也得到了美国各地年轻顾客的认同。Z世代（Gen Z）消费者——1997年至2012年出生的人——越来越倾向于选择可以自行订制的冷饮，而非传统咖啡。 对此，欧睿国际（Euromonitor International）全球热饮洞察经理特列斯登·霍夫尔（Tristan Höver）解释，年轻消费者越来越将饮品视为可根据特定时刻或需求客制化的饮品。", "summary_zh": "Elaine Ling / 伊莲的时间主要在纽约和加州之间分配，但无论她在哪里需要咖啡，她都不会去星巴克。凌伊莲（Elaine Ling；音译）的时间主要在纽约和加州之间分配，但无论她在哪里需要来杯咖啡时，她都不会去星巴克。她去那里只买冷饮。她喝的“真正的咖啡”都是从当地咖啡馆买的。“我不太喜欢去星巴克（Starbucks）喝咖啡。我觉得他们的咖啡太甜了，”这位21岁的女子告诉BBC。 “如果要我去星巴克，我更喜欢喝清爽型的饮品。”星巴克虽然50多年前以咖啡店起家，但该公司表示，如今每售出四杯饮品中就有三杯是冷饮。例如冰镇水果饮料、蛋白奶昔以及所谓的“脏苏打”（dirty sodas）——一种由泡沫、糖浆和果汁混合而成的饮品。伊莲的喜好也得到了美国各地年轻顾客的认同。Z世代（Gen Z）消费者——1997年至2012年出生的人——越来越倾向于选择可以自行订制的冷饮，而非传统咖啡。 对此，欧睿国际（Euromonitor International）全球热饮洞察经理特列斯登·霍夫尔（Tristan Höver）解释，年轻消费者越来越将饮品视为可根据特定时刻或需求客制化的饮品。", "pub_date": "2026-09-01T01:19:55+00:00", "time_str": "1天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "美國NASA全新超強望遠鏡將改寫我們對宇宙的理解", "title_zh": "美國NASA全新超強望遠鏡將改寫我們對宇宙的理解", "summary": "NASA / 罗曼太空望远镜预计将揭示数以万计的新行星和数以亿计的星系。美国太空总署（NASA；美国国家航空暨太空总署／美国宇航局）的南希·格雷斯·罗曼太空望远镜（Nancy Grace Roman Space Telescope）8月30日从佛罗里达州肯尼迪太空中心（Kennedy Space Center）发射升空。这台望远镜以美国太空总署首位女性主管兼首任首席天文学家命名。科学家希望，它能发现新的行星、揭示星系如何演化，并有助解答天体物理学中的根本问题，包括暗物质和暗能量。该任务高级项目科学家朱莉·麦克纳里博士（Dr Julie McEnery）向BBC表示：“我们将对其他恒星周围的行星进行最大规模的普查，而且⋯⋯我们将利用罗曼望远镜上的精密仪器，研究宇宙中的一切，包括所有星系、恒星，以及各种不寻常的天体。”Getty Images / Nasa / 回顾罗曼太空望远镜升空过程。（英语影片）50万台电视与哈勃（Hubble）和詹姆斯·韦伯（James Webb）太空望远镜聚焦于个别天体不同，罗曼望远镜将扫描大范围天空，观测庞大数量的星系、恒星和行星。", "summary_zh": "NASA / 罗曼太空望远镜预计将揭示数以万计的新行星和数以亿计的星系。美国太空总署（NASA；美国国家航空暨太空总署／美国宇航局）的南希·格雷斯·罗曼太空望远镜（Nancy Grace Roman Space Telescope）8月30日从佛罗里达州肯尼迪太空中心（Kennedy Space Center）发射升空。这台望远镜以美国太空总署首位女性主管兼首任首席天文学家命名。科学家希望，它能发现新的行星、揭示星系如何演化，并有助解答天体物理学中的根本问题，包括暗物质和暗能量。该任务高级项目科学家朱莉·麦克纳里博士（Dr Julie McEnery）向BBC表示：“我们将对其他恒星周围的行星进行最大规模的普查，而且⋯⋯我们将利用罗曼望远镜上的精密仪器，研究宇宙中的一切，包括所有星系、恒星，以及各种不寻常的天体。”Getty Images / Nasa / 回顾罗曼太空望远镜升空过程。（英语影片）50万台电视与哈勃（Hubble）和詹姆斯·韦伯（James Webb）太空望远镜聚焦于个别天体不同，罗曼望远镜将扫描大范围天空，观测庞大数量的星系、恒星和行星。", "pub_date": "2026-08-31T13:34:48+00:00", "time_str": "1天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "前線報導：尼泊爾洪災逾900人罹難 民眾絕望尋找失蹤親人", "title_zh": "前線報導：尼泊爾洪災逾900人罹難 民眾絕望尋找失蹤親人", "summary": "前线报导：尼泊尔洪灾逾900人罹难  民众绝望寻找失踪亲人尼泊尔上周遭遇毁灭性洪灾，已有超过900人死亡，仍有4200人失踪。有许多人在街头一张张查看寻找到的遗体照片，绝望地寻找失联的亲人；也有数百人被困隧道，至今生死未卜。BBC记者阿扎德·莫希里从加德满都出发前往受灾严重的拉苏瓦地区。她报导说，尽管救援人员持续在瓦砾与泥泞中搜寻生还者，持续降雨和山区道路受阻，让救援与物资运送面临巨大挑战。", "summary_zh": "前线报导：尼泊尔洪灾逾900人罹难  民众绝望寻找失踪亲人尼泊尔上周遭遇毁灭性洪灾，已有超过900人死亡，仍有4200人失踪。有许多人在街头一张张查看寻找到的遗体照片，绝望地寻找失联的亲人；也有数百人被困隧道，至今生死未卜。BBC记者阿扎德·莫希里从加德满都出发前往受灾严重的拉苏瓦地区。她报导说，尽管救援人员持续在瓦砾与泥泞中搜寻生还者，持续降雨和山区道路受阻，让救援与物资运送面临巨大挑战。", "pub_date": "2026-08-31T10:56:56+00:00", "time_str": "1天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "塔吉克斯坦年輕人之間緣何興起「漢語熱」？", "title_zh": "塔吉克斯坦年輕人之間緣何興起「漢語熱」？", "summary": "Reuters / 中国是塔吉克斯坦重要的经济和战略伙伴。直到几年前，英语仍是塔吉克（Tajikistan；塔吉克斯坦）年轻人最重要的外语。随着中国在中亚地区的经济影响力扩大，中文已逐渐成为塔吉克年轻一代更具吸引力的选择。根据官方统计，数以千计的塔吉克学生在中国的大学就读，另有数百人在塔吉克境内的教育机构学习汉语。就业前景的保障BBC News Persian / 许多塔吉克年轻人认为，懂中文是自己未来事业和生活的保障。许多塔吉克年轻人认为，懂中文是自己职业前景和未来生活的保障。36岁的易卜拉欣江·杜斯塔利扎达（Ebrahimjon Dostalizoda）是一名中文翻译。14年前，他开始自学中文。当时，他在塔吉克北部的一间土壤分析实验室工作。该实验室开始与一家中国道路桥梁建设公司合作后，他决定学习中文。杜斯塔利扎达说：“工作上的需要促使我学习中文。学会这门语言后，我的生活条件改善了。我得以前往中国多个城市，拓展自己的视野。如今，我努力利用这些经验来改善自己的生活，并帮助国家发展。”除了在一家中国公司担任本职工作外，他也致力推广中国语言与文学。", "summary_zh": "Reuters / 中国是塔吉克斯坦重要的经济和战略伙伴。直到几年前，英语仍是塔吉克（Tajikistan；塔吉克斯坦）年轻人最重要的外语。随着中国在中亚地区的经济影响力扩大，中文已逐渐成为塔吉克年轻一代更具吸引力的选择。根据官方统计，数以千计的塔吉克学生在中国的大学就读，另有数百人在塔吉克境内的教育机构学习汉语。就业前景的保障BBC News Persian / 许多塔吉克年轻人认为，懂中文是自己未来事业和生活的保障。许多塔吉克年轻人认为，懂中文是自己职业前景和未来生活的保障。36岁的易卜拉欣江·杜斯塔利扎达（Ebrahimjon Dostalizoda）是一名中文翻译。14年前，他开始自学中文。当时，他在塔吉克北部的一间土壤分析实验室工作。该实验室开始与一家中国道路桥梁建设公司合作后，他决定学习中文。杜斯塔利扎达说：“工作上的需要促使我学习中文。学会这门语言后，我的生活条件改善了。我得以前往中国多个城市，拓展自己的视野。如今，我努力利用这些经验来改善自己的生活，并帮助国家发展。”除了在一家中国公司担任本职工作外，他也致力推广中国语言与文学。", "pub_date": "2026-08-31T09:41:10+00:00", "time_str": "1天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "她放下演藝事業，回愛丁堡拯救家裏的中餐館", "title_zh": "她放下演藝事業，回愛丁堡拯救家裏的中餐館", "summary": "BBC / 贺漓洒（左）放下演员工作，回到爱丁堡家中帮助母亲重振中餐馆。母亲经营了30年的餐厅正在走下坡。因此，贺漓洒暂停了自己的演艺事业，回到老家试一把。多年来，贺漓洒（Lisa He）一直看着母亲 Sophie 倾注所有心力经营丽都（China Star），这是一家位于苏格兰首府爱丁堡，由家族经营的中餐馆。漫长的工作日延伸至深夜，而端上桌的每一道菜，都承载着多年来的辛勤付出。Sophie 几十年来一直奉献于这门生意，经常每星期工作七天。但经营家族餐厅并不容易，而要在竞争日益激烈的市场中脱颖而出，也变得愈来愈困难。随着时间过去，餐厅变得愈来愈冷清，进门的顾客愈来愈少，餐厅的未来也变得愈来愈不明朗。贺漓洒解释说：“妈妈最后只剩下自己一个人⋯⋯但随着时间过去，情况变得愈来愈艰难⋯⋯她70岁了，身体已经非常疲惫。”贺漓洒无法袖手旁观。怀着决心和干劲，她回到家里，帮助拯救家族生意。Lisa He / 贺漓洒的母亲长年全身投入经营中餐馆，随时每周七天无间断工作。那么，要如何扭转局面并挽救一家餐厅呢？贺漓洒开始寻找让业务现代化的方法，包括检视菜单，引入数码系统。她也希望能更善用网上评论。", "summary_zh": "BBC / 贺漓洒（左）放下演员工作，回到爱丁堡家中帮助母亲重振中餐馆。母亲经营了30年的餐厅正在走下坡。因此，贺漓洒暂停了自己的演艺事业，回到老家试一把。多年来，贺漓洒（Lisa He）一直看着母亲 Sophie 倾注所有心力经营丽都（China Star），这是一家位于苏格兰首府爱丁堡，由家族经营的中餐馆。漫长的工作日延伸至深夜，而端上桌的每一道菜，都承载着多年来的辛勤付出。Sophie 几十年来 何多次成为台湾朝野政党交锋的焦点？公视的定位回溯公视创立的历史，最初是在1980年代由时任行政院长提出，当时台湾仍处于戒严状态，只允许党政军背景的电视台制播节目。解严后，官方的主导角色淡化，学术和艺文界积极参与游说《公共电视法》立法，促成公视成立。公视于1998年正式开台，经费主要由政府捐助，但依法独立于政府运作，是台湾主要的公共媒体机构之一。", "summary_zh": "Taiwan Public Television Service台湾公共电视（公视）今年的政府捐助预算，经过数月审查后在立法院过关，但围绕公共媒体财源与独立性的争议并未落幕。立法院于8月14日完成审议。文化部对公视编列了超过21亿元新台币（6630万美元；4.4亿人民币）的捐助预算，最终遭删减约2,185万元，另有2亿元遭冻结；国际传播平台TaiwanPlus的预算则遭删减2亿元。此前，在野党曾提案删减并冻结逾10亿元，触发公视董监事会罕见地发表声明，警告删预算将重创公共媒体营运，波及影视产业与公民社会。公视制作人发起连署，超过15万人响应，包括柯佳嬿、连俞涵等多名艺人。作为开播28年的公共媒体，为何台湾公视反复陷入预算争议？预算及董事会人事为何多次成为台湾朝野政党交锋的焦点？公视的定位回溯公视创立的历史，最初是在1980年代由时任行政院长提出，当时台湾仍处于戒严状态，只允许党政军背景的电视台制播节目。解严后，官方的主导角色淡化，学术和艺文界积极参与游说《公共电视法》立法，促成公视成立。公视于1998年正式开台，经费主要由政府捐助，但依法独立于政府运作，是台湾主要的公共媒体机构之一。", "pub_date": "2026-08-31T00:15:40+00:00", "time_str": "2天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "中國審查西藏口岸遭洪災衝擊畫面，當地災民情況我們所知甚少", "title_zh": "中國審查西藏口岸遭洪災衝擊畫面，當地災民情況我們所知甚少", "summary": "BBC/CCTV / 中国官媒上为何看不到西藏洪灾冲击画面？如此冲击影片实在难以忽视：一股洪流冲过吉隆口岸，这个尼泊尔与西藏之间的主要边境口岸之一，所到之处尽被冲毁，数百人为了逃命而奔逃。这些由闭路电视拍下的画面迅速在社交媒体上传播，并登上世界各地的萤幕。除了中国本身。迄今为止，中国官方主导的国家级新闻联播只播出了一张定格画面。在中国受到严格审查的网际网路上，也很难找到完整影片，尽管有关这场灾难的不同面向曾在网上被讨论。但更难找到的是生还者亲身讲述这场山洪暴发的经历。自星期三（8月26日）以来，这场灾害已夺去数百人的生命，另有同样数量的人仍然下落不明。北京已展开大规模救援行动，数百名应急救援人员参与其中，行动仍在持续。国家主席习近平亦主持紧急会议，与官员协调救援工作。但当你把中国互联网上的内容，与过去几天世界大部分地区在网上看到的画面相比，中国的防火长城便显得前所未有地清晰。西藏自1950年代被北京控制以来，长期抗拒中国共产党的统治。多年来，中国镇压抗议活动，有时甚至采取暴力手段，并被指在这个佛教地区犯下严重人权侵犯行为。中国则将流亡精神领袖达赖喇嘛标签为分裂主义者。", "summary_zh": "BBC/CCTV / 中国官媒上为何看不到西藏洪灾冲击画面？如此冲击影片实在难以忽视：一股洪流冲过吉隆口岸，这个尼泊尔与西藏之间的主要边境口岸之一，所到之处尽被冲毁，数百人为了逃命而奔逃。这些由闭路电视拍下的画面迅速在社交媒体上传播，并登上世界各地的萤幕。除了中国本身。迄今为止，中国官方主导的国家级新闻联播只播出了一张定格画面。在中国受到严格审查的网际网路上，也很难找到完整影片，尽管有关这场灾难的不同面向曾在网上被讨论。但更难找到的是生还者亲身讲述这场山洪暴发的经历。自星期三（8月26日）以来，这场灾害已夺去数百人的生命，另有同样数量的人仍然下落不明。北京已展开大规模救援行动，数百名应急救援人员参与其中，行动仍在持续。国家主席习近平亦主持紧急会议，与官员协调救援工作。但当你把中国互联网上的内容，与过去几天世界大部分地区在网上看到的画面相比，中国的防火长城便显得前所未有地清晰。西藏自1950年代被北京控制以来，长期抗拒中国共产党的统治。多年来，中国镇压抗议活动，有时甚至采取暴力手段，并被指在这个佛教地区犯下严重人权侵犯行为。中国则将流亡精神领袖达赖喇嘛标签为分裂主义者。", "pub_date": "2026-08-30T12:37:59+00:00", "time_str": "2天前"}, {"source": "BBC中文", "source_key": "bbc中文_5", "cat": "news", "color": "#cc0000", "title": "Dolly Parton的父親生前不識字，於是她給數百萬孩子寄上書本", "title_zh": "Dolly Parton的父親生前不識字，於是她給數百萬孩子寄上書本", "summary": "BBC / 帕顿（Dolly Parton）生前在老家田纳西州创办了“想像图书馆”。美国丹佛市的一个孩子称她为“图书女王”。阿拉巴马州的另一位居民称她为“多莉女士”。在地球另一端的澳洲，一位患有语言发育迟缓的幼儿在收到一本免费邮寄的颜色书籍后，说出了她的第一个字——“橙色”，这让她的家人欣喜不已。这本书来自“想像图书馆”（Imagination Library），这是已故国际巨星多莉·帕顿（Dolly Parton；桃莉·巴顿／桃丽·芭顿）发起的一项识字计划。刚离世的帕顿女士享年80岁。她是在1995年发起这项慈善活动，以纪念她的父亲——她父亲在美中西部阿巴拉契亚山区（Appalachian）艰难的成长经历使他从未完成学业，也从未学会读写。“他是我认识的最聪明的人，但我内心深处知道，他不识字可能使他无法实现所有的梦想，”帕顿在想像图书馆网站上的一封公开信中写道。“激发孩子们对阅读的兴趣因此成了我的使命。”Harriet Anscombe / 英国伦敦一名育有二子的安斯康姆女士（Harriet Anscombe），在女儿三个月大的时候就为她报名参加了这项计划。", "summary_zh": "BBC / 帕顿（Dolly Parton）生前在老家田纳西州创办了“想像图书馆”。美国丹佛市的一个孩子称她为“图书女王”。阿拉巴马州的另一位居民称她为“多莉女士”。在地球另一端的澳洲，一位患有语言发育迟缓的幼儿在收到一本免费邮寄的颜色书籍后，说出了她的第一个字——“橙色”，这让她的家人欣喜不已。这本书来自“想像图书馆”（Imagination Library），这是已故国际巨星多莉·帕顿（Dolly Parton；桃莉·巴顿／桃丽·芭顿）发起的一项识字计划。刚离世的帕顿女士享年80岁。她是在1995年发起这项慈善活动，以纪念她的父亲——她父亲在美中西部阿巴拉契亚山区（Appalachian）艰难的成长经历使他从未完成学业，也从未学会读写。“他是我认识的最聪明的人，但我内心深处知道，他不识字可能使他无法实现所有的梦想，”帕顿在想像图书馆网站上的一封公开信中写道。“激发孩子们对阅读的兴趣因此成了我的使命。”Harriet Anscombe / 英国伦敦一名育有二子的安斯康姆女士（Harriet Anscombe），在女儿三个月大的时候就为她报名参加了这项计划。", "pub_date": "2026-08-30T11:03:44+00:00", "time_str": "2天前"}]}, {"key": "财富中文网_6", "name": "财富中文网", "cat": "news", "color": "#d32f2f", "items": [{"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "新加坡大幅调整生育奖励计划：这次能提升生育率吗？", "title_zh": "新加坡大幅调整生育奖励计划：这次能提升生育率吗？", "summary": "8月23日，新加坡总理黄循财（Lawrence Wong）在国庆群众大会上公布“SG养儿育女配套”（SG Child Support Package），推出一系列措施：延长育儿假、加大对父母的经济支持、提供更多平价托育服务，以及增加组屋申请机会。图片来源：ANNICE LYN VIA GETTY IMAGES\n新加坡正全面改革2001年首次推出的标志性婴儿花红计划。目前，这座城市国家的生育率和新生儿数量双双跌至历史低点。\n2025年，新加坡新生儿数量自独立以来首次跌破3万，生育率仅为0.87，创下历史最低纪录。低生育率对任何国家都是隐患，对国土面积不及纽约市的新加坡而言更是如此。\n新加坡国立大学（NUS）政策研究所高级研究员陈宝麟（Tan Poh Lin）解释道：“新加坡缺乏自然资源，无力承担老龄化社会成本，包括养老照护与医疗支出。”在他看来，移民也不足以解决问题：“提高生育率对于减缓人口结构转型速度、让社会在经济和制度层面逐步适应至关重要。", "summary_zh": "8月23日，新加坡总理黄循财（Lawrence Wong）在国庆群众大会上公布“SG养儿育女配套”（SG Child Support Package），推出一系列措施：延长育儿假、加大对父母的经济支持、提供更多平价托育服务，以及增加组屋申请机会。图片来源：ANNICE LYN VIA GETTY IMAGES\n新加坡正全面改革2001年首次推出的标志性婴儿花红计划。目前，这座城市国家的生育率和新生儿数量双双跌至历史低点。\n2025年，新加坡新生儿数量自独立以来首次跌破3万，生育率仅为0.87，创下历史最低纪录。低生育率对任何国家都是隐患，对国土面积不及纽约市的新加坡而言更是如此。\n新加坡国立大学（NUS）政策研究所高级研究员陈宝麟（Tan Poh Lin）解释道：“新加坡缺乏自然资源，无力承担老龄化社会成本，包括养老照护与医疗支出。”在他看来，移民也不足以解决问题：“提高生育率对于减缓人口结构转型速度、让社会在经济和制度层面逐步适应至关重要。", "pub_date": "2026-08-31T16:00:00+00:00", "time_str": "1天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "希音上市，聚光灯却已不在它身上", "title_zh": "希音上市，聚光灯却已不在它身上", "summary": "中国新股发行市场一派繁荣景象。 \n9月1日，中国电商和快时尚巨头希音（SHEIN）正式在港交所挂牌上市。按照此前披露，SHEIN此次IPO预计募资约135.96亿港元，成为香港今年规模最大的新股发行之一。希音开盘报48港元，盘中一度下跌近10%，随后跌幅有所收窄，截至收盘，总市值超2000亿港元。\n硬科技领域的IPO同样备受市场瞩目。今年7月，中国最大的存储芯片制造商长鑫存储在科创板上市，募资295亿元，成为科创板历史上第二大IPO，其股价上市首日暴涨466%。8月，中国领先的人形机器人制造企业之一宇树科技在科创板上市，其股价在开盘首日大涨460%。\n“当前这轮IPO热潮主要是由投资者对AI和机器人技术的强烈需求驱动的。”标普全球市场财智高级研究分析师赵瑞英表示。而A股的交易很大程度上是由散户投资者推动的。 \nAI成为中国IPO热潮的核心引擎\nION Analytics亚太区股权资本市场主管李培瑞指出，长鑫存储的IPO“使中国在与AI相关的科技制造领域占据了极其重要的战略地位。这也彰显了中国在科技领域实现自给自足的雄心。” \n长鑫存储成立于2016年。", "summary_zh": "中国新股发行市场一派繁荣景象。 \n9月1日，中国电商和快时尚巨头希音（SHEIN）正式在港交所挂牌上市。按照此前披露，SHEIN此次IPO预计募资约135.96亿港元，成为香港今年规模最大的新股发行之一。希音开盘报48港元，盘中一度下跌近10%，随后跌幅有所收窄，截至收盘，总市值超2000亿港元。\n硬科技领域的IPO同样备受市场瞩目。今年7月，中国最大的存储芯片制造商长鑫存储在科创板上市，募资295亿元，成为科创板历史上第二大IPO，其股价上市首日暴涨466%。8月，中国领先的人形机器人制造企业之一宇树科技在科创板上市，其股价在开盘首日大涨460%。\n“当前这轮IPO热潮主要是由投资者对AI和机器人技术的强烈需求驱动的。”标普全球市场财智高级研究分析师赵瑞英表示。而A股的交易很大程度上是由散户投资者推动的。 \nAI成为中国IPO热潮的核心引擎\nION Analytics亚太区股权资本市场主管李培瑞指出，长鑫存储的IPO“使中国在与AI相关的科技制造领域占据了极其重要的战略地位。这也彰显了中国在科技领域实现自给自足的雄心。” \n长鑫存储成立于2016年。", "pub_date": "2026-08-31T16:00:00+00:00", "time_str": "1天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "课堂设备剥夺了AI时代所需的技能，还会损害儿童的思考能力", "title_zh": "课堂设备剥夺了AI时代所需的技能，还会损害儿童的思考能力", "summary": "在格奥尔吉乌斯·阿格里科拉小学的一场媒体探访活动中，学生们正坐在笔记本电脑前。图片来源：Sebastian Kahnert/picture alliance via Getty Images\n\n新学年伊始，数字化学习与传统学习之争愈演愈烈，越来越多学区开始重新审视电子设备在课堂中的定位。\n此前不少学校弃用课本，改用电子屏幕，导致学生数学和阅读成绩大幅下滑。但电脑和平板对教育的影响，远不止所谓“3R”（读、写、算）这类基础技能。 \n宾夕法尼亚大学（University of Pennsylvania）教育研究生院教授萨拉·施奈德·卡瓦纳（Sarah Schneider Kavanagh）与波特兰大学（University of Portland）教育学院教授凯蒂·A·丹尼尔森（Katie A. Danielson）上月早些时候在《华盛顿邮报》专栏文章中写道：“小学教的远不止阅读和数学。孩子们要学会等他人把想法说完，再表达自己的观点；学会化解分歧，并讲清自己的思路。” \n两位教授补充道，这类学习其实是成长中不可缺少的一环。", "summary_zh": "在格奥尔吉乌斯·阿格里科拉小学的一场媒体探访活动中，学生们正坐在笔记本电脑前。图片来源：Sebastian Kahnert/picture alliance via Getty Images\n\n新学年伊始，数字化学习与传统学习之争愈演愈烈，越来越多学区开始重新审视电子设备在课堂中的定位。\n此前不少学校弃用课本，改用电子屏幕，导致学生数学和阅读成绩大幅下滑。但电脑和平板对教育的影响，远不止所谓“3R”（读、写、算）这类基础技能。 \n宾夕法尼亚大学（University of Pennsylvania）教育研究生院教授萨拉·施奈德·卡瓦纳（Sarah Schneider Kavanagh）与波特兰大学（University of Portland）教育学院教授凯蒂·A·丹尼尔森（Katie A. Danielson）上月早些时候在《华盛顿邮报》专栏文章中写道：“小学教的远不止阅读和数学。孩子们要学会等他人把想法说完，再表达自己的观点；学会化解分歧，并讲清自己的思路。” \n两位教授补充道，这类学习其实是成长中不可缺少的一环。", "pub_date": "2026-08-31T16:00:00+00:00", "time_str": "1天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "面试日程“撞车”被堵在路上，如今他成为维珍掌门人", "title_zh": "面试日程“撞车”被堵在路上，如今他成为维珍掌门人", "summary": "乔什·贝利斯于2005年以律师身份加入维珍，此后一路晋升至首席执行官，并从理查德·布兰森不拘一格的经营之道中汲取了不少经验。图片来源：Courtesy of Virgin Group (via Robert Perry / The Sunday Times / News Licensing)\n\n对求职者而言，光是参加亿万富翁、维珍（Virgin）品牌创始人理查德·布兰森的面试，就足以让人紧张。\n然而，当时31岁的律师乔什·贝利斯来到布兰森位于伦敦的豪宅，本以为只是一场再寻常不过的面试，布兰森却突然想起自己在城市的另一端还有一场约好的会面，而且已经迟到。他没有取消面试，而是邀请贝利斯同车前往。\n贝利斯近日在接受《财富》杂志采访时回忆道：“如果路况顺畅，那段路程大约只需要45分钟。”结果，这趟车程却变成了一场长达两个半小时的“奇遇”，而他也抓住了这个绝佳机会。\n贝利斯说道：“我们被堵在路上，这反而正合我意。我有机会真正向理查德刨根问底，弄清楚他的动力究竟源自何处。”\n最终，贝利斯于2005年获得了总法律顾问一职。", "summary_zh": "乔什·贝利斯于2005年以律师身份加入维珍，此后一路晋升至首席执行官，并从理查德·布兰森不拘一格的经营之道中汲取了不少经验。图片来源：Courtesy of Virgin Group (via Robert Perry / The Sunday Times / News Licensing)\n\n对求职者而言，光是参加亿万富翁、维珍（Virgin）品牌创始人理查德·布兰森的面试，就足以让人紧张。\n然而，当时31岁的律师乔什·贝利斯来到布兰森位于伦敦的豪宅，本以为只是一场再寻常不过的面试，布兰森却突然想起自己在城市的另一端还有一场约好的会面，而且已经迟到。他没有取消面试，而是邀请贝利斯同车前往。\n贝利斯近日在接受《财富》杂志采访时回忆道：“如果路况顺畅，那段路程大约只需要45分钟。”结果，这趟车程却变成了一场长达两个半小时的“奇遇”，而他也抓住了这个绝佳机会。\n贝利斯说道：“我们被堵在路上，这反而正合我意。我有机会真正向理查德刨根问底，弄清楚他的动力究竟源自何处。”\n最终，贝利斯于2005年获得了总法律顾问一职。", "pub_date": "2026-08-31T16:00:00+00:00", "time_str": "1天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "全球亿万富翁人数创新高，体育与慈善成最青睐投资领域报告指出，人工智能投资是亿万富翁财富增长的主要驱动力。", "title_zh": "全球亿万富翁人数创新高，体育与慈善成最青睐投资领域报告指出，人工智能投资是亿万富翁财富增长的主要驱动力。", "summary": "从微软前首席执行官史蒂夫·鲍尔默（Steve Ballmer）到商界大亨罗伯特·克拉夫特（Robert Kraft），一众亿万富翁正将财富投入体育俱乐部与慈善事业。图片来源：Gilbert Flores / Contributor / Getty Images\n\n亿万富翁手握前所未有的财富，正积极拓展财富版图：收购体育球队、资助慈善事业，并搭建更具影响力的平台。 \n根据财富情报公司Altrata的最新数据，2025年全球亿万富翁人数达到3795人，创下历史新高。\n他们的总财富增长12.8%，达到创纪录的15.1万亿美元，接近标普500指数总市值的四分之一。全球共有29位身家超500亿美元的“超级亿万富翁”。人工智能是造就这一局面的重要推手；报告指出，人工智能投资是亿万富翁财富增长的主要驱动力。\n谷歌的拉里·佩奇（Larry Page）、特斯拉的埃隆·马斯克（Elon Musk）、亚马逊的杰夫·贝佐斯（Jeff Bezos）等众多超级亿万富翁，都借人工智能投资热潮持续积累财富。除购置私人飞机与豪宅外，亿万富翁最热衷的两件事就是收购职业体育俱乐部股权和投身慈善事业。", "summary_zh": "从微软前首席执行官史蒂夫·鲍尔默（Steve Ballmer）到商界大亨罗伯特·克拉夫特（Robert Kraft），一众亿万富翁正将财富投入体育俱乐部与慈善事业。图片来源：Gilbert Flores / Contributor / Getty Images\n\n亿万富翁手握前所未有的财富，正积极拓展财富版图：收购体育球队、资助慈善事业，并搭建更具影响力的平台。 \n根据财富情报公司Altrata的最新数据，2025年全球亿万富翁人数达到3795人，创下历史新高。\n他们的总财富增长12.8%，达到创纪录的15.1万亿美元，接近标普500指数总市值的四分之一。全球共有29位身家超500亿美元的“超级亿万富翁”。人工智能是造就这一局面的重要推手；报告指出，人工智能投资是亿万富翁财富增长的主要驱动力。\n谷歌的拉里·佩奇（Larry Page）、特斯拉的埃隆·马斯克（Elon Musk）、亚马逊的杰夫·贝佐斯（Jeff Bezos）等众多超级亿万富翁，都借人工智能投资热潮持续积累财富。除购置私人飞机与豪宅外，亿万富翁最热衷的两件事就是收购职业体育俱乐部股权和投身慈善事业。", "pub_date": "2026-08-30T16:00:00+00:00", "time_str": "2天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "地产“巨震”，银行“吃饱”？", "title_zh": "地产“巨震”，银行“吃饱”？", "summary": "8月31日，A股房地产板块大幅高开后迅速跳水，多只个股炸板；截至午间收盘，地产板块由涨转跌。与此同时，银行板块逆势拉升，中国银行大涨超4%，中信银行涨超2%，双双续创历史新高。\n资本市场似乎正在对一项深刻制度变革进行理性定价——8月28日，住建部、央行、金融监管总局、自然资源部、证监会五部门在同一天出台三份重磅政策文件，从销售、信贷、融资三大环节对房地产的基础制度进行系统性重构。市场用真金白银释放的信号是：与其说这是一次“救房地产”的短期刺激，不如说这是一场“救银行、改行业”的深层手术。\n房地产重构：从“金融游戏”到“制造业”\n五部门集中发布的三份纲领性文件（下称“828新政”），覆盖土地供给、开发建设、融资体系、销售交易、风险监管全链条，对运行多年的预售制和高杠杆融资模式进行了系统性重构。\n改革的刀刃落在了三个最核心的环节。首先是销售端，有力有序推行商品住房现房销售，实现“所见即所得”；预售门槛大幅抬升，要求单体建筑需完成主体结构封顶方可预售；新出让土地“优先选择”现房销售。其次是信贷端，个人住房贷款最长期限由30年延长至40年；", "summary_zh": "8月31日，A股房地产板块大幅高开后迅速跳水，多只个股炸板；截至午间收盘，地产板块由涨转跌。与此同时，银行板块逆势拉升，中国银行大涨超4%，中信银行涨超2%，双双续创历史新高。\n资本市场似乎正在对一项深刻制度变革进行理性定价——8月28日，住建部、央行、金融监管总局、自然资源部、证监会五部门在同一天出台三份重磅政策文件，从销售、信贷、融资三大环节对房地产的基础制度进行系统性重构。市场用真金白银释放的信号是：与其说这是一次“救房地产”的短期刺激，不如说这是一场“救银行、改行业”的深层手术。\n房地产重构：从“金融游戏”到“制造业”\n五部门集中发布的三份纲领性文件（下称“828新政”），覆盖土地供给、开发建设、融资体系、销售交易、风险监管全链条，对运行多年的预售制和高杠杆融资模式进行了系统性重构。\n改革的刀刃落在了三个最核心的环节。首先是销售端，有力有序推行商品住房现房销售，实现“所见即所得”；预售门槛大幅抬升，要求单体建筑需完成主体结构封顶方可预售；新出让土地“优先选择”现房销售。其次是信贷端，个人住房贷款最长期限由30年延长至40年；", "pub_date": "2026-08-30T16:00:00+00:00", "time_str": "2天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "微软CEO：同理心并非软技能，“而是我们最难掌握的技能”", "title_zh": "微软CEO：同理心并非软技能，“而是我们最难掌握的技能”", "summary": "微软首席执行官萨蒂亚·纳德拉认为，把同理心归为“软”技能，低估了它的重要性。图片来源：Ben Kriemann—Getty Images\n\n在当今的领导力领域，软技能无疑日益受到重视。但别急着把同理心也简单归入其中。微软（Microsoft）首席执行官萨蒂亚·纳德拉坚信，理解他人的能力已经超越了软技能的范畴。他认为，将同理心描述为“软”技能，实际上低估了它的重要性，因为真正掌握同理心，恰恰是所有技能中最难的一件事。\n纳德拉2023年在接受阿克塞尔·斯普林格集团（Axel Springer）首席执行官马蒂亚斯·德普夫纳采访时表示：“同理心并不属于软技能。事实上，它是我们最难掌握的技能。它要求我们理解这个世界，理解那些对我们最重要的人。”\n纳德拉认为，拥有同理心，不仅能让领导者更好地与员工建立联系，还能拉近与客户的关系。\n他补充道：“事实上，创新就是满足未被满足的、未曾言说的客户需求。创新的源头是什么？有人说是设计思维。但设计思维的本质就是同理心。”\n纳德拉强调同理心的重要性\n印度裔美国人纳德拉在2014年出任微软首席执行官。这并非他第一次强调同理心在职场的力量。", "summary_zh": "微软首席执行官萨蒂亚·纳德拉认为，把同理心归为“软”技能，低估了它的重要性。图片来源：Ben Kriemann—Getty Images\n\n在当今的领导力领域，软技能无疑日益受到重视。但别急着把同理心也简单归入其中。微软（Microsoft）首席执行官萨蒂亚·纳德拉坚信，理解他人的能力已经超越了软技能的范畴。他认为，将同理心描述为“软”技能，实际上低估了它的重要性，因为真正掌握同理心，恰恰是所有技能中最难的一件事。\n纳德拉2023年在接受阿克塞尔·斯普林格集团（Axel Springer）首席执行官马蒂亚斯·德普夫纳采访时表示：“同理心并不属于软技能。事实上，它是我们最难掌握的技能。它要求我们理解这个世界，理解那些对我们最重要的人。”\n纳德拉认为，拥有同理心，不仅能让领导者更好地与员工建立联系，还能拉近与客户的关系。\n他补充道：“事实上，创新就是满足未被满足的、未曾言说的客户需求。创新的源头是什么？有人说是设计思维。但设计思维的本质就是同理心。”\n纳德拉强调同理心的重要性\n印度裔美国人纳德拉在2014年出任微软首席执行官。这并非他第一次强调同理心在职场的力量。", "pub_date": "2026-08-30T16:00:00+00:00", "time_str": "2天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "Anthropic首次进军实体AI领域，发布新标准", "title_zh": "Anthropic首次进军实体AI领域，发布新标准", "summary": "图片来源：AzmanJaka—Getty Images\n想象这样一座工厂：所有设备均由AI驱动，机械臂和装配线能够使用一套共同的“语言”相互“交流”。再想象一个科学实验室，显微镜可以自主寻找特定类型的分子，全天候运行，完全不需要人工介入。\n这正是Anthropic全新推出的“模型硬件标准”（Model Hardware Standard，MHS）背后的构想。该公司上周四发布了MHS研究预览版，这标志着Anthropic首次涉足所谓的“实体AI”（physical AI）领域。MHS本质是一套框架，可以将Anthropic的Claude等先进大语言模型（LLM）与制造设备、显微镜等物理设备打通连接。\nAnthropic表示，借助MHS，企业只需“数小时甚至几分钟”，即可完成AI与硬件设备的集成。以往，这一过程通常需要“数周甚至数月”，而且需要专业人员针对具体设备进行定制化开发。该公司表示，让更多用户能够使用先进AI工具，将为实现“全天候自主实验和工作流程”创造条件。科学研究和先进制造应用是MHS的核心应用场景。\nMHS还支持多台设备互联，让它们通过“读取”等统一指令进行通信。", "summary_zh": "图片来源：AzmanJaka—Getty Images\n想象这样一座工厂：所有设备均由AI驱动，机械臂和装配线能够使用一套共同的“语言”相互“交流”。再想象一个科学实验室，显微镜可以自主寻找特定类型的分子，全天候运行，完全不需要人工介入。\n这正是Anthropic全新推出的“模型硬件标准”（Model Hardware Standard，MHS）背后的构想。该公司上周四发布了MHS研究预览版，这标志着Anthropic首次涉足所谓的“实体AI”（physical AI）领域。MHS本质是一套框架，可以将Anthropic的Claude等先进大语言模型（LLM）与制造设备、显微镜等物理设备打通连接。\nAnthropic表示，借助MHS，企业只需“数小时甚至几分钟”，即可完成AI与硬件设备的集成。以往，这一过程通常需要“数周甚至数月”，而且需要专业人员针对具体设备进行定制化开发。该公司表示，让更多用户能够使用先进AI工具，将为实现“全天候自主实验和工作流程”创造条件。科学研究和先进制造应用是MHS的核心应用场景。\nMHS还支持多台设备互联，让它们通过“读取”等统一指令进行通信。", "pub_date": "2026-08-30T16:00:00+00:00", "time_str": "2天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "阿联酋如何成为资产代币化领域的“领跑者”", "title_zh": "阿联酋如何成为资产代币化领域的“领跑者”", "summary": "上周，加密货币交易巨头Coinbase宣布将在阿布扎比设立国际“代币化中心”，为阿布扎比打造全球数字资产中心的雄心注入了强劲动能。\n该中心将设在阿布扎比全球市场（ADGM）。作为阿布扎比的金融中心，ADGM已向Coinbase发放牌照，允许其开展投资交易撮合业务，并为代币化证券提供托管服务。所谓托管，本质上是安全保存和管理资产的数字所有权记录，这对于提振机构投资者信心至关重要。\n目前，资产代币化浪潮正在全球传统金融界加速蔓延。越来越多的大型资产管理机构和银行陆续将基金、债券、私募信贷和股票等资产迁移到区块链基础设施之上。\n阿布扎比由此成为这一转型的核心试验场。\n早在2018年，ADGM就推出了全球首批综合性虚拟资产监管框架之一。此后，一批又一批加密货币和代币化企业纷纷入驻，希望在该地区建立合规运营基地。\n去年12月，ADGM向全球交易量最大的加密货币交易所币安（Binance）颁发牌照，允许其在这一金融中心开展业务。CoinMarketCap的数据显示，2026年6月，币安交易量达到4.74万亿美元，占其追踪的11家交易所总交易量的39.5%，遥遥领先于竞争对手。", "summary_zh": "上周，加密货币交易巨头Coinbase宣布将在阿布扎比设立国际“代币化中心”，为阿布扎比打造全球数字资产中心的雄心注入了强劲动能。\n该中心将设在阿布扎比全球市场（ADGM）。作为阿布扎比的金融中心，ADGM已向Coinbase发放牌照，允许其开展投资交易撮合业务，并为代币化证券提供托管服务。所谓托管，本质上是安全保存和管理资产的数字所有权记录，这对于提振机构投资者信心至关重要。\n目前，资产代币化浪潮正在全球传统金融界加速蔓延。越来越多的大型资产管理机构和银行陆续将基金、债券、私募信贷和股票等资产迁移到区块链基础设施之上。\n阿布扎比由此成为这一转型的核心试验场。\n早在2018年，ADGM就推出了全球首批综合性虚拟资产监管框架之一。此后 \n实际因果链条如下：联邦政府赤字规模越大，就越需要发行更多国债以填补资金缺口。投资者因担忧政府信用下降，会要求更高的国债收益率。而学生贷款、住房抵押贷款、小企业贷款的利率均以10年期美国国债收益率为定价基准，政府借贷成本上升将直接推高全社会各类债务的利率水平。", "summary_zh": "8月18日，美国国家债务突破40万亿美元，创下历史新高。这个数字听起来十分抽象，但换算成人们更熟悉的贷款账单，就一目了然了。\n\n世界大型企业联合会（The Conference Board）旗下公共政策机构The CEO Center发布的最新经济模型，量化了联邦政府借贷规模扩大给普通美国人带来的实际经济成本，涵盖正在偿还助学贷款的学生、攒钱买房的家庭、扩张业务的小企业主，以及依靠社保生活的退休人员。\n简而言之：相较于稳健的赤字路径，若任由财政走向失序，十年间普通人将多承担数万美元成本；一旦爆发真正的财政危机，这一数字将飙升至六位数。\n尽管债务数字庞大，但其传导机制并不复杂\n将40万亿美元平摊至全美人口，相当于每个美国人背负约11.7万美元债务。但这个数字无法解释：为何从未欠过财政部一分钱的普通人同样会受到波及。\n实际因果链条如下：联邦政府赤字规模越大，就越需要发行更多国债以填补资金缺口。投资者因担忧政府信用下降，会要求更高的国债收益率。而学生贷款、住房抵押贷款、小企业贷款的利率均以10年期美国国债收益率为定价基准，政府借贷成本上升将直接推高全社会各类债务的利率水平。", "pub_date": "2026-08-30T16:00:00+00:00", "time_str": "2天前"}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "2026年《财富》世界500强论坛 增长的新方程式", "title_zh": "2026年《财富》世界500强论坛 增长的新方程式", "summary": "活动详情\n                    \n            \n        \n    \n    \n\n    \n    \n        \n            \n                当前，三股“构造性力量”正在重塑全球商业版图。技术的力量：人工智能等前沿技术加速迭代，重新定义产业格局和企业价值创造。地缘竞争的力量：全球供应链告别效率至上，向安全、韧性与可信度优先的新平衡艰难迁移。人的力量：人口结构、劳动者期望以及技术对工作模式的改变，重塑雇佣关系和组织运行逻辑，深刻挑战依托低成本劳动力的传统发展路径。置身新的经济阶段，传统增长策略难以应对。本次《财富》世界500强论坛以“增长的新方程式”为主题，聚焦AI驱动的产业变革、全球供应链重构、可持续与包容性增长、新兴市场机遇与风险等核心议程，与全球领先企业的领军者共同推演全新商业变量，求解新的增长函数，探索大公司穿越周期、实现可持续增长与高质量发展的最优路径。", "summary_zh": "活动详情\n                    \n            \n        \n    \n    \n\n    \n    \n        \n            \n                当前，三股“构造性力量”正在重塑全球商业版图。技术的力量：人工智能等前沿技术加速迭代，重新定义产业格局和企业价值创造。地缘竞争的力量：全球供应链告别效率至上，向安全、韧性与可信度优先的新平衡艰难迁移。人的力量：人口结构、劳动者期望以及技术对工作模式的改变，重塑雇佣关系和组织运行逻辑，深刻挑战依托低成本劳动力的传统发展路径。置身新的经济阶段，传统增长策略难以应对。本次《财富》世界500强论坛以“增长的新方程式”为主题，聚焦AI驱动的产业变革、全球供应链重构、可持续与包容性增长、新兴市场机遇与风险等核心议程，与全球领先企业的领军者共同推演全新商业变量，求解新的增长函数，探索大公司穿越周期、实现可持续增长与高质量发展的最优路径。", "pub_date": null, "time_str": ""}, {"source": "财富中文网", "source_key": "财富中文网_6", "cat": "news", "color": "#d32f2f", "title": "2026年《财富》中国500强论坛 焕新竞争力", "title_zh": "2026年《财富》中国500强论坛 焕新竞争力", "summary": "活动详情\n                    \n 47", "title": "西藏吉隆口岸救援通道陆路通道已基本打通", "title_zh": "西藏吉隆口岸救援通道陆路通道已基本打通", "summary": "9月2日上午10点，西藏吉隆口岸救援通道陆路通道已基本打通，救援人员、救援物资和部分装备已通过陆路通道进入核心区并开展深入救援工作。", "summary_zh": "9月2日上午10点，西藏吉隆口岸救援通道陆路通道已基本打通，救援人员、救援物资和部分装备已通过陆路通道进入核心区并开展深入救援工作。", "pub_date": "2026-09-02T03:11:43+00:00", "time_str": "2小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "电动重卡在路上——一趟700公里的长途考题", "title_zh": "电动重卡在路上——一趟700公里的长途考题", "summary": "从上海洋山港到泰州，再返回洋山港，行程700公里、36小时交付时限。开了26年柴油重卡的张长亮，第一次开着电动重卡跑上这条长途线路。续航、充电、堵车、排队，每一个环节都可能影响到运输时效。张长亮能像往常一样，准时把货送到吗？", "summary_zh": "从上海洋山港到泰州，再返回洋山港，行程700公里、36小时交付时限。开了26年柴油重卡的张长亮，第一次开着电动重卡跑上这条长途线路。续航、充电、堵车、排队，每一个环节都可能影响到运输时效。张长亮能像往常一样，准时把货送到吗？", "pub_date": "2026-09-02T03:09:51+00:00", "time_str": "2小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "国台办：统战的本质是大团结大联合，是交朋友、促团结", "title_zh": "国台办：统战的本质是大团结大联合，是交朋友、促团结", "summary": "2026年9月2日上午，国台办在新闻发布厅举行例行新闻发布会，发言人张晗就近期两岸热点问题回答记者提问。会上有记者提问：近日，有绿营政客称，台湾民间团体“小义子汉服”以“推广儒学与汉服文化”为名在端午节期间以孔庙为背景拍摄影片，疑具统战色彩。陆委会副主委沈有忠对此称，文化应是中性的，“若中共利用文化作为政治工具或统战工具，政府当然会严正驳斥”。对此有何评论？国台办发言人张晗表示，中华文化是两岸同胞共同的精神家园。岛内民间团体致力于传承弘扬中华文化，踊跃参与两岸交流活动，恰恰证明了两岸同根同源、同文同种。我们将同台湾同胞一道，持续推进两岸文化交流合作，共同弘扬中华文化，做中华文化的守护者、传承者、弘扬者。张晗表示，统战的本质是大团结大联合，是交朋友、促团结，是求同存异、共谋发展。民进党当局蓄意歪曲统战本义本质，抹黑两岸交流活动，恐吓打压参与两岸交流活动的台湾同胞，用心险恶。", "summary_zh": "2026年9月2日上午，国台办在新闻发布厅举行例行新闻发布会，发言人张晗就近期两岸热点问题回答记者提问。会上有记者提问：近日，有绿营政客称，台湾民间团体“小义子汉服”以“推广儒学与汉服文化”为名在端午节期间以孔庙为背景拍摄影片，疑具统战色彩。陆委会副主委沈有忠对此称，文化应是中性的，“若中共利用文化作为政治工具或统战工具，政府当然会严正驳斥”。对此有何评论？国台办发言人张晗表示，中华文化是两岸同胞共同的精神家园。岛内民间团体致力于传承弘扬中华文化，踊跃参与两岸交流活动，恰恰证明了两岸同根同源、同文同种。我们将同台湾同胞一道，持续推进两岸文化交流合作，共同弘扬中华文化，做中华文化的守护者、传承者、弘扬者。张晗表示，统战的本质是大团结大联合，是交朋友、促团结，是求同存异、共谋发展。民进党当局蓄意歪曲统战本义本质，抹黑两岸交流活动，恐吓打压参与两岸交流活动的台湾同胞，用心险恶。", "pub_date": "2026-09-02T03:08:24+00:00", "time_str": "2小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "国台办：将帮助更多台湾农渔优质产品进入大陆", "title_zh": "国台办：将帮助更多台湾农渔优质产品进入大陆", "summary": "2026年9月2日上午，国台办在新闻发布厅举行例行新闻发布会，发言人张晗就近期两岸热点问题回答记者提问。会上有记者提问：不久前，海关总署网站公布新增一批台湾文旦柚包装厂及果园注册事宜，受到岛内关注，请问是否会有更多台湾县市文旦柚获准输入大陆？国台办发言人张晗表示，今年4月，中央台办受权发布十项促进两岸交流合作的政策措施，包括为符合检验检疫标准的台湾农渔产品输入大陆提供便利。今年海峡论坛期间，我们举办十项促进两岸交流合作的政策措施对接签约会，为台湾特色农渔产品打开大陆销路搭建平台。继8月25日公布一批台湾文旦柚包装厂及果园注册后，海关总署9月1日又公布新一批台湾文旦柚果园和包装厂注册，为更多台湾业者把文旦柚销往大陆提供便利。张晗表示，我们尽最大努力为台湾同胞办实事、做好事、解难事。在坚持“九二共识”、反对“台独”政治基础上，在符合大陆相关检验检疫规定前提下，我们将和岛内有关方面共同努力，帮助更多台湾农渔产品、优质产品进入大陆千家万户。", "summary_zh": "2026年9月2日上午，国台办在新闻发布厅举行例行新闻发布会，发言人张晗就近期两岸热点问题回答记者提问。会上有记者提问：不久前，海关总署网站公布新增一批台湾文旦柚包装厂及果园注册事宜，受到岛内关注，请问是否会有更多台湾县市文旦柚获准输入大陆？国台办发言人张晗表示，今年4月，中央台办受权发布十项促进两岸交流合作的政策措施，包括为符合检验检疫标准的台湾农渔产品输入大陆提供便利。今年海峡论坛期间，我们举办十项促进两岸交流合作的政策措施对接签约会，为台湾特色农渔产品打开大陆销路搭建平台。继8月25日公布一批台湾文旦柚包装厂及果园注册后，海关总署9月1日又公布新一批台湾文旦柚果园和包装厂注册，为更多台湾业者把文旦柚销往大陆提供便利。张晗表示，我们尽最大努力为台湾同胞办实事、做好事、解难事。在坚持“九二共识”、反对“台独”政治基础上，在符合大陆相关检验检疫规定前提下，我们将和岛内有关方面共同努力，帮助更多台湾农渔产品、优质产品进入大陆千家万户。", "pub_date": "2026-09-02T03:08:12+00:00", "time_str": "2小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "大型焰火燃放强制性国标发布：12号礼花弹安全距离为300米", "title_zh": "大型焰火燃放强制性国标发布：12号礼花弹安全距离为300米", "summary": "记者今天了解到，市场监管总局批准发布强制性国家标准《大型焰火燃放安全技术规程》，将自2027年9月1日起实施。该标准由公安部组织修订，将为全国大型焰火燃放活动的设计、作业与管理建立统一安全技术规范，有力提升大型焰火燃放本质安全水平，助力保障人民群众生命财产安全和社会公共安全。我国是全球最大的烟花爆竹生产国和消费国，大型焰火燃放广泛应用于重大庆典和文旅活动。本次修订聚焦等级划分、安全条件、作业规程、安全评估等关键环节，主要内容包括以下四个方面：一是等级资质“一一对应”，谁燃放谁负责更明晰。标准按照燃放礼花弹及其他专业燃放类烟花产品的规格和数量，将大型焰火燃放由高至低划分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ五级。燃放等级与作业单位资质、作业人员资格逐级匹配，分级管控让责任主体更加明确。比如，Ⅰ级燃放须由甲级资质单位承担，由拥有高级职称的燃放技术人员现场负责。二是安全距离“一目了然”，群众观赏更安心。礼花弹按直径大小分号，号数越大威力越大。", "summary_zh": "记者今天了解到，市场监管总局批准发布强制性国家标准《大型焰火燃放安全技术规程》，将自2027年9月1日起实施。该标准由公安部组织修订，将为全国大型焰火燃放活动的设计、作业与管理建立统一安全技术规范，有力提升大型焰火燃放本质安全水平，助力保障人民群众生命财产安全和社会公共安全。我国是全球最大的烟花爆竹生产国和消费国，大型焰火燃放广泛应用于重大庆典和文旅活动。本次修订聚焦等级划分、安全条件、作业规程、安全评估等关键环节，主要内容包括以下四个方面：一是等级资质“一一对应”，谁燃放谁负责更明晰。标准按照燃放礼花弹及其他专业燃放类烟花产品的规格和数量，将大型焰火燃放由高至低划分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ五级。燃放等级与作业单位资质、作业人员资格逐级匹配，分级管控让责任主体更加明确。比如，Ⅰ级燃放须由甲级资质单位承担，由拥有高级职称的燃放技术人员现场负责。二是安全距离“一目了然”，群众观赏更安心。礼花弹按直径大小分号，号数越大威力越大。", "pub_date": "2026-09-02T03:03:26+00:00", "time_str": "2小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "G216国道即将抢通，已有大型机械进入核心区搜救", "title_zh": "G216国道即将抢通，已有大型机械进入核心区搜救", "summary": "央视新闻9月2日消息，8月26日上午，因尼泊尔一侧发生泥石流灾害，造成西藏日喀则市吉隆县吉隆口岸重大人员伤亡、失联。受泥石流灾害冲击，通往吉隆口岸的国道216线道路通行中断。抢险救援救灾各项工作仍在紧张有序推进，G216国道抢通作业已推进至灾害核心区，受灾核心区正进行多手段协同搜救。目前，最后一个涉水断路点已完成临时路基抢筑，大型机械可以顺利通过。上午9时40分，总台记者在吉隆口岸受灾核心区看到，参与216国道抢通作业的大型机械已经接近吉隆口岸联检大楼原址位置。矗立着五星红旗的平台，是原吉隆口岸联检大楼所在地。在吉隆河谷216国道抢通作业方向，此前的搜救核心区内，现已进驻多台大型机械。经过彻夜抢修，最后一个涉水断路点已完成临时路基抢筑，大型机械可以顺利通过。现场还在对该涉水路段展开进一步的加固，方便小型车辆也可以通过该路段进入受灾核心区。据了解，昨天晚上，救援人员已可徒步进入受灾核心区。今早，大批大型机械顺利进驻核心区域。目前，吉隆口岸受灾核心区已有多台大型机械，加紧展开失联人员搜寻和道路平整作业。", "summary_zh": "央视新闻9月2日消息，8月26日上午，因尼泊尔一侧发生泥石流灾害，造成西藏日喀则市吉隆县吉隆口岸重大人员伤亡、失联。受泥石流灾害冲击，通往吉隆口岸的国道216线道路通行中断。抢险救援救灾各项工作仍在紧张有序推进，G216国道抢通作业已推进至灾害核心区，受灾核心区正进行多手段协同搜救。目前，最后一个涉水断路点已完成临时路基抢筑，大型机械可以顺利通过。上午9时40分，总台记者在吉隆口岸受灾核心区看到，参与216国道抢通作业的大型机械已经接近吉隆口岸联检大楼原址位置。矗立着五星红旗的平台，是原吉隆口岸联检大楼所在地。在吉隆河谷216国道抢通作业方向，此前的搜救核心区内，现已进驻多台大型机械。经过彻夜抢修，最后一个涉水断路点已完成临时路基抢筑，大型机械可以顺利通过。现场还在对该涉水路段展开进一步的加固，方便小型车辆也可以通过该路段进入受灾核心区。据了解，昨天晚上，救援人员已可徒步进入受灾核心区。今早，大批大型机械顺利进驻核心区域。目前，吉隆口岸受灾核心区已有多台大型机械，加紧展开失联人员搜寻和道路平整作业。", "pub_date": "2026-09-02T03:03:26+00:00", "time_str": "2小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "一批AI应用乱象案例被通报：涉“魔改”经典、假冒仿冒公众人物等", "title_zh": "一批AI应用乱象案例被通报：涉“魔改”经典、假冒仿冒公众人物等", "summary": "近期，中央网信办组织开展“清朗·整治AI应用乱象”专项行动第二阶段工作，聚焦利用AI制作发布虚假信息、传播暴力低俗内容、假冒仿冒他人、侵害未成年人权益等突出问题，部署各地网信部门深入推进重点整治任务，督促网站平台集中清理AI生成各类违法不良信息，依法查处违规账号和移动应用程序，有效遏制AI生成合成信息内容乱象，推动AI应用服务健康有序发展。截至目前，累计清理违法违规信息561万余条，查处账号4.9万余个，处置违规网站、应用程序等2400余个。专项行动开展以来，各地网信部门切实履行属地监管责任，因地制宜推出一系列针对性治理措施。北京网信办指导网站平台全面升级审核策略，持续提升违规内容新型变体识别处置能力。上海网信办督促平台深入开展自查自纠，加大违法违规信息和账号查处力度，推出AI应用“知识普及包”引导公众识别问题风险。浙江网信办对属地重点平台开展“一企一策”问诊进行合规指导，督促完善内控体系，依法查处一批问题突出的AI应用软件。广东网信办召开重点网站平台工作例会，对多款应用违规问题开展点对点督促整改，确保专项行动取得实效。网站平台积极响应专项行动部署安排，持续健全AI内容常态化治理机制。", "summary_zh": "近期，中央网信办组织开展“清朗·整治AI应用乱象”专项行动第二阶段工作，聚焦利用AI制作发布虚假信息、传播暴力低俗内容、假冒仿冒他人、侵害未成年人权益等突出问题，部署各地网信部门深入推进重点整治任务，督促网站平台集中清理AI生成各类违法不良信息，依法查处违规账号和移动应用程序，有效遏制AI生成合成信息内容乱象，推动AI 30分到新院区参加面试。多名考生提前抵达新院区等候，直至开考前一刻，才临时被告知真实考点在七百多米外的龙南路献血站。考生紧急赶至正确考场后，却被工作人员以“超时”为由拒之门外。更令人费解的是，考生离场不久，招考方又电话通知可以返回考试，理由是“征得其他考生同意”。此时面试已开始近一小时，部分考生甚至已经结束面试，被召回考生随即对考试公平性提出强烈质疑。近年来，不少基层单位公开招考在岗位条件设置、成绩公示、面试等环节出现争议，但像泸州市龙马潭区“考点通知错误”这样的疏漏，还真不多见。这一全程漏洞百出、逻辑反常的操作，已经远超普通工作失误范畴，暴露出涉事单位招考组织流程混乱、规则意识淡薄、公平底线松弛的严重问题。绝不能以“工作疏忽、通知失误”简单搪塞、草草了结，必须全面彻查事件全貌，根据调查结果，依法依规做出处理。", "summary_zh": "近日，有网友发帖称，四川省泸州市龙马潭区红星街道社区卫生服务中心的编外工作人员招聘面试，因考点通知错误，导致多名考生错过考试，引发不小关注。9月1日，当地卫生健康局回应，已成立工作组介入调查。据海峡都市报报道，多名考生反映，自己接到招考单位电话通知，要求8月30日上午8点30分到新院区参加面试。多名考生提前抵达新院区等候，直至开考前一刻，才临时被告知真实考点在七百多米外的龙南路献血站。考生紧急赶至正确考场后，却被工作人员以“超时”为由拒之门外。更令人费解的是，考生离场不久，招考方又电话通知可以返回考试，理由是“征得其他考生同意”。此时面试已开始近一小时，部分考生甚至已经结束面试，被召回考生随即对考试公平性提出强烈质疑。近年来，不少基层单位公开招考在岗位条件设置、成绩公示、面试等环节出现争议，但像泸州市龙马潭区“考点通知错误”这样的疏漏，还真不多见。这一全程漏洞百出、逻辑反常的操作，已经远超普通工作失误范畴，暴露出涉事单位招考组织流程混乱、规则意识淡薄、公平底线松弛的严重问题。绝不能以“工作疏忽、通知失误”简单搪塞、草草了结，必须全面彻查事件全貌，根据调查结果，依法依规做出处理。", "pub_date": "2026-09-02T02:27:24+00:00", "time_str": "3小时前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "圆桌｜美国伊朗问题专家：经济痛苦不会自动转化为政治妥协", "title_zh": "圆桌｜美国伊朗问题专家：经济痛苦不会自动转化为政治妥协", "summary": "美国威胁对伊朗采取“最严厉”经济封锁后，两国又连续多日爆发新的交火。据新华社报道，美军中央司令部1日在社交媒体发布消息说，美军已完成对伊朗军事目标的新一轮打击，目标包括伊朗伊斯兰革命卫队的防空阵地、雷达系统、海事资产与设施、布雷能力以及通信站点。美国总统特朗普随后在社交媒体发文称，美军此次打击“规模大、威力强”，是对伊朗企图在霍尔木兹海峡布设水雷以及向美国在约旦的军事基地发射8枚导弹的报复行动。如果伊朗对此次打击进行报复，美国将再次进行“更猛烈、更高级别”的打击。此次冲突重启之际，美国政府正从军事手段，转而向伊朗发动大规模“经济战”之际。多位专家日前对澎湃新闻（www.thepaper.cn）表示，尽管当前美国从军事手段转向经济施压，伊朗仍能通过霍尔木兹海峡、地区威慑等予以反制。美国财政部长斯科特·贝森特8月31日警告称，在美国制裁压力不断加大的情况下，伊朗经济可能“在数周或数月内”崩溃。伊朗中央银行行长阿卜杜勒纳赛尔·赫马提随即于9月1日予以回击，表示伊朗拥有充足的外汇储备，央行已准备好向外汇市场注入最多20亿美元，以平息近期的市场波动。", "summary_zh": "美国威胁对伊朗采取“最严厉”经济封锁后，两国又连续多日爆发新的交火。据新华社报道，美军中央司令部1日在社交媒体发布消息说，美军已完成对伊朗军事目标的新一轮打击，目标包括伊朗伊斯兰革命卫队的防空阵地、雷达系统、海事资产与设施、布雷能力以及通信站点。美国总统特朗普随后在社交媒体发文称，美军此次打击“规模大、威力强”，是对伊朗企图在霍尔木兹海峡布设水雷以及向美国在约旦的军事基地发射8枚导弹的报复行动。如果伊朗对此次打击进行报复，美国将再次进行“更猛烈、更高级别”的打击。此次冲突重启之际，美国政府正从军事手段，转而向伊朗发动大规模“经济战”之际。多位专家日前对澎湃新闻（www.thepaper.cn）表示，尽管当前美国从军事手段转向经济施压，伊朗仍能通过霍尔木兹海峡、地区威慑等予以反制。美国财政部长斯科特·贝森特8月31日警告称，在美国制裁压力不断加大的情况下，伊朗经济可能“在数周或 落地办法，目前先作观察，“我们计划本学期半期后，逐步落实禁带电子产品进校园的相关管理规定。", "summary_zh": "中小学生上学是否可以携带手机，是多年来家校之间争议不断的议题。9月1日，《重庆市预防未成年人犯罪条例》正式施行，其中第二十九条明确规定：学校可以禁止学生携带手机等智能终端产品进入学校或在校园内使用；对经允许带入的，应当统一管理，除教学需要外，禁止带入课堂。开学首日，记者走访重庆多所中小学校，了解条例落地情况。开学首日：校园里的手机管理9月1日，重庆中小学校迎来新学期。在南坪中学，学生背着书包陆续走进校门，校门口、教学楼前，不少学生主动停下脚步，把手机交给随行家长，或装进包里带入学校后再交由老师统一保管。重庆南坪中学开学日（央广网发 伍福 摄）在江北中学一个班级的教室里，班主任把学生们递交上来的手机逐一清点、登记，再集中收进存放处。在已经推行统一管理的班级，手机上交、登记、保管各环节运转顺畅，学生普遍配合。江北中学，学生上交手机后在进行登记（央广网发 受访者供图）该校初三年级一位年级组长介绍，学校暂未全面禁止电子产品入校，仍沿用此前的管理方式；开学前学校已开会研究新规落地办法，目前先作观察，“我们计划本学期半期后，逐步落实禁带电子产品进校园的相关管理规定。", "pub_date": "2026-09-02T05:20:02+00:00", "time_str": "42分钟前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "徐之凯｜盘桓的幽灵：迷信闹剧为何在战后德国上演", "title_zh": "徐之凯｜盘桓的幽灵：迷信闹剧为何在战后德国上演", "summary": "《魍魉之地：战后德国的巫师、灵医和过往的幽灵》，[美]莫妮卡·布莱克著，竺丽妮译，格致出版社，2026年6月出版，331页，78.00元死地生邪祟，乱世出妖人。1945年战败后的德国，正是一片毫无信仰与希望的死地；从雅利安种族优越论与大德意志国家幻梦中醒来的德国人，正在迷失与恐惧中沉沦。通过现代社会文化史学者莫妮卡·布莱克的生动笔触，一出出仿佛脱胎于中世纪的迷信闹剧，如同穿越时光般在战后德国的废土上演。在希特勒第三帝国的恐怖统治方才落幕之时，在全新的联邦德国行将建立之际，刚刚经历了世界大战、种族大屠杀这些人类历史上最为血腥的灾难冲突的德国人，仿佛冲进了一个脱离现实的魔幻时代：1947至1965年，从南部保守的天主教巴伐利亚，到北边新教当道的石勒苏益格-荷尔施泰因，上至大州都市，下到乡野小镇，全国各地空前绝后地爆发了大量“巫术案”。“巫术”指控横行的背后，是战后社会人与人之间的猜疑、嫉妒与不信任。", "summary_zh": "《魍魉之地：战后德国的巫师、灵医和过往的幽灵》，[美]莫妮卡·布莱克著，竺丽妮译，格致出版社，2026年6月出版，331页，78.00元死地生邪祟，乱世出妖人。1945年战败后的德国，正是一片毫无信仰与希望的死地；从雅利安种族优越论与大德意志国家幻梦中醒来的德国人，正在迷失与恐惧中沉沦。通过现代社会文化史学者莫妮卡·布莱克的生动笔触，一出出仿佛脱胎于中世纪的迷信闹剧，如同穿越时光般在战后德国的废土上演。在希特勒第三帝国的恐怖统治方才落幕之时，在全新的联邦德国行将建立之际，刚刚经历了世界大战、种族大屠杀这些人类历史上最为血腥的灾难冲突的德国人，仿佛冲进了一个脱离现实的魔幻时代：1947至1965年，从南部保守的天主教巴伐利亚，到北边新教当道的石勒苏益格-荷尔施泰因，上至大州都市，下到乡野小镇，全国各地空前绝后地爆发了大量“巫术案”。“巫术”指控横行的背后，是战后社会人与人之间的猜疑、嫉妒与不信任。", "pub_date": "2026-09-02T05:19:12+00:00", "time_str": "43分钟前"}, {"source": "澎湃新闻", "source_key": "澎湃新闻_7", "cat": "news", "color": "#43a047", "title": "专访丨袁弘：《密档》是我二十年来拍的最“笨”最真诚的电影", "title_zh": "专访丨袁弘：《密档》是我二十年来拍的最“笨”最真诚的电影", "summary": "电影《密档》正在全国热映中，讲述了地下无名工作者以血肉之躯，拼死守护中央文库“一号机密”的传奇往事。如何塑造好英雄故事，来听听主演袁弘怎么说。", "summary_zh": "电影《密档》正在全国热映中，讲述了地下无名工作者以血肉之躯，拼死守护中央文库“一号机密”的传奇往事。如何塑造好英雄故事，来听听主演袁弘怎 宜。这一步方向没毛病，分岔从请进盈利之后才开始。市赚率：一个能横着比的聪明数字先说好：市赚率是个很漂亮的方法。算法就一步——市盈率÷净资产收益率，数越小越划算。市盈率20倍、ROE15%，市赚率≈1.33；另一只15倍、ROE15%，市赚率1.0，横着一排就知道谁贵。它把估值和盈利压成一个谁都能算的刻度，配上巴菲特“四折五折买可口可乐”的例子，于是有了“4折买股”的口诀——对散户来说，这比背一堆估值模型亲民得多。方法好，但用的时候有三条边界——不是方法错，是它没管到这些：边界一，折扣口径不同。 巴菲特“40美分买1美元”讲的是净资产四折；市赚率的“四折”落到净资产上往往远不是四折，甚至可能是溢价。两本账都被“折价”串着，照字面抄底容易抄错对象。边界二，周期股上要小心。", "summary_zh": "很多人学价值投资绕不开“市赚率”：市盈率÷净资产收益率，数越低越便宜。它和我前面写的“盈利调节市净率”是同一件事的两种做法，这篇把关系说清。两个方法都把“盈利”请进来给估值做校准：别光看价格便不便宜，得看价格配不配得上这家公司赚钱的本事——光看市盈率低可能是坑，赚钱能力在垮，低市盈率就是假的便宜。这一步方向没毛病，分岔从请进盈利之后才开始。市赚率：一个能横着比的聪明数字先说好：市赚率是个很漂亮的方法。算法就一步——市盈率÷净资产收益率，数越小越划算。市盈率20倍、ROE15%，市赚率≈1.33；另一只15倍、ROE15%，市赚率1.0，横着一排就知道谁贵。它把估值和盈利压成一个谁都能算的刻度，配上巴菲特“四折五折买可口可乐”的例子，于是有了“4折买股”的口诀——对散户来说，这比背一堆估值模型亲民得多。方法好，但用的时候有三条边界——不是方法错，是它没管到这些：边界一，折扣口径不同。 巴菲特“40美分买1美元”讲的是净资产四折；市赚率的“四折”落到净资产上往往远不是四折，甚至可能是溢价。两本账都被“折价”串着，照字面抄底容易抄错对象。边界二，周期股上要小心。", "pub_date": "2026-08-31T10:28:41+00:00", "time_str": "1天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "白酒行业大环境及对白酒投资的观点（散户乙2026.08.30）", "title_zh": "白酒行业大环境及对白酒投资的观点（散户乙2026.08.30）", "summary": "聊聊白酒行业的大环境与我对白酒投资的观点（非事实）。本人长期持有白酒股，立场存在天然倾向性，很难做到绝对客观。欢迎大家结合不同视角、多元观点，理性辩证看待白酒行业与白酒投资。首先客观梳理当下白酒行业的整体的不利因素，这些也是市场目前的共识。其一，受政务禁酒、商务应酬缩减影响，白酒消费场景持续收缩，传统刚需饮酒场景大幅减少。同时消费品类出现分流，以往关注的酒圈饮酒视频里清一色茅台，如今也能看到洋酒、葡萄酒、黄酒的出现，这种品类替代现象，在九十年代末至两千年初也曾集中出现过，并非首次发生。其二，时代产业底色彻底更迭。过去依靠地产、传统制造业拉动经济的时代，人情应酬、酒桌社交是商业往来的重要纽带。而当下 AI、新能源等高新科技成为经济增长核心动力，这类行业依托技术、脑力创造价值，几乎不需要传统酒桌应酬维系资源，行业社交属性持续弱化。其三，长期人口与文化趋势承压。总人口持续下滑、消费基数逐年缩减，叠加新生代群体普遍抵触传统酒桌文化（虽然这种现象在近三十年也时有发生），在多大程度上压制白酒的长期增量空间也需重视。", "summary_zh": "聊聊白酒行业的大环境与我对白酒投资的观点（非事实）。本人长期持有白酒股，立场存在天然倾向性，很难做到绝对客观。欢迎大家结合不同视角、多元观点，理性辩证看待白酒行业与白酒投资。首先客观梳理当下白酒行业的整体的不利因素，这些也是市场目前的共识。其一，受政务禁酒、商务应酬缩减影响，白酒消费场景持续收缩，传统刚需饮酒场景大幅减少。同时消费品类出现分流，以往关注的酒圈饮酒视频里清一色茅台，如今也能看到洋酒、葡萄酒、黄酒的出现，这种品类替代现象，在九十年代末至两千年初也曾集中出现过，并非首次发生。其二，时代产业底色彻底更迭。过去依靠地产、传统制造业拉动经济的时代，人情应酬、酒桌社交是商业往来的重要纽带。而当下 AI、新能源等高新科技成为经济增长核心动力，这类行业依托技术、脑力创造价值，几乎不需要传统酒桌应酬维系资源，行业社交属性持续弱化。其三，长期人口与文化趋势承压。总人口持续下滑、消费基数逐年缩减，叠加新生代群体普遍抵触传统酒桌文化（虽然这种现象在近三十年也时有发生），在多大程度上压制白酒的长期增量空间也需重视。", "pub_date": "2026-08-31T10:28:36+00:00", "time_str": "1天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "业绩增长背后，五粮液切换了增长方式", "title_zh": "业绩增长背后，五粮液切换了增长方式", "summary": "不可否认，当下我国白酒产业仍处于深度调整期，资本市场对白酒股的担忧情绪也仍为浓厚，但在五粮液的半年报中，我们依然还是能够看到行业龙头的韧性。 8月28日晚，五粮液发布半年报，上半年，实现营收284.17亿元，同比增长20.87%，实现净利润87.53亿元，同比增长89.3%。从支撑来看，稳健增长的背后，固然有上年基数较低的影响，但更多无疑还是源于其核心产品价稳量增的贡献。 但如果把财报、批价和终端数据放在一起看，一个很值得关注的变化已经开始出现：五粮液正在把经营重心从渠道发货，逐渐转向真实动销。 这可能才是这份半年报真正值得看的地方。今天我们就来说说这个变化。 01中报聚焦：净利润同比增长近90%，核心产品依旧能打这份财报告诉了我们一个核心信息：五粮液仍然还是那个五粮液。 具体来说，在行业仍处深度调整期的背景下，五粮液却交出了一份稳健增长的中报答卷。其在上半年实现营收284.17亿元，同比增长20.87%，实现净利润87.53亿元，同比更是大幅增长89.3%。且整个上半年，其毛利率高达80.29%，再创历史新高。 五粮液逆势稳增的支撑是什么？疑还是其核心五粮液产品大幅增长的贡献。", "summary_zh": "不可否认，当下我国白酒产业仍处于深度调整期，资本市场对白酒股的担忧情绪也仍为浓厚，但在五粮液的半年报中，我们依然还是能够看到行业龙头的韧性。 8月28日晚，五粮液发布半年报，上半年，实现营收284.17亿元，同比增长20.87%，实现净利润87.53亿元，同比增长89.3%。从支撑来看，稳健增长的背后，固然有上年基数较低的影响，但更多无疑还是源于其核心产品价稳量增的贡献。 但如果把财报、批价和终端数据放在一起看，一个很值得关注的变化已经开始出现：五粮液正在把经营重心从渠道发货，逐渐转向真实动销。 这可能才是这份半年报真正值得看的地方。今天我们就来说说这个变化。 01中报聚焦：净利润同比增长近90%，核心产品依旧能打这份财报告诉了我们一个核心信息：五粮液仍然还是那个五粮液。 具体来说，在行业仍处深度调整期的背景下，五粮液却交出了一份稳健增长的中报答卷。其在上半年实现营收284.17亿元，同比增长20.87%，实现净利润87.53亿元，同比更是大幅增长89.3%。且整个上半年，其毛利率高达80.29%，再创历史新高。 五粮液逆势稳增的支撑是什么？疑还是其核心五粮液产品大幅增长的贡献。", "pub_date": "2026-08-31T10:28:31+00:00", "time_str": "1天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "碳酸锂新一轮景气周期及未来中长期价格中枢展望", "title_zh": "碳酸锂新一轮景气周期及未来中长期价格中枢展望", "summary": "$藏格矿业(SZ000408)$ $盐湖股份(SZ000792)$在2021年碳酸锂价格暴涨后，我们很多机构以上一轮周期中锂价格从低点涨到十几万为例说不排除未来锂价会再次跌到曾经的低点。我当时旗帜鲜明地说第一轮锂周期对判断未来锂周期中价格没有任何参考意义。我提出的理由是第一轮锂周期只是中国新能源车初创期，其需求极低。在2022年11月下旬碳酸锂从历史高点下跌以来，到24年下半年特别是2025年时有一些所谓砖家，其中以墨柯为代表反复说未来锂价可能再次跌到5万以内。我是根本不相信这个判断的。在上一轮锂价下跌出现后，我提出来我们认真观察并留意两个信号：一是这轮锂价的低点到什么价？这轮绝对低点相对上一轮绝对低点底部价格抬高了多少？二是这轮锂价格在底部运行的时长相对上一轮底部区间运行的时间缩短多少？当时我公开说过两个结论：一是新一轮底部绝对低价相对上一轮会较大幅度抬高；二是新一轮底部区间运行相对上一轮会大幅缩短。现在回过头来看我当初公开说的这两个判断 是完全正确的，已经为事实证明了。", "summary_zh": "$藏格矿业(SZ000408)$ $盐湖股份(SZ000792)$在2021年碳酸锂价格暴涨后，我们很多机构以上一轮周期中锂价格从低点涨到十几万为例说不排除未来锂价会再次跌到曾经的低点。我当时旗帜鲜明地说第一轮锂周期对判断未来锂周期中价格没有任何参考意义。我提出的理由是第一轮锂周期只是中国新能源车初创期，其需求极低。在2022年11月下旬碳酸锂从历史高点下跌以来，到24年下半年特别是2025年时有一些所谓砖家，其中以墨柯为代表反复说未来锂价可能再次跌到5万以内。我是根本不相信这个判断的。在上一轮锂价下跌出现后，我提出来我们认真观察并留意两个信号：一是这轮锂价的低点到什么价？这轮绝对低点相对上一轮绝对低点底部价格抬高了多少？二是这轮锂价格在底部运行的时长相对上一轮底部区间运行的时间缩短多少？当时我公开说过两个结论：一是新一轮底部绝对低价相对上一轮会较大幅度抬高；二是新一轮底部区间运行相对上一轮会大幅缩短。现在回过头来看我当初公开说的这两个判断 是完全正确的，已经为事实证明了。", "pub_date": "2026-08-31T10:28:26+00:00", "time_str": "1天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "消费的春天不远了", "title_zh": "消费的春天不远了", "summary": "国内消费低迷现象已经持续了数年之久，基本算是2021-2026年大熊市的直接罪魁祸首。为什么会持续这么久的消费低迷呢？核心原因就在于房价泡沫的破裂，回顾时间线，我们不难发现本轮消费低迷和房价泡沫破裂其实是同步的，都从2021年开始滑坡，至今仍捂不住伤口。2026年相对于2021年，人均收入在增长、居民存款总额不断攀升，但消费数据却和房地产一样，日益惨淡。为何人们不愿意像以前一样热衷消费了呢？因为资产在缩水，有一个很清晰的传导链，就是中国家庭资产中房产的占比超过了六成，房价跌了，大家都会觉得自己“变穷了”，自然就不敢随便花钱，以至储蓄率被推高，大消费深陷低迷的泥沼。消费低迷现象，又反向会推导经营主体不赚钱、失业加剧，有能力的消费群体进一步萎缩，形成恶性循环。中金公司复盘美国、日本以及国内的数据后，发现房地产上涨阶段，消费的表现往往非常好，一旦房价下跌，大消费就会明显走弱，尤其是可选消费受冲击极为严重。基本上房价每下降1个百分点，家庭消费意愿大约会下降0.3个百分点，这不是个别现象，而是放之四海而皆准的心理规律。", "summary_zh": "国内消费低迷现象已经持续了数年之久，基本算是2021-2026年大熊市的直接罪魁祸首。为什么会持续这么久的消费低迷呢？核心原因就在于房价泡沫的破裂，回顾时间线，我们不难发现本轮消费低迷和房价泡沫破裂其实是同步的，都从2021年开始滑坡，至今仍捂不住伤口。2026年相对于2021年，人均收入在增长、居民存款总额不断攀升，但消费数据却和房地产一样，日益惨淡。为何人们不愿意像以前一样热衷消费了呢？因为资产在缩水，有一个很清晰的传导链，就是中国家庭资产中房产的占比超过了六成，房价跌了，大家都会觉得自己“变穷了”，自然就不敢随便花钱，以至储蓄率被推高，大消费深陷低迷的泥沼。消费低迷现象，又反向会推导经营主体不赚钱、失业加剧，有能力的消费群体进一步萎缩，形成恶性循环。中金公司复盘美国、日本以及国内的数据后，发现房地产上涨阶段，消费的表现往往非常好，一旦房价下跌，大消费就会明显走弱，尤其是可选消费受冲击极为严重。基本上房价每下降1个百分点，家庭消费意愿大约会下降0.3个百分点，这不是个别现象，而是放之四海而皆准的心理规律。", "pub_date": "2026-08-31T10:28:20+00:00", "time_str": "1天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "（周记347）50%止盈一笔丨简聊万华化学、乖宝宠物丨一组对比图片", "title_zh": "（周记347）50%止盈一笔丨简聊万华化学、乖宝宠物丨一组对比图片", "summary": "声明：文中可能会涉及个股，只是思路分享不代表绝对正确，也不代表买卖推荐，请保持独立思考，据此买卖，风险自负。黑白不建群，不私下主动联系读者，不开付费星球等付费社区。如果有人以我的名义向你收费请马上拉黑。股市有风险，入市需谨慎1聊聊本周简单聊聊本周，本周下跌1776家，70%上涨算是涨幅企业较多的一周。当下上证指数接近4000点，已经不是那个普遍低估的状态。这个阶段选择持仓更是要谨慎，当前市场和以往最大的不同是，上市企业数量大幅增加，2015年是280 抗对比帕博利珠单抗（俗称K药），一对一单药PK。它的无进展生存期结果已经公布，但总生存期还没公布。我们做的是在结果公布前，用公开数据把总生存期推算出来。这次我们发现自己之前算错了一处，而且错得不小：我们此前认为K药那一组的病人中位能活14.4个月，现在有充分理由认为应该是18.9个月左右——多了四个半月。错的原因不是数据不对，是我们把两个试验的病人做匹配时用的那套方法本身有问题。改正之后，依沃西相对K药的死亡风险比大约是0.76（这个数小于1就代表更好，0.76大致相当于死亡风险降低约四分之一）。但这个数有一个不小的浮动范围，最好的情形到0.61，最差的情形到1.07——最差那一头意味着看不出好处。这个浮动不是统计上的运气问题，而是有一块信息目前谁也拿不到。", "pub_date": "2026-08-30T14:15:42+00:00", "time_str": "2天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "英伟达70%营收增长指引意味着什么", "title_zh": "英伟达70%营收增长指引意味着什么", "summary": "本周AI重磅财报来袭，尽管英伟达给出了史上首次的下一财年指引，增长高达70%，不过市场似乎依旧兴趣平平。本次英伟达管理层破天荒的给出了FVY28的应收指引，预计同比增长约70%,意味着明年营收将达到7000亿美元的水平，如果供应链（存储、晶圆）产能限制解除，营收将有望达到100%的增长。而根据TrendForce集邦咨询预估，全球主要云端服务供应商（CSP）为加速建设AI基础设施，资本支出预估于2026年将年增98%，2027年再成长50%，大幅成长的原因，部分可归因于存储器合约价剧增、采购需求的强劲成长。DRAM、NAND Flash合计在CSP资本支出的占比，将从2026年的47%，进一步扩张至2027年的68%。这就会引出一个非常有趣的问题，当存储成为了英伟达AI服务器BOM成本的大头，其本身也是计入英伟达的销售额中的，毛利率的下降指引存储成本上涨将超过营收增长，隐含的是明年DRAM/NAND市场将同比增长70%以上，而非此前预测的40%(ASP 10%+，位元出货量+20%），那么假设位元增长20%，存储平均ASP在27年需要增长40%，这将会是和现在的市场预测完全相反的。", "summary_zh": "本周AI重磅财报来袭，尽管英伟达给出了史上首次的下一财年指引，增长高达70%，不过市场似乎依旧兴趣平平。本次英伟达管理层破天荒的给出了FVY28的应收指引，预计同比增长约70%,意味着明年营收将达到7000亿美元的水平，如果供应链（存储、晶圆）产能限制解除，营收将有望达到100%的增长。而根据TrendForce集邦咨询预估，全球主要云端服务供应商（CSP）为加速建设AI基础设施，资本支出预估于2026年将年增98%，2027年再成长50%，大幅成长的原因，部分可归因于存储器合约价剧增、采购需求的强劲成长。DRAM、NAND Flash合计在CSP资本支出的占比，将从2026年的47%，进一步扩张至2027年的68%。这就会引出一个非常有趣的问题，当存储成为了英伟达AI服务器BOM成本的大头，其本身也是计入英伟达的销售额中的，毛利率的下降指引存储成本上涨将超过营收增长，隐含的是明年DRAM/NAND市场将同比增长70%以上，而非此前预测的40%(ASP 10%+，位元出货量+20%），那么假设位元增长20%，存储平均ASP在27年需要增长40%，这将会是和现在的市场预测完全相反的。", "pub_date": "2026-08-30T14:15:36+00:00", "time_str": "2天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "对长鑫LPDDR6首发量产的思考", "title_zh": "对长鑫LPDDR6首发量产的思考", "summary": "昨天，长鑫正式宣布，其自主研发的最新一代LPDDR6实现规模量产，并将由9月即将发布的小米18 Fold折叠旗舰手机全球首发搭载。简单谈谈看法。一、LPDDR6与端侧AI而这一次，长鑫不仅打破了技术代差，更是在最新一代核心规格上实现全球首发。要理解此次量产的含金量，首先需要明白LPDDR6在当前智能终端生态中的战略位置。在智能手机等移动设备中，LPDDR（低功耗双倍数据速率内存）扮演临时工作台的角色。随着AI大模型加速向端侧（手机、PC、汽车）下沉，动辄数十亿参数的本地AI模型对内存带宽提出了严格要求。传统DRAM功耗过高无法满足移动端散热需求，而云端常用的HBM又受制于成本和体积无法下放。因此，具备高速率、低功耗特性的LPDDR，成为了端侧AI运转的核心基础设施。长鑫此次交出的LPDDR6答卷，在技术指标上达到国际第一梯队水准。单颗芯片最高容量达16GB，峰值传输速率高达12800Mbps。对比来看，这一规格与三星、海力士此前公布的路线图处于同一档位。更值得关注的是长鑫的研发工程效率。", "summary_zh": "昨天，长鑫正式宣布，其自主研发的最新一代LPDDR6实现规模量产，并将由9月即将发布的小米18 Fold折叠旗舰手机全球首发搭载。简单谈谈看法。一、LPDDR6与端侧AI而这一次，长鑫不仅打破了技术代差，更是在最新一代核心规格上实现全球首发。要理解此次量产的含金量，首先需要明白LPDDR6在当前智能终端生态中的战略位置。在智能手机等移动设备中，LPDDR（低功耗双倍数据速率内存）扮演临时工作台的角色。随着AI大模型加速向端侧（手机、PC、汽车）下沉，动辄数十亿参数的本地AI模型对内存带宽提出了严格要求。传统DRAM功耗过高无法满足移动端散热需求，而云端常用的HBM又受制于成本和体积无法下放。因此，具备高速率、低功耗特性的LPDDR，成为了端侧AI运转的核心基础设施。长鑫此次交出的LPDDR6答卷，在技术指标上达到国际第一梯队水准。单颗芯片最高容量达16GB，峰值传输速率高达12800Mbps。对比来看，这一规格与三星、海力士此前公布的路线图处于同一档位。更值得关注的是长鑫的研发工程效率。", "pub_date": "2026-08-30T14:15:28+00:00", "time_str": "2天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "从“高周转”到“现房时代”：房地产底层逻辑的彻底重构", "title_zh": "从“高周转”到“现房时代”：房地产底层逻辑的彻底重构", "summary": "昨天五部委的文件刷屏了，全网疯传，标题一个比一个吓人。但我把原文翻来覆去看了几遍，觉得大多数人还是没抓到重点。什么“现房销售”“贷款延后”，表面上是保护购房者，其实真正被抽掉的，是开发商用了二十年的那根杠杆——预售款。说白了，以前开发商卖期房，本质是拿你的钱去盖你的房子，中间还能挪去拿下一块地。你交了一百万，他可能只用了三十万盖楼，剩下七十万又滚去下一个项目。这套玩法，让房地产从制造业变成了影子银行。账面上ROE做到15%、20%，水分大得吓人，因为那里面有一大半是你无偿借给他的钱。现在新政要求现房销售、封顶才能预售、资金全额监管，等于把这根无息杠杆直接掰断了。开发商必须自己掏钱把房子盖完，卖不掉就是库存。以前是“快周转”，现在变成“慢慢磨”。对房企来说，这是从赌场回到工厂，赚的是手艺钱，不再是资金空转的钱。信贷端那个“拿到钥匙再还贷”，我觉得很多人把它当成惠民政策来解读，其实是有点跑偏了。真正的变化是风险承担者换了人，以前你买期房，从交钱那一刻起，烂尾、降标、质量差，全是你的锅。开发商收了一笔“烂尾折价”的风险溢价，但根本不需要兜底。现在不一样，你看到的是现房，不好你不买；", "summary_zh": "昨天五部委的文件刷屏了，全网疯传，标题一个比一个吓人。但我把原文翻来覆去看了几遍，觉得大多数人还是没抓到重点。什么“现房销售”“贷款延后”，表面上是保护购房者，其实真正被抽掉的，是开发商用了二十年的那根杠杆——预售款。说白了，以前开发商卖期房，本质是拿你的钱去盖你的房子，中间还能挪去拿下一块地。你交了一百万，他可能只用了三十万盖楼，剩下七十万又滚去下一个项目。这套玩法，让房地产从制造业变成了影子银行。账面上ROE做到15%、20%，水分大得吓人，因为那里面有一大半是你无偿借给他的钱。现在新政要求现房销售、封顶才能预售、资金全额监管，等于把这根无息杠杆直接掰断了。开发商必须自己掏钱把房子盖完，卖不掉就是库存。以前是“快周转”，现在变成“慢慢磨”。对房企来说，这是从赌场回到工厂，赚的是手艺钱，不再是资金空转的钱。信贷端那个“拿到钥匙再还贷”，我觉得很多人把它当成惠民政策来解读，其实是有点跑偏了。真正的变化是风险承担者换了人，以前你买期房，从交钱那一刻起，烂尾、降标、质量差，全是你的锅。开发商收了一笔“烂尾折价”的风险溢价，但根本不需要兜底。现在不一样，你看到的是现房，不好你不买；", "pub_date": "2026-08-30T06:14:35+00:00", "time_str": "2天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "AI企业端应用现状：百无一用穷翰林，草台班子数据库", "title_zh": "AI企业端应用现状：百无一用穷翰林，草台班子数据库", "summary": "当下的大模型，像极了一名饱读诗书、满腹经纶的新科状元。它最适合干的活儿，是翰林院修撰/修编。它是帝国的\"首席笔杆子\"--笔墨精妙写得了诰命，满腹经纶修得了国史，口阔悬河讲得了经筵，刚直不阿当得了考官。它干的这些活儿有两个特点：一是数据是现成的，材料都在那儿，考的是学养、笔力、分寸；二是容错率高，结果不严重，翰林离权力核心很近，但离实权很远，也担不了什么责任。这像不像当下的Vibe Coding？开发者口吐莲花，模型唰唰唰写出几百行代码、搭出一个能跑的原型、润色一份漂亮的技术方案。这不就是现代版的\"赛博修史\"吗？模型在海量语料里浸淫出来的\"学养\"，配上强化学习调出来的\"笔力\"，干起这种有明确范式、有清晰上下文、容错率较高的文书活儿，确实挥洒自如。这也是为什么过去一年多，编程辅助、文档生成、知识问答这类\"翰林式场景\"率先被AI攻陷，它们本质上就是制诰文章的赛博朋克版。但是，你真把这新科状元放到知县位置，让他去催征钱粮、躬亲听讼、厉行保甲，它立刻抓瞎。知县要做事，得先做人。需要搞清楚县丞是不是朝中重臣的门生故旧？主簿是不是连着本县的乡绅名流？需要考虑怎么笼络人心管好三班六房？", "summary_zh": "当下的大模型，像极了一名饱读诗书、满腹经纶的新科状元。它最适合干的活儿，是翰林院修撰/修编。它是帝国的\"首席笔杆子\"--笔墨精妙写得了诰命，满腹经纶修得了国史，口阔悬河讲得了经筵，刚直不阿当得了考官。它干的这些活儿有两个特点：一是数据是现成的，材料都在那儿，考的是学养、笔力、分寸；二是容错率高，结果不严重，翰林离权力核心很近，但离实权很远，也担不了什么责任。这像不像当下的Vibe Coding？开发者口吐莲花，模型唰唰唰写出几百行代码、搭出一个能跑的原型、润色一份漂亮的技术方案。这不就是现代版的\"赛博修史\"吗？模型在海量语料里浸淫出来的\"学养\"，配上强化学习调出来的\"笔力\"，干起这种有明确范式、有清晰上下文、容错率较高的文书活儿，确实挥洒自如。这也是为什么过去一年多，编程辅助、文档生成、知识问答这类\"翰林式场景\"率先被AI攻陷，它们本质上就是制诰文章的赛博朋克版。但是，你真把这新科状元放到知县位置，让他去催征钱粮、躬亲听讼、厉行保甲，它立刻抓瞎。知县要做事，得先做人。需要搞清楚县丞是不是朝中重臣的门生故旧？主簿是不是连着本县的乡绅名流？需要考虑怎么笼络人心管好三班六房？", "pub_date": "2026-08-30T06:14:25+00:00", "time_str": "2天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "投资中最简单的事", "title_zh": "投资中最简单的事", "summary": "霍华德・马克思著有《投资最重要的事》，两年后邱国鹭出版《投资中最简单的事》，书名是向前者的致敬。书本把道理写得清清楚楚，但知易行难。越在市场沉淀越久，我越明白一个道理：投资本身不复杂，复杂的是人心，是总想不停交易、总想抓住每一段行情的执念。昨天我写了一篇关于海河流域的随笔，记录半生山河记忆。发出来看的人很少。很多群里、圈子里，所有人都在追逐热点、讨论个股、挖掘题材，人人都在忙着找下一只会涨的股票。大家似乎默认：投资必须时刻在场、时刻操作、时刻寻找机会。但这恰恰是大多数人亏损的根源。真正的投资，最简单、最朴素、最赚钱的事，其实只有三件：少犯错、等机会、只做简单题。一、翻开交易记录：亏损 90%，来自最频繁的胡乱操作我复盘自己二十几年的交易历史，得出一个无比真实的结论：我的所有大幅回撤，都不是来自看不懂的行情，而是来自 “我总想做点什么”。每个人都可以自己做一次深度复盘：把自己所有交易记录拉出来，从大亏损到小亏损依次排序。你会震惊地发现：账户绝大部分亏损，集中在最多 20% 的糟糕交易里。如果我们能主动删掉、规避掉这最差的 20% 交易，整体收益率会瞬间提升一大截，甚至直接从亏损变盈利。", "summary_zh": "霍华德・马克思著有《投资最重要的事》，两年后邱国鹭出版《投资中最简单的事》，书名是向前者的致敬。书本把道理写得清清楚楚，但知易行难。越在市场沉淀越久，我越明白一个道理：投资本身不复杂，复杂的是人心，是总想不停交易、总想抓住每一段行情的执念。昨天我写了一篇关于海河流域的随笔，记录半生山河记忆。发出来看的人很少。很多群里、圈子里，所有人都在追逐热点、讨论个股、挖掘题材，人人都在忙着找下一只会涨的股票。大家似乎默认：投资必须时刻在场、时刻操作、时刻寻找机会。但这恰恰是大多数人亏损的根源。真正的投资，最简单、最朴素、最赚钱的事，其实只有三件：少犯错、等机会、只做简单题。一、翻开交易记录：亏损 90%，来自最频繁的胡乱操作我复盘自己二十几年的交易历史，得出一个无比真实的结论：我的所有大幅回撤，都不是来自看不懂的行情，而是来自 “我总想做点什么”。每个人都可以自己做一次深度复盘：把自己所有交易记录拉出来，从大亏损到小亏损依次排序。你会震惊地发现：账户绝大部分亏损，集中在最多 20% 的糟糕交易里。如果我们能主动删掉、规避掉这最差的 20% 交易，整体收益率会瞬间提升一大截，甚至直接从亏损变盈利。", "pub_date": "2026-08-30T06:14:16+00:00", "time_str": "2天前"}, {"source": "雪球热帖", "source_key": "雪球热帖_12", "cat": "news", "color": "#0097a7", "title": "本周：我们所处的时代", "title_zh": "本周：我们所处的时代", "summary": "不交易宏观，但一定要理解。当前资本市场的核心矛盾就是宏观流动性，反而是产业上就那些东西已经不是主要焦点。所以理解并有独立思考还是很重要。首先必须要承认美债也好、通胀也好、加息也好这些问题牵扯面和问题是极其复杂的，复杂到那边白宫和联储内部应该都吵翻了天。而且宏观决策牵扯到的信息面极广，这也是为什么宏观我只听海外投行的观点，例如大摩Robin团队（推荐8月24那一期），你能感受到他们的全球视野以及是多方验证和取证了各方面信息来做的判断。反而国内很多宏观都是家里蹲，只凭经验和历史做感性判断的我看来都是民科（尤其是那些一开口的语气就是导演视角来指点联储应该怎么做或美股必然崩的老登）。因为市场分歧极大，所以做预测是很难的。但我们也可以从纷杂的信息里面找到一些共识和规律。而恰恰有可能是这些共识，是有助于我们穿越迷雾的。共识1:很多问题短期就是无解；既然无解，就不可能在一个方向下猛药。所以网上调侃卧室从加息 or 降息里面选择了or这个段子倒有几分真实。联储最新那个立场说放弃前瞻性指引倒不一定只是为了树立新的风格，而是当前这种环境下只能根据数据做应对，表明市场的随机和复杂性。", "summary_zh": "不交易宏观，但一定要理解。当前资本市场的核心矛盾就是宏观流动性，反而是产业上就那些东西已经不是主要焦点。所以理解并有独立思考还是很重要。首先必须要承认美债也好、通胀也好、加息也好这些问题牵扯面和问题是极其复杂的，复杂到那边白宫和联储内部应该都吵翻了天。而且宏观决策牵扯到的信息面极广，这也是为什么宏观我只听海外投行的观点，例如大摩Robin团队（推荐8月24那一期），你能感受到他们的全球视野以及是多方验证和取证了各方面信息来做的判断。反而国内很多宏观都是家里蹲，只凭经验和历史做感性判断的我看来都是民科（尤其是那些一开口的语气就是导演视角来指点联储应该怎么做或美股必然崩的老登）。因为市场分歧极大，所以做预测是很难的。但我们也可以从纷杂的信息里面找到一些共识和规律。而恰恰有可能是这些共识，是有助于我们穿越迷雾的。共识1:很多问题短期就是无解；既然无解，就不可能在一个方向下猛药。所以网上调侃卧室从加息 or 降息里面选择了or这个段子倒有几分真实。联储最新那个立场说放弃前瞻性指引倒不一定只是为了树立新的风格，而是当前这种环境下只能根据数据做应对，表明市场的随机和复杂性。", "pub_date": "2026-08-30T06:14:07+00:00", "time_str": "2天前"}]}, {"key": "bbc英语教学_13", "name": "BBC英语教学", "cat": "news", "color": "#bb1919", "items": [{"source": "BBC英语教学", "source_key": "bbc英语教学_13", "cat": "news", "color": "#bb1919", "title": "Huge Roman villa found under popular park dubbed town's 'Pompeii' 小镇热门公园地下发现罗马别墅遗址，被誉为当地的 “庞贝古城”", "title_zh": "Huge Roman villa found under   function updateHash(){
    var p='#view='+(filter.type==='cat'?'cat&c='+filter.cat:filter.type==='src'?'src&s='+encodeURIComponent(filter.src):'all');
    try{history.replaceState(null,'',p);}catch(e){}
  }
  function restoreFromHash(){
    var h=(location.hash||'').replace(/^#/,'');if(!h)return false;
    var p={};h.split('&').forEach(function(kv){var s=kv.split('=');if(s[0])p[s[0]]=decodeURIComponent(s[1]||'');});
    if(p.view==='cat'&&p.c){filter={type:'cat',cat:p.c};return true;}
    if(p.view==='src'&&p.s){filter={type:'src',src:p.s};return true;}
    return false;
  }

  /* ── Init ── */
  var restored = restoreFromHash();
  renderChips(); renderWall(); renderPanel();
  var relEl = document.getElementById('buildRel');
  if(relEl && BUILD_TS){
    var mins=Math.max(0,Math.round((Date.now()-BUILD_TS)/60000));
    relEl.textContent=(mins<60?mins+' 分钟前':mins<1440?Math.round(mins/60)+' 小时前':Math.round(mins/1440)+' 天前');
  }

  /* ── Live RSS update ── */
  var liveEl = document.getElementById('liveStatus');
  setTimeout(function(){
    var ctrl=new AbortController();
    var tid=setTimeout(function(){ctrl.abort();},12000);
    fetch('/api/rss',{signal:ctrl.signal}).then(function(r){
      clearTimeout(tid);if(!r.ok)throw new Error('API '+r.status);return r.json();
    }).then(function(data){
      if(!data.sources)return;var updated=0;
      data.sources.forEach(function(live){
        if(!live.items||!live.items.length)return;
        var src=SOURCES.find(function(s){return s.key===live.key;});if(!src)return;
        live.items.forEach(function(it){it.title_zh=it.title;it.summary_zh=it.summary||'';});
        src.items=live.items;updated++;
      });
      if(updated>0){
        renderChips();renderWall();renderPanel();
        if(liveEl){var now=new Date();liveEl.textContent='✓ 实时已更新 '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');}
      }
    }).catch(function(e){
      if(liveEl)liveEl.textContent='· 显示静态构建数据';
    });
  },800);
})();
</script>
</body>
</html>
