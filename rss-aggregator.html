tems": [{"source": "游戏研究社", "source_key": "游戏研究社_19", "cat": "cn_tech", "color": "#5c6bc0", "title": "CDPR带头，帮到了科隆展上被偷电脑的独立开发者", "title_zh": "CDPR带头，帮到了科隆展上被偷电脑的独立开发者", "summary": "Ryan Laley是一名来自英格兰的开发者。他的本职是一名引擎专家——教授他人如何运用虚幻引擎来开发游戏。他在油管开设的相关频道发了上千个相关的教学视频，有超过12万人订阅。他也正在独立开发自己的游戏《MIMIC》——一款恐怖题材的多人社交博弈游戏，预定于今年10月以抢先体验形式上线。Ryan为此报名参加了今年的科隆游戏展，买下了一个小展位，用于展示自己的游戏。他还精心准备了用光栅工艺制作的小卡片，上面印有游戏的免费Key，用于发放给现场遇到他的玩家们。相对于如今已成为全球第一大游戏展、参展商超过1700家、首次卖光了约23.3 万平方米全部可用展区的科隆游戏展而言，这是一个不起眼的小展位。但你很容易感受到Ryan对这次参展的重视和期待。但就在展会正式开始后的第二天，Ryan发了一条推文，说自己展位上的笔记本被偷走了。之后他又拍了一条短视频来讲述事情经过——仅在一夜之间，包括他在内的多名参展商被盗窃了留在展位储藏柜内的设备。而场内并没有监控设备，因此虽然报了警，但能找回这些设备的希望相当渺茫。视频里的Ryan所显露的绝望、委屈都溢于言表，令人很难不共情。", "summary_zh": "Ryan Laley是一名来自英格兰的开发者。他的本职是一名引擎专家——教授他人如何运用虚幻引擎来开发游戏。他在油管开设的相关频道发了上千个相关的教学视频，有超过12万人订阅。他也正在独立开发自己的游戏《MIMIC》——一款恐怖题材的多人社交博弈游戏，预定于今年10月以抢先体验形式上线。Ryan为此报名参加了今年的科隆游戏展，买下了一个小展位，用于展示自己的游戏。他还精心准备了用光栅工艺制作的小卡片，上面印有游戏的免费Key，用于发放给现场遇到他的玩家们。相对于如今已成为全球第一大游戏展、参展商超过1700家、首次卖光了约23.3 万平方米全部可用展区的科隆游戏展而言，这是一个不起眼的小展位。但你很容易感受到Ryan对这次参展的重视和期待。但就在展会正式开始后的第二天，Ryan发了一条推文，说自己展位上的笔记本被偷走了。之后他又拍了一条短视频来讲述事情经过——仅在一夜之间，包括他在内的多名参展商被盗窃了留在展位储藏柜内的设备。而场内并没有监控设备，因此虽然报了警，但能找回这些设备的希望相当渺茫。视频里的Ryan所显露的绝望、委屈都溢于言表，令人很难不共情。", "pub_date": "2026-09-01T00:00:00+08:00", "time_str": "1天前"}, {"source": "游戏研究社", "source_key": "游戏研究社_19", "cat": "cn_tech", "color": "#5c6bc0", "title": "一家独立团队做了款AI跑团游戏，结果AI含量越做越少？", "title_zh": "一家独立团队做了款AI跑团游戏，结果AI含量越做越少？", "summary": "如非必要，勿增AI。试图拉朋友一起跑团时，很多人都会强调“自由”：你可以自由创建角色、自由选择行动，拥有电子游戏难以提供的自由度。在向人具体说明这种自由时，我往往会抛出一段真实体验：试想在《龙与地下城》的世界里，你中毒了，全队都没有解毒剂，这时扮演变形怪角色的队友突发奇想，认为可以钻进你的肾脏做一套透析解毒。主持人同意了这样的做法，于是在用骰子经过一系列检定之后，你们成功地在魔法世界完成了一场（字面意义上）沉浸式的透析手术。玩家听到这种程度的自由，或许都会觉得跑团确实挺有意思。但由于这项活动要求的时间和精力成本很高，即便感兴趣，大多数人真能成团的机会仍然寥寥无几。随着LLM的普及和能力提升，我总会想象，有没有一款电子游戏，不需要自己进行复杂的部署和调试，也能借助AI实现这样的自由。这也是为什么，在之前Steam新品节的人气榜上点开中式克苏鲁RPG《请神》demo时，藏在游戏简介里的自由模式吸引了我：“在支持的情节点自由输入文字，发挥想象力与NPC互动、解决问题，用你自己的方式影响故事。", "summary_zh": "如非必要，勿增AI。试图拉朋友一起跑团时，很多人都会强调“自由”：你可以自由创建角色、自由选择行动，拥有电子游戏难以提供的自由度。在向人具体说明这种自由时，我往往会抛出一段真实体验：试想在《龙与地下城》的世界里，你中毒了，全队都没有解毒剂，这时扮演变形怪角色的队友突发奇想，认为可以钻进你的肾脏做一套透析解毒。主持人同意了这样的做法，于是在用骰子经过一系列检定之后，你们成功地在魔法世界完成了一场（字面意义上）沉浸式的透析手术。玩家听到这种程度的自由，或许都会觉得跑团确实挺有意思。但由于这项活动要求的时间和精力成本很高，即便感兴趣，大多数人真能成团的机会仍然寥寥无几。随着LLM的普及和能力提升，我总会想象，有没有一款电子游戏，不需要自己进行复杂的部署和调试，也能借助AI实现这样的自由。这也是为什么，在之前Steam新品节的人气榜上点开中式克苏鲁RPG《请神》demo时，藏在游戏简介里的自由模式吸引了我：“在支持的情节点自由输入文字，发挥想象力与NPC互动、解决问题，用你自己的方式影响故事。", "pub_date": "2026-09-01T00:00:00+08:00", "time_str": "1天前"}, {"source": "游戏研究社", "source_key": "游戏研究社_19", "cat": "cn_tech", "color": "#5c6bc0", "title": "一名XBOX玩家是如何告赢微软的", "title_zh": "一名XBOX玩家是如何告赢微软的", "summary": "游戏账号被盗已经不是一件新鲜事。在各大社交平台上，一直都有不少玩家分享账号被黑客盗用后的经历，能够顺利将账号找回并且恢复的却很少。以XBOX的账号举例，黑客可能通过安全漏洞修改账号信息，更换绑定邮箱，一旦30天之内原本的玩家没有注意到这条邮件信息，账号就可能彻底落入他人手中。经历过类似事情的人不在少数，甚至已经有了多种维权攻略这时候玩家再去寻找微软客服，结果往往不太理想：要么验证成功，更改密码和安全信息，找回账号；要么玩家与黑客双输——玩家可以申请将账号直接永久封锁，谁也无法再次使用。账号数据丢失，导致需要重新购买所有游戏，是目前所有案例中更普遍的情况。前段时间，一位来自巴西的游戏用户 Ordo_Liberal 就经历了类似的事件。不同的是，在账号被盗、数据被删除之后，他选择将微软告上法庭。三个月后，他胜诉拿回了账号。1一切还得追溯到今年四月份。当时，Ordo发布了第一条帖子，标题是：“我的微软账号被黑了。微软支持团队确认账号被黑，并且他们无法将账号复原，所以他们删除了我的账号，我现在得重新购买我的所有游戏。", "summary_zh": "游戏账号被盗已经不是一件新鲜事。在各大社交平台上，一直都有不少玩家分享账号被黑客盗用后的经历，能够顺利将账号找回并且恢复的却很少。以XBOX的账号举例，黑客可能通过安全漏洞修改账号信息，更换绑定邮箱，一旦30天之内原本的玩家没有注意到这条邮件信息，账号就可能彻底落入他人手中。经历过类似事情的人不在少数，甚至已经有了多种维权攻略这时候玩家再去寻找微软客服，结果往往不太理想：要么验证成功，更改密码和安全信息，找回账号；要么玩家与黑客双输——玩家可以申请将账号直接永久封锁，谁也无法再次使用。账号数据丢失，导致需要重新购买所有游戏，是目前所有案例中更普遍的情况。前段时间，一位来自巴西的游戏用户 Ordo_Liberal 就经历了类似的事件。不同的是，在账号被盗、数据被删除之后，他选择将微软告上法庭。三个月后，他胜诉拿回了账号。1一切还得追溯到今年四月份。当时，Ordo发布了第一条帖子，标题是：“我的微软账号被黑了。微软支持团队确认账号被黑，并且他们无法将账号复原，所以他们删除了我的账号，我现在得重新购买我的所有游戏。", "pub_date": "2026-09-01T00:00:00+08:00", "time_str": "1天前"}, {"source": "游戏研究社", "source_key": "游戏研究社_19", "cat": "cn_tech", "color": "#5c6bc0", "title": "“金铲铲启动”，正在变得无处不在", "title_zh": "“金铲铲启动”，正在变得无处不在", "summary": "五周年的陪伴感。最近几次和朋友聚餐的时候，只要人还没齐，总能看到他们面前的手机上运行着《金铲铲之战》——我对此已经见怪不怪了。前两天和朋友吃小龙虾，他只关心他的“世纪和解”能不能三星对大部分玩家来说，这样的场景甚至不需要刻意寻找。通勤地铁上看见邻座铲一把，逛街时聊两句阵容，和朋友吃饭时开一局……“铲铲”正在越来越自然地出现在生活里。而在金铲铲五周年的节点，玩家在身边能不经意看到的“铲铲”元素正在变得越来越多。五周年期间，《金铲铲之战》还合作了麦当劳、海底捞和乐刻等多家品牌。从商场到餐厅、从快餐到健身房，合作仍在继续强化着铲铲的线下属性。这不仅是把游戏内容带到线下，在五周年的生日派对里，也是在共同强化着铲铲的“陪伴感”。那句我们熟悉的“金铲铲启动”，正在变得无处不在。1今年五周年，金铲铲在做一件看似很简单的事情：让玩家在更多地方遇见“铲铲”。昨天在深圳湾万象城，《金铲铲之战》的五周年生日派对就成了线下遇见铲铲最有代表性的一幕。商场外的一大片空地上，搭建起了一片巨大的活动区域。", "summary_zh": "五周年的陪伴感。最近几次和朋友聚餐的时候，只要人还没齐，总能看到他们面前的手机上运行着《金铲铲之战》——我对此已经见怪不怪了。前两天和朋友吃小龙虾，他只关心他的“世纪和解”能不能三星对大部分玩家来说，这样的场景甚至不需要刻意寻找。通勤地铁上看见邻座铲一把，逛街时聊两句阵容，和朋友吃饭时开一局……“铲铲”正在越来越自然地出现在生活里。而在金铲铲五周年的节点，玩家在身边能不经意看到的“铲铲”元素正在变得越来越多。五周年期间，《金铲铲之战》还合作了麦当劳、海底捞和乐刻等多家品牌。从商场到餐厅、从快餐到健身房，合作仍在继续强化着铲铲的线下属性。这不仅是把游戏内容带到线下，在五周年的生日派对里，也是在共同强化着铲铲的“陪伴感”。那句我们熟悉的“金铲铲启动”，正在变得无处不在。1今年五周年，金铲铲在做一件看似很简单的事情：让玩家在更多地方遇见“铲铲”。昨天在深圳湾万象城，《金铲铲之战》的五周年生日派对就成了线下遇见铲铲最有代表性的一幕。商场外的一大片空地上，搭建起了一片巨大的活动区域。", "pub_date": "2026-09-01T00:00:00+08:00", "time_str": "1天前"}, {"source": "游戏研究社", "source_key": "游戏研究社_19", "cat": "cn_tech", "color": "#5c6bc0", "title": "COD23多人模式评析：更像一盘各大制作组做出的“融合菜”", "title_zh": "COD23多人模式评析：更像一盘各大制作组做出的“融合菜”", "summary": "怎么做都要挨骂。这两周里，“年货”FPS《使命召唤》的新作——《使命召唤：现代战争4》（COD23），端上来了相当大规模的一次B测，虽然有个用于尝鲜的战役关卡，但主要测试的还是多人对战。试玩第一周是预购和领到提前测试码的玩家参与测试，可以说碰到的都是核心玩家。又因为这代多人对战安排了严苛的SBMM匹配机制，在狂捞人头的“奖励局”过后，总会有好几局匹到黑队和高手的“坐牢局”，打得越厉害就越容易挨揍。不难猜到，这几天的多人对战强度堪比“高压锅”，连我个人都匹到过两次自己关注的主播，然后被干了个稀碎。第一周的优化和服务器也有不小的问题，经常出现对枪对不过，然后发现死亡回放里自己压根一枪没开的情况。动视官方大胆开放了B测的Steam商店页面，好评率并不乐观。但我在高强度的“军训”中打上头了。这是我近几年来第一次在COD的B测投入超过10个小时，打到半夜睡不着，还会对着自己难得的精彩集锦沾沾自喜。因为这代COD让我发现：我又打得动多人对战了，年轻的感觉回来了。", "summary_zh": "怎么做都要挨骂。这两周里，“年货”FPS《使命召唤》的新作——《使命召唤：现代战争4》（COD23），端上来了相当大规模的一次B测，虽然有个用于尝鲜的战役关卡，但主要测试的还是多人对战。试玩第一周是预购和领到提前测试码的玩家参与测试，可以说碰到的都是核心玩家。又因为这代多人对战安排了严苛的SBMM匹配机制，在狂捞人头的“奖励局”过后，总会有好几局匹到黑队和高手的“坐牢局”，打得越厉害就越容易挨揍。不难猜到，这几天的多人对战强度堪比“高压锅”，连我个人都匹到过两次自己关注的主播，然后被干了个稀碎。第一周的优化和服务器也有不小的问题，经常出现对枪对不过，然后发现死亡回放里自己压根一枪没开的情况。动视官方大胆开放了B测的Steam商店页面，好评率并不乐观。但我在高强度的“军训”中打上头了。这是我近几年来第一次在COD的B测投入超过10个小时，打到半夜睡不着，还会对着自己难得的精彩集锦沾沾自喜。因为这代COD让我发现：我又打得动多人对战了，年轻的感觉回来了。", "pub_date": "2026-09-01T00:00:00+08:00", "time_str": "1天前"}]}, {"key": "潮流周刊_21", "name": "潮流周刊", "cat": "cn_tech", "color": "#ff5722", "items": [{"source": "潮流周刊", "source_key": "潮流周刊_21", "cat": "cn_tech", "color": "#ff5722", "title": "第280期 - 喜欢宋体", "title_zh": "第280期 - 喜欢宋体", "summary": "封面图拍摄于杭州新开的恒隆商场，周末过去逛了逛，喝了一杯 AITCoffee，味道还不错，看到墙上有这么一个纸窗户，上面写着宋字，我最近产品官网喜欢用这个字体，很古典。\n\n记录每周看到的接地气的潮流技术，筛选后发布于此，觉得不错可关注此周刊，方便获取更新通知\n\n潮流工具\ncelldock-for-mac：在 Mac 上使用蜂窝网络、短信和通话\nhttps://github.com/celldock/celldock-for-mac\n这个产品有点意思，假如你手上有大疆的 4G 模块可以试试，我也打算搞一个玩玩，甚至可以插一张 SIM 卡，配一个模块，就变成出门在外的随身 Wi-Fi 了。\n\nkooky：又一个专为 AI Coding 优化的 macOS 终端\nhttps://github.com/iAmCorey/kooky\n支持侧边栏 workspace 管理、水平 / 垂直分屏、一键启动 agent、实时查看 agent 状态，也能在 pane 底部直接看到 Git、Node、Python 等工作区状态。", "summary_zh": "封面图拍摄于杭州新开的恒隆商场，周末过去逛了逛，喝了一杯 AITCoffee，味道还不错，看到墙上有这么一个纸窗户，上面写着宋字，我最近产品官网喜欢用这个字体，很古典。\n\n记录每周看到的接地气的潮流技术，筛选后发布于此，觉得不错可关注此周刊，方便获取更新通知\n\n潮流工具\ncelldock-for-mac：在 Mac 上使用蜂窝网络、短信和通话\nhttps://github.com/celldock/celldock-for-mac\n这个产品有点意思，假如你手上有大疆的 4G 模块可以试试，我也打算搞一个玩玩，甚至可以插一张 SIM 卡，配一个模块，就变成出门在外的随身 Wi-Fi 了。\n\nkooky：又一个专为 AI Coding 优化的 macOS 终端\nhttps://github.com/iAmCorey/kooky\n支持侧边栏 workspace 管理、水平 / 垂直分屏、一键启动 agent、实时查看 agent 状态，也能在 pane 底部直接看到 Git、Node、Python 等工作区状态。", "pub_date": "2026-08-31T00:00:00+00:00", "time_str": "2天前"}]}, {"key": "扯氮集_25", "name": "扯氮集", "cat": "cn_tech", "color": "#6a1b9a", "items": []}, {"key": "deepzz_26", "name": "Deepzz", "cat": "cn_tech", "color": "#d32f2f", "items": []}, {"key": "mit科技评论_28", "name": "MIT科技评论", "cat": "cn_tech", "color": "#0097a7", "items": [{"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "a16z押注“机器时代”：AI的瓶颈，正在向模型以下转移", "title_zh": "a16z押注“机器时代”：AI的瓶颈，正在向模型以下转移", "summary": "近日，风险投资机构 a16z 宣布成立一支 11 亿美元的“机器时代基金”（Machine Age Fund），用于投资 AI 相关的物理层基础设施：涵盖芯片、内存、网络、存储、数据中心、机器人以及家用 AI 设备等。随后，a16z 的联合创始人 Ben Horowitz、普通合伙人 Martin Casado，以及管理合伙人 Raghu Raghuram 进行了一场对谈，详细解释了为什么要在这个时间点专门成立这样一支基金。几个人反复谈到：过去几年，AI 行业最受关注的是模型还能不能继续 Scaling，但当模型能力不断提高、应用开始大规模落地之后，真正跟不上的东西正在从模型本身转移到底层基础设施。Raghu 对此有一个很形象的说法。过去谈计算基础设施，无非是服务器、存储和网络，但这一轮 AI 基础设施如果继续往下追，最终甚至可以一路追到矿山和铜矿。Ben 的说法更直接：新的芯片、系统软件、供电方式，甚至底层连接方式都需要变化。Martin 则认为，这一轮 AI 和过去的软件时代有一个很大的不同。传统软件开发首先是工程问题，多投入资金、多招工程师，并不能让项目按比例提速。", "summary_zh": "近日，风险投资机构 a16z 宣布成立一支 11 亿美元的“机器时代基金”（Machine Age Fund），用于投资 AI 相关的物理层基础设施：涵盖芯片、内存、网络、存储、数据中心、机器人以及家用 AI 设备等。随后，a16z 的联合创始人 Ben Horowitz、普通合伙人 Martin Casado，以及管理合伙人 Raghu Raghuram 进行了一场对谈，详细解释了为什么要在这个时间点专门成立这样一支基金。几个人反复谈到：过去几年，AI 行业最受关注的是模型还能不能继续 Scaling，但当模型能力不断提高、应用开始大规模落地之后，真正跟不上的东西正在从模型本身转移到底层基础设施。Raghu 对此有一个很形象的说法。过去谈计算基础设施，无非是服务器、存储和网络，但这一轮 AI 基础设施如果继续往下追，最终甚至可以一路追到矿山和铜矿。Ben 的说法更直接：新的芯片、系统软件、供电方式，甚至底层连接方式都需要变化。Martin 则认为，这一轮 AI 和过去的软件时代有一个很大的不同。传统软件开发首先是工程问题，多投入资金、多招工程师，并不能让项目按比例提速。", "pub_date": "2026-08-31T11:37:35+00:00", "time_str": "1天前"}, {"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "MIT课堂里诞生的新飞机，在足球场就能起降，即将迎来量产", "title_zh": "MIT课堂里诞生的新飞机，在足球场就能起降，即将迎来量产", "summary": "（来源：MIT News）一个诞生于麻省理工学院课堂项目的飞行器概念，如今正在变成一项价值 8.5 亿美元的制造计划。Electra 最初的设想，是造一架混合动力飞机：它不需要传统飞机那么长的跑道，却能比纯电动飞机飞得更远、更快。如今，这个从校园里走出来的项目，正准备进入规模化生产。目前，Electra 设计的是一款固定翼飞机，希望让航空出行覆盖更多传统机场难以触达的地区，尤其是那些距离大型机场较远的人群。相比传统飞机，它采用了更小、更高效的发动机，同时配备电池，在起飞和降落阶段提供额外动力。这款飞机的航程约为 1200 英里（约 1930 公里），巡航速度约为每小时 200 英里（约 320 公里）。它不仅能降低燃油消耗，更特别的是，对起降场地的要求远低于传统飞机，而且噪音更小。理论上，驳船、停车场甚至足球场大小的空地，都可能成为它的起降点，而不必依赖传统机场。Electra 技术开发总监克里斯·库尔廷（Chris Courtin）表示，“50 到 250 英里（约 80 至 400 公里）的出行距离，是这项技术最适合发挥作用的区间。", "summary_zh": "（来源：MIT News）一个诞生于麻省理工学院课堂项目的飞行器概念，如今正在变成一项价值 8.5 亿美元的制造计划。Electra 最初的设想，是造一架混合动力飞机：它不需要传统飞机那么长的跑道，却能比纯电动飞机飞得更远、更快。如今，这个从校园里走出来的项目，正准备进入规模化生产。目前，Electra 设计的是一款固定翼飞机，希望让航空出行覆盖更多传统机场难以触达的地区，尤其是那些距离大型机场较远的人群。相比传统飞机，它采用了更小、更高效的发动机，同时配备电池，在起飞和降落阶段提供额外动力。这款飞机的航程约为 1200 英里（约 1930 公里），巡航速度约为每小时 200 英里（约 320 公里）。它不仅能降低燃油消耗，更特别的是，对起降场地的要求远低于传统飞机，而且噪音更小。理论上，驳船、停车场甚至足球场大小的空地，都可能成为它的起降点，而不必依赖传统机场。Electra 技术开发总监克里斯·库尔廷（Chris Courtin）表示，“50 到 250 英里（约 80 至 400 公里）的出行距离，是这项技术最适合发挥作用的区间。", "pub_date": "2026-08-31T11:35:12+00:00", "time_str": "1天前"}, {"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "被消费者抛弃的黑莓手机，正在另一个赛道悄悄赚钱", "title_zh": "被消费者抛弃的黑莓手机，正在另一个赛道悄悄赚钱", "summary": "你有多久没见过“黑莓”这个品牌？对大多数人来说，黑莓（BlackBerry）是一段属于 21 世纪前 10 年的记忆，与之绑定的符号是全键盘、BBM（自有即时通讯软件）、商务人士专属……但随着 iPhone 等智能触屏手机席卷市场，它似乎彻底销声匿迹了。不过，在消费者注意不到的角落里，黑莓正在焕发新的生机。截至目前，全球超 2.75 亿辆汽车的底层系统使用黑莓旗下 QNX 的软件；2026 年以来，黑莓的股价翻了一番。而驱动市场重新关注这家老牌公司的，是一个全新的关键词：具身智能。多年前一次脱离业务主线的收购，如今成为它在物理 AI 时代的入场券。一家还在，但已经变形的公司最近 20 年，黑莓的转型并不轻盈。2007 年，苹果公司发布 iPhone 之后，其手机业务持续失血，2011 年一次大规模服务中断进一步动摇了企业客户的信任。2013 年底，以扭亏经验著称的华裔高管程守宗（John Chen）出任黑莓 CEO。在他的带领下，黑莓逐步实现了业务重心的转向：2016 年正式退出手机硬件的设计与制造，品牌被授权给 TCL 等厂商代工；同期还通过一系列收购扩充软件和加密通信业务。", "summary_zh": "你有多久没见过“黑莓”这个品牌？对大多数人来说，黑莓（BlackBerry）是一段属于 21 世纪前 10 年的记忆，与之绑定的符号是全键盘、BBM（自有即时通讯软件）、商务人士专属……但随着 iPhone 等智能触屏手机席卷市场，它似乎彻底销声匿迹了。不过，在消费者注意不到的角落里，黑莓正在焕发新的生机。截至目前，全球超 2.75 亿辆汽车的底层系统使用黑莓旗下 QNX 的软件；2026 年以来，黑莓的股价翻了一番。而驱动市场重新关注这家老牌公司的，是一个全新的关键词：具身智能。多年前一次脱离业务主线的收购，如今成为它在物理 AI 时代的入场券。一家还在，但已经变形的公司最近 20 年，黑莓的转型并不轻盈。2007 年，苹果公司发布 iPhone 之后，其手机业务持续失血，2011 年一次大规模服务中断进一步动摇了企业客户的信任。2013 年底，以扭亏经验著称的华裔高管程守宗（John Chen）出任黑莓 CEO。在他的带领下，黑莓逐步实现了业务重心的转向：2016 年正式退出手机硬件的设计与制造，品牌被授权给 TCL 等厂商代工；同期还通过一系列收购扩充软件和加密通信业务。", "pub_date": "2026-08-31T11:28:48+00:00", "time_str": "1天前"}, {"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "华人团队开发光驱动软体机器人，连跳500次不用干预，腾空自我复位", "title_zh": "华人团队开发光驱动软体机器人，连跳500次不用干预，腾空自我复位", "summary": "许多人小时候都玩过折纸青蛙。用手按住它的尾部再松开，纸青蛙便会突然弹起。但每跳一次，人们都要重新按压，让它再次蓄能。许多软体装置也一样，可以跳得很高，却无法独自准备好“下一跳”。若要反复跳跃，机器人既要储存并快速释放弹性能，还要处理空中姿态、落地状态和重新蓄能等问题。以往方案通常需要人工复位、机械锁扣，或者周期性改变外部刺激。任何一个环节失效，连续运动都会中断。近日，北卡罗来纳州立大学尹杰研究团队给出了解决方案，成员包括漆方杰、周才植、清海涛、孙昊泽和洪尧烨。他们把液晶弹性体软环与刚性 V 形尾部结合，让装置在恒定红外光照下完成储能、起跳和复位。论文于 8 月 27 日发表于《美国国家科学院院刊》（PNAS）。实验中，这枚毫米尺度的软环连续跳跃超过 500 次，无需反复开关光源或手动复位。优化构型的垂直跳跃高度超过自身高度的 80 倍，稳定定向跳跃距离超过自身长度的 3 倍，还能在斜坡、草地、湿沙和碎石等表面持续运动。此外，团队进一步改变材料与尾部设计，使软环可以入水、划行并重返岸边。", "summary_zh": "许多人小时候都玩过折纸青蛙。用手按住它的尾部再松开，纸青蛙便会突然弹起。但每跳一次，人们都要重新按压，让它再次蓄能。许多软体装置也一样，可以跳得很高，却无法独自准备好“下一跳”。若要反复跳跃，机器人既要储存并快速释放弹性能，还要处理空中姿态、落地状态和重新蓄能等问题。以往方案通常需要人工复位、机械锁扣，或者周期性改变外部刺激。任何一个环节失效，连续运动都会中断。近日，北卡罗来纳州立大学尹杰研究团队给出了解决方案，成员包括漆方杰、周才植、清海涛、孙昊泽和洪尧烨。他们把液晶弹性体软环与刚性 V 形尾部结合，让装置在恒定红外光照下完成储能、起跳和复位。论文于 8 月 27 日发表于《美国国家科学院院刊》（PNAS）。实验中，这枚毫米尺度的软环连续跳跃超过 500 次，无需反复开关光源或手动复位。优化构型的垂直跳跃高度超过自身高度的 80 倍，稳定定向跳跃距离超过自身长度的 3 倍，还能在斜坡、草地、湿沙和碎石等表面持续运动。此外，团队进一步改变材料与尾部设计，使软环可以入水、划行并重返岸边。", "pub_date": "2026-08-31T09:45:41+00:00", "time_str": "1天前"}, {"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "美国电动车卖不动，2.5万美元的小皮卡能救场吗？", "title_zh": "美国电动车卖不动，2.5万美元的小皮卡能救场吗？", "summary": "（来源：麻省理工科技评论）美国电动车卖不动了。目前，电动车在美国新车销量中的占比还不到 10%，而且这个数字仍在下降。从气候角度看，这显然不是什么好消息，毕竟交通运输业仍是美国最大的温室气体排放来源。Slate Auto 的新款电动皮卡，或许提供了一种不同的思路。至少，它几乎反着美国汽车市场的主流逻辑来：不追求配置堆满，也不追求越来越长的续航，而是把车做得更小、更简单，也更便宜。Slate 把“简单”做到了近乎极致。这是一辆只有两个车门的小型皮卡，车身甚至比本田思域还短。此前不少媒体最津津乐道的一点，是基础版连电动车窗都没有，开关车窗要靠手摇（一种如今已经很少见的配置）。在续航上，Slate 同样没有跟着其他电动车厂商一起卷。它搭载一块容量只有 65 千瓦时的磷酸铁锂电池，官方最高续航约为 205 英里，也就是约 330 公里。相比之下，最入门的特斯拉 Model 3 单次充电也能跑超过 320 英里，约 515 公里。但也正因为接受了更短的续航，并砍掉了美国消费者如今习以为常的大量配置，Slate 才能把基础版售价压到 2.5 万美元以下。", "summary_zh": "（来源：麻省理工科技评论）美国电动车卖不动了。目前，电动车在美国新车销量中的占比还不到 10%，而且这个数字仍在下降。从气候角度看，这显然不是什么好消息，毕竟交通运输业仍是美国最大的温室气体排放来源。Slate Auto 的新款电动皮卡，或许提供了一种不同的思路。至少，它几乎反着美国汽车市场的主流逻辑来：不追求配置堆满，也不追求越来越长的续航，而是把车做得更小、更简单，也更便宜。Slate 把“简单”做到了近乎极致。这是一辆只有两个车门的小型皮卡，车身甚至比本田思域还短。此前不少媒体最津津乐道的一点，是基础版连电动车窗都没有，开关车窗要靠手摇（一种如今已经很少见的配置）。在续航上，Slate 同样没有跟着其他电动车厂商一起卷。它搭载一块容量只有 65 千瓦时的磷酸铁锂电池，官方最高续航约为 205 英里，也就是约 330 公里。相比之下，最入门的特斯拉 Model 3 单次充电也能跑超过 320 英里，约 515 公里。但也正因为接受了更短的续航，并砍掉了美国消费者如今习以为常的大量配置，Slate 才能把基础版售价压到 2.5 万美元以下。", "pub_date": "2026-08-30T12:57:32+00:00", "time_str": "2天前"}, {"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "a16z成立11亿美元“机器时代基金”，专投AI底层硬件设施", "title_zh": "a16z成立11亿美元“机器时代基金”，专投AI底层硬件设施", "summary": "8 月 28 日，风险投资机构 a16z 在官网发布公告，公司联合创始人本·霍洛维茨（Ben Horowitz）、管理合伙人拉古·拉古拉姆（Raghu Raghuram），以及 3 位关键业务负责人联名署名，宣布成立一只 11 亿美元的“机器时代基金”（Machine Age Fund），用于投资 AI 相关的物理层基础设施：涵盖芯片、内存、网络、存储、数据中心、机器人以及家用 AI 设备等。作为一家资金管理规模已达 900 亿美元、2025 年占据全美风投总额约 18% 的机构，a16z 成立 17 年以来，最广为人知的招牌是“软件吞噬世界”。从引领软件投资风潮，到如今大张旗鼓宣布进军硬件，a16z 叙事转向背后，资本的暗河正在涌向 AI 基础设施。平台级重构的窗口期a16z 在公告中判断，AI 对物理层的需求已经超出了现有供应链的承载能力，整个硬件平台需要被重新设计。具体来看，下一代 Rubin 机架的单机架算力密度是上一代 H100 的 28 倍；单机架功耗从原本的 5~10 千瓦跃升至现在的 100~250 千瓦，未来三年内甚至将冲进兆瓦级；数据中心的规模从几十兆瓦跳到吉瓦级；", "summary_zh": "8 月 28 日，风险投资机构 a16z 在官网发布公告，公司联合创始人本·霍洛维茨（Ben Horowitz）、管理合伙人拉古·拉古拉姆（Raghu Raghuram），以及 3 位关键业务负责人联名署名，宣布成立一只 11 亿美元的“机器时代基金”（Machine Age Fund），用于投资 AI 相关的物理层基础设施：涵盖芯片、内存、网络、存储、数据中心、机器人以及家用 AI 设备等。作为一家资金管理规模已达 900 亿美元、2025 年占据全美风投总额约 18% 的机构，a16z 成立 17 年以来，最广为人知的招牌是“软件吞噬世界”。从引领软件投资风潮，到如今大张旗鼓宣布进军硬件，a16z 叙事转向背后，资本的暗河正在涌向 AI 基础设施。平台级重构的窗口期a16z 在公告中判断，AI 对物理层的需求已经超出了现有供应链的承载能力，整个硬件平台需要被重新设计。具体来看，下一代 Rubin 机架的单机架算力密度是上一代 H100 的 28 倍；单机架功耗从原本的 5~10 千瓦跃升至现在的 100~250 千瓦，未来三年内甚至将冲进兆瓦级；数据中心的规模从几十兆瓦跳到吉瓦级；", "pub_date": "2026-08-30T10:05:44+00:00", "time_str": "2天前"}, {"source": "MIT科技评论", "source_key": "mit科技评论_28", "cat": "cn_tech", "color": "#0097a7", "title": "不扎针就能连续监测6种代谢分子，UCSD团队开发首款汗液生化传感智能戒指", "title_zh": "不扎针就能连续监测6种代谢分子，UCSD团队开发首款汗液生化传感智能戒指", "summary": "今年菲尔茨奖揭晓后，在不少公开场合或视频记录中，有眼尖的网友发现，获奖者之一、华人数学家王虹手上戴着一枚 Oura 智能戒指。作为商业化可穿戴设备中增长最快的门类之一，Oura、三星、Ultrahuman、Circular 等常见品牌做出的智能戒指，绝大部分内置光电容积描记法（PPG）、加速度计、温度传感器，可监测人体心率、血氧、体温、运动量、睡眠等生物活动。不过，这些设备只能感知部分物理信号，始终无法记录使用者体内更深层的生化组分动态信息。7 月底，加利福尼亚大学圣地亚哥分校（UCSD）的研究人员在《自然-通讯》（Nature Communications）发表了一项研究，该校纳米工程系约瑟夫·王（Joseph Wang）教授和徐升教授带领团队，做出一枚重 5.1 克、外径 3 厘米的智能戒指原型，可从手指皮肤渗出的微量汗液中，同时连续监测与葡萄糖、酮体、乳酸、尿酸、维生素 C 和酒精相关的 6 种代谢分子，并将其命名为 CHARM（连续健康分析戒指模块）。", "summary_zh": "今年菲尔茨奖揭晓后，在不少公开场合或视频记录中，有眼尖的网友发现，获奖者之一、华人数学家王虹手上戴着一枚 Oura 智能戒指。作为商业化可穿戴设备中增长最快的门类之一，Oura、三星、Ultrahuman、Circular 等常见品牌做出的智能戒指，绝大部分内置光电容积描记法（PPG）、加速度计、温度传感器，可监测人体心率、血氧、体温、运动量、睡眠等生物活动。不过，这些设备只能感知部分物理信号，始终无法记录使用者体内更深层的生化组分动态信息。7 月底，加利福尼亚大学圣地亚哥分校（UCSD）的研究人员在《自然-通讯》（Nature Communications）发表了一项研究，该校纳米工程系约瑟夫·王（Joseph Wang）教授和徐升教授带领团队，做出一枚重 5.1 克、外径 3 厘米的智能戒指原型，可从手指皮肤渗出的微量汗液中，同时连续监测与葡萄糖、酮体、乳酸、尿酸、维生素 C 和酒精相关的 6 种代谢分子，并将其命名为 CHARM（连续健康分析戒指模块）。", "pub_date": "2026-08-30T10:01:49+00:00", "time_str": "2天前"}]}, {"key": "疯投圈_29", "name": "疯投圈", "cat": "cn_tech", "color": "#c62828", "items": [{"source": "疯投圈", "source_key": "疯投圈_29", "cat": "cn_tech", "color": "#c62828", "title": "146 ✪ 对买量和铺货说bye-bye，AI如何驱动出海品牌增长?", "title_zh": "146 ✪ 对买量和铺货说bye-bye，AI如何驱动出海品牌增长?", "summary": "疯投圈长期关注中国企业的全球化征程。中国企业的出海逻辑正在经历系统性变化：过往依靠铺货和采买流量的方法论已经失效，出海企业必须要成为真正的全球化品牌。线上流量越贵，品牌越需要通过优质内容和达人营销占领消费者心智。但海外营销面临诸多难题：达人生态分散，跨语言、跨文化沟通障碍，使得品牌要承担高昂的管理成本以及不透明的价格和交易流程。AI技术的发展应用，正在为这些长期困扰出海企业的问题提供新解法。\n\n本期节目我们邀请到AI原生海外达人营销平台AhaCreator的创始人Kay。AhaCreator是飞书首个海外达人营销AI Agent合作伙伴，致力于帮助全球化品牌更高效地连接全球创作者。我们重点讨论了以下话题：\n\n\n海外达人营销为什么比国内更难规模化？\nAI如何改造全球营销行业？\nAI除了提高效率，能否真正改善营销效果？\nAI应用公司的壁垒究竟在哪里？\n如果大平台下场做同类业务，创业公司该如何应对？", "summary_zh": "疯投圈长期关注中国企业的全球化征程。中国企业的出海逻辑正在经历系统性变化：过往依靠铺货和采买流量的方法论已经失效，出海企业必须要成为真正的全球化品牌。线上流量越贵，品牌越需要通过优质内容和达人营销占领消费者心智。但海外营销面临诸多难题：达人生态分散，跨语言、跨文化沟通障碍，使得品牌要承担高昂的管理成本以及不透明的价格和交易流程。AI技术的发展应用，正在为这些长期困扰出海企业的问题提供新解法。\n\n本期节目我们邀请到AI原生海外达人营销平台AhaCreator的创始人Kay。AhaCreator是飞书首个海外达人营销AI Agent合作伙伴，致力于帮助全球化品牌更高效地连接全球创作者。我们重点讨论了以下话题：\n\n\n海外达人营销为什么比国内更难规模化？\nAI如何改造全球营销行业？\nAI除了提高效率，能否真正改善营销效果？\nAI应用公司的壁垒究竟在哪里？\n如果大平台下场做同类业务，创业公司该如何应对？", "pub_date": "2026-08-31T10:00:00+00:00", "time_str": "1天前"}]}, {"key": "超能网_31", "name": "超能网", "cat": "cn_tech", "color": "#0091ea", "items": [{"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "《越过山丘》发售预告：10月14日登陆PC，Steam国区定价86元", "title_zh": "《越过山丘》发售预告：10月14日登陆PC，Steam国区定价86元", "summary": "《越过山丘（over the hill）》将于2026年10月14日登陆PC平台，PlayStation 5、Xbox Series X|S、以及Nintendo Switch 2版本预计2027年推出，游戏支持简体中文界面。游戏将带领玩家梦回越野黄金年代，探索广袤无垠天地。 \n    if (IsMobile()) {\n                jQuery(\"iframe\").attr(\"width\", \"100%\");\n                jQuery(\"iframe\").attr(\"height\", jQuery(\"#post_body\").width() * 9 / 16);\n            } else jQuery(\"iframe\").attr(\"height\", jQuery(\"#post_body\").width() * 9 / 16 + 120);手机通道：哔哩哔哩近日官方也公布了《越过山丘》在Steam上的定价，国区标准版价格86元，不过不会开放预购；", "summary_zh": "《越过山丘（over the hill）》将于2026年10月14日登陆PC平台，PlayStation 5、Xbox Series X|S、以及Nintendo Switch 2版本预计2027年推出，游戏支持简体中文界面。游戏将带领玩家梦回越野黄金年代，探索广袤无垠天地。 \n    if (IsMobile()) {\n                jQuery(\"iframe\").attr(\"width\", \"100%\");\n                jQuery(\"iframe\").attr(\"height\", jQuery(\"#post_body\").width() * 9 / 16);\n            } else jQuery(\"iframe\").attr(\"height\", jQuery(\"#post_body\").width() * 9 / 16 + 120);手机通道：哔哩哔哩近日官方也公布了《越过山丘》在Steam上的定价，国区标准版价格86元，不过不会开放预购；", "pub_date": "2026-09-02T12:21:00+00:00", "time_str": "09-02 20:21"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "雷蛇灵猫发布：超便携游戏手柄，适用于7英寸以内手机，售价799元", "title_zh": "雷蛇灵猫发布：超便携游戏手柄，适用于7英寸以内手机，售价799元", "summary": "雷蛇（Razer）宣布，推出雷蛇灵猫（Razer Prio）。这是一款可折叠的超便携游戏手柄，适用于7英寸以内手机，支持Android和iPhone移动设备。目前新产品已登陆电商平台，并开始销售了，显示价格为799元。雷蛇灵猫 超便携游戏手柄，地址：点此前往>>>雷蛇表示，雷蛇灵猫是一款专为碎片化时间设计的超便携游戏手柄，让玩家轻松将零星空闲时间转化为游戏时光。只需将雷蛇灵猫从口袋中取出，展开即可变身为完整的游戏主机式手柄——无需充电，无需繁琐设置，就能将短暂的空闲时间变成一场精彩冒险。雷蛇灵猫采用了独特的折叠设计，打开即可将手掌大小的机身化身为全尺寸手柄，并适配最大7英寸的手机，比如苹果的iPhone 17 Pro Max或者三星的Galaxy S26 Ultra，让玩家获得全尺寸的游戏主机级操控。其配备完整的手柄布局，包括摇杆、正面按键、肩键与扳机键，使得玩家在手游上的操控也毫不妥协。经过优化后，雷蛇灵猫兼容大多数流行的手机保护壳，使用时无需取下手机保护壳，即可立即开始游戏。", "summary_zh": "雷蛇（Razer）宣布，推出雷蛇灵猫（Razer Prio）。这是一款可折叠的超便携游戏手柄，适用于7英寸以内手机，支持Android和iPhone移动设备。目前新产品已登陆电商平台，并开始销售了，显示价格为799元。雷蛇灵猫 超便携游戏手柄，地址：点此前往>>>雷蛇表示，雷蛇灵猫是一款专为碎片化时间设计的超便携游戏手柄，让玩家轻松将零星空闲时间转化为游戏时光。只需将雷蛇灵猫从口袋中取出，展开即可变身为完整的游戏主机式手柄——无需充电，无需繁琐设置，就能将短暂的空闲时间变成一场精彩冒险。雷蛇灵猫采用了独特的折叠设计，打开即可将手掌大小的机身化身为全尺寸手柄，并适配最大7英寸的手机，比如苹果的iPhone 17 Pro Max或者三星的Galaxy S26 Ultra，让玩家获得全尺寸的游戏主机级操控。其配备完整的手柄布局，包括摇杆、正面按键、肩键与扳机键，使得玩家在手游上的操控也毫不妥协。经过优化后，雷蛇灵猫兼容大多数流行的手机保护壳，使用时无需取下手机保护壳，即可立即开始游戏。", "pub_date": "2026-09-02T11:21:00+00:00", "time_str": "09-02 19:21"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "《恶意不息》1.0正式版宣布延期：推迟至明年3月，年末会有新的公测", "title_zh": "《恶意不息》1.0正式版宣布延期：推迟至明年3月，年末会有新的公测", "summary": "Moon Studios GmbH宣布，《恶意不息（No Rest for the Wicked）》1.0正式版将推迟发售，从2026年10月延后至2027年3月。官方表示，开发团队对游戏有着不妥协的要求，虽然已经很接近，但是仍然不够好，需要额外的时间提升性能，完善职业系统，将游戏打磨至应有的水平，宁愿多花几个月的时间，也不愿意向玩家发布一个明知道还不完美的作品。与此同时，官方还将在今年12月进行新的公开测试，另外还有几个关键点：所有在2027年1月1日之前购买《恶意不息》的Steam用户，将获得“创始人礼包”奖励，感谢你们支持完成抢先体验。PlayStation平台的预购活动将于2027年1月开启，届时也有机会获得“创始人礼包”奖励。很快会为玩家安排一场“Wicked Inside”活动，更多详情可关注Moon Studios GmbH的社交媒体账号。《恶意不息》由曾打造《精灵与森林》与《精灵与萤火意志》的获奖工作室 Moon Studios 倾力呈现，是一款风格独特、直击感官的动作角色扮演游戏，支持单人游玩或最多四名玩家在线合作畅玩。", "summary_zh": "Moon Studios GmbH宣布，《恶意不息（No Rest for the Wicked）》1.0正式版将推迟发售，从2026年10月延后至2027年3月。官方表示，开发团队对游戏有着不妥协的要求，虽然已经很接近，但是仍然不够好，需要额外的时间提升性能，完善职业系统，将游戏打磨至应有的水平，宁愿多花几个月的时间，也不愿意向玩家发布一个明知道还不完美的作品。与此同时，官方还将在今年12月进行新的公开测试，另外还有几个关键点：所有在2027年1月1日之前购买《恶意不息》的Steam用户，将获得“创始人礼包”奖励，感谢你们支持完成抢先体验。PlayStation平台的预购活动将于2027年1月开启，届时也有机会获得“创始人礼包”奖励。很快会为玩家安排一场“Wicked Inside”活动，更多详情可关注Moon Studios GmbH的社交媒体账号。《恶意不息》由曾打造《精灵与森林》与《精灵与萤火意志》的获奖工作室 Moon Studios 倾力呈现，是一款风格独特、直击感官的动作角色扮演游戏，支持单人游玩或最多四名玩家在线合作畅玩。", "pub_date": "2026-09-02T11:54:00+00:00", "time_str": "09-02 19:54"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "华硕公布ProArt GR1X规格：搭载RTX Spark的迷你PC，内存最高可选128GB", "title_zh": "华硕公布ProArt GR1X规格：搭载RTX Spark的迷你PC，内存最高可选128GB", "summary": "在今年的COMPUTEX 2026上，华硕宣布旗下ProArt系列迎来搭载英伟达RTX Spark的新品，除了ProArt P16（H7607）和ProArt P14（H7407）两款笔记本电脑外，还包括一款ProArt Mini PC小型主机。首批基于RTX Spark的终端产品之一，华硕现在公布了这款小型主机的型号，为“ProArt GR1X”，产品页面也已经上线。ProArt GR1X的整体尺寸为150 x 150 x 51 mm，可选黑白外观，能轻松应对繁重的AI任务和复杂的3D渲染，节省了大量空间，手掌中即可轻松操作。内置的散热系统专为RTX Spark量身定制，可以应付140W性能输出。RTX Spark主要由英伟达与联发科合作开发的Grace CPU + Blackwell RTX GPU组成，采用台积电3nm工艺制造，AI性能达到1petaFLOP，能够本地运行高达200B参数的AI模型。其中CPU部分采用可Arm v9.2架构，由10个Cortex-X925和10个Cortex-A725内核组成，共享32MB的L3缓存；", "summary_zh": "在今年的COMPUTEX 2026上，华硕宣布旗下ProArt系列迎来搭载英伟达RTX Spark的新品，除了ProArt P16（H7607）和ProArt P14（H7407）两款笔记本电脑外，还包括一款ProArt Mini PC小型主机。首批基于RTX Spark的终端产品之一，华硕现在公布了这款小型主机的型号，为“ProArt GR1X”，产品页面也已经上线。ProArt GR1X的整体尺寸为150 x 150 x 51 mm，可选黑白外观，能轻松应对繁重的AI任务和复杂的3D渲染，节省了大量空间，手掌中即可轻松操作。内置的散热系统专为RTX Spark量身定制，可以应付140W性能输出。RTX Spark主要由英伟达与联发科合作开发的Grace CPU + Blackwell RTX GPU组成，采用台积电3nm工艺制造，AI性能达到1petaFLOP，能够本地运行高达200B参数的AI模型。其中CPU部分采用可Arm v9.2架构，由10个Cortex-X925和10个Cortex-A725内核组成，共享32MB的L3缓存；", "pub_date": "2026-09-02T11:29:00+00:00", "time_str": "09-02 19: A今天宣布，DLSS 5将于9月3日随新版 GeForce Game Ready 驱动上线，《NBA 2K27》为首发支持游戏。该技术今年 3 月首次公布，核心是 3D-Guided Neural Rendering（3D 引导神经渲染）。", "pub_date": "2026-09-01T22:01:00+00:00", "time_str": "8小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "ASML称已经有10套High-NA EUV系统上线：分布在四个客户，另外3套部署中", "title_zh": "ASML称已经有10套High-NA EUV系统上线：分布在四个客户，另外3套部署中", "summary": "随着芯片制造商加速推进先进制程节点，High-NA EUV系统再次受到大家的关注，也让ASML（阿斯麦）更加高调地宣传新一代光刻技术。今年7月，ASML宣布英特尔已在Intel 18A工艺上采用High-NA EUV光刻技术，生产部分代号“Panther Lake”的第三代酷睿Ultra系列处理器，成为了业界首个采用High-NA EUV光刻技术大规模生产逻辑芯片的企业。据TrendForce报道，近日ASML高级副总裁兼High-NA EUV产品主管Greet Storms在出席活动时透露，目前全球已经有10套High-NA EUV系统上线，分别安装在4个客户的晶圆厂，另外还有3套High-NA EUV系统正在发货或者安装当中。", "summary_zh": "随着芯片制造商加速推进先进制程节点，High-NA EUV系统再次受到大家的关注，也让ASML（阿斯麦）更加高调地宣传新一代光刻技术。今年7月，ASML宣布英特尔已在Intel 18A工艺上采用High-NA EUV光刻技术，生产部分代号“Panther Lake”的第三代酷睿Ultra系列处理器，成为了业界首个采用High-NA EUV光刻技术大规模生产逻辑芯片的企业。据TrendForce报道，近日ASML高级副总裁兼High-NA EUV产品主管Greet Storms在出席活动时透露，目前全球已经有10套High-NA EUV系统上线，分别安装在4个客户的晶圆厂，另外还有3套High-NA EUV系统正在发货或者安装当中。", "pub_date": "2026-09-01T16:53:00+00:00", "time_str": "13小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "HBM3E现货价格已涨至四到五倍LTA水平，三星70%的DRAM产能锁定至2031年", "title_zh": "HBM3E现货价格已涨至四到五倍LTA水平，三星70%的DRAM产能锁定至2031年", "summary": "随着DRAM供应日趋紧张，韩国的DRAM出口开始逐渐减少，且价格上涨。统计数字显示，HBM和LPDDR类别DRAM出口量从今年5月的6.8179亿个单位降至7月的5.9174亿个单位，降幅达13.2%。尽管出口数量下降，但是出口价值却从114.3亿美元上升至135.5亿美元，增长了18.5%，对应每单位平均价格从16.76美元飙升至22.90美元，涨幅达36.6%。据TrendForce报道，由于DRAM制造商对长期供应协议（LTA）的依赖程度变得更高，进一步收紧了可用的供应量。最主要还是大量产能被主要客户锁定，现货市场的余量减少。传闻三星的DRAM产能，70%部分已经被主要客户锁定至2031年。目前36GB的HBM3E模块在现货市场的价格约为2100美元，约为长期供应协议里价格的四到五倍。更多的长期供应协议也在重塑DRAM制造商的库存，比如三星半导体库存自去年底开始增长了32%，至2026年上半年达到38.06万亿韩元（约合277.15亿美元/人民币1864.94亿元），其中在制品（WIP）库存增长35%，达29.71万亿韩元（约合216.35亿美元/人民币1455.79亿元）。", "summary_zh": "随着DRAM供应日趋紧张，韩国的DRAM出口开始逐渐减少，且价格上涨。统计数字显示，HBM和LPDDR类别DRAM出口量从今年5月的6.8179亿个单位降至7月的5.9174亿个单位，降幅达13.2%。尽管出口数量下降，但是出口价值却从114.3亿美元上升至135.5亿美元，增长了18.5%，对应每单位平均价格从16.76美元飙升至22.90美元，涨幅达36.6%。据TrendForce报道，由于DRAM制造商对长期供应协议（LTA）的依赖程度变得更高，进一步收紧了可用的供应量。最主要还是大量产能被主要客户锁定，现货市场的余量减少。传闻三星的DRAM产能，70%部分已经被主要客户锁定至2031年。目前36GB的HBM3E模块在现货市场的价格约为2100美元，约为长期供应协议里价格的四到五倍。更多的长期供应协议也在重塑DRAM制造商的库存，比如三星半导体库存自去年底开始增长了32%，至2026年上半年达到38.06万亿韩元（约合277.15亿美元/人民币1864.94亿元），其中在制品（WIP）库存增长35%，达29.71万亿韩元（约合216.35亿美元/人民币1455.79亿元）。", "pub_date": "2026-09-01T16:18:00+00:00", "time_str": "13小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "华硕和微星首批RTX Spark笔电已售罄，已积极下单采购新一批芯片", "title_zh": "华硕和微星首批RTX Spark笔电已售罄，已积极下单采购新一批芯片", "summary": "在COMPUTEX 2026上，英伟达正式发布了RTX Spark，宣告进军消费级PC处理器市场。新产品定位为全新类别的处理器，专为打造个人AI的Windows 11 PC而生。传闻英伟达已经敲定首批RTX Spark PC，目标是在今年秋季上市，首批产品将由华硕与微星提供。据Wccftech报道，近日华硕在季度财报电话会议的问答环节中透露，其渠道合作伙伴预订了所有搭载RTX Spark的笔记本电脑。类似的情况也发生在微星，已确认来自中国和美国的客户大量订购搭载RTX Spark的笔记本电脑，其中更为强大的“N1X”版本几乎售罄。考虑到新款RTX Spark PC有着非常不错的销售前景，华硕和微星都选择向英伟达下单，采购新一批RTX Spark芯片。英伟达根据CPU核心数量和GPU的SM规模不同，提供了四个型号，N1X和N1各两款。按照之前的说法，即便是采用相对低端的N1型号，对应的笔记本电脑起售价也可能达到1799美元，如果换成高端的N1X型号，预计不会低于2899美元。", "summary_zh": "在COMPUTEX 2026上，英伟达正式发布了RTX Spark，宣告进军消费级PC处理器市场。新产品定位为全新类别的处理器，专为打造个人AI的Windows 11 PC而生。传闻英伟达已经敲定首批RTX Spark PC，目标是在今年秋季上市，首批产品将由华硕与微星提供。据Wccftech报道，近日华硕在季度财报电话会议的问答环节中透露，其渠道合作伙伴预订了所有搭载RTX Spark的笔记本电脑。类似的情况也发生在微星，已确认来自中国和美国的客户大量订购搭载RTX Spark的笔记本电脑，其中更为强大的“N1X”版本几乎售罄。考虑到新款RTX Spark PC有着非常不错的销售前景，华硕和微星都选择向英伟达下单，采购新一批RTX Spark芯片。英伟达根据CPU核心数量和GPU的SM规模不同，提供了四个型号，N1X和N1各两款。按照之前的说法，即便是采用相对低端的N1型号，对应的笔记本电脑起售价也可能达到1799美元，如果换成高端的N1X型号，预计不会低于2899美元。", "pub_date": "2026-09-01T15:59:00+00:00", "time_str": "14小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "厂商不排除再上调主板价格：成本仍可能继续上涨", "title_zh": "厂商不排除再上调主板价格：成本仍可能继续上涨", "summary": "过去一年里，大家看到不少DIY配件都出现了涨价，最明显的就是存储和显卡，价格可以说已经涨到了让人难以忍受的程度。上个月，由于采购成本不断提高，华硕、微星和七彩虹等主板厂商都选择在8月开始执行涨价方案。据博板堂报道，主板的上游原材料上涨了确实很多，包括：PCB板价格整体上涨15%至50%；各类型电容普遍上涨50%左右；Wi-Fi模块涨幅在10%至20%之间。虽然单个配件看起来价格上涨得不多，但是累计起来至少让主板的成本提高了10%以上。虽然主板厂商在8月提高了产品的价格，但是整体涨幅有限，上涨幅度平均仅有3%左右，而且涉及的型号较少。主板厂商更多倾向于上调附加值更高的中高端主板的价格，低端系列上调幅度相对温和。市场主力的台系品牌当中，只有微星选择普涨，华硕技嘉只针对主力型号上涨，而且幅度都不大，上涨5元至50元。大陆的品牌像七彩虹和铭瑄，上涨幅度更小，只有10元至20元。今年主板销量大幅下滑，非常影响主板厂商的利润。考虑到主板成本价格仍有上涨空间，不排除后续几个月内，主板厂商将针对部分型号继续上调价格。", "summary_zh": "过去一年里，大家看到不少DIY配件都出现了涨价，最明显的就是存储和显卡，价格可以说已经涨到了让人难以忍受的程度。上个月，由于采购成本不断提高，华硕、微星和七彩虹等主板厂商都选择在8月开始执行涨价方案。据博板堂报道，主板的上游原材料上涨了确实很多，包括：PCB板价格整体上涨15%至50%；各类型电容普遍上涨50%左右；Wi-Fi模块涨幅在10%至20%之间。虽然单个配件看起来价格上涨得不多，但是累计起来至少让主板的成本提高了10%以上。虽然主板厂商在8月提高了产品的价格，但是整体涨幅有限，上涨幅度平均仅有3%左右，而且涉及的型号较少。主板厂商更多倾向于上调附加值更高的中高端主板的价格，低端系列上调幅度相对温和。市场主力的台系品牌当中，只有微星选择普涨，华硕技嘉只针对主力型号上涨，而且幅度都不大，上涨5元至50元。大陆的品牌像七彩虹和铭瑄，上涨幅度更小，只有10元至20元。今年主板销量大幅下滑，非常影响主板厂商的利润。考虑到主板成本价格仍有上涨空间，不排除后续几个月内，主板厂商将针对部分型号继续上调价格。", "pub_date": "2026-09-01T15:30:00+00:00", "time_str": "14小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "《神鬼寓言》重启版完全通关需30至40小时，生活模拟系统提升了可玩性", "title_zh": "《神鬼寓言》重启版完全通关需30至40小时，生活模拟系统提升了可玩性", "summary": "《神鬼寓言（Fable）》重启版是由Playground Games开发的开放世界动作角色扮演游戏，将于2027年2月24日发售，登陆Xbox Series X|S、PlayStation 5、以及PC，并首发加入Game Pass游戏库，支持简体中文界面和字幕。据Notebookcheck报道，近日Playground Games的游戏副总监Will Kennedy和Craig Littler接受了媒体的采访，透露了《神鬼寓言》重启版的一些细节，表示玩家大概需要15至20小时完成主线任务，如果加上支线任务和开放世界内容，将额外再花15至20小时，也就是说完全通过需要30至40小时。另外生活模拟系统是没有限制的，玩家想玩多久都行，提升了游戏的可玩性。在今年科隆游戏展（Gamescom 2026）上，Playground Games带来了游戏的任务实机演示，展示了焕然一新的女主形象，还有前期的游戏任务和战斗内容。", "summary_zh": "《神鬼寓言（Fable）》重启版是由Playground Games开发的开放世界动作角色扮演游戏，将于2027年2月24日发售，登陆Xbox Series X|S、PlayStation 5、以及PC，并首发加入Game Pass游戏库，支持简体中文界面和字幕。据Notebookcheck报道，近日Playground Games的游戏副总监Will Kennedy和Craig Littler接受了媒体的采访，透露了《神鬼寓言》重启版的一些细节，表示玩家大概需要15至20小时完成主线任务，如果加上支线任务和开放世界内容，将额外再花15至20小时，也就是说完全通过需要30至40小时。另外生活模拟系统是没有限制的，玩家想玩多久都行，提升了游戏的可玩性。在今年科隆游戏展（Gamescom 2026）上，Playground Games带来了游戏的任务实机演示，展示了焕然一新的女主形象，还有前期的游戏任务和战斗内容。", "pub_date": "2026-09-01T15:07:00+00:00", "time_str": "14小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "《英雄萨姆 : 破碎宇宙》正式发售：带来街机风格的FPS体验，Steam首发69.3元", "title_zh": "《英雄萨姆 : 破碎宇宙》正式发售：带来街机风格的FPS体验，Steam首 ", "summary": "据The Information报道，长鑫存储（CXMT）已启动HBM3E风险试产。虽然现阶段的HBM3E产量还比较低，但是对于长鑫存储来说，这是一个重要的里程碑，预计未来几年会进一步提高产量。如果对过去几年的AI芯片有所了解，就会知道HBM在其中发挥的重要作用。英伟达基于Hopper架构GPU的H200，是首款采用8层堆叠HBM3E的产品，随后基于Blackwell系列架构GPU的B200/GB200和B300/GB300同样采用了HBM3E，直到今年最新的Rubin架构GPU，才转向HBM4。AMD也在多款Instinct MI300系列产品上选择HBM3E，至今仍然是出货的主力。暂时还不清楚长鑫存储生产的HBM3E规格，按照JEDEC固态技术协会的标准，HBM3E位宽为1024-bit，每引脚速度在9.2Gbps到12.4Gbps之间，大多数时候的标准配置为9.6Gbps，对应的总带宽为1.2TB/s，容量可以是8层堆叠的24GB，或者是12层堆叠的36GB。随着长鑫存储从风险试产转向大规模生产，可能不用等太久，就会了解到更多信息。", "summary_zh": "据The Information报道，长鑫存储（CXMT）已启动HBM3E风险试产。虽然现阶段的HBM3E产量还比较低，但是对于长鑫存储来说，这是一个重要的里程碑，预计未来几年会进一步提高产量。如果对过去几年的AI芯片有所了解，就会知道HBM在其中发挥的重要作用。英伟达基于Hopper架构GPU的H200，是首款采用8层堆叠HBM3E的产品，随后基于Blackwell系列架构GPU的B200/GB200和B300/GB300同样采用了HBM3E，直到今年最新的Rubin架构GPU，才转向HBM4。AMD也在多款Instinct MI300系列产品上选择HBM3E，至今仍然是出货的主力。暂时还不清楚长鑫存储生产的HBM3E规格，按照JEDEC固态技术协会的标准，HBM3E位宽为1024-bit，每引脚速度在9.2Gbps到12.4Gbps之间，大多数时候的标准配置为9.6Gbps，对应的总带宽为1.2TB/s，容量可以是8层堆叠的24GB，或者是12层堆叠的36GB。随着长鑫存储从风险试产转向大规模生产，可能不用等太久，就会了解到更多信息。", "pub_date": "2026-09-01T09:28:00+00:00", "time_str": "20小时前"}, {"source": "超能网", "source_key": "超能网_31", "cat": "cn_tech", "color": "#0091ea", "title": "创维推出G24 GT3显示器：23.8英寸FHD@310Hz Fast-IPS，首发599元", "title_zh": "创维推出G24 GT3显示器：23.8英寸FHD@310Hz Fast-IPS，首发599元", "summary": "近日，创维推出G24 GT3显示器（具体型号为F24G42F），其配备了一块FHD@310Hz的屏幕，响应时间低至1ms的同时拥有最高550尼特的最高亮度，达到HDR400标准。新品现已开启预约，于9月7日正式开抢，首发售价为599元。预约后下单并完成晒单分享还可获得京豆和20元E卡，权益叠加最高可享价值66元的礼包。学生用户另赠Type-C转DP视频线材，便于外接笔记本电脑，畅爽电竞。和以往的产品一样，厂商也为其提供三年质保上门服务。G24 GT3电竞显示器，京东地址：点此前往>>>G24 GT3采用了经典的三边窄边框设计。其搭载了23.8英寸的Fast IPS面板，显示比例为16:9，分辨率为1920 x 1080，响应时间为1ms，最高刷新率310Hz，静态对比度1000:1，最高亮度550尼特，达到HDR400标准，DCI-P3色域覆盖率为93% 。显示器内置瞬晰引擎Pro和光感屏变功能，前者可减少画面内容快速移动时的模糊感，后者则依附环境光传感器和环境光温表，跟随场景智能变化亮度，避免画面过亮或过暗。", "summary_zh": "近日，创维推出G24 GT3显示器（具体型号为F24G42F），其配备了一块FHD@310Hz的屏幕，响应时间低至1ms的同时拥有最高550尼特的最高亮度，达到HDR400标准。新品现已开启预约，于9月7日正式开抢，首发售价为599元。预约后下单并完成晒单分享还可获得京豆和20元E卡，权益叠加最高可享价值66元的礼包。学生用户另赠Type-C转DP视频线材，便于外接笔记本电脑，畅爽电竞。和以往的产品一样，厂商也为其提供三年质保上门服务。G24 GT3电竞显示器，京东地址：点此前往>>>G24 GT3采用了经 明日达”入口被多家媒体解读为杀入即时零售，但作者实测多日并未在 App 内稳定看到该入口，判断只是短时试运行。文章区分了它与次日达的本质差异，指出这更像对标京东，而非正面硬刚美团闪购。\n\n8 月 10 日，拼多多上线 “最快明日达” 一级入口，众多媒体纷纷报道，称拼多多杀入即时零售赛道，要与美团闪购、淘宝闪购、京东外卖正面竞争。\n\n我在 8 月 11 日看到这条新闻后，打开自己的拼多多，并没有找到这个一级入口，后续几天持续关注，依旧没有看到。由此可以判断，该功能大概率只是 8 月 10 日当天试运行，并不代表拼多多要在该领域开展大规模动作。\n其次，单看 “最快明日达” 这个模式，对标的应该是京东的次达板块，而并非即时零售，但很多媒体报道口径却将其归为拼多多入局即时零售。\n再加上，8月10日晚间，拼多多人士对北京日报记者回应称，业务没有大的变化，也不做外卖，只是把主站的商品内，有时效保障的商品聚合，满足要求快一些送达的用户需求，提升履约体验。“哪怕不搞这个入口，也有很多商品是次日达的，现在只是让消费者更好地找到。", "summary_zh": "拼多多上线“最快明日达”入口被多家媒体解读为杀入即时零售，但作者实测多日并未在 App 内稳定看到该入口，判断只是短时试运行。文章区分了它与次日达的本质差异，指出这更像对标京东，而非正面硬刚美团闪购。\n\n8 月 10 日，拼多多上线 “最快明日达” 一级入口，众多媒体纷纷报道，称拼多多杀入即时零售赛道，要与美团闪购、淘宝闪购、京东外卖正面竞争。\n\n我在 8 月 11 日看到这条新闻后，打开自己的拼多多，并没有找到这个一级入口，后续几天持续关注，依旧没有看到。由此可以判断，该功能大概率只是 8 月 10 日当天试运行，并不代表拼多多要在该领域开展大规模动作。\n其次，单看 “最快明日达” 这个模式，对标的应该是京东的次达板块，而并非即时零售，但很多媒体报道口径却将其归为拼多多入局即时零售。\n再加上，8月10日晚间，拼多多人士对北京日报记者回应称，业务没有大的变化，也不做外卖，只是把主站的商品内，有时效保障的商品聚合，满足要求快一些送达的用户需求，提升履约体验。“哪怕不搞这个入口，也有很多商品是次日达的，现在只是让消费者更好地找到。", "pub_date": "2026-09-02T04:04:37+00:00", "time_str": "1小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "20岁大学生在 TikTok 评论区发现一个焦虑，做出月入10万美元的 AI App", "title_zh": "20岁大学生在 TikTok 评论区发现一个焦虑，做出月入10万美元的 AI App", "summary": "GoTall 用“我到底能长多高”切入青少年身高焦虑，靠 TikTok 评论区验证需求，一年内下载破百万、月入10万美元。文章拆解其“测身高—预测—习惯管理”的产品结构与三层需求验证。\n\n今天分享的产品非常小，小到刚看到它的收入时我都疑惑了几秒，它就是：\n去年夏天，Michael Que 还在纽约找金融实习。\n他是 NYU Stern 的学生，学金融、心理学和计算机科学，原本走的是一条非常典型的商学院路线：投行、VC、暑期实习。\n\n结果连续碰壁。\n他后来自己复盘过2025年：\n1月准备投行面试；2月大量投简历、Cold Email、找人内推，基本没结果；3月好不容易进了一个不错实习的终面，还是被拒；5月参加 Goldman Sachs 的 Superday，再次被拒。\n最后找了一份没有工资的实习，干到6月也辞了。\n但也正是在这段时间，他开始注意到另外一群年轻人。\n很多跟他年龄差不多，甚至更小的人，正在靠一个很简单的 App 一个月赚几十万、上百万美元。\n\n于是 Michael 开始研究消费类 App，然后他注意到了一个看起来小得不能再小的需求：\n“我以后到底能长多高？", "summary_zh": "GoTall 用“我到底能长多高”切入青少年身高焦虑，靠 TikTok 评论区验证需求，一年内下载破百万、月入10万美元。文章拆解其“测身高—预测—习惯管理”的产品结构与三层需求验证。\n\n今天分享的产品非常小，小到刚看到它的收入时我都疑惑了几秒，它就是：\n去年夏天，Michael Que 还在纽约找金融实习。\n他是 NYU Stern 的学生，学金融、心理学和计算机科学，原本走的是一条非常典型的商学院路线：投行、VC、暑期实习。\n\n结果连续碰壁。\n他后来自己复盘过2025年：\n1月准备投行面试；2月大量投简历、Cold Email、找人内推，基本没结果；3月好不容易进了一个不错实习的终面，还是被拒；5月参加 Goldman Sachs 的 Superday，再次被拒。\n最后找了一份没有工资的实习，干到6月也辞了。\n但也正是在这段时间，他开始注意到另外一群年轻人。\n很多跟他年龄差不多，甚至更小的人，正在靠一个很简单的 App 一个月赚几十万、上百万美元。\n\n于是 Michael 开始研究消费类 App，然后他注意到了一个看起来小得不能再小的需求：\n“我以后到底能长多高？", "pub_date": "2026-09-02T03:40:35+00:00", "time_str": "2小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "微信小程序虚拟支付正式开放，个人开发者不用注册公司了", "title_zh": "微信小程序虚拟支付正式开放，个人开发者不用注册公司了", "summary": "微信小程序开放个人虚拟支付，为个人开发者补齐了从开发到变现的最后一公里。结合AI Agent浪潮，微信正构建中国版Micro SaaS生态。本文解读政策细节、费率结算及对独立开发者的深远影响。\n\n8月 31 日，我看到一个值得关注的政策变化：个人主体小程序已支持虚拟支付能力。\n从微信小程序最新后台来看，个人开发者可以进入虚拟支付管理页面，配置交易订单、资金管理、代币、道具以及支付相关参数。基础配置中还能看到 OfferID、沙箱 AppKey、现网 AppKey，以及苹果 IAP 支付相关选项。页面同时明确提示，个人主体小程序月收款限额约为 10 万元。\n如果只把它理解成微信支付多开放了一个接口，这件事其实并不大。但放到 2026 年，意义完全不同。过去一年，Codex、Claude、WorkBuddy 这类 Agent 已经把一个人开发软件的成本明显降了下来。当开发越来越容易之后，一个现实问题反而变得越来越突出：个人开发者做出来的软件，如何实现盈利？\n这次调整可能是微信生态里程碑式节点：微信正在具备中国版 Micro SaaS 的生态条件。", "summary_zh": "微信小程序开放个人虚拟支付，为个人开发者补齐了从开发到变现的最后一公里。结合AI Agent浪潮，微信正构建中国版Micro SaaS生态。本文解读政策细节、费率结算及对独立开发者的深远影响。\n\n8月 31 日，我看到一个值得关注的政策变化：个人主体小程序已支持虚拟支付能力。\n从微信小程序最新后台来看，个人开发者可以进入虚拟支付管理页面，配置交易订单、资金管理、代币、道具以及支付相关参数。基础配置中还能看到 OfferID、沙箱 AppKey、现网 AppKey，以及苹果 IAP 支付相关选项。页面同时明确提示，个人主体小程序月收款限额约为 10 万元。\n如果只把它理解成微信支付多开放了一个接口，这件事其实并不大。但放到 2026 年，意义完全不同。过去一年，Codex、Claude、WorkBuddy 这类 Agent 已经把一个人开发软件的成本明显降了下来。当开发越来越容易之后，一个现实问题反而变得越来越突出：个人开发者做出来的软件，如何实现盈利？\n这次调整可能是微信生态里程碑式节点：微信正在具备中国版 Micro SaaS 的生态条件。", "pub_date": "2026-09-02T03:25:56+00:00", "time_str": "2小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "让社媒互动率涨10倍的秘诀", "title_zh": "让社媒互动率涨10倍的秘诀", "summary": "社媒互动率低迷？别急，本文分享6个实战技巧，从内容价值到互动钩子，帮你激活沉默粉丝。活动设计、回复策略、算法借力，每一步都有讲究。尤其第6个技巧，运营高手都在用，值得收藏！\n\n“为什么我的内容没人互动？”\n这个问题几乎困扰着每一个做社媒的小伙伴。发布的内容浏览量尚可，但点赞寥寥、评论更是屈指可数。\n这种尴尬的局面，相信很多人都经历过。\n今天给大家分享6个经过实战验证的提升互动率技巧，尤其是第6个，运营高手都在用！\n一、制作高质量、有共鸣的内容\n内容为王，依然是真理。\n你要知道，用户愿意互动的前提是：内容触动了Ta的某个神经，让Ta产生了”这就是我，让我共鸣”或者”这对我有用”的感觉。\n因此互动的前提是让人想动。内容本身没有吸引力，再多的技巧都是空中楼阁。\n如何创造有共鸣的内容？", "summary_zh": "社媒互动率低迷？别急，本文分享6个实战技巧，从内容价值到互动钩子，帮你激活沉默粉丝。活动设计、回复策略、算法借力，每一步都有讲究。尤其第6个技巧，运营高手都在用，值得收藏！\n\n“为什么我的内容没人互动？”\n这个问题几乎困扰着每一个做社媒的小伙伴。发布的内容浏览量尚可，但点赞寥寥、评论更是屈指可数。\n这种尴尬的局面，相信很多人都经历过。\n今天给大家分享6个经过实战验证的提升互动率技巧，尤其是第6个，运营高手都在用！\n一、制作高质量、有共鸣的内容\n内容为王，依然是真理。\n你要知道，用户愿意互动的前提是：内容触动了Ta的某个神经，让Ta产生了”这就是我，让我共鸣”或者”这对我有用”的感觉。\n因此互动的前提是让人想动。内容本身没有吸引力，再多的技巧都是空中楼阁。\n如何创造有共鸣的内容？", "pub_date": "2026-09-02T02:46:06+00:00", "time_str": "3小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "基金互金运营工作交接，到底怎么交接？—关于业务”可迁移性”的一些思考", "title_zh": "基金互金运营工作交接，到底怎么交接？—关于业务”可迁移性”的一些思考", "summary": "互金运营交接难在隐性知识多、规则碎片化。本文从业务地图、平台手册、产品策略、运营日历、沟通路径等八个维度，系统拆解如何将业务逻辑显性化，让接手人快速上手，确保业务无缝衔接。\n\n互金运营换盘，到底交什么才能让接手的人顺畅？让渠道和客户感觉业务的齿轮没有因为换人卡顿？\n互金行业变化快，团队调整、人员流动、组织架构变动，而每次变动，交接都是绕不过去的一环。\n交接又很主观，散乱的交接可能导致继任工作很累（尤其是行业新人越来越多），到处去问对接人，频率低的工作不一定交接到位。客户那边感受更直接：沟通过的还得重新沟通，活动上线延迟了，业务靠惯性在跑。\n但互金运营的交接确实不好做：变化快；有些平台或者运营的规则碎片化；每个平台的流量逻辑、审核尺度、资源申请窗口都不一样；很多交互习惯存在于日常沟通的细节里不在平台或者OA手册；隐性知识占比高，什么素材能过审、什么时间点提资源来不及、渠道习惯什么样的沟通方式，这些是靠一次次试错磨出来的，很难量化。\n这次试着把业务运转的逻辑显性化。下面分享我梳理的八个交接维度，抛砖引玉。", "summary_zh": "互金运营交接难在隐性知识多、规则碎片化。本文从业务地图、平台手册、产品策略、运营日历、沟通路径等八个维度，系统拆解如何将业务逻辑显性化，让接手人快速上手，确保业务无缝衔接。\n\n互金运营换盘，到底交什么才能让接手的人顺畅？让渠道和客户感觉业务的齿轮没有因为换人卡顿？\n互金行业变化快，团队调整、人员流动、组织架构变动，而每次变动，交接都是绕不过去的一环。\n交接又很主观，散乱的交接可能导致继任工作很累（尤其是行业新人越来越多），到处去问对接人，频率低的工作不一定交接到位。客户那边感受更直接：沟通过的还得重新沟通，活动上线延迟了，业务靠惯性在跑。\n但互金运营的交接确实不好做：变化快；有些平台或者运营的规则碎片化；每个平台的流量逻辑、审核尺度、资源申请窗口都不一样；很多交互习惯存在于日常沟通的细节里不在平台或者OA手册；隐性知识占比高，什么素材能过审、什么时间点提资源来不及、渠道习惯什么样的沟通方式，这些是靠一次次试错磨出来的，很难量化。\n这次试着把业务运转的逻辑显性化。下面分享我梳理的八个交接维度，抛砖引玉。", "pub_date": "2026-09-02T02:36:55+00:00", "time_str": "3小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "老产品接入AI，先把用户送到目的地", "title_zh": "老产品接入AI，先把用户送到目的地", "summary": "百度文库与网盘正通过AI重构，从搜索升级转向全链路交付。本文基于2026 AI产品大会演讲，解析如何将问、搜、读、编、创、存、享串成闭环，让网盘从被动存储变为主动服务，并探讨通用智能体与技能生态的取舍之道。\n\n面对 AI 浪潮，文库和网盘没有只做一次AI接入升级，而是重新追问用户真正要完成什么。在 2026 AI产品大会现场，钟昊分享了团队如何把搜索、阅读、编辑、创作、存储和分享串成一条交付链路，如何让被动的云空间变得更主动，以及在速度、深度、标准化、自由执行和用户习惯之间做取舍。本文也记录了嘉宾从 workflow 到通用智能体、从产品重构到技能生态的实践判断。\n以下内容根据现场音频和演示材料整理，Enjoy：\n \n大家好，我今天想讲讲百度文库和百度网盘怎么做 AI 重构。\n2023 年到 2024 年，我们开始迎接这轮 AI 浪潮时，我最直接的感受是，所有产品都得迎头赶上。对我和团队来说，当时一直在琢磨的就是：两个老产品怎么开出新花，AI 重构到底从哪里下手。\n先说文库。很多人一想到它，脑子里还是 21 世纪初那种老页面：上面有很多资料，有用户分享的经验和文档。", "summary_zh": "百度文库与网盘正通过AI重构，从搜索升级转向全链路交付。本文基于2026 AI产品大会演讲，解析如何将问、搜、读、编、创、存、享串成闭环，让网盘从被动存储变为主动服务，并探讨通用智能体与技能生态的取舍之道。\n\n面对 AI 浪潮，文库和网盘没有只做一次AI接入升级，而是重新追问用户真正要完成什么。在 2026 AI产品大会现场，钟昊分享了团队如何把搜索、阅读、编辑、创作、存储和分享串成一条交付链路，如何让被动的云空间变得更主动，以及在速度、深度、标准化、自由执行和用户习惯之间做取舍。本文也记录了嘉宾从 workflow 到通用智能体、从产品重构到技能生态的实践判断。\n以下内容根据现场音频和演示材料整理，Enjoy：\n \n大家好，我今天想讲讲百度文库和百度网盘怎么做 AI 重构。\n2023 年到 2024 年，我们开始迎接这轮 AI 浪潮时，我最直接的感受是，所有产品都得迎头赶上。对我和团队来说，当时一直在琢磨的就是：两个老产品怎么开出新花，AI 重构到底从哪里下手。\n先说文库。很多人一想到它，脑子里还是 21 世纪初那种老页面：上面有很多资料，有用户分享的经验和文档。", "pub_date": "2026-09-02T01:29:30+00:00", "time_str": "4小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "中国机器人已出海至141国，售后服务正成为新的机会", "title_zh": "中国机器人已出海至141国，售后服务正成为新的机会", "summary": "中国机器人出口激增，但海外客户要的不再是单台设备，而是整套可落地的解决方案。乐聚、月泉、中科开创等企业正通过本地化合作、生态出海、全链条协同等模式破解服务与适配难题。本文剖析三大出海模式，为机器人企业提供战略参考。\n\n广州的一家工业机器人企业的老板，今年第一次感到迷茫。产品技术不差，出口额也在涨，但海外客户越来越难伺候。“我要的不是一台机器，是能落地的整套方案。售后、二次开发、场景适配你们管不管？的谈判语句出现的越来越频繁”\n这不是一家企业的困境。2026世界机器人大会上，英国“48家”集团主席Jack Perry发布欧洲机器人采购需求时提了一个建议，“先试后买”。让欧洲企业先把机器人放进真实场景验证效果，再决定是否采购更多。证明了海外客户要的不是一台机器，是一套能直接用的生产方案。\n佩里带来了欧洲市场的明确采购需求：物流仓储领域应用成熟、需求迫切；酒店餐饮与零售服务业因劳动力成本高企潜力可观；农业领域被他视为最具变革性的市场。但他也直言，目前的机器人在欧洲的销售量并不大。潜在需求不意味着可以自动转化为订单，中国企业光把产品运过去已经远远不够。", "summary_zh": "中国机器人出口激增，但海外客户要的不再是单台设备，而是整套可落地的解决方案。乐聚、月泉、中科开创等企业正通过本地化合作、生态出海、全链条协同等模式破解服务与适配难题。本文剖析三大出海模式，为机器人企业提供战略参考。\n\n广州的一家工业机器人企业的老板，今年第一次感到迷茫。产品技术不差，出口额也在涨，但海外客户越来越难伺候。“我要的不是一台机器，是能落地的整套方案。售后、二次开发、场景适配你们管不管？的谈判语句出现的越来越频繁”\n这不是一家企业的困境。2026世界机器人大会上，英国“48家”集团主席Jack Perry发布欧洲机器人采购需求时提了一个建议，“先试后买”。让欧洲企业先把机器人放进真实场景验证效果，再决定是否采购更多。证明了海外客户要的不是一台机器，是一套能直接用的生产方案。\n佩里带来了欧洲市场的明确采购需求：物流仓储领域应用成熟、需求迫切；酒店餐饮与零售服务业因劳动力成本高企潜力可观；农业领域被他视为最具变革性的市场。但他也直言，目前的机器人在欧洲的销售量并不大。潜在需求不意味着可以自动转化为订单，中国企业光把产品运过去已经远远不够。", "pub_date": "2026-09-02T01:03:20+00:00", "time_str": "4小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "爆火之后，Infinite Slop 靠什么活下去？", "title_zh": "爆火之后，Infinite Slop 靠什么活下去？", "summary": "Pieter Levels 官方产品截图\n8月30日，有一个叫Pieter Levels 的人发文称，自己刚做的 Infinite Slop 上线首日有3.7万人观看。这个数字由创作者自报，具体统计的是独立用户、访问量还是播放次数，我们不太清楚。\n项目走红后，他为它注册了 InfiniteSlop.ai 域名。\n新模型、过去做不到的交互，再加上几段足够荒诞的视频，让这个刚上线的项目很快获得关注。\n当我看到这个数字后的第一个反应，不是它会不会成为下一个Twitch，而是另一件更现实的事。\n这东西要怎么赚钱？\nInfinite Slop 不是普通的视频网站。它没有一个持续更新内容的创作者团队，也没有让用户上传库存视频。页面里只有一条永不停止的公共直播，观众在聊天区写下自己想看的画面，系统审核后把请求放进队列，再用AI生成下一段视频。\n官网把 banana、cat、space、news 和 game show 列成现成分类。用户可以随意组合这些元素，所有人的提示词排在同一个频道里，AI再尝试把新画面接到上一段之后。\n它有点像一台被全体观众同时抢遥控器的电视。", "summary_zh": "Pieter Levels 官方产品截图\n8月30日，有一个叫Pieter Levels 的人发文称，自己刚做的 Infinite Slop 上线首日有3.7万人观看。这个数字由创作者自报，具体统计的是独立用户、访问量还是播放次数，我们不太清楚。\n项目走红后，他为它注册了 InfiniteSlop.ai 域名。\n新模型、过去做不到的交互，再加上几段足够荒诞的视频，让这个刚上线的项目很快获得关注。\n当我看到这个数字后的第一个反应，不是它会不会成为下一个Twitch，而是另一件更现实的事。\n这东西要怎么赚钱？\nInfinite Slop 不是普通的视频网站。它没有一个持续更新内容的创作者团队，也没有让用户上传库存视频。页面里只有一条永不停止的公共直播，观众在聊天区写下自己想看的画面，系统审核后把请求放进队列，再用AI生成下一段视频。\n官网把 banana、cat、space、news 和 game show 列成现成分类。用户可以随意组合这些元素，所有人的提示词排在同一个频道里，AI再尝试把新画面接到上一段之后。\n它有点像一台被全体观众同时抢遥控器的电视。", "pub_date": "2026-09-02T00:59:03+00:00", "time_str": "5小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "人人都有AI，不等于拥有一支AI-native团队", "title_zh": "人人都有AI，不等于拥有一支AI-native团队", "summary": "前段时间，一位程序员跟我说起他最近的困扰。\n现在产品经理在用 AI 写需求、画原型，他也在用 AI 写代码。照理说，两个人都变快了，项目应该推进得更顺才对。可实际情况恰恰相反。\n产品经理把 AI 生成的方案交过来，他用自己的 AI 拆解和实现。讨论到一半，两个人才发现，产品经理未必完全理解那份方案，他也未必完全理解 AI 生成的代码。两个人围绕两个 AI 的产物来回争论，最后甚至说不清，分歧究竟出在需求、实现，还是各自一开始就带错了上下文。\n他说了一句很有意思的话：真想让产品经理的 AI 和我的 AI 直接对接。\n既然很多内容都是 AI 生成的，与其让两个人分别转述，再在误解上继续讨论，不如让两个 AI 自己把问题说清楚。\n这听起来像一句程序员式的吐槽，却可能指出了 AI 进入团队之后最早暴露的问题：我们更新了个人工具，却还在沿用上一代的协作方式。\n过去两年，市场上的 AI 提效工具越来越多。写文档、做调研、画原型、写代码、做数据分析，每个环节都有人在做 Copilot 和 Agent。管理者也开始关心，公司买了多少账号、多少员工在使用、单项任务节省了多少时间。", "summary_zh": "前段时间，一位程序员跟我说起他最近的困扰。\n现在产品经理在用 AI 写需求、画原型，他也在用 AI 写代码。照理说，两个人都变快了，项目应该推进得更顺才对。可实际情况恰恰相反。\n产品经理把 AI 生成的方案交过来，他用自己的 AI 拆解和实现。讨论到一半，两个人才发现，产品经理未必完全理解那份方案，他也未必完全理解 AI 生成的代码。两个人围绕两个 AI 的产物来回争论，最后甚至说不清，分歧究竟出在需求、实现，还是各自一开始就带错了上下文。\n他说了一句很有意思的话：真想让产品经理的 AI 和我的 AI 直接对接。\n既然很多内容都是 AI 生成的，与其让两个人分别转述，再在误解上继续讨论，不如让两个 AI 自己把问题说清楚。\n这听起来像一句程序员式的吐槽，却可能指出了 AI 进入团队之后最早暴露的问题：我们更新了个人工具，却还在沿用上一代的协作方式。\n过去两年，市场上的 AI 提效工具越来越多。写文档、做调研、画原型、写代码、做数据分析，每个环节都有人在做 Copilot 和 Agent。管理者也开始关心，公司买了多少账号、多少员工在使用、单项任务节省了多少时间。", "pub_date": "2026-09-02T00:57:16+00:00", "time_str": "5小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "做产品三年，还是没学会做产品", "title_zh": "做产品三年，还是没学会做产品", "summary": "做了三年产品，却发现自己只是把第一年的工作重复了三年？本文直击产品经理成长困境：从接需求到做产品，关键在于能否回答“为什么做”和“有没有用”。如果你也困在需求执行的循环里，这篇文章值得一读。\n\n前段时间跟一个产品经理聊天。\n他做产品三年多了，原型画得很快，PRD写得也挺熟练。平时负责接需求、开评审、跟进开发、组织验收，一套流程现在走得贼溜。\n然后继续往下聊，慢慢我发现有点不对劲了。\n这个需求为什么做？\n业务提的。\n为什么优先级这么高？\n领导说比较着急。\n上线以后解决了什么问题？\n这个不太清楚，反正已经交付了。\n听起来是不是很熟悉？\n很多产品经理工作了两三年，每天都很忙，做过的需求不少，文档也攒了一大堆。可回头一看，除了工具用得更熟、流程跑得更快，好像并没有真正形成自己的判断。\n第一年在接需求，第三年还在接需求。\n第一年等领导告诉自己做什么，第三年还在等不知道谁给答案。\n\n工作年限增长了，产品能力却没有一点儿增长。\n说得直接一点：他只是把第一年的工作，重复做了三年。\n一、做过很多需求，不等于会做产品\n新人刚入行的时候，从执行开始很正常。", "summary_zh": "做了三年产品，却发现自己只是把第一年的工作重复了三年？本文直击产品经理成长困境：从接需求到做产品，关键在于能否回答“为什么做”和“有没有用”。如果你也困在需求执行的循环里，这篇文章值得一读。\n\n前段时间跟一个产品经理聊天。\n他做产品三年多了，原型画得很快，PRD写得也挺熟练。平时负责接需求、开评审、跟进开发、组织验收，一套流程现在走得贼溜。\n然后继续往下聊，慢慢我发现有点不对劲了。\n这个需求为什么做？\n业务提的。\n为什么优先级这么高？\n领导说比较着急。\n上线以后解决了什么问题？\n这个不太清楚，反正已经交付了。\n听起来是不是很熟悉？\n很多产品经理工作了两三年，每天都很忙，做过的需求不少，文档也攒了一大堆。可回头一看，除了工具用得更熟、流程跑得更快，好像并没有真正形成自己的判断。\n第一年在接需求，第三年还在接需求。\n第一年等领导告诉自己做什么，第三年还在等不知道谁给答案。\n\n工作年限增长了，产品能力却没有一点儿增长。\n说得直接一点：他只是把第一年的工作，重复做了三年。\n一、做过很多需求，不等于会做产品\n新人刚入行的时候，从执行开始很正常。", "pub_date": "2026-09-02T00:54:09+00:00", "time_str": "5小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "同样叫红包，为什么有时是会员资产，有时只是一次促销", "title_zh": "同样叫红包，为什么有时是会员资产，有时只是一次促销", "summary": "会员资产不只是余额和红包的集合，其背后隐藏着复杂的业务语义与责任链。本文通过充值、红包等案例，剖析资产与促销的本质区别，提出按价值语义分类的方法，帮助产品经理理清设计思路。\n\n前面几篇，我们从会员身份、等级权益，一路写到会员运营。\n关系要被经营，通常少不了一些用户能感知的价值：余额、储值、赠送金、红包、券、礼品卡、积分、次卡……\n它们在前台经常被统一收进“我的资产”，到了需求文档里，也很容易被塞进一个“会员资产中心”。\n但名字放在一起，不代表它们是同一种业务对象。\n这篇先不画账户和流程。我想先回答：我们说“会员资产”时，到底在说什么？\n同一句“发 20 元红包”，背后可能是三种需求\n先用一个脱敏综合案例进入。它把品牌自有商城、平台旗舰店和线下门店里的常见需求合在一起，不对应某一个客户。\n某品牌准备做会员活动，会上出现了三项需求：\n\n自有商城充值 500 元，到账 500 元本金，再赠送 50 元；\n给会员发 20 元“红包”，进入账户后显示剩余金额，可以分次使用；\n平台旗舰店发 20 元“红包”，满足商品和订单门槛后一次性抵扣，由平台与商家共同承担优惠。", "summary_zh": "会员资产不只是余额和红包的集合，其背后隐藏着复杂的业务语义与责任链。本文通过充值、红包等案例，剖析资产与促销的本质区别，提出按价值语义分类的方法，帮助产品经理理清设计思路。\n\n前面几篇，我们从会员身份、等级权益，一路写到会员运营。\n关系要被经营，通常少不了一些用户能感知的价值：余额、储值、赠送金、红包、券、礼品卡、积分、次卡……\n它们在前台经常被统一收进“我的资产”，到了需求文档里，也很容易被塞进一个“会员资产中心”。\n但名字放在一起，不代表它们是同一种业务对象。\n这篇先不画账户和流程。我想先回答：我们说“会员资产”时，到底在说什么？\n同一句“发 20 元红包”，背后可能是三种需求\n先用一个脱敏综合案例进入。它把品牌自有商城、平台旗舰店和线下门店里的常见需求合在一起，不对应某一个客户。\n某品牌准备做会员活动，会上出现了三项需求：\n\n自有商城充值 500 元，到账 500 元本金，再赠送 50 元；\n给会员发 20 元“红包”，进入账户后显示剩余金额，可以分次使用；\n平台旗舰店发 20 元“红包”，满足商品和订单门槛后一次性抵扣，由平台与商家共同承担优惠。", "pub_date": "2026-09-02T00:51:48+00:00", "time_str": "5小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "一个项目管理软件的诞生（八）：从需求池到发布计划，研发交付如何管理范围与节奏", "title_zh": "一个项目管理软件的诞生（八）：从需求池到发布计划，研发交付如何管理范围与节奏", "summary": "Jira 至今保留 Version，ONES、TAPD 与飞书项目却把版本做成可配置工作项。菜单可以消失，范围与节奏的管理责任不能消失：一批不确定需求怎样变成团队愿担、组织可调、可核验的交付承诺，才是研发交付的核心。\n\n最近重新看 Jira、ONES、TAPD 和飞书项目的交付规划能力时，我遇到一个很有意思的差异。\nJira 到今天仍然保留 Version。工作项通过 Fix versions 进入某个计划版本，空间里还有 Releases 页面。可再看 ONES 和 TAPD，产品更强调的是“发布”“发布计划”“规划”和“路线图”；飞书项目则更进一步，公开模板里的版本、迭代甚至里程碑，本身就可以是一类可配置工作项。\n如果只看入口，很容易得到一个结论：版本管理正在消失。\n但把这些产品真正保存的数据放在一起，结论正好相反。消失的往往只是一个固定菜单，或者一类写死的专用实体。团队仍然要回答：候选需求有哪些，这次准备交付什么，何时交付，能力够不够，范围变化后谁来决定，最后又真正交付了什么。\n这些问题不但没有消失，团队越大，反而越不能依靠一个版本号和一次口头承诺解决。", "summary_zh": "Jira 至今保留 Version，ONES、TAPD 与飞书项目却把版本做成可配置工作项。菜单可以消失，范围与节奏的管理责任不能消失：一批不确定需求怎样变成团队愿担、组织可调、可核验的交付承诺，才是研发交付的核心。\n\n最近重新看 Jira、ONES、TAPD 和飞书项目的交付规划能力时，我遇到一个很有意思的差异。\nJira 到今天仍然保留 Version。工作项通过 Fix versions 进入某个计划版本，空间里还有 Releases 页面。可再看 ONES 和 TAPD，产品更强调的是“发布”“发布计划”“规划”和“路线图”；飞书项目则更进一步，公开模板里的版本、迭代甚至里程碑，本身就可以是一类可配置工作项。\n如果只看入口，很容易得到一个结论：版本管理正在消失。\n但把这些产品真正保存的数据放在一起，结论正好相反。消失的往往只是一个固定菜单，或者一类写死的专用实体。团队仍然要回答：候选需求有哪些，这次准备交付什么，何时交付，能力够不够，范围变化后谁来决定，最后又真正交付了什么。\n这些问题不但没有消失，团队越大，反而越不能依靠一个版本号和一次口头承诺解决。", "pub_date": "2026-09-02T00:35:02+00:00", "time_str": "5小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "marketingskills：一套 Markdown 文件，让 AI 编码智能体变成半个 CMO", "title_zh": "marketingskills：一套 Markdown 文件，让 AI 编码智能体变成半个 CMO", "summary": "你以为它又是个卖课、卖 SaaS 的营销库？我点进去第一眼也这么想。结果仓库里没有 App，没有后端，连一行能跑的业务逻辑都谈不上核心，整套东西就是一堆 Markdown 文件。\n\n但关键是，你的 Claude Code、Cursor 或者 Codex 真的能把这堆文件读进去，然后像干了十年增长的人一样帮你做落地页、写冷邮件、排 A/B 测试。它本质是一份”领域知识包”，不是软件产品。\n\n我翻完 README 和几篇独立评测之后，判断收窄了。它不是那种靠 Star 数撑场面的空壳，但也不是什么银弹。它解决的是一个非常具体、而且被很多人忽略的痛点：开发者会用 AI 写代码，却普遍不会用 AI 做营销。\n说白了这篇文章就想讲明白一件事：这套技能包到底值不值得你往项目里装，以及装之前有哪些坑得先看清。\n核心亮点\n它最聪明的设计是”共享上下文”。所有技能都先读一份 product-marketing.md，里面写着你的产品定位、目标用户、竞争环境。技能干活之前先理解语境，才不会写出漂亮但和你产品毫无关系的文案。\n这个设计比大多数 AI 营销工具想得周全。", "summary_zh": "你以为它又是个卖课、卖 SaaS 的营销库？我点进去第一眼也这么想。结果仓库里没有 App，没有后端，连一行能跑的业务逻辑都谈不上核心，整套东西就是一堆 Markdown 文件。\n\n但关键是，你的 Claude Code、Cursor 或者 Codex 真的能把这堆文件读进去，然后像干了十年增长的人一样帮你做落地页、写冷邮件、排 A/B 测试。它本质是一份”领域知识包”，不是软件产品。\n\n我翻完 README 和几篇独立评测之后，判断收窄了。它不是那种靠 Star 数撑场面的空壳，但也不是什么银弹。它解决的是一个非常具体、而且被很多人忽略的痛点：开发者会用 AI 写代码，却普遍不会用 AI 做营销。\n说白了这篇文章就想讲明白一件事：这套技能包到底值不值得你往项目里装，以及装之前有哪些坑得先看清。\n核心亮点\n它最聪明的设计是”共享上下文”。所有技能都先读一份 product-marketing.md，里面写着你的产品定位、目标用户、竞争环境。技能干活之前先理解语境，才不会写出漂亮但和你产品毫无关系的文案。\n这个设计比大多数 AI 营销工具想得周全。", "pub_date": "2026-09-01T12:27:32+00:00", "time_str": "17小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "Penpot UI/UX Design 拆解：把设计判断力塞进 MCP 工具链", "title_zh": "Penpot UI/UX Design 拆解：把设计判断力塞进 MCP 工具链", "summary": "让 AI 在 Penpot 里画一个移动端登录页，最常见的结局是：颜色随机挑、间距靠蒙、画完它自己也不知道对不对。问题不在模型不会调 API，在于从来没人告诉它什么叫”对”。设计决策里那些隐性的判断力，才是人和代码猴子之间的分水岭。\n\npenpot-uiux-design 这个 Skill 给的解法很直接。它不是又一份 MCP 工具清单，而是一份把”一个合格设计师进场前该做的动作”编码成硬流程的约束文档。它挂在 Smithery 上，ID 是 github/penpot-uiux-design，目标读者是已经接好 Penpot MCP 的 AI 客户端。\n\n抓它最核心的架构思想，一句话就能说清：先探查再创建，先问设计系统再落像素，画完必须自己看一眼。这三拍顺序错一处，输出质量就塌一半。它卖的不是创意，是纪律。\n但有个前提必须先摆出来。它依赖的 penpot/penpot-mcp 仓库在 2026 年 2 月 3 日已经归档，代码整体迁进了 Penpot 主仓库的 develop/mcp 目录，连插件 UI 都在归档后加了弃用提示。", "summary_zh": "让 AI 在 Penpot 里画一个移动端登录页，最常见的结局是：颜色随机挑、间距靠蒙、画完它自己也不知道对不对。问题不在模型不会调 API，在于从来没人告诉它什么叫”对”。设计决策里那些隐性的判断力，才是人和代码猴子之间的分水岭。\n\npenpot-uiux-design 这个 Skill 给的解法很直接。它不是又一份 MCP 工具清单，而是一份把”一个合格设计师进场前该做的动作”编码成硬流程的约束文档。它挂在 Smithery 上，ID 是 github/penpot-uiux-design，目标读者是已经接好 Penpot MCP 的 AI 客户端。\n\n抓它最核心的架构思想，一句话就能说清：先探查再创建，先问设计系统再落像素，画完必须自己看一眼。这三拍顺序错一处，输出质量就塌一半。它卖的不是创意，是纪律。\n但有个前提必须先摆出来。它依赖的 penpot/penpot-mcp 仓库在 2026 年 2 月 3 日已经归档，代码整体迁进了 Penpot 主仓库的 develop/mcp 目录，连插件 UI 都在归档后加了弃用提示。", "pub_date": "2026-09-01T12:13:21+00:00", "time_str": "17小时前"}, {"source": "人人都是产品经理", "source_key": "人人都是产品经理_39", "cat": "cn_tech", "color": "#00aa55", "title": "揭秘：workbuddy白嫖积分的5个途径！（每月可薅3500+积分）", "title_zh": "揭秘：workbuddy白嫖积分的5个途径！（每月可薅3500+积分）", "summary": "WorkBuddy免费版每月只送500积分，用Kimi K3跑一个任务就烧光最低档额度。不必充值：每月3500积分、接DeepSeek API十块钱用一个月、按模型分工把调用花在刀刃上，三条路皆0成本。趁Hy3、Hy4限时免费，快囤积分。\n\n最近后台被问得最多的一句话：WorkBuddy的积分，怎么又没了？\n我先给你算笔账：免费版每月赠送500积分。听着不少？用Kimi K3这种旗舰模型全程跑，一个正经任务就能把最低档套餐的积分额度烧完。一个月下来，杯水车薪。\n充值当然能解决。但我把账扒完发现，根本不用充——每月3500积分的白嫖入口、10块钱用一个月的API接法、还有让每次调用都物尽其用的分工法，三条路全都是0成本起步。更巧的是现在正好是窗口期：Hy3、Hy4 标着「限时免费」，聊天不花钱，但「限时」二字就是倒计时；就算模型免费，AI 作图、生成视频、长文档分析这些重活照样烧积分——趁现在零成本把积分囤满，才是真聪明。\n这篇我挨个拆给你看，建议先收藏再照做，你的WorkBuddy基本能一直续命。", "summary_zh": "WorkBuddy免费版每月只送500积分，用Kimi K3跑一个任务就烧光最低档额度。不必充值：每月3500积分、接DeepSeek API十块钱用一个月、按模型分工把调用花在刀刃上，三条路皆0成本。趁Hy3、Hy4限时免费，快囤积分。\n\n最近后台被问得最多的一句话：WorkBuddy的积分，怎么又没了？\n我先给你算笔账：免费版每月赠送500积分。听着不少？用Kimi K3这种旗舰模型全程跑，一个正经任务就能把最低档套餐的积分额度烧完。一个月下来，杯水车薪。\n充值当然能解决。但我把账扒完发现，根本不用充——每月3500积分的白嫖入口、10块钱用一个月的API接法、还有让每次调用都物尽其用的分工法，三条路全都是0成本起步。更巧的是现在正好是窗口期：Hy3、Hy4 标着「限时免费」，聊天不花钱，但「限时」二字就是倒计时；就算模型免费，AI 作图、生成视频、长文档分析这些重活照样烧积分——趁现在零成本把积分囤满，才是真聪明。\n这篇我挨个拆给你看，建议先收藏再照做，你的WorkBuddy基本能一直续命。", "pub_date": "2026-09-01T10:13:03+00:00", "time_str": "19小时前"}]}, {"key": "cnbeta_41", "name": "cnBeta", "cat": "cn_tech", "color": "#00bc74", "items": [{"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "OpenAI称Astra AI模型首度超越其“关键”网络安全能力阈值", "title_zh": "OpenAI称Astra AI模型首度超越其“关键”网络安全能力阈值", "summary": "OpenAI周二表示，其即将推出的人工智能模型Astra是首个超越其“关键”网络安全能力阈值的产品。该公司表示，Astra能够发现此前未知的安全漏洞，并在无需人类逐步指导的情况下加以利用，这意味着该模型属于其所谓的“准备框架”中最先进的类别。OpenAI表示仍计划“很快”推出Astra，但对其网络安全能力的访问将更加受限。OpenAI首席执行官山姆·奥特曼OpenAI于2023年推出了“准备框架”，作为其“跟踪和应对可能带来严重危害新风险的先进AI能力”的方法。在去年对该框架的更新中，公司界定了“高”能力阈值（模型可能放大现有的严重危害途径）和“关键”能力阈值（模型可能引入前所未有的严重危害新途径）。“我们将在发布时的模型系统卡中分享更多关于安全、安保和对齐测试及评估的细节，”OpenAI在周二的博客文章中表示。在上个月披露其两个模型逃逸训练环境、访问开放网络并入侵Hugging Face的系统后，OpenAI的安全和安保实践一直受到密切关注。OpenAI将此次攻击描述为“前所未有的网络安全事件”，并暂时暂停了部分内部训练和研究。", "summary_zh": "OpenAI周二表示，其即将推出的人工智能模型Astra是首个超越其“关键”网络安全能力阈值的产品。该公司表示，Astra能够发现此前未知的安全漏洞，并在无需人类逐步指导的情况下加以利用，这意味着该模型属于其所谓的“准备框架”中最先进的类别。OpenAI表示仍计划“很快”推出Astra，但对其网络安全能力的访问将更加受限。OpenAI首席执行官山姆·奥特曼OpenAI于2023年推出了“准备框架”，作为其“跟踪和应对可能带来严重危害新风险的先进AI能力”的方法。在去年对该框架的更新中，公司界定了“高”能力阈值（模型可能放大现有的严重危害途径）和“关键”能力阈值（模型可能引入前所未有的严重危害新途径）。“我们将在发布时的模型系统卡中分享更多关于安全、安保和对齐测试及评估的细节，”OpenAI在周二的博客文章中表示。在上个月披露其两个模型逃逸训练环境、访问开放网络并入侵Hugging Face的系统后，OpenAI的安全和安保实践一直受到密切关注。OpenAI将此次攻击描述为“前所未有的网络安全事件”，并暂时暂停了部分内部训练和研究。", "pub_date": "2026-09-01T23:06:09+00:00", "time_str": "6小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "Anthropic发布Claude Fable与Mythos 5.1：成本降低 网络安全误报减少约60%", "title_zh": "Anthropic发布Claude Fable与Mythos 5.1：成本降低 网络安全误报减少约60%", "summary": "Anthropic于9月1日宣布推出Claude Fable 5.1和Claude Mythos 5.1，并称这两款模型是“全球最先进的编程与知识工作模型”。Anthropic表示，Claude Fable 5.1在编程、知识工作以及长期复杂问题解决任务方面树立了新的标准。在低强度或中等强度推理设置下，该模型能够取得与Fable 5相当甚至更好的效果；在更高强度的推理设置下，性能则实现大幅提升。多项基准测试显示，Fable 5.1的表现超过了Fable 5、Opus 5以及OpenAI的GPT-5.6 Sol。Fable 5.1与Mythos 5.1采用相同的基础模型，但安全防护等级有所不同。Fable 5.1面向所有用户开放，而Mythos 5.1目前仅限美国企业，以及参与Anthropic可信访问计划的个人用户使用。Anthropic还推出了生命科学验证计划，允许研究人员利用Mythos 5.1在生物学领域的高级能力开展科学研究，并计划很快向科学家开放注册。Anthropic称，Fable 5.1的安全防护机制也得到了改进。", "summary_zh": "Anthropic于9月1日宣布推出Claude Fable 5.1和Claude Mythos 5.1，并称这两款模型是“全球最先进的编程与知识工作模型”。Anthropic表示，Claude Fable 5.1在编程、知识工作以及长期复杂问题解决任务方面树立了新的标准。在低强度或中等强度推理设置下，该模型能够取得与Fable 5相当甚至更好的效果；在更高强度的推理设置下，性能则实现大幅提升。多项基准测试显示，Fable 5.1的表现超过了Fable 5、Opus 5以及OpenAI的GPT-5.6 Sol。Fable 5.1与Mythos 5.1采用相同的基础模型，但安全防护等级有所不同。Fable 5.1面向所有用户开放，而Mythos 5.1目前仅限美国企业，以及参与Anthropic可信访问计划的个人用户使用。Anthropic还推出了生命科学验证计划，允许研究人员利用Mythos 5.1在生物学领域的高级能力开展科学研究，并计划很快向科学家开放注册。Anthropic称，Fable 5.1的安全防护机制也得到了改进。", "pub_date": "2026-09-01T23:05:59+00:00", "time_str": "6小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "三星公布新一代内存路线图：HBM5性能目标翻倍 zHBM最高提升八倍", "title_zh": "三星公布新一代内存路线图：HBM5性能目标翻倍 zHBM最高提升八倍", "summary": "在台北举行的SEMICON Taiwan 2026期间，三星公布了最新内存产品路线图，重点聚焦于HBM5以及全新zHBM架构。三星表示，HBM5的目标是实现相较HBM4E约两倍的整体性能，同时将单位功耗性能提升20%，并把热阻降低20%。HBM5将采用三星自研的2纳米工艺制造基础裸片，取代HBM4和HBM4E使用的4纳米工艺。产品堆叠层数也将扩展至12层、16层和20层，预计在2028年前后进入量产。三星近期还在Hot Chips 2026大会的预告资料中确认，公司正准备推出HBM4E，目标速度为每引脚16 Gbps。目前三星正在出货的HBM4速度为每引脚11.7 Gbps。相比传统HBM将内存置于加速器旁边的设计，zHBM采用更激进的垂直整合方式，直接把内存堆叠在处理器上方，从而缩短数据传输路径，并提高带宽与能源效率。三星预计，zHBM的原始性能将达到HBM4E的8倍，单位功耗性能达到3倍，同时将热阻降低75%至90%。三星已在FMS 2026上展示业界首批zHBM概念产品，预计这种全新架构将在2029年之后推出。重新设计HBM架构似乎已成为行业发展方向。", "summary_zh": "在台北举行的SEMICON Taiwan 2026期间，三星公布了最新内存产品路线图，重点聚焦于HBM5以及全新zHBM架构。三星表示，HBM5的目标是实现相较HBM4E约两倍的整体性能，同时将单位功耗性能提升20%，并把热阻降低20%。HBM5将采用三星自研的2纳米工艺制造基础裸片，取代HBM4和HBM4E使用的4纳米工艺。产品堆叠层数也将扩展至12层、16层和20层，预计在2028年前后进入量产。三星近期还在Hot Chips 2026大会的预告资料中确认，公司正准备推出HBM4E，目标速度为每引脚16 Gbps。目前三星正在出货的HBM4速度为每引脚11.7 Gbps。相比传统HBM将内存置于加速器旁边的设计，zHBM采用更激进的垂直整合方式，直接把内存堆叠在处理器上方，从而缩短数据传输路径，并提高带宽与能源效率。三星预计，zHBM的原始性能将达到HBM4E的8倍，单位功耗性能达到3倍，同时将热阻降低75%至90%。三星已在FMS 2026上展示业界首批zHBM概念产品，预计这种全新架构将在2029年之后推出。重新设计HBM架构似乎已成为行业发展方向。", "pub_date": "2026-09-01T23:05:46+00:00", "time_str": "6小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "Google九月Android更新将扩展 Find Hub 无需追踪器也能找回重要物品", "title_zh": "Google九月Android更新将扩展 Find Hub 无需追踪器也能找回重要物品", "summary": "Google宣布，Android设备将在本月获得一批新功能更新，其中包括 Motion Assist，以及对 Find Hub 的功能扩展。Motion Assist 是Android系统推出的一项防晕车功能，原理类似苹果的 Motion Cues。该功能会在屏幕上叠加一组能够根据车辆运动变化而移动的圆点，帮助用户减轻在乘车过程中因观看屏幕产生的晕动不适。此次更新的另一项重点，是 Find Hub 将新增一种无需为物品安装追踪器的查找方式。根据Google当天发布的博客内容，用户今后可以让 Gemini 记住护照等重要物品的存放位置。这类物品平时使用频率不高，用户可能在数月后忘记当初将其放在了哪里。用户可以要求 Gemini 记录物品所在位置，并为其添加照片。日后需要找回物品时，用户可以直接询问 Gemini，也可以在 Find Hub 的“已记住的物品”选项卡中查看相关信息。该功能将面向运行 Android 16 或更高版本的设备推出，但仅限于同时支持 Gemini 和 Find Hub 的国家或地区。本次更新还加入了 Guided Vision 功能。", "summary_zh": "Google宣布，Android设备将在本月获得一批新功能更新，其中包括 Motion Assist，以及对 Find Hub 的功能扩展。Motion Assist 是Android系统推出的一项防晕车功能，原理类似苹果的 Motion Cues。该功能会在屏幕上叠加一组能够根据车辆运动变化而移动的圆点，帮助用户减轻在乘车过程中因观看屏幕产生的晕动不适。此次更新的另一项重点，是 Find Hub 将新增一种无需为物品安装追踪器的查找方式。根据Google当天发布的博客内容，用户今后可以让 Gemini 记住护照等重要物品的存放位置。这类物品平时使用频率不高，用户可能在数月后忘记当初将其放在了哪里。用户可以要求 Gemini 记录物品所在位置，并为其添加照片。日后需要找回物品时，用户可以直接询问 Gemini，也可以在 Find Hub 的“已记住的物品”选项卡中查看相关信息。该功能将面向运行 Android 16 或更高版本的设备推出，但仅限于同时支持 Gemini 和 Find Hub 的国家或地区。本次更新还加入了 Guided Vision 功能。", "pub_date": "2026-09-01T23:05:35+00:00", "time_str": "6小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "苹果前CFO卢卡·梅斯特里将逐步淡出公司", "title_zh": "苹果前CFO卢卡·梅斯特里将逐步淡出公司", "summary": "据彭博社报道，苹果前首席财务官卢卡·梅斯特里正在进一步减少在公司的工作。梅斯特里于2025年1月卸任首席财务官一职，但仍留在苹果，负责管理公司企业服务部门。近几周，他也已辞去这一职务。据彭博社消息，梅斯特里目前仍是苹果员工，但除在苹果大学主持一门课程外，已不再承担其他工作职责。梅斯特里此前向苹果前首席执行官Tim Cook汇报，但并不向现任首席执行官约翰·特努斯汇报。目前，他正逐步退出苹果的日常工作，每周大约只前往办公室一次。苹果的企业服务部门涵盖信息系统与技术、信息安全，以及房地产与开发等业务。梅斯特里卸任首席财务官后接任的凯万·帕雷克目前负责接管这一团队。彭博社指出，库克过去倾向于让即将离任的高管转任规模较小的职位，但特努斯或许不会延续这一做法。 查看评论", "summary_zh": "据彭博社报道，苹果前首席财务官卢卡·梅斯特里正在进一步减少在公司的工作。梅斯特里于2025年1月卸任首席财务官一职，但仍留在苹果，负责管理公司企业服务部门。近几周，他也已辞去这一职务。据彭博社消息，梅斯特里目前仍是苹果员工，但除在苹果大学主持一门课程外，已不再承担其他工作职责。梅斯特里此前向苹果前首席执行官Tim Cook汇报，但并不向现任首席执行官约翰·特努斯汇报。目前，他正逐步退出苹果的日常工作，每周大约只前往办公室一次。苹果的企业服务部门涵盖信息系统与技术、信息安全，以及房地产与开发等业务。梅斯特里卸任首席财务官后接任的凯万·帕雷克目前负责接管这一团队。彭博社指出，库克过去倾向于让即将离任的高管转任规模较小的职位，但特努斯或许不会延续这一做法。 查看评论", "pub_date": "2026-09-01T23:05:23+00:00", "time_str": "6小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "Google推出AI图像创作工具Pics 基于Nano Banana模型打造", "title_zh": "Google推出AI图像创作工具Pics 基于Nano Banana模型打造", "summary": "Google于9月1日正式推出Google Pics，这是一款集成在Google Workspace中的生成式人工智能图像创作与编辑工具，旨在与Canva、Adobe Express以及微软Designer等产品展开竞争。Google AI Pro和Ultra订阅用户，以及大多数Google Workspace企业客户，都可以免费使用该工具。Google Pics由Gemini的“Nano Banana”图像生成与编辑模型驱动。用户可以通过文字提示制作海报、传单及其他视觉内容，并根据实际需求对生成结果进行调整。Google表示，Pics既可以作为独立服务使用，也会整合到Google Workspace的多款应用中，包括Google Slides、Docs和Drive。这样一来，用户无需离开正在使用的Workspace应用，就能直接生成和编辑图片。由于图像生成是使用Pics的主要起点，Google尤其强调了工具的精细化编辑能力。用户可以针对图片中的单个部分进行调整，而不必每次都重新生成整张图片。其中，对象分割功能可以识别并单独提取图片中的不同对象。", "summary_zh": "Google于9月1日正式推出Google Pics，这是一款集成在Google Workspace中的生成式人工智能图像创作与编辑工具，旨在与Canva、Adobe Express以及微软Designer等产品展开竞争。Google AI Pro和Ultra订阅用户，以及大多数Google Workspace企业客户，都可以免费使用该工具。Google Pics由Gemini的“Nano Banana”图像生成与编辑模型驱动。用户可以通过文字提示制作海报、传单及其他视觉内容，并根据实际需求对生成结果进行调整。Google表示，Pics既可以作为独立服务使用，也会整合到Google Workspace的多款应用中，包括Google Slides、Docs和Drive。这样一来，用户无需离开正在使用的Workspace应用，就能直接生成和编辑图片。由于图像生成是使用Pics的主要起点，Google尤其强调了工具的精细化编辑能力。用户可以针对图片中的单个部分进行调整，而不必每次都重新生成整张图片。其中，对象分割功能可以识别并单独提取图片中的不同对象。", "pub_date": "2026-09-01T23:05:10+00:00", "time_str": "6小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "Windows 11将于2026年10月默认启用更强的内核保护", "title_zh": "Windows 11将于2026年10月默认启用更强的内核保护", "summary": "微软宣布，自2026年10月起，符合条件的Windows 11设备将默认启用内存完整性保护，从而进一步加强系统内核级安全性。近年来，Windows 11的网络安全问题受到越来越多关注，尤其是人工智能工具正在以极快的速度和较高的准确率发现操作系统中的漏洞。这已经促使微软对Windows 11进行多项重要安全调整，而此次宣布的内存完整性保护默认启用，正是微软在这一领域推出的最新措施。从2026年10月开始，微软将逐步向符合条件的Windows 11设备推送相关安全增强功能，默认执行更严格的内核级保护。虽然这些安全能力此前已经存在，但此次更新将免去用户手动开启或配置的步骤，对于负责管理组织网络安全状况的IT管理员而言尤其如此。内存完整性保护将默认启用。该功能建立在基于虚拟化的安全性（VBS）基础之上，通过硬件虚拟化创建隔离环境，防止恶意程序利用低级驱动程序劫持电脑。它也被称为“受虚拟机监控程序保护的代码完整性”（HVCI）。微软表示，这项调整将通过Windows质量更新发布，预计会随10月的“补丁星期二”更新上线，该更新计划于10月13日发布。", "summary_zh": "微软宣布，自2026年10月起，符合条件的Windows 11设备将默认启用内存完整性保护，从而进一步加强系统内核级安全性。近年来，Windows 11的网络安全问题受到越来越多关注，尤其是人工智能工具正在以极快的速度和较高的准确率发现操作系统中的漏洞。这已经促使微软对Windows 11进行多项重要安全调整，而此次宣布的内存完整性保护默认启用，正是微软在这一领域推出的最新措施。从2026年10月开始，微软将逐步向符合条件的Windows 11设备推送相关安全增强功能，默认执行更严格的内核级保护。虽然这些安全能力此前已经存在，但此次更新将免去用户手动开启或配置的步骤，对于负责管理组织网络安全状况的IT管理员而言尤其如此。内存完整性保护将默认启用。该功能建立在基于虚拟化的安全性（VBS）基础之上，通过硬件虚拟化创建隔离环境，防止恶意程序利用低级驱动程序劫持电脑。它也被称为“受虚拟机监控程序保护的代码完整性”（HVCI）。微软表示，这项调整将通过Windows质量更新发布，预计会随10月的“补丁星期二”更新上线，该更新计划于10月13日发布。", "pub_date": "2026-09-01T18:35:33+00:00", "time_str": "11小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "苹果预告下周将举行规模盛大的新品发布会", "title_zh": "苹果预告下周将举行规模盛大的新品发布会", "summary": "苹果首席执行官约翰·特努斯在上任后发给员工的首封备忘录中透露，苹果将在下周举行一场“规模盛大、令人惊艳的发布会”。苹果营销负责人格雷格·乔斯维克当天也在社交媒体上表示，苹果将在9月9日（周三）公布更多消息。苹果当天将举行特别活动，活动于太平洋时间上午10点开始。据预计，苹果届时将发布iPhone 18 Pro和iPhone 18 Pro Max，并推出旗下首款折叠屏iPhone。此外，Apple Watch Series 12、Apple Watch Ultra 4也有望亮相，AirPods 5同样可能成为发布会内容之一。目前苹果尚未公布全部产品信息，因此发布会可能还会带来其他新品或意外惊喜。 查看评论", "summary_zh": "苹果首席执行官约翰·特努斯在上任后发给员工的首封备忘录中透露，苹果将在下周举行一场“规模盛大、令人惊艳的发布会”。苹果营销负责人格雷格·乔斯维克当天也在社交媒体上表示，苹果将在9月9日（周三）公布更多消息。苹果当天将举行特别活动，活动于太平洋时间上午10点开始。据预计，苹果届时将发布iPhone 18 Pro和iPhone 18 Pro Max，并推出旗下首款折叠屏iPhone。此外，Apple Watch Series 12、Apple Watch Ultra 4也有望亮相，AirPods 5同样可能成为发布会内容之一。目前苹果尚未公布全部产品信息，因此发布会可能还会带来其他新品或意外惊喜。 查看评论", "pub_date": "2026-09-01T18:35:19+00:00", "time_str": "11小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "约翰·特努斯正式出任苹果CEO 内部备忘录预告下周重大新品发布", "title_zh": "约翰·特努斯正式出任苹果CEO 内部备忘录预告下周重大新品发布", "summary": "苹果公司于当地时间9月1日正式完成首席执行官交接，约翰·特努斯接替蒂姆·库克出任苹果CEO，后者则转任执行董事长。特努斯当天向苹果员工发布了就任后的首封内部备忘录。他在信中感谢员工的祝福，并高度评价库克在任期间对苹果的贡献，称苹果非常幸运拥有一位以价值观、正直、善意和人性化方式领导公司的CEO。他还表示，很高兴库克将继续担任执行董事长。特努斯表示，能够在“世界上最伟大的公司”担任CEO令他深感荣幸，并对苹果未来的发展充满期待。他透露，苹果下周将举行一场“规模庞大且非常精彩”的新品发布活动，并感谢员工为发布会所付出的努力。除即将到来的发布活动外，特努斯还表示，自己同样期待苹果正在研发的产品，以及团队未来共同构想并创造出的、目前尚未被想象出来的新产品。他称，没有哪支团队比苹果更适合与自己一起打造未来。特努斯于2001年加入苹果，此前长期负责硬件工程部门，并曾担任硬件工程高级副总裁。与具有运营管理背景的库克相比，特努斯拥有更强的产品和工程背景。在此次管理层交接过程中，苹果领导团队也进行了调整。约翰尼·斯鲁吉现任苹果首席硬件官，接管了此前由特努斯领导的硬件工程团队；", "summary_zh": "苹果公司于当地时间9月1日正式完成首席执行官交接，约翰·特努斯接替蒂姆·库克出任苹果CEO，后者则转任执行董事长。特努斯当天向苹果员工发布了就任后的首封内部备忘录。他在信中感谢员工的祝福，并高度评价库克在任期间对苹果的贡献，称苹果非常幸运拥有一位以价值观、正直、善意和人性化方式领导公司的CEO。他还表示，很高兴库克将继续担任执行董事长。特努斯表示，能够在“世界上最伟大的公司”担任CEO令他深感荣幸，并对苹果未来的发展充满期待。他透露，苹果下周将举行一场“规模庞大且非常精彩”的新品发布活动，并感谢员工为发布会所付出的努力。除即将到来的发布活动外，特努斯还表示，自己同样期待苹果正在研发的产品，以及团队未来共同构想并创造出的、目前尚未被想象出来的新产品。他称，没有哪支团队比苹果更适合与自己一起打造未来。特努斯于2001年加入苹果，此前长期负责硬件工程部门，并曾担任硬件工程高级副总裁。与具有运营管理背景的库克相比，特努斯拥有更强的产品和工程背景。在此次管理层交接过程中，苹果领导团队也进行了调整。约翰尼·斯鲁吉现任苹果首席硬件官，接管了此前由特努斯领导的硬件工程团队；", "pub_date": "2026-09-01T18:35:09+00:00", "time_str": "11小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "苹果新任CEO约翰·特努斯在X平台发布首条动态向关注者问好", "title_zh": "苹果新任CEO约翰·特努斯在X平台发布首条动态向关注者问好", "summary": "苹果首席执行官约翰·特努斯正式加入社交平台X，并发布了个人账号的首条动态。正如外界预料的那样，这条仅有“hello”五个字母的简短消息迅速获得大量关注。苹果历任首席执行官通常都具备一定的社交属性，而在当代，这往往也意味着拥有社交媒体账号。因此，随着特努斯正式接任苹果掌舵人，他也开设了自己的X账号。目前，账号@johnternus已经上线，并在特努斯担任苹果首席执行官的首个正式工作日公开亮相。根据账号资料显示，该账号早在2026年6月便已私下创建，但目前只发布过一条动态，内容是全部使用小写字母书写的“hello”。尚不清楚特努斯是在谨慎尝试进入社交媒体，还是有意借鉴苹果在用户启用新设备时使用问候语的传统。考虑到他此前几乎没有社交媒体活动记录，这两个原因可能兼而有之。这条只有五个字母的动态，在发布后极短时间内便为账号带来了巨大关注。截至报道发布时，这条动态上线约35分钟，已经获得约74.8万次浏览、3.1万次点赞、3600次转发和5000条评论。与此同时，特努斯的账号已经拥有约3.46万名粉丝。虽然这一数字与Tim Cook积累的1980万名粉丝相去甚远，但特努斯的账号毕竟才刚刚开始运营。", "summary_zh": "苹果首席执行官约翰·特努斯正式加入社交平台X，并发布了个人账号的首条动态。正如外界预料的那样，这条仅有“hello”五个字母的简短消息迅速获得大量关注。苹果历任首席执行官通常都具备一定的社交属性，而在当代，这往往也意味着拥有社交媒体账号。因此，随着特努斯正式接任苹果掌舵人，他也开设了自己的X账号。目前，账号@johnternus已经上线，并在特努斯担任苹果首席执行官的首个正式工作日公开亮相。根据账号资料显示，该账号早在2026年6月便已私下创建，但目前只发布过一条动态，内容是全部使用小写字母书写的“hello”。尚不清楚特努斯是在谨慎尝试进入社交媒体，还是有意借鉴苹果在用户启用新设备时使用问候语的传统。考虑到他此前几乎没有社交媒体活动记录，这两个原因可能兼而有之。这条只有五个字母的动态，在发布后极短时间内便为账号带来了巨大关注。截至报道发布时，这条动态上线约35分钟，已经获得约74.8万次浏览、3.1万次点赞、3600次转发和5000条评论。与此同时，特努斯的账号已经拥有约3.46万名粉丝。虽然这一数字与Tim Cook积累的1980万名粉丝相去甚远，但特努斯的账号毕竟才刚刚开始运营。", "pub_date": "2026-09-01T17:05:09+00:00", "time_str": "12小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "GoPro将以2.85亿美元被收购 股东保留合并后公司约10%股份", "title_zh": "GoPro将以2.85亿美元被收购 股东保留合并后公司约10%股份", "summary": "经历多年财务困境后，运动相机制造商GoPro即将被一家名为“Starman Optical”的公司以2.85亿美元收购。根据双方周二公布的合并协议，Starman Optical将以每股1.14美元的价格向GoPro股东支付现金，同时让GoPro现有股东持有合并后公司约10%的股份。交易预计将在今年年底前完成，并将一并消除GoPro约9200万美元的未偿债务。此次合并公布前几个月，GoPro曾透露正在考虑转型，从生产消费级相机转向国防科技领域。就在交易宣布前一天左右，YouTuber Markiplier披露其已累计持有GoPro 8.5%的股份。GoPro表示，此次合并旨在通过资本重组、改善资产负债表、投入增长资金以及将面向战略市场的产品制造环节迁回美国，最大化利用公司知识产权及其在消费、商业和国防市场的增长潜力。公司还称，将继续“全面支持”现有消费产品，同时投资于业务增长，并推进更加多元化的产品路线。不过，目前外界尚不清楚这些计划的具体含义。Starman Optical本身也缺乏足够的运营历史，市场难以据此判断其未来表现。", "summary_zh": "经历多年财务困境后，运动相机制造商GoPro即将被一家名为“Starman Optical”的公司以2.85亿美元收购。根据双方周二公布的合并协议，Starman Optical将以每股1.14美元的价格向GoPro股东支付现金，同时让GoPro现有股东持有合并后公司约10%的股份。交易预计将在今年年底前完成，并将一并消除GoPro约9200万美元的未偿债务。此次合并公布前几个月，GoPro曾透露正在考虑转型，从生产消费级相机转向国防科技领域。就在交易宣布前一天左右，YouTuber Markiplier披露其已累计持有GoPro 8.5%的股份。GoPro表示，此次合并旨在通过资本重组、改善资产负债表、投入增长资金以及将面向战略市场的产品制造环节迁回美国，最大化利用公司知识产权及其在消费、商业和国防市场的增长潜力。公司还称，将继续“全面支持”现有消费产品，同时投资于业务增长，并推进更加多元化的产品路线。不过，目前外界尚不清楚这些计划的具体含义。Starman Optical本身也缺乏足够的运营历史，市场难以据此判断其未来表现。", "pub_date": "2026-09-01T16:05:34+00:00", "time_str": "13小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "iPhone 18 Pro或推出暗樱桃、天蓝与黑色 银色版本或将缺席", "title_zh": "iPhone 18 Pro或推出暗樱桃、天蓝与黑色 银色版本或将缺席", "summary": "据爆料者“定焦数码”透露，苹果iPhone 18 Pro已进入全面量产阶段，其配色方案可能与此前传闻有所不同，预计包括暗樱桃色、天蓝色和黑色，银色版本则大概率不会推出。该爆料者在微博表示，目前尚未在中国看到银色机型存在的迹象。如果消息属实，苹果将为iPhone 18 Pro全面更换配色，不会延续iPhone 17 Pro的三种颜色，也意味着此前传闻中的银色不会成为新机选项。此前，彭博社记者马克·古尔曼曾将iPhone 18 Pro的新主打色描述为“深红色”；Macworld随后称其为“暗樱桃色”，并预测其他配色为浅蓝、深灰和银色。另一位微博爆料者“Instant Digital”则曾表示苹果可能放弃黑色，并形容暗樱桃色是酒红、咖啡色与深紫色的混合。目前流出的模型机和SIM卡托照片显示，暗樱桃色基本已成为重点配色，但浅蓝、天蓝、黑色、深灰和银色是否最终入选，仍存在不同说法。暗樱桃色预计将取代iPhone 17 Pro上的宇宙橙，成为iPhone 18 Pro系列的标志性配色。黑色能否回归同样尚未确定。", "summary_zh": "据爆料者“定焦数码”透露，苹果iPhone 18 Pro已进入全面量产阶段，其配色方案可能与此前传闻有所不同，预计包括暗樱桃色、天蓝色和黑色，银色版本则大概率不会推出。该爆料者在微博表示，目前尚未在中国看到银色机型存在的迹象。如果消息属实，苹果将为iPhone 18 Pro全面更换配色，不会延续iPhone 17 Pro的三种颜色，也意味着此前传闻中的银色不会成为新机选项。此前，彭博社记者马克·古尔曼曾将iPhone 18 Pro的新主打色描述为“深红色”；Macworld随后称其为“暗樱桃色”，并预测其他配色为浅蓝、深灰和银色。另一位微博爆料者“Instant Digital”则曾表示苹果可能放弃黑色，并形容暗樱桃色是酒红、咖啡色与深紫色的混合。目前流出的模型机和SIM卡托照片显示，暗樱桃色基本已成为重点配色，但浅蓝、天蓝、黑色、深灰和银色是否最终入选，仍存在不同说法。暗樱桃色预计将取代iPhone 17 Pro上的宇宙橙，成为iPhone 18 Pro系列的标志性配色。黑色能否回归同样尚未确定。", "pub_date": "2026-09-01T16:05:20+00:00", "time_str": "13小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "Perplexity推出混合计算功能 敏感任务拆分给本地AI处理", "title_zh": "Perplexity推出混合计算功能 敏感任务拆分给本地AI处理", "summary": "今年2月，Perplexity推出了Perplexity Computer。这是一套类似Claude Cowork的人工智能代理工具，能够利用网络以及用户电脑上的文件和应用，自主完成各种任务。此后，该平台逐渐发展出多个产品，包括面向Mac的Personal Computer。如今，Perplexity又宣布推出一项名为Hybrid Compute的新功能。Hybrid Compute允许用户将一项任务拆分给云端前沿模型和本地大语言模型共同处理。云端模型可以是Opus 5或GPT-5.6 Sol等高性能模型，本地模型则运行在用户自己的电脑上。其核心思路是，让本地模型负责处理敏感信息，从而确保相关数据始终安全地留在设备中。Perplexity表示，Hybrid Compute适用于多种场景。例如，律师可以利用它撰写一份法律简报，将正在处理的案件与现有判例进行比较。在这一过程中，客户数据可以保存在本地，避免被上传至云端。对于希望控制成本的用户来说，Hybrid Compute也能将部分工作从通常价格更高的前沿模型转移到本地模型，以降低推理费用。“这项功能直接集成在Mac应用中。", "summary_zh": "今年2月，Perplexity推出了Perplexity Computer。这是一套类似Claude Cowork的人工智能代理工具，能够利用网络以及用户电脑上的文件和应用，自主完成各种任务。此后，该平台逐渐发展出多个产品，包括面向Mac的Personal Computer。如今，Perplexity又宣布推出一项名为Hybrid Compute的新功能。Hybrid Compute允许用户将一项任务拆分给云端前沿模型和本地大语言模型共同处理。云端模型可以是Opus 5或GPT-5.6 Sol等高性能模型，本地模型则运行在用户自己的电脑上。其核心思路是，让本地模型负责处理敏感信息，从而确保相关数据始终安全地留在设备中。Perplexity表示，Hybrid Compute适用于多种场景。例如，律师可以利用它撰写一份法律简报，将正在处理的案件与现有判例进行比较。在这一过程中，客户数据可以保存在本地，避免被上传至云端。对于希望控制成本的用户来说，Hybrid Compute也能将部分工作从通常价格更高的前沿模型转移到本地模型，以降低推理费用。“这项功能直接集成在Mac应用中。", "pub_date": "2026-09-01T16:05:09+00:00", "time_str": "13小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "台积电工人争取提高奖金上限 台湾美光员工逾八成支持罢工", "title_zh": "台积电工人争取提高奖金上限 台湾美光员工逾八成支持罢工", "summary": "在三星内存芯片工厂员工成功争取到更高奖金后，美光位于台湾的工厂员工也开始寻求类似待遇。美光台湾工会今年7月曾召开会议，研究三星员工罢工事件及其谈判结果。工会成员向路透社表示，如果管理层无法满足诉求，员工可能进一步采取罢工行动。今年7月的美光工会会议主要讨论了员工对罢工的疑问，同时征询了员工对公司奖金政策的意见。目前，美光奖金最高上限为工资的200%。工会还承诺向参会者介绍三星员工今年早些时候发起的罢工，以及他们如何成功重新协商奖金上限和利润分成比例。此前，三星员工曾因SK海力士员工获得高额奖金而发起抗议。当时，存储芯片行业受市场繁荣推动，SK海力士向员工发放了可观奖金。三星内存芯片部门员工随后通过谈判争取到更有利的奖金政策，但这一结果又引发了三星DS业务集团其他员工的抗议，部分员工甚至佩戴黑色臂章上班。据路透社报道，美光台湾桃园和台中地区的工会在8月进行了一项调查，超过80%的参与调查成员表示支持罢工。两家工会称，它们共代表约1万名美光员工，而美光在台湾的员工总数约为1.5万人。与三星员工的诉求类似，美光台湾员工希望公司改革奖金制度和利润分享计划。", "summary_zh": "在三星内存芯片工厂员工成功争取到更高奖金后，美光位于台湾的工厂员工也开始寻求类似待遇。美光台湾工会今年7月曾召开会议，研究三星员工罢工事件及其谈判结果。工会成员向路透社表示，如果管理层无法满足诉求，员工可能进一步采取罢工行动。今年7月的美光工会会议主要讨论了员工对罢工的疑问，同时征询了员工对公司奖金政策的意见。目前，美光奖金最高上限为工资的200%。工会还承诺向参会者介绍三星员工今年早些时候发起的罢工，以及他们如何成功重新协商奖金上限和利润分成比例。此前，三星员工曾因SK海力士员工获得高额奖金而发起抗议。当时，存储芯片行业受市场繁荣推动，SK海力士向员工发放了可观奖金。三星内存芯片部门员工随后通过谈判争取到更有利的奖金政策，但这一结果又引发了三星DS业务集团其他员工的抗议，部分员工甚至佩戴黑色臂章上班。据路透社报道，美光台湾桃园和台中地区的工会在8月进行了一项调查，超过80%的参与调查成员表示支持罢工。两家工会称，它们共代表约1万名美光员工，而美光在台湾的员工总数约为1.5万人。与三星员工的诉求类似，美光台湾员工希望公司改革奖金制度和利润分享计划。", "pub_date": "2026-09-01T13:35:27+00:00", "time_str": "16小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "英伟达据报重启“Rubin CPX”AI加速器项目 改用168GB HBM4内存", "title_zh": "英伟达据报重启“Rubin CPX”AI加速器项目 改用168GB HBM4内存", "summary": "据供应链分析师郭明錤透露，英伟达此前一度搁置的“Rubin CPX”AI加速器项目如今重新启动，并对内存架构进行了重新设计。该产品原计划搭载128GB GDDR7显存，如今改为配备168GB HBM4高带宽内存。英伟达在去年年底曾宣布，计划基于Rubin GPU家族开发一款专用加速器，主要面向大规模智能体人工智能工作负载。项目公布后曾被报道暂时搁置，但英伟达目前似乎已经完成重新规划。Rubin CPX将部署在独立机架中，每个机架可配置64至256块独立CPX GPU。与负责解码任务的常规Rubin GPU不同，CPX GPU主要用于大语言模型推理过程中的“预填充”阶段，负责处理输入上下文以及KV缓存。英伟达正在尝试将预填充和解码任务分离，由CPX GPU承担预填充工作，再由常规Rubin GPU负责解码，从而提升整体推理效率。一个配备8块CPX GPU的机架托盘，可处理容量达1.34TB的长上下文预填充数据及相关KV缓存，并全部依靠HBM4内存完成。HBM4能够提供更高的内存带宽，有助于加快长上下文数据的处理速度。", "summary_zh": "据供应链分析师郭明錤透露，英伟达此前一度搁置的“Rubin CPX”AI加速器项目如今重新启动，并对内存架构进行了重新设计。该产品原计划搭载128GB GDDR7显存，如今改为配备168GB HBM4高带宽内存。英伟达在去年年底曾宣布，计划基于Rubin GPU家族开发一款专用加速器，主要面向大规模智能体人工智能工作负载。项目公布后曾被报道暂时搁置，但英伟达目前似乎已经完成重新规划。Rubin CPX将部署在独立机架中，每个机架可配置64至256块独立CPX GPU。与负责解码任务的常规Rubin GPU不同，CPX GPU主要用于大语言模型推理过程中的“预填充”阶段，负责处理输入上下文以及KV缓存。英伟达正在尝试将预填充和解码任务分离，由CPX GPU承担预填充工作，再由常规Rubin GPU负责解码，从而提升整体推理效率。一个配备8块CPX GPU的机架托盘，可处理容量达1.34TB的长上下文预填充数据及相关KV缓存，并全部依靠HBM4内存完成。HBM4能够提供更高的内存带宽，有助于加快长上下文数据的处理速度。", "pub_date": "2026-09-01T13:35:13+00:00", "time_str": "16小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "苹果宣布约翰·特努斯出任CEO 库克担任执行董事长", "title_zh": "苹果宣布约翰·特努斯出任CEO 库克担任执行董事长", "summary": "苹果公司官网更新显示，约翰·特努斯（John Ternus）已正式出任苹果公司首席执行官，同时担任公司董事。另外，蒂姆·库克的职务变更为苹果公司执行董事长。据苹果公司官网，约翰于2001年加入苹果的产品设计团队，并于2013年成为硬件工程部门的副总裁。2021年，他加入高管团队，担任硬件工程部门的高级副总裁。在苹果工作的整个期间，约翰负责监督各种开创性产品的硬件工程工作，并在推出多个新产品线方面发挥了重要作用，包括iPad和AirPods，以及iPhone、Mac和Apple Watch等多代0产品。此外，约翰还主导了苹果公司大部分对可靠性和耐用性领域的项目，引入的新技术使苹果产品具有了显著的抗损能力。他还推动了苹果在材料和硬件设计方面的创新，这些创新减少了产品的碳足迹，包括开发了一种新的回收铝化合物，该化合物已应用于多个产品线；在Apple WatchUltra中使用3D打印钛材料；以及在可修复性方面的进步，这些进步延长了多款苹果产品的使用寿命。 查看评论", "summary_zh": "苹果公司官网更新显示，约翰·特努斯（John Ternus）已正式出任苹果公司首席执行官，同时担任公司董事。另外，蒂姆·库克的职务变更为苹果公司执行董事长。据苹果公司官网，约翰于2001年加入苹果的产品设计团队，并于2013年成为硬件工程部门的副总裁。2021年，他加入高管团队，担任硬件工程部门的高级副总裁。在苹果工作的整个期间，约翰负责监督各种开创性产品的硬件工程工作，并在推出多个新产品线方面发挥了重要作用，包括iPad和AirPods，以及iPhone、Mac和Apple Watch等多代0产品。此外，约翰还主导了苹果公司大部分对可靠性和耐用性领域的项目，引入的新技术使苹果产品具有了显著的抗损能力。他还推动了苹果在材料和硬件设计方面的创新，这些创新减少了产品的碳足迹，包括开发了一种新的回收铝化合物，该化合物已应用于多个产品线；在Apple WatchUltra中使用3D打印钛材料；以及在可修复性方面的进步，这些进步延长了多款苹果产品的使用寿命。 查看评论", "pub_date": "2026-09-01T12:05:25+00:00", "time_str": "17小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "三星公布下一代存储器战略：HBM5性能目标提升至HBM4E两倍", "title_zh": "三星公布下一代存储器战略：HBM5性能目标提升至HBM4E两倍", "summary": "三星电子计划将下一代高带宽存储器（HBM）HBM5的性能提升至HBM4E的2倍，而后续一代产品zHBM的性能目标则达到HBM4E的8倍。三星将以3D结构创新为核心，争夺下一代存储器市场的主导权。三星电子DS部门存储器事业部产品企划团队负责人崔长锡1日公布了三星下一代存储器战略。三星电子目前正在开发HBM5，目标是相比HBM4E将性能提升2倍、每瓦性能提升20%，同时将热阻降低20%，以满足AI芯片对高性能和低功耗的需求。面向HBM5之后的zHBM，三星计划进一步提升性能。三星提出的目标是，zHBM相比HBM4E性能提升8倍、每瓦性能提升3倍，同时将热阻降低75%至90%。针对大语言模型（LLM）所需的大容量存储器需求，三星还在推进zNAND-O的开发。zNAND-O的目标是在比特密度达到DRAM 10倍的同时，将读取带宽和能效分别提升至NAND的7倍。三星计划于2028年开始zNAND-O的样品供应。三星电子将上述下一代存储器技术开发方向具体概括为“CUBE”战略。", "summary_zh": "三星电子计划将下一代高带宽存储器（HBM）HBM5的性能提升至HBM4E的2倍，而后续一代产品zHBM的性能目标则达到HBM4E的8倍。三星将以3D结构创新为核心，争夺下一代存储器市场的主导权。三星电子DS部门存储器事业部产品企划团队负责人崔长锡1日公布了三星下一代存储器战略。三星电子目前正在开发HBM5，目标是相比HBM4E将性能提升2倍、每瓦性能提升20%，同时将热阻降低20%，以满足AI芯片对高性能和低功耗的需求。面向HBM5之后的zHBM，三星计划进一步提升性能。三星提出的目标是，zHBM相比HBM4E性能提升8倍、每瓦性能提升3倍，同时将热阻降低75%至90%。针对大语言模型（LLM）所需的大容量存储器需求，三星还在推进zNAND-O的开发。zNAND-O的目标是在比特密度达到DRAM 10倍的同时，将读取带宽和能效分别提升至NAND的7倍。三星计划于2028年开始zNAND-O的样品供应。三星电子将上述下一代存储器技术开发方向具体概括为“CUBE”战略。", "pub_date": "2026-09-01T12:05:14+00:00", "time_str": "17小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "TP-Link首款消费级Wi‑Fi 8路由器Archer 8 Ultra开启预订", "title_zh": "TP-Link首款消费级Wi‑Fi 8路由器Archer 8 Ultra开启预订", "summary": "TP-Link近日公布了首款消费级Wi‑Fi 8路由器Archer 8 Ultra的更多信息及上市安排。该产品将于9月30日在部分地区开启预订，公司还计划在2027年第一和第二季度陆续推出更多Wi‑Fi 8设备。不过，这些产品能否在美国上市，目前仍无法确定。Archer 8 Ultra BN19000在IFA 2026上正式亮相，采用三频设计，标称无线总速率达到19Gbps，配备18根内置天线和10Gbps有线网络接口，覆盖面积据称可达3600平方英尺。TP-Link重新设计了机身外观，希望用户将其放置在架子等开阔位置展示，而不是藏在容易限制信号传播的地方。TP-Link Systems总裁杰夫·巴尼表示，用户真正关心的是连接是否稳定一致，Archer 8的设计目标正是提供这种体验。针对面积更大的住宅，TP-Link还推出了Deco 8 Ultra BN22000。该产品最高可提供22Gbps无线带宽，并支持10Gbps以太网。一套由三台设备组成的系统据称能够覆盖9800平方英尺空间，同时支持超过200台设备。欧洲版本的标称无线速率为19Gbps。", "summary_zh": "TP-Link近日公布了首款消费级Wi‑Fi 8路由器Archer 8 Ultra的更多信息及上市安排。该产品将于9月30日在部分地区开启预订，公司还计划在2027年第一和第二季度陆续推出更多Wi‑Fi 8设备。不过，这些产品能否在美国上市，目前仍无法确定。Archer 8 Ultra BN19000在IFA 2026上正式亮相，采用三频设计，标称无线总速率达到19Gbps，配备18根内置天线和10Gbps有线网络接口，覆盖面积据称可达3600平方英尺。TP-Link重新设计了机身外观，希望用户将其放置在架子等开阔位置展示，而不是藏在容易限制信号传播的地方。TP-Link Systems总裁杰夫·巴尼表示，用户真正关心的是连接是否稳定一致，Archer 8的设计目标正是提供这种体验。针对面积更大的住宅，TP-Link还推出了Deco 8 Ultra BN22000。该产品最高可提供22Gbps无线带宽，并支持10Gbps以太网。一套由三台设备组成的系统据称能够覆盖9800平方英尺空间，同时支持超过200台设备。欧洲版本的标称无线速率为19Gbps。", "pub_date": "2026-09-01T11:05:09+00:00", "time_str": "18小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "戴森推出配备摄像头的智能牙刷CameraJet", "title_zh": "戴森推出配备摄像头的智能牙刷CameraJet", "summary": "戴森宣布进军口腔护理领域，推出首款配备摄像头并具备自动清洁牙缝功能的电动牙刷CameraJet。该产品售价499美元，提供陶瓷蓝和陶瓷粉两种配色，于9月1日起上市。CameraJet将摄像头安装在刷头下方，用户可通过Wi-Fi把口腔内部的实时画面传输到手机等智能设备上，从而观察牙齿状况。摄像头还会配合人工智能算法识别牙齿之间的缝隙，并在刷牙过程中自动向这些位置喷射漱口水，帮助清理牙缝。牙刷内置一枚约10万像素的微型摄像头和频闪灯。戴森表示，其“间隙光学定位”功能每秒分析摄像头拍摄的28张实时画面，相关图像不会存储在设备中，也不会发送至云端。当系统检测到牙缝后，CameraJet能在100毫秒内喷出锥形漱口水水流，对目标区域进行冲洗。也就是说，用户刷牙的同时，牙刷能够同步完成部分牙缝清洁工作。CameraJet的售价并不便宜，但相比其他没有摄像头和喷射系统的高端智能牙刷，其价格只略高一些。对于平时难以坚持使用牙线、又不希望因清洁不到位而受到牙医提醒的人来说，这项功能可能具有一定吸引力。 查看评论", "summary_zh": "戴森宣布进军口腔护理领域，推出首款配备摄像头并具备自动清洁牙缝功能的电动牙刷CameraJet。该产品售价499美元，提供陶瓷蓝和陶瓷粉两种配色，于9月1日起上市。CameraJet将摄像头安装在刷头下方，用户可通过Wi-Fi把口腔内部的实时画面传输到手机等智能设备上，从而观察牙齿状况。摄像头还会配合人工智能算法识别牙齿之间的缝隙，并在刷牙过程中自动向这些位置喷射漱口水，帮助清理牙缝。牙刷内置一枚约10万像素的微型摄像头和频闪灯。戴森表示，其“间隙光学定位”功能每秒分析摄像头拍摄的28张实时画面，相关图像不会存储在设备中，也不会发送至云端。当系统检测到牙缝后，CameraJet能在100毫秒内喷出锥形漱口水水流，对目标区域进行冲洗。也就是说，用户刷牙的同时，牙刷能够同步完成部分牙缝清洁工作。CameraJet的售价并不便宜，但相比其他没有摄像头和喷射系统的高端智能牙刷，其价格只略高一些。对于平时难以坚持使用牙线、又不希望因清洁不到位而受到牙医提醒的人来说，这项功能可能具有一定吸引力。 查看评论", "pub_date": "2026-09-01T10:05:11+00:00", "time_str": "19小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "英伟达新驱动又翻车 8-bit色深下显示器疯狂闪烁", "title_zh": "英伟达新驱动又翻车 8-bit色深下显示器疯狂闪烁", "summary": "NVIDIA于几日前发布了Game Ready 616.56版显卡驱动，宣称带来了近年最强性能提升之一。然而这款驱动很快被曝出存在严重bug——部分用户反映更新后显示器出现画面闪烁问题。据用户 @renan_maniero 反馈，他在多台显示器上测试后均发现了该问题，随后多名用户跟帖确认。汇总信息后发现一个共同点：闪烁仅发生在8-bit色深模式下，切换到10-bit模式后问题几乎立即消失。这一问题已反馈至NVIDIA官方，一名员工已确认bug存在。NVIDIA官方声明称正在“测试修复方案”，预计很快会发布新版驱动或热修复补丁。受影响的用户可以尝试以下方法：•\t切换至10-bit色深：打开NVIDIA App → 系统 → 显示器 → 选择10-bit模式。若成功，Windows 10/11高级显示设置中应显示10-bit色深。•\t如果显示器不支持10-bit色深，可尝试降低刷新率（但未必有效）。•\t如上述方法均无效，建议回滚至旧版驱动。值得注意的是，616.56驱动在3DMark等跑分软件中表现亮眼——部分游戏性能提升高达12%。", "summary_zh": "NVIDIA于几日前发布了Game Ready 616.56版显卡驱动，宣称带来了近年最强性能提升之一。然而这款驱动很快被曝出存在严重bug——部分用户反映更新后显示器出现画面闪烁问题。据用户 @renan_maniero 反馈，他在多台显示器上测试后均发现了该问题，随后多名用户跟帖确认。汇总信息后发现一个共同点：闪烁仅发生在8-bit色深模式下，切换到10-bit模式后问题几乎立即消失。这一问题已反馈至NVIDIA官方，一名员工已确认bug存在。NVIDIA官方声明称正在“测试修复方案”，预计很快会发布新版驱动或热修复补丁。受影响的用户可以尝试以下方法：•\t切换至10-bit色深：打开NVIDIA App → 系统 → 显示器 → 选择10-bit模式。若成功，Windows 10/11高级显示设置中应显示10-bit色深。•\t如果显示器不支持10-bit色深，可尝试降低刷新率（但未必有效）。•\t如上述方法均无效，建议回滚至旧版驱动。值得注意的是，616.56驱动在3DMark等跑分软件中表现亮眼——部分游戏性能提升高达12%。", "pub_date": "2026-09-01T09:35:09+00:00", "time_str": "20小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "DeepSeek-V4首款多模态模型权重开放“睁眼”后追上Opus-4.8", "title_zh": "DeepSeek-V4首款多模态模型权重开放“睁眼”后追上Opus-4.8", "summary": "在连续强化了推理、代码和Agent能力之后，DeepSeek终于为V4补上了视觉输入。8月31日上午，DeepSeek在Hugging Face开放了DeepSeek-V4-Flash-Vision-Exp模型权重，开发者可以直接下载模型权重并自行部署。而官方仓库除了模型文件，还包括视觉编码器和Aligner等组件的参考推理实现，并覆盖DFlash Attention、MoE、Hyper-Connections和DSpark等部分。就在10天前，DeepSeek正式对外公布V4-Flash-Vision-Exp模型，规模约3050亿参数。从名字里的“Exp”不难看出，这是V4系列首款实验性多模态模型，其建立在V4-Flash架构之上，通过加入视觉模块并继续训练，使模型获得处理图片的能力。在纯文本任务上，官方称V4-Flash-Vision-Exp与V4-Flash整体保持相近水平，主要区别是新模型能够识别照片内容、读取截图中的文字、分析图表，也可以把图片作为Agent工作流程的一部分，而不再只能依赖文字描述。", "summary_zh": "在连续强化了推理、代码和Agent能力之后，DeepSeek终于为V4补上了视觉输入。8月31日上午，DeepSeek在Hugging Face开放了DeepSeek-V4-Flash-Vision-Exp模型权重，开发者可以直接下载模型权重并自行部署。而官方仓库除了模型文件，还包括视觉编码器和Aligner等组件的参考推理实现，并覆盖DFlash Attention、MoE、Hyper-Connections和DSpark等部分。就在10天前，DeepSeek正式对外公布V4-Flash-Vision-Exp模型，规模约3050亿参数。从名字里的“Exp”不难看出，这是V4系列首款实验性多模态模型，其建立在V4-Flash架构之上，通过加入视觉模块并继续训练，使模型获得处理图片的能力。在纯文本任务上，官方称V4-Flash-Vision-Exp与V4-Flash整体保持相近水平，主要区别是新模型能够识别照片内容、读取截图中的文字、分析图表，也可以把图片作为Agent工作流程的一部分，而不再只能依赖文字描述。", "pub_date": "2026-09-01T09:06:42+00:00", "time_str": "20小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "特努斯开局一对2", "title_zh": "特努斯开局一对2", "summary": "一周前，苹果先给库克办了一场告别派对。地点就在Apple Park园区内，大约来了200个人，OneRepublic现场演出。乔布斯的遗孀Laurene Powell Jobs、苹果前COO Jeff Williams、服务业务负责人Eddy Cue都来了，马上要接班的约翰·特努斯（John Ternus）也上台讲了话。15年CEO生涯到了最后几天，苹果把能叫来的老朋友都叫来了。昨天，也就是8月31日，库克又给全体员工发了一封告别信。他说自己会想念这份工作，也特意把一大段话留给了特努斯，称很少有人像他一样懂得怎样“造出改变世界的产品”。随后库克又在社交媒体上向整个苹果社区道谢：“我的职位明天会变，但我对苹果社区的爱永远不会变。”到了今天，那个“明天”真的来了。9月1日，50岁的特努斯正式接过苹果CEO的位置。15年前，库克接班时也是50岁。只不过库克当年要接替的是乔布斯，特努斯面对的却是另一番光景：外界已经等苹果换帅很久，苹果在AI上也正缺一个新答案。更重要的是，特努斯并非空手上桌。按斗地主的说法，他开局就拿到了一对儿2。", "summary_zh": "一周前，苹果先给库克办了一场告别派对。地点就在Apple Park园区内，大约来了200个人，OneRepublic现场演出。乔布斯的遗孀Laurene Powell Jobs、苹果前COO Jeff Williams、服务业务负责人Eddy Cue都来了，马上要接班的约翰·特努斯（John Ternus）也上台讲了话。15年CEO生涯到了最后几天，苹果把能叫来的老朋友都叫来了。昨天，也就是8月31日，库克又给全体员工发了一封告别信。他说自己会想念这份工作，也特意把一大段话留给了特努斯，称很少有人像他一样懂得怎样“造出改变世界的产品”。随后库克又在社交媒体上向整个苹果社区道谢：“我的职位明天会变，但我对苹果社区的爱永远不会变。”到了今天，那个“明天”真的来了。9月1日，50岁的特努斯正式接过苹果CEO的位置。15年前，库克接班时也是50岁。只不过库克当年要接替的是乔布斯，特努斯面对的却是另一番光景：外界已经等苹果换帅很久，苹果在AI上也正缺一个新答案。更重要的是，特努斯并非空手上桌。按斗地主的说法，他开局就拿到了一对儿2。", "pub_date": "2026-09-01T09:06:32+00:00", "time_str": "20小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "Manus宣布正式恢复独立运营 创始人肖弘及团队留任", "title_zh": "Manus宣布正式恢复独立运营 创始人肖弘及团队留任", "summary": "9月1日，Manus今日宣布即日起正式恢复独立运营，由创始人肖弘、首席科学家季逸超及联合创始人张涛组成的创始团队将继续领导公司。Manus在此前一段时间经历了运营主体变更，部分用户在此期间需进行数据备份与恢复，并经历临时访问中断。公司对用户为此付出的额外时间与精力表示感谢，并提醒已备份但尚未恢复数据的用户可通过恢复门户进行操作，无截止时间限制。作为独立的通用AI智能体实验室，Manus表示将持续推进产品创新，未来将更深度融入用户日常工作流程、更直接地与世界交互，并以更主动的方式代表用户行动。更多创新成果即将推出。 查看评论", "summary_zh": "9月1日，Manus今日宣布即日起正式恢复独立运营，由创始人肖弘、首席科学家季逸超及联合创始人张涛组成的创始团队将继续领导公司。Manus在此前一段时间经历了运营主体变更，部分用户在此期间需进行数据备份与恢复，并经历临时访问中断。公司对用户为此付出的额外时间与精力表示感谢，并提醒已备份但尚未恢复数据的用户可通过恢复门户进行操作，无截止时间限制。作为独立的通用AI智能体实验室，Manus表示将持续推进产品创新，未来将更深度融入用户日常工作流程、更直接地与世界交互，并以更主动的方式代表用户行动。更多创新成果即将推出。 查看评论", "pub_date": "2026-09-01T09:06:19+00:00", "time_str": "20小时前"}, {"source": "cnBeta", "source_key": "cnbeta_41", "cat": "cn_tech", "color": "#00bc74", "title": "宇树员工曝王兴兴严控公司成本 超100元报销要他亲自审批", "title_zh": "宇树员工曝王兴兴严控公司成本 超100元报销要他亲自审批", "summary": "据《财经》报道，多名宇树科技员工称，公司创始人王兴兴非常重视成本控制，一笔超过100元的报销也需要由其审批，员工经常在其办公室外排队等待。报道援引员工说法称，王兴兴要求“每一分钱都要花在刀刃上”，不仅把控公司战略和预算，还会参与产品设计及宣传片制作等具体环节，包括讨论螺丝钉长度、材料颜色、拍摄场景和灯光等。宇树在产品研发中也延续了降本思路。王兴兴此前曾公开表示，降低成本首先依靠设计，其次才是规模化生产，并称单纯依靠扩大产量降本是“幻觉”。据报道，宇树通过选择成本较低的零部件、简化通信方案以及自主组装等方式控制硬件成本。不过，这种管理方式也使大量事项集中到王兴兴本人。多名员工称，宇树组织架构较为扁平，需要其亲自审批的事务较多。员工向其汇报时需要快速说明重点，否则可能被打断或催促。《财经》表示，已就报销审批、绩效考核、供应商保密协议及早期品控等问题向宇树科技提出采访请求，截至报道发布，公司未予回应。 查看评论", "summary_zh": "据《财经》报道，多名宇树科技员工称，公司创始人王兴兴非常重视成本控制，一笔超过100元的报销也需要由其审批，员工经常在其办公室外排队等待。报道援引员工说法称，王兴兴要求“每一分钱都要花在刀刃上”，不仅把控公司战略和预算，还会参与产品设计及宣传片制作等具体环节，包括讨论螺丝钉长度、材料颜色、拍摄场景和灯光等。宇树在产品研发中也 来做。\nPDF 编辑\n这次比较大的变化是加入了 PDF 内容编辑。\n现在可以直接修改、添加和删除 PDF 中的文字和图片，同时支持高亮、下划线、绘图、文本框等常用批注功能。\n希望打开 PDF 后，不需要在不同工具之间来回切换，阅读、批注和编辑尽量都可以在一个窗口里完成。\n\nAI 文档处理\n另外一个比较大的更新是 AI 。\n现在可以直接针对当前 PDF 和 AI 对话，也加入了一些比较实用的文档处理功能：\n\nAI 对话\n文档总结\n内容翻译\n表格提取\n思维导图\n自动生成目录\n\n\nAI 部分没有单独做成一个聊天机器人，而是尽量和 PDF 内容结合。\n例如选中一段内容后，可以直接让 AI 解释、翻译；", "summary_zh": "一个独立开发的 macOS PDF 编辑器，最近做了一次比较大的更新\n之前在 V2EX 发过一个帖子，做的是一个 macOS PDF 工具。当时产品还比较早期，主要是阅读、批注和一些 PDF 处理功能。\n这段时间基本都在埋头开发，最近终于完成了一次比较大的更新，所以回来分享一下现在的进展。\n现在产品叫 Arc PDF，目前主要围绕 PDF 的阅读、编辑和 AI 文档处理来做。\nPDF 编辑\n这次比较大的变化是加入了 PDF 内容编辑。\n现在可以直接修改、添加和删除 PDF 中的文字和图片，同时支持高亮、下划线、绘图、文本框等常用批注功能。\n希望打开 PDF 后，不需要在不同工具之间来回切换，阅读、批注和编辑尽量都可以在一个窗口里完成。\n\nAI 文档处理\n另外一个比较大的更新是 AI 。\n现在可以直接针对当前 PDF 和 AI 对话，也加入了一些比较实用的文档处理功能：\n\nAI 对话\n文档总结\n内容翻译\n表格提取\n思维导图\n自动生成目录\n\n\nAI 部分没有单独做成一个聊天机器人，而是尽量和 PDF 内容结合。\n例如选中一段内容后，可以直接让 AI 解释、翻译；", "pub_date": "2026-09-02T03:22:59+00:00", "time_str": "2小时前"}, {"source": "V2EX技术", "source_key": "v2ex技术_44", "cat": "cn_tech", "color": "#3177cf", "title": "GPT sol 的上下文长度设置成多少比较合适，默认的 200k 太短了，随便几下就开始合并了， 1m 到后面又有点顾头不顾尾的", "title_zh": "GPT sol 的上下文长度设置成多少比较合适，默认的 200k 太短了，随便几下就开始合并了， 1m 到后面又有点顾头不顾尾的", "summary": "", "summary_zh": "", "pub_date": "2026-09-02T03:13:53+00:00", "time_str": "2小时前"}, {"source": "V2EX技术", "source_key": "v2ex技术_44", "cat": "cn_tech", "color": "#3177cf", "title": "🔥 GPT-Load 2.0 发布！轻量易用的自托管 AI 网关", "title_zh": "🔥 GPT-Load 2.0 发布！轻量易用的自托管 AI 网关", "summary": "GitHub：https://github.com/tbphp/gpt-load\n官网：https://www.gpt-load.com\n2.0 RC 版本已发布，这次是完整重写，不是 1.x 的小升级重构。\nGPT-Load 2.0 的初衷很简单：开发者手里的 AI 资源越来越杂，各种 API Key 还有订阅，再各个客户端里反复配、切换账号太繁琐。\n所以 2.0 的使用方式尽量做得简单：\n\n导入资源 → 生成 AccessKey → 直接调用。\n\n之后，GPT-Load 会自动帮你处理凭据轮换、权重调度、失败重试、冷却、黑名单、会话亲和和健康判定。\n和 CPA 、New API 、sub2api 的区别？\n这些项目做得很好、功能已经很成熟，我一直在使用。\nCPA 适合直接把 Codex 、Claude 等订阅账号代理成 API 。\nNew API 和 sub2-api 更偏用户体系、额度、计费、充值和 API 分发。\nGPT-Load  2.0 的设计语言更偏向于简洁、轻量、易用。\n主要面向个人和内部团队，专注把手里的各种上游资源收进同一个资源池，再统一调度、容错和观测。", "summary_zh": "GitHub：https://github.com/tbphp/gpt-load\n官网：https://www.gpt-load.com\n2.0 RC 版本已发布，这次是完整重写，不是 1.x 的小升级重构。\nGPT-Load 2.0 的初衷很简单：开发者手里的 AI 资源越来越杂，各种 API Key 还有订阅，再各个客户端里反复配、切换账号太繁琐。\n所以 2.0 的使用方式尽量做得简单：\n\n导入资源 → 生成 AccessKey → 直接调用。\n\n之后，GPT-Load 会自动帮你处理凭据轮换、权重调度、失败重试、冷却、黑名单、会话亲和和健康判定。\n和 CPA 、New API 、sub2api 的区别？\n这些项目做得很好、功能已经很成熟，我一直在使用。\nCPA 适合直接把 Codex 、Claude 等订阅账号代理成 API 。\nNew API 和 sub2-api 更偏用户体系、额度、计费、充值和 API 分发。\nGPT-Load  2.0 的设计语言更偏向于简洁、轻量、易用。\n主要面向个人和内部团队，专注把手里的各种上游资源收进同一个资源池，再统一调度、容错和观测。", "pub_date": "2026-09-02T02:46:29+00:00", "time_str": "3小时前"}, {"source": "V2EX技术", "source_key": "v2ex技术_44", "cat": "cn_tech", "color": "#3177cf", "title": "WIndows pwsh MCP 推荐，我已经使用半年，感觉良好", "title_zh": "WIndows pwsh MCP 推荐，我已经使用半年，感觉良好", "summary": "Github 仓库是这个: ripple ，不是我开发的。\n作者前期开发 yotsuda/PowerShell.MCP 这个开发时间更长，名字取得好，所以用的人更多 star 更多，但是有架构性的缺陷(不能执行交互式命令)，所以单独开发了 yotsuda/ripple ，但是没多少人注意到。\n在 windows 上边，我自己 codex/agy/claude 都是使用这个 mcp 代替内置 shell 的。\n说一下为什么推荐：\n\n持久有状态会话，多次命令调用之间保持相同的 Session 状态，AI 执行命令很方便。\nagent 可执行交互式命令，像人一样处理终端输入，不会一直卡住，还可以 Ctrl+C 。这点真的很重要。\n能够实时无损窥探终端啥情况，想象一下执行一个长时间命令，等太久 A I 也不知道啥情况，用这个 mcp 可以像人一样直接看到当前终端的部分输出，命令继续后台执行着，不必等到最后结束。\n长输出截断返回，防止命令产生巨量无意义的日志占用 AI 珍贵的上下文。完整输出保留到临时文件夹可回查。\n人机共用的共享控制台，你能看到 AI 到底在干啥，执行啥。", "summary_zh": "Github 仓库是这个: ripple ，不是我开发的。\n作者前期开发 yotsuda/PowerShell.MCP 这个开发时间更长，名字取得好，所以用的人更多 star 更多，但是有架构性的缺陷(不能执行交互式命令)，所以单独开发了 yotsuda/ripple ，但是没多少人注意到。\n在 windows 上边，我自己 codex/agy/claude 都是使用这个 mcp 代替内置 shell 的。\n说一下为什么推荐：\n\n持久有状态会话，多次命令调用之间保持相同的 Session 状态，AI 执行命令很方便。\nagent 可执行交互式命令，像人一样处理终端输入，不会一直卡住，还可以 Ctrl+C 。这点真的很重要。\n能够实时无损窥探终端啥情况，想象一下执行一个长时间命令，等太久 A I 也不知道啥情况，用这个 mcp 可以像人一样直接看到当前终端的部分输出，命令继续后台执行着，不必等到最后结束。\n长输出截断返回，防止命令产生巨量无意义的日志占用 AI 珍贵的上下文。完整输出保留到临时文件夹可回查。\n人机共用的共享控制台，你能看到 AI 到底在干啥，执行啥。", "pub_date": "2026-09-02T01:51:25+00:00", "time_str": "4小时前"}, {"source": "V2EX技术", "source_key": "v2ex技术_44", "cat": "cn_tech", "color": "#3177cf", "title": "GPT 网页版疑似修复了降智会被发现的 bug", "title_zh": "GPT 网页版疑似修复了降智会被发现的 bug", "summary": "问是什么模型，回答 sol结果糖果
