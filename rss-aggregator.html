<style>

}
[data-theme="dark"] {

  --ink:#ece7df; --muted:#a59d90; --faint:#98907f;

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }

a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

/* ── Header ── */

.hd { max-width:1560px; margin:0 auto; padding:9px 20px; display:flex; align-items:center; gap:12px; }
.hd .logo { display:flex; align-items:center; gap:8px; flex:none; font-family:var(--display); font-weight:900; font-size:16px; }
.hd .logo .sub { font-size:11px; color:var(--muted); font-weight:400; margin-left:2px; font-family:var(--body); }
.hd .nav-links { display:flex; align-items:center; gap:2px; flex:1; }
.hd .nav-links a { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:500; border:1px solid transparent; transition:all .15s; }

.theme-btn { width:30px; height:30px; border-radius:999px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; transition:all .15s; }
.theme-btn:hover { border-color:var(--brand-line); }

.src-btn { display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid var(--brand-line); background:var(--brand-weak); color:var(--brand-strong); transition:all .15s; }
.src-btn:hover { background:var(--brand-line); color:#fff; }
.src-btn svg { width:13px; height:13px; }
.src-btn .cnt { font-family:var(--mono); font-size:10px; opacity:.8; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { padding:4px 12px; border-radius:999px; font-size:12px; font-weight:500; border:1px solid var(--line); background:var(--card); color:var(--muted); transition:all .15s; white-space:nowrap; }
.chip:hover { border-color:var(--line-strong); color:var(--ink); }
.chip.on { background:var(--brand-weak); border-color:var(--brand-line); color:var(--brand-strong); font-weight:600; }
.chip .n { font-family:var(--mono); font-size:10px; opacity:.75; margin-left:3px; }
.fpill { display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 12px; border-radius:999px; font-size:12px; font-weight:600; background:var(--ink); color:var(--bg); }
.fpill .x { width:16px; height:16px; border-radius:999px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; }
.fpill .x:hover { background:rgba(255,255,255,.34); }
.tool-meta { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; }

/* ── Card wall ── */
.wall-wrap { max-width:1560px; margin:0 auto; padding:14px 20px 60px; }
.wall { columns:4 300px; column-gap:14px; }
.card { break-inside:avoid; margin-bottom:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px 12px; cursor:pointer; position:relative; transition:box-shadow .18s, border-color .18s, transform .18s; }
.card:hover { border-color:var(--brand-line); box-shadow:var(--shadow-lift); transform:translateY(-2px); }
.card.open { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand-line); }
.card-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.cat-tag { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.cat-tag::before { content:""; display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px; vertical-align:1px; background:var(--cc); }
.card-time { font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-left:auto; }
.ext-btn { flex:none; width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--faint); border:1px solid transparent; transition:all .15s; }
.ext-btn:hover { color:var(--brand-strong); border-color:var(--brand-line); background:var(--brand-weak); }
.ext-btn svg { width:11px; height:11px; }
.card-title { font-family:var(--display); font-size:15.5px; font-weight:700; line-height:1.45; margin-bottom:7px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; transition:color .15s; }
.card:hover .card-title { color:var(--brand-strong); }
.card-summary { font-size:12.5px; color:var(--muted); line-height:1.7; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }

.src-dot { width:8px; height:8px; border-radius:999px; flex:none; background:var(--sc); }
[data-theme="dark"] .src-dot { filter:brightness(1.7) saturate(.85); }
.src-name { font-weight:600; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.foot-meta { margin-left:auto; font-family:var(--mono); font-size:10.5px; display:flex; gap:8px; align-items:center; white-space:nowrap; }
.no-ft { font-size:10px; color:var(--faint); border:1px dashed var(--line-strong); border-radius:4px; padding:0 5px; }
.card.visited .card-title { color:var(--faint); }
.card.visited .card-title::after { content:"df2\8bfb"; font-family:var(--body); font-size:9px; font-weight:600; color:var(--faint); border:1px solid var(--line-strong); border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:2px; }
.pod-chip { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:var(--cat-podcast); background:color-mix(in srgb, var(--cat-podcast) 10%, transparent); border-radius:4px; padding:1px 6px; font-weight:600; }
.empty-hint { text-align:center; color:var(--faint); font-size:13px; padding:60px 0; line-height:2; }

/* ── Source panel (left drawer) ── */
.src-panel { position:fixed; top:0; left:0; bottom:0; width:min(340px,90vw); z-index:80; background:var(--card); border-right:1px solid var(--line); transform:translateX(-103%); transition:transform .28s cubic-bezier(.32,.72,.28,1); display:flex; flex-direction:column; box-shadow:18px 0 50px rgba(0,0,0,.12); }
body.src-open .src-panel { transform:none; }
.sp-head { flex:none; padding:14px 14px 10px; border-bottom:1px solid var(--line); }
.sp-head .row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.sp-head h2 { font-family:var(--display); font-size:15px; font-weight:900; flex:1; }
.sp-close { width:26px; height:26px; border-radius:999px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); transition:all .15s; }
.sp-close:hover { border-color:var(--line-strong); color:var(--ink); }
.sp-close svg { width:12px; height:12px; }
.sp-search { display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px; background:var(--bg); border:1px solid var(--line); }
.sp-search svg { width:12px; height:12px; color:var(--faint); flex:none; }
.sp-search input { border:0; background:transparent; outline:none; font-size:12px; color:var(--ink); font-family:var(--body); width:100%; }
.sp-search input::placeholder { color:var(--faint); }
.sp-list { flex:1; overflow-y:auto; padding-bottom:20px; }
.sp-all { display:flex; align-items:center; gap:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); border-left:3px solid transparent; transition:all .1s; }
.sp-all:hover { background:var(--bg); color:var(--ink); }
.sp-all.on { color:var(--brand-strong); background:var(--brand-weak); border-left-color:var(--brand); }
.sp-all .n { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint); }
.sp-cat { position:sticky; top:0; background:var(--card); padding:10px 16px 4px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--cc); display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
.sp-cat .arrow { font-size:9px; color:var(--faint); transition:transform .15s; }
.sp-cat.folded .arrow { transform:rotate(-90deg); }
.sp-cat .n { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint); }
.sp-cat-body { }
.sp-src { display:flex; align-items:center; gap:8px; padding:7px 16px; font-size:12.5px; cursor:pointer; color:var(--muted); border-left:3px solid transparent; transition:all .1s; }
.sp-src:hover { background:var(--bg); color:var(--ink); }
.sp-src.on { color:var(--brand-strong); background:var(--brand-weak); border-left-color:var(--brand); font-weight:600; }
.sp-src .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-src .n { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint); flex:none; }
.sp-src .src-dot { width:9px; height:9px; }
.sp-none { padding:14px 16px; font-size:12px; color:var(--faint); }

/* ── Scrim ── */
.scrim { position:fixed; inset:0; background:rgba(28,25,23,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:60; }
body.reading .scrim, body.src-open .scrim { opacity:1; pointer-events:auto; }

/* ── Reader drawer (right) ── */
.reader2 { position:fixed; top:0; right:0; bottom:0; width:min(760px,100%); z-index:70; background:var(--bg); border-left:1px solid var(--line); box-shadow:-18px 0 50px rgba(0,0,0,.16); transform:translateX(103%); transition:transform .3s cubic-bezier(.32,.72,.28,1); display:flex; flex-direction:column; }

.r2-top { flex:none; display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--card); position:relative; }
.r2-progress { position:absolute; left:0; bottom:-1px; height:2px; background:var(--brand); width:0%; transition:width .1s linear; }
.r2-back { display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--muted); padding:5px 10px 5px 6px; border-radius:999px; border:1px solid transparent; white-space:nowrap; transition:all .15s; }
.r2-back:hover { color:var(--ink); border-color:var(--line); background:var(--bg); }
.r2-back svg { width:14px; height:14px; }
.r2-src { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); min-width:0; }
.r2-src .src-dot { width:9px; height:9px; }

.r2-acts { margin-left:auto; display:flex; align-items:center; gap:8px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--bg); }
.seg button { padding:4px 13px; font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; transition:all .15s; }
.seg button.on { background:var(--brand-weak); color:var(--brand-strong); font-weight:600; }
.seg button[disabled] { opacity:.4; cursor:not-allowed; }
.r2-open { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--brand-strong); background:var(--brand-weak); border:1px solid var(--brand-line); padding:4px 12px; border-radius:8px; white-space:nowrap; transition:all .15s; }
.r2-open:hover { background:var(--brand-line); color:#fff; }
.r2-body { flex:1; overflow-y:auto; }
.r2-inner { max-width:680px; margin:0 auto; padding:30px 34px 80px; }
.r2-title { font-family:var(--display); font-size:23px; font-weight:900; line-height:1.42; margin-bottom:12px; }
.r2-title a { color:var(--ink); }

.r2-meta { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--faint); padding-bottom:16px; margin-bottom:22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }

.r2-summary { font-size:15px; line-height:1.9; color:var(--ink); }

.r2-lang-toggle { display:inline-flex; align-items:center; gap:0; margin-top:16px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); font-size:12px; }
.r2-lang-toggle button { padding:4px 12px; border:none; background:transparent; color:var(--muted); cursor:pointer; transition:all .15s; font-family:var(--body); font-size:12px; }
.r2-lang-toggle button.active { background:var(--brand); color:#fff; }
.r2-lang-toggle button:hover:not(.active) { background:var(--brand-weak); }
.fallback-card { border:1px dashed var(--line-strong); border-radius:10px; padding:22px; text-align:center; background:var(--card); margin-top:6px; }
.fallback-card .fb-ico { font-size:22px; margin-bottom:8px; }
.fallback-card p { font-size:13px; color:var(--muted); margin-bottom:16px; line-height:1.7; }
.fb-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 20px; border-radius:8px; background:var(--brand-weak); color:var(--brand-strong); border:1px solid var(--brand-line); transition:all .15s; }
.fb-btn:hover { background:var(--brand-line); color:#fff; }
.r2-foot-hint { text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--faint); padding:26px 0 6px; border-top:1px solid var(--line); margin-top:34px; }

/* ── Footer ── */
.footer { text-align:center; padding:6px 0; font-size:11px; color:var(--faint); font-family:var(--mono); border-top:1px solid var(--line); background:var(--bg); }

/* ── Responsive ── */
@media (max-width:900px) {
  .hd .logo .sub { display:none; }
  .toolbar { padding:12px 14px 2px; }
  .wall-wrap { padding:12px 14px 50px; }
  .r2-inner { padding:22px 20px 70px; }
  .tool-meta { display:none; }
}
@media (max-width:700px) {
  .hd .nav-links a { padding:5px 9px; font-size:12px; }
  .chips { overflow-x:auto; flex-wrap:nowrap; max-width:100%; padding-bottom:4px; }
  .chip { white-space:nowrap; flex:none; }
  .r2-top { padding:8px 12px; }
  .r2-back span { display:none; }
  .r2-src b { max-width:110px; }
  .r2-open { padding:4px 9px; }
}
</style>

3U/IPTV 播放列表的工具，支持频道监测、订阅链接和 Chrome 扩展", "summary": "标题：\n[推广] AutoM3U：用 AI Coding 搓了个管理 M3U / IPTV 播放列表的工具\n\n最近 AI Coding 太火了。\n以前做产品：\n\n想需求 → 写代码 → Debug → 再写代码 → 再 Debug\n\n现在做产品：\n\n想需求 → 问 AI 「这个你会吧？」→ 它自信输出几百行代码 → 一运行，熟悉的红字扑面而来\n\n然后，就有了 AutoM3U。\n\nAutoM3U 是做什么的？\n这是一个面向 M3U / M3U8 / HLS / IPTV 用户的播放列表管理工具。\n不提供源，不搞“神秘直播合集”。\n它想解决的问题很朴素：\n\n把自己有权使用、但乱得像浏览器书签一样的直播链接，整理成一份可以长期维护的个人播放列表。\n\n\n目前支持什么？", "summary_zh": "标题：\n[推广] AutoM3U：用 AI Coding 搓了个管理 M3U / IPTV 播放列表的工具\n\n最近 AI Coding 太火了。\n以前做产品：\n\n想需求 → 写代码 → Debug → 再写代码 → 再 Debug\n\n现在做产品：\n\n想需求 → 问 AI 「这个你会吧？」→ 它自信输出几百行代码 → 一运行，熟悉的红字扑面而来\n\n然后，就有了 AutoM3U。\n\nAutoM3U 是做什么的？\n这是一个面向 M3U / M3U8 / HLS / IPTV 用户的播放列表管理工具。\n不提供源，不搞“神秘直播合集”。\n它想解决的问题很朴素：\n\n把自己有权使用、但乱得像浏览器书签一样的直播链接，整理成一份可以长期维护的个人播放列表。\n\n\n目前支持什么？", "pub_date": "2026-09-02T05:01:00+00:00", "time_str": "1小时前"}, {"source": "V2EX", "source_key": "v2ex_1", "cat": "cn_tech", "color": "#d7434e", "title": "[分享创造] ​[分享创造] 一个无审查、免注册、无水印的 AI 绘图工具 Uncensored AI Editor", "title_zh": "[分享创造] ​[分享创造] 一个无审查、免注册、无水印的 AI 绘图工具 Uncensored AI Editor", "summary": "最近一直在折腾 AI 绘图，发现市面上大多数工具（ Midjourney, DALL-E 等）虽然强大，但限制也挺多：必须注册账号、有复杂的提示词过滤、免费额度用完就得订阅，而且下载往往还带水印。\n于是我个人搞了这个工具： Uncensored AI Editor。\n核心卖点：\n\n完全免注册：打开网页就能用，不需要绑定邮箱或社交账号，保护隐私。\n**无内容审查 (Uncensored)**：回归 AI 作为创作工具的本质，给予创作者最大的表达自由。\n无水印下载：生成的图片干干净净，直接就能用于你的项目、博文或设计稿。\n纯网页运行：无需安装，适配手机、平板和电脑浏览器，随时随地开启创作。\n功能丰富：支持 Text-to-Image ，也支持参考图（ Image Reference ）输入，提供 13 种原生比例选择。\n\n为什么做这个？\n我们认为 AI 应该是一个中立的创意辅助工具。很多时候，过于死板的关键词过滤会误伤正常的艺术创作。我们希望提供一个更自由、更直接的创作环境，让大家能专注于创意本身。", "summary_zh": "最近一直在折腾 AI 绘图，发现市面上大多数工具（ Midjourney, DALL-E 等）虽然强大，但限制也挺多：必须注册账号、有复杂的提示词过滤、免费额度用完就得订阅，而且下载往往还带水印。\n于是我个人搞了这个工具： Uncensored AI Editor。\n核心卖点：\n\n完全免注册：打开网页就能用，不需要绑定邮箱或社交账号，保护隐私。\n**无内容审查 (Uncensored)**：回归 AI 作为创作工具的本质，给予创作者最大的表达自由。\n无水印下载：生成的图片干干净净，直接就能用于你的项目、博文或设计稿。\n纯网页运行：无需安装，适配手机、平板和电脑浏览器，随时随地开启创作。\n功能丰富：支持 Text-to-Image ，也支持参考图（ Image Reference ）输入，提供 13 种原生比例选择。\n\n为什么做这个？\n我们认为 AI 应该是一个中立的创意辅助工具。很多时候，过于死板的关键词过滤会误伤正常的艺术创作 效与视觉升级，以及全新个人任务行动等海量内容。\n全新D系重型坦克线：校炮系统登场本次更新中，4辆D系重型坦克组成了一条全新的研发分支，顶级坦克为强悍的XI级Pz.70-120。该分支所有坦克均配备了独特的校炮系统——车长可在战斗中针对不同对手即时调整炮弹参数，无需切换炮弹类型即可更有效地应对敌方装甲。顶级战车Pz.70-120更拥有出色的装甲、强大的火力以及-11°火炮俯角。\n5辆XI级坦克：前所未见的玩法机制除了D系重坦线的顶级车辆外，另有5辆独特的XI级坦克加入战场，分别来自5个不同的系别。每辆坦克都引入了专属玩法机制——从自适应自动装填系统、可切换射击模式，到火箭辅助武器、先进侦察系统，每一辆都将带来前所未有的全新体验。\n轻型坦克全面重制：三大战场角色2.4版本对轻型坦克进行了大规模重制。", "summary_zh": "2026年9月2日早上8点，《坦克世界》2.4版本“动力全开”（Overdrive）正式全平台同步上线。作为2026年规模最大的一次内容更新，本次版本为全体车长带来了6辆全新XI级坦克、一整条全新D系重型坦克线、经过全面优化的匹配系统、惊艳的音效与视觉升级，以及全新个人任务行动等海量内容。\n全新D系重型坦克线：校炮系统登场本次更新中，4辆D系重型坦克组成了一条全新的研发分支，顶级坦克为强悍的XI级Pz.70-120。该分支所有坦克均配备了独特的校炮系统——车长可在战斗中针对不同对手即时调整炮弹参数，无需切换炮弹类型即可更有效地应对敌方装甲。顶级战车Pz.70-120更拥有出色的装甲、强大的火力以及-11°火炮俯角。\n5辆XI级坦克：前所未见的玩法机制除了D系重坦线的顶级车辆外，另有5辆独特的XI级坦克加入战场，分别来自5个不同的系别。每辆坦克都引入了专属玩法机制——从自适应自动装填系统、可切换射击模式，到火箭辅助武器、先进侦察系统，每一辆都将带来前所未有的全新体验。\n轻型坦克全面重制：三大战场角色2.4版本对轻型坦克进行了大规模重制。", "pub_date": "2026-09-02T11:13:09+08:00", "time_str": "2小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "Vol.134 和两位AI短剧的编导聊聊这个\"风口\"的从业体验", "title_zh": "Vol.134 和两位AI短剧的编导聊聊这个\"风口\"的从业体验", "summary": "嘉宾：岸边的塞涅卡&陈导封面/剪辑/后期：Ac跳票一年，主播和嘉宾终于对齐颗粒度了！本期节目我们邀请到两位嘉宾——@岸边的塞涅卡和@陈导，一起聊聊和AI短剧相关的一切。一位是身经百战的MFA编剧，一位是初入职场的新血导演，二位作为文化行业从业者，在\"影视寒冬\"的大背景下都不约而同选择了迈入AI短剧这个风口；随着2024至今的三年飞速发展，他们在瞬息万变中已然经验丰富，体味良多。随着AI在各行各业的飞速进化和广泛应用，对于它的评价也是众说纷纭。有人批它令人失业，有人赞它解放生产力；有人将其视为无所不能的助手，也有人只当它是一件越来越好用的工具。作为AI短剧公司的专业编剧和导演，二位嘉宾的身份则是\"工具的使用者\"和\"资源的运作者\"。作为工具的AI，究竟如何具体地帮助两位的创作执行？作为助手的AI，又在哪些层面改变了两位对创作的认知？本期节目，我们一探究竟。P.S：[1]由于嘉宾辗转在通勤路上，录音设备受限，本期节目部分音频可能出现音质较低，清晰度受限的情况，对收听体验的影响还望大家谅解；", "summary_zh": "嘉宾：岸边的塞涅卡&陈导封面/剪辑/后期：Ac跳票一年，主播和嘉宾终于对齐颗粒度了！本期节目我们邀请到两位嘉宾——@岸边的塞涅卡和@陈导，一起聊聊和AI短剧相关的一切。一位是身经百战的MFA编剧，一位是初入职场的新血导演，二位作为文化行业从业者，在\"影视寒冬\"的大背景下都不约而同选择了迈入AI短剧这个风口；随着2024至今的三年飞速发展，他们在瞬息万变中已然经验丰富，体味良多。随着AI在各行各业的飞速进化和广泛应用，对于它的评价也是众说纷纭。有人批它令人失业，有人赞它解放生产力；有人将其视为无所不能的助手，也有人只当它是一件越来越好用的工具。作为AI短剧公司的专业编剧和导演，二位嘉宾的身份则是\"工具的使用者\"和\"资源的运作者\"。作为工具的AI，究竟如何具体地帮助两位的创作执行？作为助手的AI，又在哪些层面改变了两位对创作的认知？本期节目，我们一探究竟。P.S：[1]由于嘉宾辗转在通勤路上，录音设备受限，本期节目部分音频可能出现音质较低 好。但他终将发现，自己错得有多离谱。DLC 特色包括：\n\n完整配音的前传战役，包含10个全新关卡。\n探索东南亚的全新生态地貌，完美再现标志性的美术风格。\n在可复玩的微型沙盒关卡中，一边挑战极限速通，一边达成支线目标。\n粉碎一个新NPC阵营：爱国防御联盟。\n狠狠掷出防暴盾牌，直接把敌人的脑袋砸开花。\n由芝加哥知名制作人Kalibration（曾为《El Paso, Elsewhere 2》谱曲）倾力打造的原声配乐。", "summary_zh": "由 Strange Scaffold 打造的秘密复仇惊悚FPS游戏《我是你的野兽》“退出时间”DLC正式公布。本次将于10月20日发售的前传中，秘密特工阿方斯·哈丁是美国军工复合体权力结构的忠实信徒。\n\n\n他坚信，自己的上线查尔斯·伯金上校的一切安排都是在为他着想。他还坚信，对秘密行动局(COI, Covert Operations Initiative)的死敌“爱国防御联盟”发动影子战争，能让这个世界变得更好。但他终将发现，自己错得有多离谱。DLC 特色包括：\n\n完整配音的前传战役，包含10个全新关卡。\n探索东南亚的全新生态地貌，完美再现标志性的美术风格。\n在可复玩的微型沙盒关卡中，一边挑战极限速通，一边达成支线目标。\n粉碎一个新NPC阵营：爱国防御联盟。\n狠狠掷出防暴盾牌，直接把敌人的脑袋砸开花。\n由芝加哥知名制作人Kalibration（曾为《El Paso, Elsewhere 2》谱曲）倾力打造的原声配乐。", "pub_date": "2026-09-02T09:25:00+08:00", "time_str": "4小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "《链在一起》现已实装2v2竞速模式", "title_zh": "《链在一起》现已实装2v2竞速模式", "summary": "多人合作游戏《链在一起》现已实装2v2竞速模式。此前，玩家需与朋友们一起，从地狱的深渊被链锁攀登并穿过多样的世界。 现在，玩家还要和对手展开正面较量，在 30 分钟内比比看谁能攀得更高！\n与此同时，本次更新还将带来两套免费的全新造型：美式囚犯连体服以及中世纪囚犯服。毕竟，受苦也要穿得像模像样。 若玩家想要额外支持开发团队，还可选购售价12元的支持者包，带来专属的黄金锁链外观（无加成）。 \n与此同时，总部位于英国的发行商 Secret Mode 将接管《链在一起》，并引入全新的开发合作伙伴  Lab42 Games  。作为此次变更的一部分，原开发商 Anegar Games 将逐步退出本作的后续开发。", "summary_zh": "多人合作游戏《链在一起》现已实装2v2竞速模式。此前，玩家需与朋友们一起，从地狱的深渊被链锁攀登并穿过多样的世界。 现在，玩家还要和对手展开正面较量，在 30 分钟内比比看谁能攀得更高！\n与此同时，本次更新还将带来两套免费的全新造型：美式囚犯连体服以及中世纪囚犯服。毕竟，受苦也要穿得像模像样。 若玩家想要额外支持开发团队，还可选购售价12元的支持者包，带来专属的黄金锁链外观（无加成）。 \n与此同时，总部位于英国的发行商 Secret Mode 将接管《链在一起》，并引入全新的开发合作伙伴  Lab42 Games  。作为此次变更的一部分，原开发商 Anegar Games 将逐步退出本作的后续开发。", "pub_date": "2026-09-02T09:15:00+08:00", "time_str": "4小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "英伟达正式公布DLSS5，首发登陆《NBA 2K27》", "title_zh": "英伟达正式公布DLSS5，首发登陆《NBA 2K27》", "summary": "英伟达于今日正式公布 DLSS 5 技术，将于9月3日首发登陆《NBA 2K27》。据悉，这项技术适用于所有GeForce RTX 50系列显卡、笔记本电脑以及GeForce NOW。英伟达引入了3D引导神经渲染，标志着AI实时图形向好莱坞级别的高画质迈出了关键一步。\n\nVisual Concepts高级制作人Peter Kavic表示，这项技术赋予了开发团队极高的控制力。团队可以设定整体色调和风格以匹配原有的艺术方向，还能使用像素级的细节提升控制遮罩在关键部位精细调整角色，同时细致地还原角色外貌。\n官方表示，DLSS 5将游戏引擎渲染的画面作为坚实的底层基础。在图形管线的最后渲染阶段，DLSS 为场景注入逼真的光照和材质。同时，开发者可以确保引擎帧决定保留的内容，并由美术人员指导修改的部分。\n为了实现DLSS 5，NVIDIA研发了全新的实时AI模型。该模型能够以确定性的方式运行，在处理相同的输入帧时输出一致的结果。本次的技术直接锚定渲染帧，通过学习识别引擎数据来分析屏幕上的物体、材质、空间关系和光源。", "summary_zh": "英伟达于今日正式公布 DLSS 5 技术，将于9月3日首发登陆《NBA 2K27》。据悉，这项技术适用于所有GeForce RTX 50系列显卡、笔记本电脑以及GeForce NOW。英伟达引入了3D引导神经渲染，标志着AI实时图形向好莱坞级别的高画质迈出了关键一步。\n\nVisual Concepts高级制作人Peter Kavic表示，这项技术赋予了开发团队极高的控制力。团队可以设定整体色调和风格以匹配原有的艺术方向，还能使用像素级的细节提升控制遮罩在关键部位精细调整角色，同时细致地还原角色外貌。\n官方表示，DLSS 5将游戏引擎渲染的画面作为坚实的底层基础。在图形管线的最后渲染阶段，DLSS 为场景注入逼真的光照和材质。同时，开发者可以确保引擎帧决定保留的内容，并由美术人员指导修改的部分。\n为了实现DLSS 5，NVIDIA研发了全新的实时AI模型。该模型能够以确定性的方式运行，在处理相同的输入帧时输出一致的结果。本次的技术直接锚定渲染帧，通过学习识别引擎数据来分析屏幕上的物体、材质、空间关系和光源。", "pub_date": "2026-09-02T09:05:00+08:00", "time_str": "4小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "【抽奖】《007 初露锋芒》销量突破400万套，迎来首次八折优惠", "title_zh": "【抽奖】《007 初露锋芒》销量突破400万套，迎来首次八折优惠", "summary": "曾打造《HITMAN》系列的独立游戏开发与发行商 IO Interactive，联合 Amazon MGM Studios，共同庆祝《007 初露锋芒》在发售后三个月内销量突破 400 万套，成为 2026 年销量增长最快的游戏之一。为纪念这一里程碑，《007 初露锋芒》现推出八折优惠，这是该游戏首次折扣促销。\nIO Interactive 将持续扩展《007 初露锋芒》的内容，并定期推出“战术模拟”更新，带领玩家探索多个标志性地点，包括肯辛顿工作室、斯洛伐克山脉、毛里塔尼亚黑市以及越南珍珠度假村。此外，游戏还将陆续加入全新工具、武器、外观道具、排行榜挑战，并探索推出新游戏+模式，以提升重复游玩的乐趣。\n《007 初露锋芒》现已登陆 PlayStation5、Xbox Series X|S 和 Amazon.com；PC 玩家可通过 Steam 与 Epic Games Store 购买，主要零售渠道亦有销售。Nintendo Switch 2 版本将于 2026 年夏季稍晚推出。《007 First Light》提供标准版、豪华版、典藏版和传承版。更多详情请访问官网。", "summary_zh": "曾打造《HITMAN》系列的独立游戏开发与发行商 IO Interactive，联合 Amazon MGM Studios，共同庆祝《007 初露锋芒》在发售后三个月内销量突破 400 万套，成为 2026 年销量增长最快的游戏之一。为纪念这一里程碑，《007 初露锋芒》现推出八折优惠，这是该游戏首次折扣促销。\nIO Interactive 将持续扩展《007 初露锋芒》的内容，并定期推出“战术模拟”更新，带领玩家探索多个标志性地点，包括肯辛顿工作室、斯洛伐克山脉、毛里塔尼亚黑市以及越南珍珠度假村。此外，游戏还将陆续加入全新工具、武器、外观道具、排行榜挑战，并探索推出新游戏+模式，以提升重复游玩的乐趣。\n《007 初露锋芒》现已登陆 PlayStation5、Xbox Series X|S 和 Amazon.com；PC 玩家可通过 Steam 与 Epic Games Store 购买，主要零售渠道亦有销售。Nintendo Switch 2 版本将于 2026 年夏季稍晚推出。《007 First Light》提供标准版、豪华版、典藏版和传承版。更多详情请访问官网。", "pub_date": "2026-09-01T21:00:00+08:00", "time_str": "17小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "全城都被喇叭洗脑，除了你这个垃圾佬——《喇叭之城》", "title_zh": "全城都被喇叭洗脑，除了你这个垃圾佬——《喇叭之城》", "summary": "真理与爱必须战胜谎言与仇恨。Pravda a láska musí zvítězit nad lží a nenávistí.——瓦茨拉夫·哈维尔解谜游戏的魅力，常常来自它独有的气质。一个画面，一段音乐，甚至一种颜色，都能成为一款游戏的印记。提到荒诞与永生，我们会想到《锈湖》；提到邪教与祭祀，我们会想到《湖边小屋》。那么，说起反乌托邦风格的解谜游戏，你会想到哪一款？是带着《机械迷城》，还是《银河历险记》系列？答案或许各不相同，可沿着这些鲜明的画面与奇妙的谜题一路找下去，我们总是绕不开一个名字——Amanita Design。而这次要给大家推荐的游戏便是他们带来的新作——《喇叭之城》。\n在进入这座城市前，先说一个很重要的消息：《喇叭之城》在8月29日17:00正式更新了中文配音。\n更新完成后，游戏将拥有三套完整配音，分别是中文、英文和捷克语。它来自捷克独立游戏团队Amanita Design，也就是国内玩家熟悉的“蘑菇社”。制作组专门录制了一整套中文语音，还重新调整了字幕的时间轴。对一款体量有限的独立游戏来说，这项工作需要投入不少时间与成本。", "summary_zh": "真理与爱必须战胜谎言与仇恨。Pravda a láska musí zvítězit nad lží a nenávistí.——瓦茨拉夫·哈维尔解谜游戏的魅力，常常来自它独有的气质。一个画面，一段音乐，甚至一种颜色，都能成为一款游戏的印记。提到荒诞与永生，我们会想到《锈湖》；提到邪教与祭祀，我们会想到《湖边小屋》。那么，说起反乌托邦风格的解谜游戏，你会想到哪一款？是带着《机械迷城》，还是《银河历险记》系列？答案或许各不相同，可沿着这些鲜明的画面与奇妙的谜题一路找下去，我们总是绕不开一个名字——Amanita Design。而这次要给大家推荐的游戏便是他们带来的新作——《喇叭之城》。\n在进入这座城市前，先说一个很重要的消息：《喇叭之城》在8月29日17:00正式更新了中文配音。\n更新完成后，游戏将拥有三套完整配音，分别是中文、英文和捷克语。它来自捷克独立游戏团队Amanita Design，也就是国内玩家熟悉的“蘑菇社”。制作组专门录制了一整套中文语音，还重新调整了字幕的时间轴。对一款体量有限的独立游戏来说，这项工作需要投入不少时间与成本。", "pub_date": "2026-09-01T20:30:18+08:00", "time_str": "17小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "我们需要更多小镇偶像，录音笔VOL.776", "title_zh": "我们需要更多小镇偶像，录音笔VOL.776", "summary": "【录音笔】是GPASS推出的一档会员专享节目，内容来自机核办公室日程生活和工作中的一些短小记录，每期时长十几分钟左右（大概吧）。内容也许是一些不成体统的碎碎念，也许是一些突然发疯的暴言，还有可能是哪个缺德的把办公室里真实的日常对话（dui ma）偷偷录了下来，总之就连我们自己现在也不知道每期会有哪些人参与，会录些什么。", "summary_zh": "【录音笔】是GPASS推出的一档会员专享节目，内容来自机核办公室日程生活和工作中的一些短小记录，每期时长十几分钟左右（大概吧）。内容也许是一些不成体统的碎碎念，也许是一些突然发疯的暴言，还有可能是哪个缺德的把办公室里真实的日常对话（dui ma）偷偷录了下来，总之就连我们自己现在也不知道每期会有哪些人参与，会录些什么。", "pub_date": "2026-09-01T17:00:00+08:00", "time_str": "21小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "悠木碧还是太权威了：《噬血代码 2》DLC“Mass of Idris”试玩+采访小记", "title_zh": "悠木碧还是太权威了：《噬血代码 2》DLC“Mass of Idris”试玩+采访小记", "summary": "作为一款以吸血鬼与末日世界为背景的戏剧性探索动作RPG，《噬血代码2》自今年1月发售以来曾经一度成为许多“魂类游戏”爱好者以及二次元玩家们关注的焦点。在这部作品中，玩家将扮演吸血鬼猎人，与拥有穿越时空能力的少女“露”携手，穿梭于现代与百年前的过去，通过改写历史的关键节点来阻止世界走向崩毁。\n游戏延续了前作的血码系统，并新增了近战、平衡、技巧型战术切换功能，在保留吸血攻击机制的基础上大幅扩展了武器种类与技能组合。如今，本作全新扩充DLC《Mask of Idris》（伊德瑞斯的面具）即将于9月9日正式登陆PS5、Xbox Series X|S及PC平台。应万代南梦宫的邀请，我们日前在上海参加了《噬血代码2》DLC《Mask of Idris》的媒体试玩活动，现场试玩时长约45分钟。下文将围绕本次实机体验，展开具体的介绍与分析。\n试玩体验首先要提醒各位的是，本次DLC并非购买后即可直接游玩的内容。玩家需要先在本篇中达成第二个结局“调和之月”，并将支线任务“瓦伦丁的请求”推进至“和瓦伦丁交换意见：马格梅尔岛的书”后，才能解锁DLC的后续任务。", "summary_zh": "作为一款以吸血鬼与末日世界为背景的戏剧性探索动作RPG，《噬血代码2》自今年1月发售以来曾经一度成为许多“魂类游戏”爱好者以及二次元玩家们关注的焦点。在这部作品中，玩家将扮演吸血鬼猎人，与拥有穿越时空能力的少女“露”携手，穿梭于现代与百年前的过去，通过改写历史的关键节点来阻止世界走向崩毁。\n游戏延续了前作的血码系统，并新增了近战、平衡、技巧型战术切换功能，在保留吸血攻击机制的基础上大幅扩展了武器种类与技能组合。如今，本作全新扩充DLC《Mask of Idris》（伊德瑞斯的面具）即将于9月9日正式登陆PS5、Xbox Series X|S及PC平台。应万代南梦宫的邀请，我们日前在上海参加了《噬血代码2》DLC《Mask of Idris》的媒体试玩活动，现场试玩时长约45分钟。下文将围绕本次实机体验，展开具体的介绍与分析。\n试玩体验首先要提醒各位的是，本次DLC并非购买后即可直接游玩的内容。玩家需要先在本篇中达成第二个结局“调和之月”，并将支线任务“瓦伦丁的请求”推进至“和瓦伦丁交换意见：马格梅尔岛的书”后，才能解锁DLC的后续任务。", "pub_date": "2026-09-01T17:00:00+08:00", "time_str": "21小时前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "让好创意，在聚光灯下持续生长｜第三届TapTap聚光灯GameJam报名开启", "title_zh": "让好创意，在聚光灯下持续生长｜第三届TapTap聚光灯GameJam报名开启", "summary": "年初举办的TapTap年度游戏大赏2025，是一届游戏群星闪耀的颁奖庆典。《33号远征队》游戏总监纪尧姆·布罗什、《弹丸论破》制作人小高和刚、《潜水员戴夫》制作人黄载皓……这些行业知名前辈从全球各地赶来，共同汇聚在了上海的这个夜晚。\n<TAPTAP报名链接>而在其中一个颁奖环节，是一位名叫晏金晨的中国大学生走上了领奖台，在行业前辈们的注视下，从心动CEO黄一孟手中，接过了聚光灯「最佳游戏」和「最佳学生作品」两座沉甸甸的奖杯。\n参加游戏大赏的几个月前，他和队友们耗时21天，在第二届TapTap聚光灯GameJam里创作出了解密游戏《错误类型：Type Error》，并凭借此站到了行业聚光灯的正中央。\n从灵光乍现一个想法，到真正站在聚光灯下，这中间只隔了一次游戏人展现热爱、自我表达的活动 —— 这就是GameJam，一场不问出身，只关乎创意、才华与热情的游戏创作挑战。传统定义上，GameJam只是一场「限时做游戏」的比赛。参赛者们需要在极限时间内，根据现场公布的命题，从零开始创作一款可玩的游戏作品。", "summary_zh": "年初举办的TapTap年度游戏大赏2025，是一届游戏群星闪耀的颁奖庆典。《33号远征队》游戏总监纪尧姆·布罗什、《弹丸论破》制作人小高和刚、《潜水员戴夫》制作人黄载皓……这些行业知名前辈从全球各地赶来，共同汇聚在了上海的这个夜晚。\n<TAPTAP报名链接>而在其中一个颁奖环节，是一位名叫晏金晨的中国大学生走上了领奖台，在行业前辈们的注视下，从心动CEO黄一孟手中，接过了聚光灯「最佳游戏」和「最佳学生作品」两座沉甸甸的奖杯。\n参加游戏大赏的几个月前，他和队友们耗时21天，在第二届TapTap聚光灯GameJam里创作出了解密游戏《错误类型：Type Error》，并凭借此站到了行业聚光灯的正中央。\n从灵光乍现 mmary_zh": "由 Slavic Magic 打造的中世纪城市建造游戏《庄园领主》销量突破400万份。开发团队在感谢玩家支持的同时，同步推出抢先体验阶段迄今规模最大的内容更新。据悉本次更新涵盖乳牛畜牧、苹果酒与蜂蜜酒酿造、燕麦种植等全新玩法，并对物流、建造与季节性机制进行全面重构。\n《庄园领主》最初由波兰开发者 Greg Styczeń 历时数年一手打造的游戏，2024年4月开启抢先体验首日便创下百万销量纪录。本次新增内容超过 30 项重大变更，包括全新地图、主 HUD 界面重新设计、工匠主动配方系统以及建材场与季节性动物繁殖等深度机制。\n开发团队在 Steam 公告中也直面了社群对内容更新节奏的批评。公告表示：「最近我看到不少评论批评游戏缺乏新内容，希望这次更新会是一个好的开始。如果大家先前给出的评论是负面的，也许这次能让你改观。若没有，我只能说，我们依然会继续努力。下一次更新预计于 9 月底推出，届时会加入一系列全新的 “加成”。」", "pub_date": "2026-09-01T08:55:00+08:00", "time_str": "1天前"}, {"source": "机核", "source_key": "机核_2", "cat": "cn_tech", "color": "#1a1a1a", "title": "剑戟复兴，乐趣平平：小评《鬼武者：剑之道》", "title_zh": "剑戟复兴，乐趣平平：小评《鬼武者：剑之道》", "summary": "对我而言，CAPCOM的《鬼武者》系列，只要能老老实实地把历代作品的高清复刻版逐一推出来，我就已经心满意足了。要知道，距离上一部正统续作《新·鬼武者 梦之曙光》发售，已经过去了整整二十年。这个曾在PS2时代创下辉煌、系列累计销量超过900万份的经典IP，仅仅因为《新·鬼武者》约64万套的销量惨淡，就陷入了被雪藏的境地。作为一位全系列都通关过的老玩家，我太清楚《鬼武者》一直以高难度，还有硬核的“一闪”系统著称，但正是这种“刀尖舔血”的极致博弈，才让它在我心中始终占有一席之地。\n2025年索尼“State of Play”活动上，当卡普空以RE引擎重制的《鬼武者：剑之道》正式亮相时，作为通关全系列的老玩家，我心中其实并不全是激动，反而掺杂着不少疑虑——当年让我们魂牵梦绕的那套“一闪”系统、那套硬核的攻防博弈，放在二十年后，是否还能适应当下玩家早已被各种动作游戏“驯化”过的操作习惯？而那些跟我一样在PS2时代就一路厮杀了过来的老家伙们，又是否还愿意为这部“新鬼武者”买单？\n带着这些疑问，也感谢卡普空的邀请，我于前几日完整体验了《鬼武者：剑之道》的全部内容。", "summary_zh": "对我而言，CAPCOM的《鬼武者》系列，只要能老老实实地把历代作品的高清复刻版逐一推出来，我就已经心满意足了。要知道，距离上一部正统续作《新·鬼武者 梦之曙光》发售，已经过去了整整二十年。这个曾在PS2时代创下辉煌、系列累计销量超过900万份的经典IP，仅仅因为《新·鬼武者》约64万套的销量惨淡，就陷入了被雪藏的境地。作为一位全系列都通关过的老玩家，我太清楚《鬼武者》一直以高难度，还有硬核的“一闪”系统著称，但正是这种“刀尖舔血”的极致博弈，才让它在我心中始终占有一席之地。\n2025年索尼“State of Play”活动上，当卡普空以RE引擎重制的《鬼武者：剑之道》正式亮相时，作为通关全系列的老玩家，我心中其实并不全是激动，反而掺杂着不少疑虑——当年让我们魂牵梦绕的那套“一闪”系统、那套硬核的攻防博弈，放在二十年后，是否还能适应当下玩家早已被各种动作游戏“驯化”过的操作习惯？而那些跟我一样在PS2时代就一路厮杀了过来的老家伙们，又是否还愿意为这部“新鬼武者”买单？\n带着这些疑问，也感谢卡普空的邀请，我于前几日完整体验了《鬼武者：剑之道》的全部内容。", "pub_date": "2026-08-31T23:20:00+08:00", "time_str": "1天前"}]}, {"key": "solidot_3", "name": "Solidot", "cat": "cn_tech", "color": "#0066ff", "items": [{"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "小规模民调显示七成韩国民众支持限制青少年使用社交网络", "title_zh": "小规模民调显示七成韩国民众支持限制青少年使用社交网络", "summary": "周二公布的一项民调显示，七成韩国民众表示支持出台限制青少年使用社媒的政策。这项民意调查访问了 1000 名年龄在 14-58 岁之间的受访者。调查结果显示，70.7% 的受访者支持，29.3% 的受访者反对。占总调查人数五分之一的青少年受访者中，59% 反对，41% 支持。当被问及实施此类限制的合适年龄时，16.8% 选择了 15 岁，14.9% 选择了 18 岁，13.1% 选择了 11 岁及以下。大多数受访者表示，即使出台此类政策，在限制青少年使用社媒方面仍然存在局限性，青少年用户可能会盗用他人账号或转向其它不受限制的平台，因此 59.8% 的受访者认为，平台应采取更多措施营造安全的社媒使用环境。", "summary_zh": "周二公布的一项民调显示，七成韩国民众表示支持出台限制青少年使用社媒的政策。这项民意调查访问了 1000 名年龄在 14-58 岁之间的受访者。调查结果显示，70.7% 的受访者支持，29.3% 的受访者反对。占总调查人数五分之一的青少年受访者中，59% 反对，41% 支持。当被问及实施此类限制的合适年龄时，16.8% 选择了 15 岁，14.9% 选择了 18 岁，13.1% 选择了 11 岁及以下。大多数受访者表示，即使出台此类政策，在限制青少年使用社媒方面仍然存在局限性，青少年用户可能会盗用他人账号或转向其它不受限制的平台，因此 59.8% 的受访者认为，平台应采取更多措施营造安全的社媒使用环境。", "pub_date": "2026-09-01T23:37:06+08:00", "time_str": "14小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "Softaculous 遭遇长达 33 小时的 BGP 路由劫持", "title_zh": "Softaculous 遭遇长达 33 小时的 BGP 路由劫持", "summary": "8 月 28 日 20:57 UTC 左右，一个不相关网络 BGP 路由通告了 Softaculous 使用的 Hetzner IP 段，将部分原本发送到 Softaculous 系统的流量劫持到攻击者控制的服务器。Hetzner 是 Softaculous 的上游基础设施供应商，而 Softaculous 则是一家为 Web 托管服务商提供软件的公司，它的 Virtualizor 控制面板被管理员用于部署和管理 VPS。这次 BGP 路由劫持影响了 Virtualizo 更新服务器以及客户和计费网站。攻击者还从 Let's Encrypt CA 获取了有效的 TLS 证书，Let's Encrypt 的自动域名所有权验证也被劫持到了攻击者控制的 IP。Softaculous 于 8 月 29 日 08:50 UTC 向 Hetzner 报告了事件，Hetzner 随后通过发布相同的路由通告遏制了问题。但攻击者于 20:00 UTC 再次了长达 10 小时的路由劫持。8 月 30 日 05:50-06:10 UTC 路由通告被撤回，劫持停止。", "summary_zh": "8 月 28 日 20:57 UTC 左右，一个不相关网络 BGP 路由通告了 Softaculous 使用的 Hetzner IP 段，将部分原本发送到 Softaculous 系统的流量劫持到攻击者控制的服务器。Hetzner 是 Softaculous 的上游基础设施供应商，而 Softaculous 则是一家为 Web 托管服务商提供软件的公司，它的 Virtualizor 控制面板被管理员用于部署和管理 VPS。这次 BGP 路由劫持影响了 Virtualizo 更新服务器以及客户和计费网站。攻击者还从 Let's Encrypt CA 获取了有效的 TLS 证书，Let's Encrypt 的自动域名所有权验证也被劫持到了攻击者控制的 IP。Softaculous 于 8 月 29 日 08:50 UTC 向 Hetzner 报告了事件，Hetzner 随后通过发布相同的路由通告遏制了问题。但攻击者于 20:00 UTC 再次了长达 10 小时的路由劫持。8 月 30 日 05:50-06:10 UTC 路由通告被撤回，劫持停止。", "pub_date": "2026-09-01T22:35:00+08:00", "time_str": "15小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "科学家定位调控冬眠的关键脑回路", "title_zh": "科学家定位调控冬眠的关键脑回路", "summary": "为弄清动物进入冬眠时大脑的变化，研究人员首先在实验室中诱导叙利亚仓鼠冬眠。两个月里，他们把动物笼舍中开灯的时间缩短，以模拟秋季。然后在接下来的两个月中，将温度降至约4摄氏度，以模拟冬季。 在人造冬季中，动物开始冬眠——体温下降，“在窝里缩成一团”。冬眠持续2到8周，其间仓鼠睡眠状态在微觉醒和深度蛰伏之间循环。团队收集了刚进入深度蛰伏的仓鼠的大脑，并将其与刚从蛰伏中短暂醒来或完全未冬眠的仓鼠的大脑进行比较。结果发现，一种名为Fos的蛋白质高水平表达，表明下丘脑视前区存在活动。该区域参与调节体温、睡眠和其他重要功能。研究人员发现，仓鼠冬眠中活跃的POA神经元特定亚群，似乎与小鼠蛰伏状态中鉴定出的神经元相同。抑制这些神经元会延迟仓鼠重新进入蛰伏，而激活这些神经元则引发仓鼠筑巢行为并使其体温下降。这是体温虽不如自然冬眠时那么低，但也远低于平时，仅13摄氏度。在小鼠中激活这些细胞也能使体温降低，但幅度较小。这组POA细胞可能是进化遗留下来的“关闭键”，使早期温血哺乳动物能够降低维持体温的高能量成本。", "summary_zh": "为弄清动物进入冬眠时大脑的变化，研究人员首先在实验室中诱导叙利亚仓鼠冬眠。两个月里，他们把动物笼舍中开灯的时间缩短，以模拟秋季。然后在接下来的两个月中，将温度降至约4摄氏度，以模拟冬季。 在人造冬季中，动物开始冬眠——体温下降，“在窝里缩成一团”。冬眠持续2到8周，其间仓鼠睡眠状态在微觉醒和深度蛰伏之间循环。团队收集了刚进入深度蛰伏的仓鼠的大脑，并将其与刚从蛰伏中短暂醒来或完全未冬眠的仓鼠的大脑进行比较。结果发现，一种名为Fos的蛋白质高水平表达，表明下丘脑视前区存在活动。该区域参与调节体温、睡眠和其他重要功能。研究人员发现，仓鼠冬眠中活跃的POA神经元特定亚群，似乎与小鼠蛰伏状态中鉴定出的神经元相同。抑制这些神经元会延迟仓鼠重新进入蛰伏，而激活这些神经元则引发仓鼠筑巢行为并使其体温下降。这是体温虽不如自然冬眠时那么低，但也远低于平时，仅13摄氏度。在小鼠中激活这些细胞也能使体温降低，但幅度较小。这组POA细胞可能是进化遗留下来的“关闭键”，使早期温血哺乳动物能够降低维持体温的高能量成本。", "pub_date": "2026-09-01T21:11:19+08:00", "time_str": "16小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "ChatGPT 和 Reddit 被要求遵守欧盟的 DSA", "title_zh": "ChatGPT 和 Reddit 被要求遵守欧盟的 DSA", "summary": "欧盟委员会周一表示，OpenAI 的 ChatGPT 将需要遵守更严格的欧盟法规，否则将面临罚款。聊天机器人 ChatGPT、社媒论坛 Reddit 和游戏平台 Roblox 被欧盟网络安全法规《Digital Services Act（DSA）》归类为“超大型在线平台”。该认定意味着这些服务面临额外的义务，如删除非法内容、保护未成年人的隐私和安全，如果未能遵守规定，将面临最高全球收入 6% 的罚款。欧盟的决定标志着 DSA 的适用范围进一步扩大到生成式 AI 领域。此前 X 的 AI 聊天机器人 Grok 已因违反 DSA 而受到调查。这三大服务在欧盟的月活用户数都已超过 4500 万，达到了 DSA 规定的加强审查门槛。它们需要在 12 月底前履行额外义务。", "summary_zh": "欧盟委员会周一表示，OpenAI 的 ChatGPT 将需要遵守更严格的欧盟法规，否则将面临罚款。聊天机器人 ChatGPT、社媒论坛 Reddit 和游戏平台 Roblox 被欧盟网络安全法规《Digital Services Act（DSA）》归类为“超大型在线平台”。该认定意味着这些服务面临额外的义务，如删除非法内容、保护未成年人的隐私和安全，如果未能遵守规定，将面临最高全球收入 6% 的罚款。欧盟的决定标志着 DSA 的适用范围进一步扩大到生成式 AI 领域。此前 X 的 AI 聊天机器人 Grok 已因违反 DSA 而受到调查。这三大服务在欧盟的月活用户数都已超过 4500 万，达到了 DSA 规定的加强审查门槛。它们需要在 12 月底前履行额外义务。", "pub_date": "2026-09-01T20:51:39+08:00", "time_str": "17小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "太阳风暴导致美国 GPS 信号偏差逾 10 米", "title_zh": "太阳风暴导致美国 GPS 信号偏差逾 10 米", "summary": "2025 年 11 月太阳释放了多个 X 级耀斑，耀斑还伴随着引发地磁风暴的日冕物质抛射。地球上的居民在此期间目睹了绚丽的极光，极光的范围甚至延伸至低纬度地区。对太阳风暴期间收集的数据的分析发现，美国上空的大气层出现了大范围的、横跨东西海岸的扰动，其规模前所未见。它导致部分地区的 GPS 定位偏差超过 10 米。如此大的偏差足以影响精准农业和自动驾驶汽车的运作。GPS 信号穿过电离层时会被扭曲和衍射，导致抵达接收器时的信号强度快速波动，这种现象被称为振幅闪烁（amplitude scintillation）。闪烁并不罕见，通常发生在两极和赤道，中纬度地区被认为相对安全。但去年底的太阳超级风暴改变了这一切。美国大陆西经 80-120 度之间的大片区域出现了强振幅闪烁。如此大范围的强振幅闪烁以前从未看到过。", "summary_zh": "2025 年 11 月太阳释放了多个 X 级耀斑，耀斑还伴随着引发地磁风暴的日冕物质抛射。地球上的居民在此期间目睹了绚丽的极光，极光的范围甚至延伸至低纬度地区。对太阳风暴期间收集的数据的分析发现，美国上空的大气层出现了大范围的、横跨东西海岸的扰动，其规模前所未见。它导致部分地区的 GPS 定位偏差超过 10 米。如此大的偏差足以影响精准农业和自动驾驶汽车的运作。GPS 信号穿过电离层时会被扭曲和衍射，导致抵达接收器时的信号强度快速波动，这种现象被称为振幅闪烁（amplitude scintillation）。闪烁并不罕见，通常发生在两极和赤道，中纬度地区被认为相对安全。但去年底的太阳超级风暴改变了这一切。美国大陆西经 80-120 度之间的大片区域出现了强振幅闪烁。如此大范围的强振幅闪烁以前从未看到过。", "pub_date": "2026-09-01T19:22:57+08:00", "time_str": "18小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "智神星一号成功完成首次演示飞行", "title_zh": "智神星一号成功完成首次演示飞行", "summary": "民营商业航天公司星河动力于 9 月 1 日 10 时在酒泉东风商业航天创新试验区智神星系列专用发射工位成功发射了其中型火箭智神星一号。智神星一号是基于已投入使用的小型火箭谷神星一号，为两级构型，全长 52 米，芯级直径 3.35 米。智神星一号类似 Falcon 9，使用煤油和液氧作为推进剂，也采用类似的方式回收方式，第一次飞行没有尝试回收。火箭能将 5 吨重的有效载荷送入 400 公里高的近地轨道，或将 3 吨的有效载荷送入 700 公里高的太阳同步轨道，其有效载荷小于 Falcon 9。智神星一号设计回收使用次数不少于 25 次。星河动力正在智神星一号基础上研发重型版本，类似 Falcon Heavy，设计能将 17.5 吨重的有效载荷送入近地轨道。", "summary_zh": "民营商业航天公司星河动力于 9 月 1 日 10 时在酒泉东风商业航天创新试验区智神星系列专用发射工位成功发射了其中型火箭智神星一号。智神星一号是基于已投入使用的小型火箭谷神星一号，为两级构型，全长 52 米，芯级直径 3.35 米。智神星一号类似 Falcon 9，使用煤油和液氧作为推进剂，也采用类似的方式回收方式，第一次飞行没有尝试回收。火箭能将 5 吨重的有效载荷送入 400 公里高的近地轨道，或将 3 吨的有效载荷送入 700 公里高的太阳同步轨道，其有效载荷小于 Falcon 9。智神星一号设计回收使用次数不少于 25 次。星河动力正在智神星一号基础上研发重型版本，类似 Falcon Heavy，设计能将 17.5 吨重的有效载荷送入近地轨道。", "pub_date": "2026-09-01T17:59:58+08:00", "time_str": "20小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "中国光伏装机容量首次超过煤电", "title_zh": "中国光伏装机容量首次超过煤电", "summary": "中国国家能源局星期二公布的最新数据显示，截至今年 7 月底，全国光伏发电装机容量达到 12.86 亿千瓦，略高于 12.85 亿千瓦的煤电装机容量。目前光伏占全国发电总装机容量的31.5%。今年前七个月，全国光伏发电量超过 8024 亿千瓦时，同比增长 15.5%，相当于全国每八度电中约有一度来自光伏。能源局预计，未来五年中国光伏产业投资将超过 2 万亿元人民币。", "summary_zh": "中国国家能源局星期二公布的最新数据显示，截至今年 7 月底，全国光伏发电装机容量达到 12.86 亿千瓦，略高于 12.85 亿千瓦的煤电装机容量。目前光伏占全国发电总装机容量的31.5%。今年前七个月，全国光伏发电量超过 8024 亿千瓦时，同比增长 15.5%，相当于全国每八度电中约有一度来自光伏。能源局预计，未来五年中国光伏产业投资将超过 2 万亿元人民币。", "pub_date": "2026-09-01T15:57:05+08:00", "time_str": "22小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "Paint.NET 实验性支持 Wine/Linux", "title_zh": "Paint.NET 实验性支持 Wine/Linux", "summary": "Windows 上的流行图像编辑软件 Paint.NET 释出了 v5.2 Alpha (build 9739)，实验性的加入了对 Wine/Linux 的支持。想要尝试的 Linux 用户需要：1）使用便捷式版本，安装程序无法工作；WINE 版本至少为 v11.14；添加一个注册表项 wine reg add \"HKCU\\Software\\Wine\\DllOverrides\" /v d3dcompiler_47 /d native /f，防止 Wine 用自身版本覆盖 DLL；已安装 DXVK； 用 /wine 命令行参数运行。", "summary_zh": "Windows 上的流行图像编辑软件 Paint.NET 释出了 v5.2 Alpha (build 9739)，实验性的加入了对 Wine/Linux 的支持。想要尝试的 Linux 用户需要：1）使用便捷式版本，安装程序无法工作；WINE 版本至少为 v11.14；添加一个注册表项 wine reg add \"HKCU\\Software\\Wine\\DllOverrides\" /v d3dcompiler_47 /d native /f，防止 Wine 用自身版本覆盖 DLL；已安装 DXVK； 用 /wine 命令行参数运行。", "pub_date": "2026-09-01T15:30:30+08:00", "time_str": "22小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "带电雨滴会腐蚀汽车", "title_zh": "带电雨滴会腐蚀汽车", "summary": "德国科学家研究显示，作为一种自然发生的现象，带电雨滴能分解经过保护性涂层处理的表面。这一此前被忽视的腐蚀机制有助于寻找新方法保护如汽车、船舶、建筑和文化遗址等金属物体。腐蚀是户外金属制品和结构面临的一个经济和安全问题。之前认为，雨水造成的腐蚀主要是因为雨滴具有物理腐蚀性或带有来自污染物的酸性。虽然既往研究已证明水滴在滑过植物叶子和窗玻璃这类常见表面时会带电，但这种电荷对金属表面的腐蚀作用却被忽视了。马普学会高分子研究所的研究人员分析了电中性水滴如何带电并腐蚀不同材料。他们将水滴到四种常见表面——植物叶子、PVC（聚氯乙烯）泡沫板、聚苯乙烯玻璃，和常用疏水涂层PFOTS（全氟辛基三乙氧基硅烷）。这些水滴随后会滑到有聚四氟乙烯涂层的铜上。研究者发现，水滴带上了很微弱的电荷（0.2-2纳库仑）。在3000个水滴从这些表面滴到有聚四氟乙烯涂层的铜上后，观察发现这一涂层会分解，导致底下的金属被腐蚀。如果水滴不带电，就不会观察到表面损伤。", "summary_zh": "德国科学家研究显示，作为一种自然发生的现象，带电雨滴能分解经过保护性涂层处理的表面。这一此前被忽视的腐蚀机制有助于寻找新方法保护如汽车、船舶、建筑和文化遗址等金属物体。腐蚀是户外金属制品和结构面临的一个经济和安全问题。之前认为，雨水造成的腐蚀主要是因为雨滴具有物理腐蚀性或带有来自污染物的酸性。虽然既往研究已证明水滴在滑过植物叶子和窗玻璃这类常见表面时会带电，但这种电荷对金属表面的腐蚀作用却被忽视了。马普学会高分子研究所的研究人员分析了电中性水滴如何带电并腐蚀不同材料。他们将水滴到四种常见表面——植物叶子、PVC（聚氯乙烯）泡沫板、聚苯乙烯玻璃，和常用疏水涂层PFOTS（全氟辛基三乙氧基硅烷）。这些水滴随后会滑到有聚四氟乙烯涂层的铜上。研究者发现，水滴带上了很微弱的电荷（0.2-2纳库仑）。在3000个水滴从这些表面滴到有聚四氟乙烯涂层的铜上后，观察发现这一涂层会分解，导致底下的金属被腐蚀。如果水滴不带电，就不会观察到表面损伤。", "pub_date": "2026-09-01T15:06:44+08:00", "time_str": "22小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "拒绝改名的 MapQuest 成为美国 App Store 下载量最高的地图导航应用", "title_zh": "拒绝改名的 MapQuest 成为美国 App Store 下载量最高的地图导航应用", "summary": "在 Google Maps 以极快的速度屈服特朗普的行政令，将安大略湖（Lake Ontario）更名为美国湖（Lake America）之后，公开宣布拒绝改名的美国地图导航服务 MapQuest 立即赢得了公众的支持，其移动应用下载量飙升，排在苹果美国 App Store 非游戏类榜单第四，总排名第八，成为美国排名第一的地图导航应用。MapQuest 也成为苹果加拿大 App Store 下载量总排名第二的应用。该公司表示，自决定保留安大略湖名称以来，其应用的下载量增加了数十万次，使用量更是飙升至正常水平的 50 倍。Sensor Tower 的第三方数据也显示，8 月 24 日开始的一周内 MapQuest 全球和美国应用总下载量分别为 18.4 万次和 16.2 万次，均较前一周增长逾 10 倍。在美国 8 月 26-30 日间 MapQuest 应用的日下载量环比增长了 128%。", "summary_zh": "在 Google Maps 以极快的速度屈服特朗普的行政令，将安大略湖（Lake Ontario）更名为美国湖（Lake America）之后，公开宣布拒绝改名的美国地图导航服务 MapQuest 立即赢得了公众的支持，其移动应用下载量飙升，排在苹果美国 App Store 非游戏类榜单第四，总排名第八，成为美国排名第一的地图导航应用。MapQuest 也成为苹果加拿大 App Store 下载量总排名第二的应用。该公司表示，自决定保留安大略湖名称以来，其应用的下载量增加了数十万次，使用量更是飙升至正常水平的 50 倍。Sensor Tower 的第三方数据也显示，8 月 24 日开始的一周内 MapQuest 全球和美国应用总下载量分别为 18.4 万次和 16.2 万次，均较前一周增长逾 10 倍。在美国 8 月 26-30 日间 MapQuest 应用的日下载量环比增长了 128%。", "pub_date": "2026-09-01T15:02:20+08:00", "time_str": "23小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "Google 从其扩展商店移除了包括 uBlock Origin 在内的所有 Manifest V2 扩展", "title_zh": "Google 从其扩展商店移除了包括 uBlock Origin 在内的所有 Manifest V2 扩展", "summary": "Google 从其扩展商店 Chrome Web Store 移除了包括 uBlock Origin 在内的所有 Manifest V2 扩展。Chrome 用户已安装的 Manifest V2 扩展目前还能使用，但不会再收到任何更新，卸载之后将无法再重新安装。Chrome Web Store 将只提供 Manifest v3 扩展，Manifest v3 相比 Manifest v2 的一大区别是移除了 blockingWebRequest 和 declarativeNetRequest，限制了广告屏蔽扩展的功能，uBlock Origin 是基于 Manifest V2，它没有 Manifest V3 版本，但有一个基于 V3 的精简版本。用户如果想要继续使用 uBlock Origin 只能改用 Firefox 以及另一款基于 Chromium 的浏览器 Brave。", "summary_zh": "Google 从其扩展商店 Chrome Web Store 移除了包括 uBlock Origin 在内的所有 Manifest V2 扩展。Chrome 用户已安装的 Manifest V2 扩展目前还能使用，但不会再收到任何更新，卸载之后将无法再重新安装。Chrome Web Store 将只提供 Manifest v3 扩展，Manifest v3 相比 Manifest v2 的一大区别是移除了 blockingWebRequest 和 declarativeNetRequest，限制了广告屏蔽扩展的功能，uBlock Origin 是基于 Manifest V2，它没有 Manifest V3 版本，但有一个基于 V3 的精简版本。用户如果想要继续使用 uBlock Origin 只能改用 Firefox 以及另一款基于 Chromium 的浏览器 Brave。", "pub_date": "2026-09-01T14:38:41+08:00", "time_str": "23小时前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "OpenShot 4.0 释出", "title_zh": "OpenShot 4.0 释出", "summary": "自由软件视频编辑器项目 OpenShot 释出了 v4.0 版本。主要新特性包括：新色彩视图；新录制视图：将麦克风、屏幕、Web 摄像头和系统音频直接添加到项目中，每个音源保持独立且可编辑；10 种新特效；使用本地大模型选择和跟踪对象；更简洁的原生时间线；更快的特效和编辑速度；智能的创意工作流程；扩展 Qt 6 支持，改进了与较新 Linux 发行版的兼容性，为 Android 和其它平台奠定了基础。", "summary_zh": "自由软件视频编辑器项目 OpenShot 释出了 v4.0 版本。主要新特性包括：新色彩视图；新录制视图：将麦克风、屏幕、Web 摄像头和系统音频直接添加到项目中，每个音源保持独立且可编辑；10 种新特效；使用本地大模型选择和跟踪对象；更简洁的原生时间线；更快的特效和编辑速度；智能的创意工作流程；扩展 Qt 6 支持，改进了与较新 Linux 发行版的兼容性，为 Android 和其它平台奠定了基础。", "pub_date": "2026-09-01T00:54:12+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "加州议会通过年龄验证法案，Linux BSD 豁免", "title_zh": "加州议会通过年龄验证法案，Linux BSD 豁免", "summary": "加州参议院和众议院批准了年龄验证法案 Assembly Bill 1856。在递交给州长批准之后法案预计于 2027 年 1 月 1 日生效。法案豁免了 Linux 和 BSD 等开源操作系统。法案要求，如果操作系统有账户设置功能，那么系统提供商须提供一个界面，在账户设置期间要求输入设备主用户的出生日期、年龄或两者兼有。操作系统通过相对一致的实时 API 向受监管的应用商店和应用开发商提供数字年龄信号。该信号不显示精确的出生日期，而是四个年龄段之一：13 岁以下、13-15 岁、16-17 岁或 18 岁及以上。对 2027 年 1 月 1 日之前的设备，操作系统提供商必须在 2027 年 7 月 1 日之前提供界面让账户持有人提供所需的年龄信息。", "summary_zh": "加州参议院和众议院批准了年龄验证法案 Assembly Bill 1856。在递交给州长批准之后法案预计于 2027 年 1 月 1 日生效。法案豁免了 Linux 和 BSD 等开源操作系统。法案要求，如果操作系统有账户设置功能，那么系统提供商须提供一个界面，在账户设置期间要求输入设备主用户的出生日期、年龄或两者兼有。操作系统通过相对一致的实时 API 向受监管的应用商店和应用开发商提供数字年龄信号。该信号不显示精确的出生日期，而是四个年龄段之一：13 岁以下、13-15 岁、16-17 岁或 18 岁及以上。对 2027 年 1 月 1 日之前的设备，操作系统提供商必须在 2027 年 7 月 1 日之前提供界面让账户持有人提供所需的年龄信息。", "pub_date": "2026-08-31T23:47:25+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "Linux 7.3-rc1 释出", "title_zh": "Linux 7.3-rc1 释出", "summary": "Linus Torvalds 宣布释出 Linux 7.3-rc1，关闭了 7.3 的合并窗口，正式版预计将在十月底释出。Linux 7.3 的主要特性包括：Ryzen AI Halo LED/RGB 驱动、继续即将推出的 AMD Zen 6 的支持工作、KSMBD 兼容 Apple Time Machine 备份、内核驱动初步支持 2026 年款 Steam Controller、合并 FailFS、Intel Xe3P Nova Lake 集显支持稳定、改进了显存容量有限的系统的游戏性能、改进 SMP 降低延迟提升实时性能、等等。", "summary_zh": "Linus Torvalds 宣布释出 Linux 7.3-rc1，关闭了 7.3 的合并窗口，正式版预计将在十月底释出。Linux 7.3 的主要特性包括：Ryzen AI Halo LED/RGB 驱动、继续即将推出的 AMD Zen 6 的支持工作、KSMBD 兼容 Apple Time Machine 备份、内核驱动初步支持 2026 年款 Steam Controller、合并 FailFS、Intel Xe3P Nova Lake 集显支持稳定、改进了显存容量有限的系统的游戏性能、改进 SMP 降低延迟提升实时性能、等等。", "pub_date": "2026-08-31T23:07:53+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "Steam 平台 2003-2013 年的几乎所有游戏泄露", "title_zh": "Steam 平台 2003-2013 年的几乎所有游戏泄露", "summary": "上周末 Steam 平台逾 12TB 数据泄露，涵盖了该平台 2003-2013 年之间几乎所有的游戏。这些数据是通过一个公开访问的 API 获取的，但不清楚是近期访问还是早就下载但直到上周才公开。相关数据来自被称为 Steam2 的内容分发系统，2013 年 Steam2 被 SteamPipe 系统所取代，因此数据仅限于 2013 年前。泄露的数据包括了Valve 和第三方发行商发布的热门游戏的早期版本、原型版本和试玩版本，其中包括《传送门2》的被删减内容，被取消的《半条命2：第三章》的部分文件。", "summary_zh": "上周末 Steam 平台逾 12TB 数据泄露，涵盖了该平台 2003-2013 年之间几乎所有的游戏。这些数据是通过一个公开访问的 API 获取的，但不清楚是近期访问还是早就下载但直到上周才公开。相关数据来自被称为 Steam2 的内容分发系统，2013 年 Steam2 被 SteamPipe 系统所取代，因此数据仅限于 2013 年前。泄露的数据包括了Valve 和第三方发行商发布的热门游戏的早期版本、原型版本和试玩版本，其中包括《传送门2》的被删减内容，被取消的《半条命2：第三章》的部分文件。", "pub_date": "2026-08-31T22:19:30+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "Google 改变了其搜索结果的展示方式", "title_zh": "Google 改变了其搜索结果的展示方式", "summary": "Google 过去一年对其搜索结果的展示方式进行了两次重大改变。其一是搜索结果链接，以前你将鼠标悬停在搜索结果上会在浏览器底部看到网站链接，现在显示的是 google.com/goto + 一串看起来随机的字符串。搜索结果中的 AI Overview 引用的链接也是采用此类展示方式。其二是用户以前可以在搜索词末尾添加 &num=100，可以在一个页面上显示前 100 个搜索结果，如今这一快捷方式被取消了，Google 强制只展示最多 10 个搜索结果，意味着你想要看前 100 个结果需要点击 10 次。", "summary_zh": "Google 过去一年对其搜索结果的展示方式进行了两次重大改变。其一是搜索结果链接，以前你将鼠标悬停在搜索结果上会在浏览器底部看到网站链接，现在显示的是 google.com/goto + 一串看起来随机的字符串。搜索结果中的 AI Overview 引用的链接也是采用此类展示方式。其二是用户以前可以在搜索词末尾添加 &num=100，可以在一个页面上显示前 100 个搜索结果，如今这一快捷方式被取消了，Google 强制只展示最多 10 个搜索结果，意味着你想要看前 100 个结果需要点击 10 次。", "pub_date": "2026-08-31T19:35:03+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "植物如何应对高温", "title_zh": "植物如何应对高温", "summary": "科学家早就知道，植物叶片表面分布着许多微小的气孔。当温度升高时，这些微小的孔隙会“张嘴”，让水分蒸发，从而带走热量，就像人出汗能降温一样，但气孔这一植物“散热器”背后的分子调控机制，一直是个未解之谜。该通路的核心是一种名为“泛素特异性蛋白酶24”（UBP24）的蛋白质。他们发现，当高温来袭，植物体内的激酶会“唤醒”UBP24，导致其分子电荷发生变化，使其变得更加稳定。在更稳定的状态下，UBP24 有助于“保护”并激活其他参与维持气孔开口的蛋白质，使植物的蒸发冷却系统在热应激时保持活跃。通俗来说，UBP24 就像“空调”上灵敏的温控开关。类似的故事并非只在植物身上上演。科学家还发现，啤酒酵母中的一种相关蛋白质也依靠相似原理应对热应激。酵母与植物分属不同物种，生活方式大相径庭，且两者之间存在数亿年的进化差距，却在细胞层面使用了相似的“散热逻辑”。", "summary_zh": "科学家早就知道，植物叶片表面分布着许多微小的气孔。当温度升高时，这些微小的孔隙会“张嘴”，让水分蒸发，从而带走热量，就像人出汗能降温一样，但气孔这一植物“散热器”背后的分子调控机制，一直是个未解之谜。该通路的核心是一种名为“泛素特异性蛋白酶24”（UBP24）的蛋白质。他们发现，当高温来袭，植物体内的激酶会“唤醒”UBP24，导致其分子电荷发生变化，使其变得更加稳定。在更稳定的状态下，UBP24 有助于“保护”并激活其他参与维持气孔开口的蛋白质，使植物的蒸发冷却系统在热应激时保持活跃。通俗来说，UBP24 就像“空调”上灵敏的温控开关。类似的故事并非只在植物身上上演。科学家还发现，啤酒酵母中的一种相关蛋白质也依靠相似原理应对热应激。酵母与植物分属不同物种，生活方式大相径庭，且两者之间存在数亿年的进化差距，却在细胞层面使用了相似的“散热逻辑”。", "pub_date": "2026-08-31T17:08:40+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "人类何时开始不爱吃昆虫？", "title_zh": "人类何时开始不爱吃昆虫？", "summary": "研究人员借助基因组证据，还原了数千年来人类食用昆虫的模式。研究表明，在欧洲、中亚与东亚地区，吃昆虫可能只是偶然行为；而在热带地区以及尼安德特人中，食虫则更为普遍。研究人员检测了 745 份来自现代人的牙结石样本，其年代最早可追溯至 3.3 万年前。牙结石能保存食物的 DNA，为研究人员提供了远古饮食的记录。研究结果显示，生活在欧亚大陆北部的现代人并不会经常食用昆虫。研究团队还检测了与分解几丁质相关的基因，几丁质是昆虫外骨骼的主要成分。在欧亚大陆北部人群中，几丁质酶基因发生了突变，导致人体消化昆虫外骨骼的能力下降。这种基因模式已延续了约 9000 年，可追溯至农业兴起之时。尼安德特人的情况则截然不同，他们的牙结石中所含的昆虫 DNA 要多得多。尼安德特人牙结石中最常见的基因痕迹来自双翅目昆虫，包含苍蝇和蚊子，其中蚊子的 DNA 含量尤其丰富。该结果佐证了近期的一个假说——尼安德特人可能经常食用带有蝇蛆的动物尸体。而蚊子遗骸的大量存在也支持了另一种观点——猎物的尸体有时可能被存放在池塘或沼泽环境中，而蚊子会在这些地方产卵。", "summary_zh": "研究人员借助基因组证据，还原了数千年来人类食用昆虫的模式。研究表明，在欧洲、中亚与东亚地区，吃昆虫可能只是偶然行为；而在热带地区以及尼安德特人中，食虫则更为普遍。研究人员检测了 745 份来自现代人的牙结石样本，其年代最早可追溯至 3.3 万年前。牙结石能保存食物的 DNA，为研究人员提供了远古饮食的记录。研究结果显示，生活在欧亚大陆北部的现代人并不会经常食用昆虫。研究团队还检测了与分解几丁质相关的基因，几丁质是昆虫外骨骼的主要成分。在欧亚大陆北部人群中，几丁质酶基因发生了突变，导致人体消化昆虫外骨骼的能力下降。这种基因模式已延续了约 9000 年，可追溯至农业兴起之时。尼安德特人的情况则截然不同，他们的牙结石中所含的昆虫 DNA 要多得多。尼安德特人牙结石中最常见的基因痕迹来自双翅目昆虫，包含苍蝇和蚊子，其中蚊子的 DNA 含量尤其丰富。该结果佐证了近期的一个假说——尼安德特人可能经常食用带有蝇蛆的动物尸体。而蚊子遗骸的大量存在也支持了另一种观点——猎物的尸体有时可能被存放在池塘或沼泽环境中，而蚊子会在这些地方产卵。", "pub_date": "2026-08-31T16:13:37+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "天文学家可能发现首个没有恒星的星系", "title_zh": "天文学家可能发现首个没有恒星的星系", "summary": "被称为 Cloud 9 的星系可能是人类发现的第一个没有恒星的“失败”星系。此类星系虽然有大量气体和尘埃，却几乎没有恒星存在。Cloud 9 距离地球 1400 万光年，靠近旋涡星系 M94，它包含一团巨大的氢气云，估计质量是太阳的 100 万倍，以及质量约为太阳 500 万倍的暗物质。它几乎不发出任何星光。无恒星星系形成的主流解释与紫外背景辐射相关，在宇宙早期的再电离时代后，紫外辐射场将低质量暗物质晕中的气体加热到足够高的温度，使得气体无法有效冷却并坍缩形成恒星。", "summary_zh": "被称为 Cloud 9 的星系可能是人类发现的第一个没有恒星的“失败”星系。此类星系虽然有大量气体和尘埃，却几乎没有恒星存在。Cloud 9 距离地球 1400 万光年，靠近旋涡星系 M94，它包含一团巨大的氢气云，估计质量是太阳的 100 万倍，以及质量约为太阳 500 万倍的暗物质。它几乎不发出任何星光。无恒星星系形成的主流解释与紫外背景辐射相关，在宇宙早期的再电离时代后，紫外辐射场将低质量暗物质晕中的气体加热到足够高的温度，使得气体无法有效冷却并坍缩形成恒星。", "pub_date": "2026-08-31T15:53:29+08:00", "time_str": "1天前"}, {"source": "Solidot", "source_key": "solidot_3", "cat": "cn_tech", "color": "#0066ff", "title": "韩国准备向所有民众提供免费 AI 服务", "title_zh": "韩国准备向所有民众提供免费 AI 服务", "summary": "韩国准备向所有民众提供免费 AI 服务 AI for All。该服务计划从下月起进行 beta 测试，计划今年晚些时候推出。服务由韩国两家最大的电信公司以及 Kakao 牵头的三个联盟提供，政府提供部分算力，包括提供最多 512 块英伟达 B200 芯片和支付部分运营费用。AI 服务预计将与政府系统连接，而不只是作为独立的聊天机器人运行。居民将能使用这些服务预约医生、搜索公寓和获取税务指导。小型企业将能计算税款和查询是否符合政府补贴资格。家长将收到教育内容的推荐。每个联盟都计划推出自己的 AI 应用，在现有产品中加入生成式 AI 功能。在政府支持的计划下，用户可以无限次访问，没有 token 限制。", "summary_zh": "韩国准备向所有民众提供免费 AI 服务 AI for All。该服务计划从下月起进行 beta 测试，计划今年晚些时候推出。服务由韩国两家最大的电信公司以及 Kakao 牵头的三个联盟提供，政府提供部分算力，包括提供最多 512 块英伟达 B200 芯片和支付部分运营费用。AI 服务预计将与政府系统连接，而不只是作为独立的聊天机器人运行。居民将能使用这些服务预约医生、搜索公寓和获取税务指导。小型企业将能计算税款和查询是否符合政府补贴资格。家长将收到教育内容的推荐。每个联盟都计划推出 于原油。当印度民众购买更多黄金时，就意味着更多外汇流出印度。", "summary_zh": "印度总理莫迪再次呼吁印度民众，除非确有必要，否则不要购买黄金，并推迟非必要的海外旅行，包括海外举办婚礼。莫迪周二在社交媒体上表示，尽管全球战争、经济不确定性以及供应链中断持续存在，印度经济仍在快速发展，但他强调，印度民众仍需要通过选择“印度制造”产品、减少不必要的外汇流出，为增强印度经济实力作出贡献。莫迪强调......本文来自微信公众号： 财联社 ，作者：牛占林印度总理莫迪再次呼吁印度民众，除非确有必要，否则不要购买黄金，并推迟非必要的海外旅行，包括海外举办婚礼。莫迪周二在社交媒体上表示，尽管全球战争、经济不确定性以及供应链中断持续存在，印度经济仍在快速发展，但他强调，印度民众仍需要通过选择“印度制造”产品、减少不必要的外汇流出，为增强印度经济实力作出贡献。莫迪强调：“如果出国是为了休闲旅游，就不要去了。如果要去海外结婚，也不要这么做。如果没有必要，也不要购买黄金。”之所以发出上述呼吁，莫迪最直接的考量是希望减少不必要的外汇流出。印度的黄金需求几乎完全依赖海外供应，因此黄金一直是印度进口额最大的商品之一，仅次于原油。当印度民众购买更多黄金时，就意味着更多外汇流出印度。", "pub_date": "2026-09-02T02:28:21+00:00", "time_str": "3小时前"}, {"source": "虎嗅", "source_key": "虎嗅_11", "cat": "cn_tech", "color": "#3a85ff", "title": "名创优品，两大引擎同时降速", "title_zh": "名创优品，两大引擎同时降速", "summary": "从表象上看，名创优品依然维持着消费寒冬里难得的扩张高势能，但资本市场给出的却是截然相反的冷遇。因为增长表象下，增收不增利概括了名创优品当下的处境。我们的核心观点如下：1.名创优品的营收增长有真实的基本面支撑，海外扩张和TOP TOY是两大引擎，但海外直营的高成本正在吞噬利润。2.IP战略是一把双刃剑，授权IP......本文来自微信公众号： 财报纪 ，作者：专注财报分析的从表象上看，名创优品依然维持着消费寒冬里难得的扩张高势能，但资本市场给出的却是截然相反的冷遇。因为增长表象下，增收不增利概括了名创优品当下的处境。我们的核心观点如下：1.名创优品的营收增长有真实的基本面支撑，海外扩张和TOP TOY是两大引擎，但海外直营的高成本正在吞噬利润。2.IP战略是一把双刃剑，授权IP贡献了流水，但授权费用和营销费用正在疯狂蚕食利润空间。3.自有IP YOYO是名创优品从“搬运工”转向“原创者”的关键棋子，但目前仍是需要母公司持续输血的成本中心。4.回看名创优品过去两年的动作，管理层显然想通过追逐消费热点来对冲周期波动，但是现在来看，追的过快反而不是一件好事。", "summary_zh": "从表象上看，名创优品依然维持着消费寒冬里难得的扩张高势能，但资本市场给出的却是截然相反的冷遇。因为增长表象下，增收不增利概括了名创优品当下的处境。我们的核心观点如下：1.名创优品的营收增长有真实的基本面支撑，海外扩张和TOP TOY是两大引擎，但海外直营的高成本正在吞噬利润。2.IP战略是一把双刃剑，授权IP......本文来自微信公众号： 财报纪 ，作者：专注财报分析的从表象上看，名创优品依然维持着消费寒冬里难得的扩张高势能，但资本市场给出的却是截然相反的冷遇。因为增长表象下，增收不增利概括了名创优品当下的处境。我们的核心观点如下：1.名创优品的营收增长有真实的基本面支撑，海外扩张和TOP TOY是两大引擎，但海外直营的高成本正在吞噬利润。2.IP战略是一把双刃剑，授权IP贡献了流水，但授权费用和营销费用正在疯狂蚕食利润空间。3.自有IP YOYO是名创优品从“搬运工”转向“原创者”的关键棋子，但目前仍是需要母公司持续输血的成本中心。4.回看名创优品过去两年的动作，管理层显然想通过追逐消费热点来对冲周期波动，但是现在来看，追的过快反而不是一件好事。", "pub_date": "2026-09-02T02:24:32+00:00", "time_str": "3小时前"}, {"source": "虎嗅", "source_key": "虎嗅_11", "cat": "cn_tech", "color": "#3a85ff", "title": "皮鞋卖不动了，中国男人都在买什么鞋？", "title_zh": "皮鞋卖不动了，中国男人都在买什么鞋？", "summary": "近日，男鞋巨头奥康国际发布2026财年半年报引发关注。其营收同比下滑近三成，且扣除非经常性损益后 供强劲、充满整个房间的声音，具有深沉的低音、DJ 连接和卡拉 OK 功能，内置轮子，方便移动到派对的任何地方；ULT TOWER 5 将震撼的低音、DJ 输入和卡拉 OK 功能集成到紧凑便携的设计中，适合小型聚会和轻松的移动使用。", "pub_date": "2026-09-02T05:35:16+00:00", "time_str": "27分钟前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "为小米迄今最高端手机 18 Fold 铺路，小米汽车 App 已适配阔形屏幕比例", "title_zh": "为小米迄今最高端手机 18 Fold 铺路，小米汽车 App 已适配阔形屏幕比例", "summary": "IT之家 9 月 2 日消息，小米秋季旗舰新品发布会已官宣定档 9 月 7 日（下周一）晚 7 点，届时将带来小米 18 Fold 全新折叠屏旗舰手机。今日午间，小米创办人、董事长兼 CEO 雷军发布视频，晒出了小米 18 Fold 真机。雷军表示，这（小米 18 Fold）是小米迄今为止最高端的手机，首发玄戒 O3 AI 旗舰处理器。据IT之家小伙伴 @开坦克的贝塔 反馈，小米汽车 App 已经适配了阔形屏幕比例。从他的机型小尾巴及分享屏幕截图内容来看，他使用的是华为 Pura X Max 典藏版横向阔折叠手机。@开坦克的贝塔 分享，在小米汽车 App 没适配阔形屏幕比例前，应用内车的模型无法完整显示。目前，小米已向全渠道头部经销商明确：小米 18 Fold 全版本售价均将超万元，起售版本定价在 12,000 元左右。如果爆料属实，小米 18 Fold 将成为小米首款起价破万元的手机。此外，小米 18 Fold 将全球首发长鑫 LPDDR6 内存。", "summary_zh": "IT之家 9 月 2 日消息，小米秋季旗舰新品发布会已官宣定档 9 月 7 日（下周一）晚 7 点，届时将带来小米 18 Fold 全新折叠屏旗舰手机。今日午间，小米创办人、董事长兼 CEO 雷军发布视频，晒出了小米 18 Fold 真机。雷军表示，这（小米 18 Fold）是小米迄今为止最高端的手机，首发玄戒 O3 AI 旗舰处理器。据IT之家小伙伴 @开坦克的贝塔 反馈，小米汽车 App 已经适配了阔形屏幕比例。从他的机型小尾巴及分享屏幕截图内容来看，他使用的是华为 Pura X Max 典藏版横向阔折叠手机。@开坦克的贝塔 分享，在小米汽车 App 没适配阔形屏幕比例前，应用内车的模型无法完整显示。目前，小米已向全渠道头部经销商明确：小米 18 Fold 全版本售价均将超万元，起售版本定价在 12,000 元左右。如果爆料属实，小米 18 Fold 将成为小米首款起价破万元的手机。此外，小米 18 Fold 将全球首发长鑫 LPDDR6 内存。", "pub_date": "2026-09-02T05:34:12+00:00", "time_str": "28分钟前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "目标 2030 年投运：蓝色起源拿下 NASA 约 7 亿美元大单，开发火星通信网络", "title_zh": "目标 2030 年投运：蓝色起源拿下 NASA 约 7 亿美元大单，开发火星通信网络", "summary": "IT之家 9 月 2 日消息，美国宇航局昨日（9 月 1 日）发布博文，宣布已向蓝色起源（Blue Origin）授予一份固定价格合同（firm-fixed-price），由后者开发火星通信网络。固定价格合同（Firm-Fixed-Price，FFP）是政府采购与商业合同中“风险主要在承包商一侧”的典型合同类型：价格在签约时即确定，除非发生合同约定的变更（如范围变更、不可抗力条款触发等），否则不因承包商实际成本高低而调整。该合同最高潜在价值约 7 亿美元（IT之家注：现汇率约合 47.16 亿元人民币），蓝色起源将负责火星通信网络（MTN）的设计、开发、集成、发射和运营，目标在 2028 年 12 月 31 日前交付 1 艘高性能火星通信轨道器，并预估 2030 年在火星投入运行。根据建设规划，这艘轨道器将绕火星运行，充当火星任务与地球之间的数据中继节点，为火星表面及周边航天器转发科学数据、图像、导航信息和关键任务通信。美国宇航局表示该系统将提供可靠、高带宽的通信与导航服务。随着火星机器人任务数量增加，任务产生和 NAND 闪存二厂建设，计划将当地整体产能提高约 50%。据 Trendforce 今日报道，该公司五年前收购英特尔 NAND 业务时，中国国家市场监督管理总局附加的限制性条件将于 2026 年 12 月到期。产能扩张与监管松绑两股力量交汇，SK 海力士在华 NAND 及企业级 SSD（eSSD）业务正迎来关键转折点。2021 年 12 月，国家市场监督管理总局以附加限制性条件批准 SK 海力士收购英特尔 NAND 及 SSD 业务，其核心条件包括：不得以不合理的价格向中国境内市场供应 PCIe 企业级固态硬盘产品和 SATA 企业级固态硬盘产品。向中国境内市场销售的 PCIe 企业级固态硬盘产品和 SATA 企业级固态硬盘产品的价格，在交易条款相当的情况下，不得高于其在生效日前 24 个月内的平均价格。在生效日起 5 年内持续扩大 PCIe 企业级固态硬盘产品和 SATA 企业级固态硬盘产品的产量。依据公平、合理、无歧视原则向中国境内市场继续供应所有产品。", "summary_zh": "IT之家 9 月 2 日消息，韩媒《首尔经济日报》8 月 11 日报道称，SK 海力士在从英特尔手中接过后，时隔多年重启大连 NAND 闪存二厂建设，计划将当地整体产能提高约 50%。据 Trendforce 今日报道，该公司五年前收购英特尔 NAND 业务时，中国国家市场监督管理总局附加的限制性条件将于 2026 年 12 月到期。产能扩张与监管松绑两股力量交汇，SK 海力士在华 NAND 及企业级 SSD（eSSD）业务正迎来关键转折点。2021 年 12 月，国家市场监督管理总局以附加限制性条件批准 SK 海力士收购英特尔 NAND 及 SSD 业务，其核心条件包括：不得以不合理的价格向中国境内市场供应 PCIe 企业级固态硬盘产品和 SATA 企业级固态硬盘产品。向中国境内市场销售的 PCIe 企业级固态硬盘产品和 SATA 企业级固态硬盘产品的价格，在交易条款相当的情况下，不得高于其在生效日前 24 个月内的平均价格。在生效日起 5 年内持续扩大 PCIe 企业级固态硬盘产品和 SATA 企业级固态硬盘产品的产量。依据公平、合理、无歧视原则向中国境内市场继续供应所有产品。", "pub_date": "2026-09-02T05:13:43+00:00", "time_str": "48分钟前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "国产第二代高温超导带材用铁基合金基带材料研制成功，打破进口依赖、成本仅四分之一", "title_zh": "国产第二代高温超导带材用铁基合金基带材料研制成功，打破进口依赖、成本仅四分之一", "summary": "IT之家 9 月 2 日消息，中国科学院理化技术研究所今日宣布，经过三年多攻关，成功研制出第二代高温超导带材用铁基合金基带。近期，上海超导科技股份有限公司采用该基带完成了带材制备验证，成功制备出高性能二代高温超导带材。第二代高温超导带材因其具有更高的临界温度、更高的临界电流密度以及更优的在场载流性能，在可控核聚变、超导电力、超导加速器等强磁强电领域具备广阔应用前景。其多层结构中，位于最底部的金属基带层作为整条带材的“骨架”，担负力学承载的核心功能，使带材能够承受绕制、弯曲和冷热循环等加工与服役应力。当前，超导带材用基带几乎全部采用哈氏合金（C276），我国该材料长期依赖进口，虽近年来国产化已取得阶段性突破，但仍面临原材料成本高、力学性能接近极限等突出问题。C276 属于镍基合金，镍元素含量超过 50%，还含有约 16% 的钼、3% 的钨、2.5% 的钴等有色金属元素，廉价的铁元素仅占 5%，使得 C276 材料的原材料成本居高不下。同时，在近 30 年的开发应用中，基于 C276 基带的带材力学性能已经接近其极限。", "summary_zh": "IT之家 9 月 2 日消息，中国科学院理化技术研究所今日宣布，经过三年多攻关，成功研制出第二代高温超导带材用铁基合金基带。近期，上海超导科技股份有限公司采用该基带完成了带材制备验证，成功制备出高性能二代高温超导带材。第二代高温超导带材因其具有更高的临界温度、更高的临界电流密度以及更优的在场载流性能，在可控核聚变、超导电力、超导加速器等强磁强电领域具备广阔应用前景。其多层结构中，位于最底部的金属基带层作为整条带材的“骨架”，担负力学承载的核心功能，使带材能够承受绕制、弯曲和冷热循环等加工与服役应力。当前，超导带材用基带几乎全部采用哈氏合金（C276），我国该材料长期依赖进口，虽近年来国产化已取 ummary": "IT之家 9 月 2 日消息，小米米家夜灯 4 单只装上架预约，将于 9 月 9 日下周三开启众筹，厂商建议零售价 79 元，众筹价 59 元（IT之家附小米有品官方购买地址：点此购买）。小米米家夜灯 4 主要是升级了 24GHz 雷达，拥有 120° 大广角，在正前方 3m、侧方 2.5m 范围内可精准识别人体细微动作。黑暗环境下，可实现人来灯亮，人离开后 10 秒后自动关灯。小米米家夜灯 4 采用背面出光，经墙面充分反射打散光线，支持 1lm、3lm、5lm、15lm 亮度 4 挡可调，无可视频闪，RGO 无蓝光危害，舒适暖光不刺眼。这款产品搭载 800mAh 锂电池，采用 Type-C 充电设计，搭载低功耗算法，满电续航 8 个月（最高亮度 3 个月）。", "summary_zh": "IT之家 9 月 2 日消息，小米米家夜灯 4 单只装上架预约，将于 9 月 9 日下周三开启众筹，厂商建议零售价 79 元，众筹价 59 元（IT之家附小米有品官方购买地址：点此购买）。小米米家夜灯 4 主要是升级了 24GHz 雷达，拥有 120° 大广角，在正前方 3m、侧方 2.5m 范围内可精准识别人体细微动作。黑暗环境下，可实现人来灯亮，人离开后 10 秒后自动关灯。小米米家夜灯 4 采用背面出光，经墙面充分反射打散光线，支持 1lm、3lm、5lm、15lm 亮度 4 挡可调，无可视频闪，RGO 无蓝光危害，舒适暖光不刺眼。这款产品搭载 800mAh 锂电池，采用 Type-C 充电设计，搭载低功耗算法，满电续航 8 个月（最高亮度 3 个月）。", "pub_date": "2026-09-02T04:32:58+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "育碧收紧《荣耀战魂》游戏多人模式，9 月 10 日起 Linux 玩家无法开黑", "title_zh": "育碧收紧《荣耀战魂》游戏多人模式，9 月 10 日起 Linux 玩家无法开黑", "summary": "IT之家 9 月 2 日消息，育碧昨日（9 月 1 日）发布公告，表示由于反作弊系统无法在 Linux / SteamOS 平台上有效运作，将于 9 月 10 日开始在其平台上封禁《荣耀战魂》（For Honor）多人模式。对于 Linux 和 Steam Deck 等玩家而言，意味着在 9 月 10 日之后无法“开黑”了。“开黑”是游戏圈常用语，意思是几个认识的人组队一起打游戏，并且能方便地语音或当面交流战术。IT之家查询公开资料，《荣耀战魂》游戏于 2017 年 2 月 14 日发行，以中世纪冷兵器战争为背景。玩家可选择维京人、骑士、武士及武林四大阵营，通过多样化的武器装备选择、战术配合争夺领土。《荣耀战魂》使用 Epic Games 开发的 Easy Anti-Cheat 反作弊系统来打击 PC 平台作弊行为。育碧官方声明称，公司“无法在 Linux 平台上有效部署防护措施”，因此选择彻底移除该平台的访问权限。育碧并非首家因反作弊顾虑而放弃 Linux 支持的发行商。", "summary_zh": "IT之家 9 月 2 日消息，育碧昨日（9 月 1 日）发布公告，表示由于反作弊系统无法在 Linux / SteamOS 平台上有效运作，将于 9 月 10 日开始在其平台上封禁《荣耀战魂》（For Honor）多人模式。对于 Linux 和 Steam Deck 等玩家而言，意味着在 9 月 10 日之后无法“开黑”了。“开黑”是游戏圈常用语，意思是几个认识的人组队一起打游戏，并且能方便地语音或当面交流战术。IT之家查询公开资料，《荣耀战魂》游戏于 2017 年 2 月 14 日发行，以中世纪冷兵器战争为背景。玩家可选择维京人、骑士、武士及武林四大阵营，通过多样化的武器装备选择、战术配合争夺领土。《荣耀战魂》使用 Epic Games 开发的 Easy Anti-Cheat 反作弊系统来打击 PC 平台作弊行为。育碧官方声明称，公司“无法在 Linux 平台上有效部署防护措施”，因此选择彻底移除该平台的访问权限。育碧并非首家因反作弊顾虑而放弃 Linux 支持的发行商。", "pub_date": "2026-09-02T04:31:02+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "小米智能插座 4 发布：升级 Wi-Fi 6 远程控制无需网关，众筹 49 元", "title_zh": "小米智能插座 4 发布：升级 Wi-Fi 6 远程控制无需网关，众筹 49 元", "summary": "IT之家 9 月 2 日消息，小米昨日推出了全新一代的小米智能插座 4 新品，厂商建议零售价 59 元，众筹价 49 元，将于 9 月 9 日下周三开启众筹（IT之家附小米有品官方购买地址：点此购买）。小米智能插座 4 尺寸为 52×41×57.6mm，相比上一代主要是升级了 Wi-Fi 6 远程连接（IT之家注：仅支持 2.4GHz 频段）支持以及新国标插脚，适配各种插排，电量统计图 + 功率统计图，显示年 / 月 / 周 / 日。这款产品支持小米澎湃智联，可定制专属智能联动场景，通过米家 App 即可统一管控全屋设备，同时支持按个人习惯自由定制智能联动，让操作更顺手。它还支持定时 / 倒计时等本地运行功能，断网也能持续执行任务，时间一到自动切断电源。在 APP 设置双击插座本体按键，无需掏手机，快速启动倒计时断电。相关阅读：《小米智能开关 2 发布：有机玻璃面板，支持单零火自适应》", "summary_zh": "IT之家 9 月 2 日消息，小米昨日推出了全新一代的小米智能插座 4 新品，厂商建议零售价 59 元，众筹价 49 元，将于 9 月 9 日下周三开启众筹（IT之家附小米有品官方购买地址：点此购买）。小米智能插座 4 尺寸为 52×41×57.6mm，相比上一代主要是升级了 Wi-Fi 6 远程连接（IT之家注：仅支持 2.4GHz 频段）支持以及新国标插脚，适配各种插排，电量统计图 + 功率统计图，显示年 / 月 / 周 / 日。这款产品支持小米澎湃智联，可定制专属智能联动场景，通过米家 App 即可统一管控全屋设备，同时支持按个人习惯自由定制智能联动，让操作更顺手。它还支持定时 / 倒计时等本地运行功能，断网也能持续执行任务，时间一到自动切断电源。在 APP 设置双击插座本体按键，无需掏手机，快速启动倒计时断电。相关阅读：《小米智能开关 2 发布：有机玻璃面板，支持单零火自适应》", "pub_date": "2026-09-02T04:25:09+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "星宇股份董事长周晓萍回应劝退应届生事件：公司深刻反省并真诚道歉，将以制度和流程切实保障劳动者合法权益", "title_zh": "星宇股份董事长周晓萍回应劝退应届生事件：公司深刻反省并真诚道歉，将以制度和流程切实保障劳动者合法权益", "summary": "IT之家 9 月 2 日消息，常州星宇车灯股份有限公司（简称“星宇股份”）今日上午举行 2026 年半年度业绩说明会，星宇股份董事长兼总经理周晓萍就最近网络热议的“劝退应届生事件”进行了回应。周晓萍表示，公司高度关注近期舆情，已就事件的真实情况公开发布致歉信并正在政府部门的指导下妥善落实相关措施。公司对披露真实情况的媒体监督表示衷心感谢，公司深刻反省并真诚道歉。同时，公司对部分媒体的不实报道也已通过网信和网安部门进行投诉和举报，维护公司的合法权益。周晓萍还称，公司依据法律法规和规范性文件等制定各项用工制度和流程，并在本次事件发生后重新审视及整改，将以制度和流程切实保障劳动者合法权益。公司再次向社会和广大投资者真诚道歉，公司将严守合规运营底线，构建和谐劳动关系，积极承担更多社会责任，努力以更好的业绩回馈投资者。综合IT之家此前报道，车灯上市公司星宇股份近日被曝羞辱式劝退应届生，硕士被安排打螺丝，引发网络热议。", "summary_zh": "IT之家 9 月 2 日消息，常州星宇车灯股份有限公司（简称“星宇股份”）今日上午举行 2026 年半年度业绩说明会，星宇股份董事长兼总经理周晓萍就最近网络热议的“劝退应届生事件”进行了回应。周晓萍表示，公司高度关注近期舆情，已就事件的真实情况公开发布致歉信并正在政府部门的指导下妥善落实相关措施。公司对披露真实情况的媒体监督表示衷心感谢，公司深刻反省并真诚道歉。同时，公司对部分媒体的不实报道也已通过网信和网安部门进行投诉和举报，维护公司的合法权益。周晓萍还称，公司依据法律法规和规范性文件等制定各项用工制度和流程，并在本次事件发生后重新审视及整改，将以制度和流程切实保障劳动者合法权益。公司再次向社会和广大投资者真诚道歉，公司将严守合规运营底线，构建和谐劳动关系，积极承担更多社会责任，努力以更好的业绩回馈投资者。综合IT之家此前报道，车灯上市公司星宇股份近日被曝羞辱式劝退应届生，硕士被安排打螺丝，引发网络热议。", "pub_date": "2026-09-02T04:24:22+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "三星最强平板 Galaxy Tab S12 Ultra 跑分曝光：单核较前代高 21%、多核高 16%", "title_zh": "三星最强平板 Galaxy Tab S12 Ultra 跑分曝光：单核较前代高 21%、多核高 16%", "summary": "IT之家 9 月 2 日消息，科技媒体 sammyfans 昨日（9 月 1 日）发布博文，报道称三星最强平板 Galaxy Tab S12 Ultra（型号 SM-X940）现身 GeekBench 跑分库，7.0.0 版本单核成绩为 2760 分，多核成绩为 9291 分。根据跑分页面显示的规格，三星 Galaxy Tab S12 Ultra 平板配备联发科天玑 9500 芯片，CPU 主频可达 4.21GHz，作为对比三星 Galaxy Tab S11 Ultra 平板配备联发科天玑 9400+ 芯片，主频为 3.73GHz。IT之家援引博文介绍，附上三星 Galaxy Tab S12 Ultra 的跑分对比如下：三星 Galaxy Tab S12 Ultra三星 Galaxy Tab S11 Ultra增幅单核2760228121%多核9291800516%内存方面，目前曝光的测试机配备 12GB RAM，与上一代机型的起步配置保持一致。不过，按照三星近年来 Ultra 系列产品的惯例，正式发布后预计还会推出 16GB 内存版本。", "summary_zh": "IT之家 9 月 2 日消息，科技媒体 sammyfans 昨日（9 月 1 日）发布博文，报道称三星最强平板 Galaxy Tab S12 Ultra（型号 SM-X940）现身 GeekBench 跑分库，7.0.0 版本单核成绩为 2760 分，多核成绩为 9291 分。根据跑分页面显示的规格，三星 Galaxy Tab S12 Ultra 平板配备联发科天玑 9500 芯片，CPU 主频可达 4.21GHz，作为对比三星 Galaxy Tab S11 Ultra 平板配备联发科天玑 9400+ 芯片，主频为 3.73GHz。IT之家援引博文介绍，附上三星 Galaxy Tab S12 Ultra 的跑分对比如下：三星 Galaxy Tab S12 Ultra三星 Galaxy Tab S11 Ultra增幅单核2760228121%多核9291800516%内存方面，目前曝光的测试机配备 12GB RAM，与上一代机型的起步配置保持一致。不过，按照三星近年来 Ultra 系列产品的惯例，正式发布后预计还会推出 16GB 内存版本。", "pub_date": "2026-09-02T04:12:25+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "网信办通报“清朗 · 整治 AI 应用乱象”典型案例：涉 AI 魔改经典、换脸假冒等数字泔水，豆包、元宝、千问、文心一言严格限制违规内容输出", "title_zh": "网信办通报“清朗 · 整治 AI 应用乱象”典型案例：涉 AI 魔改经典、换脸假冒等数字泔水，豆包、元宝、千问、文心一言严格限制违规内容输出", "summary": "IT之家 9 月 2 日消息，中央网信办今日公布了“清朗 · 整治 AI 应用乱象”专项行动第二阶段工作的最新进展和相关成果。此次行动聚焦利用 AI 制作发布虚假信息、传播暴力低俗内容、假冒仿冒他人、侵害未成年人权益等突出问题，部署各地网信部门深入推进重点整治任务。据官方通报，截至目前，此次专项行动累计清理违法违规信息 561 万余条，查处账号 4.9 万余个，处置违规网站、应用程序等 2400 余个。同时，各地网信部门因地制宜推出一系列针对性治理措施：北京网信办指导平台升级审核策略以提升对违规内容新型变体的识别处置能力；上海网信办督促平台自查自纠并推出 AI 应用“知识普及包”引导公众识别风险；浙江网信办对属地重点平台开展“一企一策”合规指导并依法查处问题突出的 AI 应用；广东网信办召开重点平台工作例会对多款应用违规问题开展点对点督促整改。另外，抖音、快手、微博、腾讯、百度、哔哩哔哩、小红书、知乎、豆瓣、淘宝等平台进一步强化技术赋能，优化多模态识别模型，动态扩充人脸库、声纹库和违规样本库，上线人脸实时治理系统等功能，提升违规内容智能检测和拦截效率，累计发布各类治理公告 46 期。", "summary_zh": "IT之家 9 月 2 日消息，中央网信办今日公布了“清朗 · 整治 AI 应用乱象”专项行动第二阶段工作的最新进展和相关成果。此次行动聚焦利用 AI 制作发布虚假信息、传播暴力低俗内容、假冒仿冒他人、侵害未成年人权益等突出问题，部署各地网信部门深入推进重点整治任务。据官方通报，截至目前，此次专项行动累计清理违法违规信息 561 万余条，查处账号 4.9 万余个，处置违规网站、应用程序等 2400 余个。同时，各地网信部门因地制宜推出一系列针对性治理措施：北京网信办指导平台升级审核策略以提升对违规内容新型变体的识别处置能力；上海网信办督促平台自查自纠并推出 AI 应用“知识普及包”引导公众识别风险；浙江网信办对属地重点平台开展“一企一策”合规指导并依法查处问题突出的 AI 应用；广东网信办召开重点平台工作例会对多款应用违规问题开展点对点督促整改。另外，抖音、快手、微博、腾讯、百度、哔哩哔哩、小红书、知乎、豆瓣、淘宝等平台进一步强化技术赋能，优化多模态识别模型，动态扩充人脸库、声纹库和违规样本库，上线人脸实时治理系统等功能，提升违规内容智能检测和拦截效率，累计发布各类治理公告 46 期。", "pub_date": "2026-09-02T04:05:06+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "降低打字干扰：微软 Word / Outlook 已默认禁用文本预测功能", "title_zh": "降低打字干扰：微软 Word / Outlook 已默认禁用文本预测功能", "summary": "IT之家 9 月 2 日消息，微软昨日（9 月 1 日）发布博文，宣布在 Word 和 Outlook 应用中，已默认禁用文本预测（text predictions）功能。微软在博文中指出，基于相关调查，部分用户认为该功能干扰到日常输入体验，且倾向于自行完成输入，因此决定默认禁用该功能。对该功能有需求的用户，依然可以在设置中启用。", "summary_zh": "IT之家 9 月 2 日消息，微软昨日（9 月 1 日）发布博文，宣布在 Word 和 Outlook 应用中，已默认禁用文本预测（text predictions）功能。微软在博文中指出，基于相关调查，部分用户认为该功能干扰到日常输入体验，且倾向于自行完成输入，因此决定默认禁用该功能。对该功能有需求的用户，依然可以在设置中启用。", "pub_date": "2026-09-02T04:03:23+00:00", "time_str": "1小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "智谱 AI 入驻天猫开设官方旗舰店，大模型套餐可直接网购，个人版月付 118 元起", "title_zh": "智谱 AI 入驻天猫开设官方旗舰店，大模型套餐可直接网购，个人版月付 118 元起", "summary": "IT之家 9 月 2 日消息，国产 AI 大模型厂商智谱正式入驻天猫，开设“智谱旗舰店”。即日起，用户可在淘宝 App 搜索“智谱旗舰店”进店下单。店铺目前已上架智谱 GLM Coding Plan 订阅套餐，基于 GLM-5.3 模型，并适配 ZCode、Claude Code、Codex 等 20 余款主流 Agent。智谱在售商品包括个人版 Lite、Pro、Max 及团队版标准席位，支持按月、季、年订阅。其中个人版 Lite 版 118 元（含 10000 积分 / 周），Pro 版 538 元（含 60000 积分 / 周），Max 版 1078 元（含 140000 积分 / 周），团队版标准席位 598 元（含 66000 积分 / 席位）。IT之家注：此前大模型厂商主要通过官网等自有渠道销售订阅产品。智谱此次入驻天猫，意味着大模型订阅服务开始进入传统电商平台的消费场景。智谱旗舰店的经营者为北京智谱华章科技股份有限公司。智谱方面表示，未来用户购买词元（Token）也可在电商平台完成。", "summary_zh": "IT之家 9 月 2 日消息，国产 AI 大模型厂商智谱正式入驻天猫，开设“智谱旗舰店”。即日起，用户可在淘宝 App 搜索“智谱旗舰店”进店下单。店铺目前已上架智谱 GLM Coding Plan 订阅套餐，基于 GLM-5.3 模型，并适配 ZCode、Claude Code、Codex 等 20 余款主流 Agent。智谱在售商品包括个人版 Lite、Pro、Max 及团队版标准席位，支持按月、季、年订阅。其中个人版 Lite 版 118 元（含 10000 积分 / 周），Pro 版 538 元（含 60000 积分 / 周），Max 版 1078 元（含 140000 积分 / 周），团队版标准席位 598 元（含 66000 积分 / 席位）。IT之家注：此前大模型厂商主要通过官网等自有渠道销售订阅产品。智谱此次入驻天猫，意味着大模型订阅服务开始进入传统电商平台的消费场景。智谱旗舰店的经营者为北京智谱华章科技股份有限公司。智谱方面表示，未来用户购买词元（Token）也可在电商平台完成。", "pub_date": "2026-09-02T03:57:30+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "我国实现铁尾矿“变废为宝”，全球最大难选铁矿磁化焙烧工程竣工验收", "title_zh": "我国实现铁尾矿“变废为宝”，全球最大难选铁矿磁化焙烧工程竣工验收", "summary": "IT之家 9 月 2 日消息，据央视新闻报道，我国是全球最大的铁矿石消费国，对外依存度高。科研团队在国际上首次突破了难选铁矿高效利用的核心技术瓶颈，全球最大难选铁矿磁化焙烧工程昨天（9 月 1 日）竣工验收。难选铁矿指依靠常规选矿手段，难以将铁矿物与杂质有效分离、无法产出高品位铁精矿的原生矿产。常规选矿排出的超低品位铁尾矿，也属于难选铁矿，过去大多被视作废料，可利用价值极低。为了提升这类矿藏和选矿废料的利用率，中国科学院过程工程研究所科研团队突破传统磁化焙烧技术方案局限，成功创建了颗粒停留时间精细调控磁化焙烧成套新技术，可使含铁量仅 11% 的铁尾矿经过处理后，产出铁元素质量占比 64% 以上的铁精矿。基于该技术，全球最大难选铁矿流态化磁化焙烧项目于今年 1 月投产，铁转化率高达 98%，真正实现了“变废为宝”。鞍钢矿业资源利用（鞍山）有限公司总经理范喜杰：我们的项目近期已经达产，每年可以生产铁精矿 220 万吨，对整个产业链供应链的安全和稳定会起到一个非常大的支撑作用。", "summary_zh": "IT之家 9 月 2 日消息，据央视新闻报道，我国是全球最大的铁矿石消费国，对外依存度高。科研团队在国际上首次突破了难选铁矿高效利用的核心技术瓶颈，全球最大难选铁矿磁化焙烧工程昨天（9 月 1 日）竣工验收。难选铁矿指依靠常规选矿手段，难以将铁矿物与杂质有效分离、无法产出高品位铁精矿的原生矿产。常规选矿排出的超低品位铁尾矿，也属于难选铁矿，过去大多被视作废料，可利用价值极低。为了提升这类矿藏和选矿废料的利用率，中国科学院过程工程研究所科研团队突破传统磁化焙烧技术方案局限，成功创建了颗粒停留时间精细调控磁化焙烧成套新技术，可使含铁量仅 11% 的铁尾矿经过处理后，产出铁元素质量占比 64% 以上的铁精矿。基于该技术，全球最大难选铁矿流态化磁化焙烧项目于今年 1 月投产，铁转化率高达 98%，真正实现了“变废为宝”。鞍钢矿业资源利用（鞍山）有限公司总经理范喜杰：我们的项目近期已经达产，每年可以生产铁精矿 220 万吨，对整个产业链供应链的安全和稳定会起到一个非常大的支撑作用。", "pub_date": "2026-09-02T03:55:32+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "台积电回应欧洲加建先进制程晶圆厂呼声：当地需有长期需求", "title_zh": "台积电回应欧洲加建先进制程晶圆厂呼声：当地需有长期需求", "summary": "IT之家 9 月 2 日消息，台积电资深副总经理、副联席首席运营官侯永清昨日表示，该企业会否选择在欧洲建设先进制程工艺晶圆厂，取决于当地市场是否存在长期的先进制程需求这一基本面。▲ 侯永清侯永清表示，先进制程晶圆厂项目需要长期运作才能真正创造效益，政府补贴仅能降低前期成本，没有稳定的需求必然失败。此外，先进晶圆厂需要法规、土地、水力、电力、人才、供应链的全方位支持。欧洲在半导体商业制造上的存在主要体现在在模拟器件领域，先进逻辑制程工艺属于其传统弱势领域。台积电乐见欧洲半导体初创企业投入先进芯片设计，正通过特殊专案合作提升欧洲芯片需求。他还表示，欧洲《芯片法案 2.0》应扩大半导体供应链激励广度，台积电正通过训练计划在全球范围内培养学生对半导体的兴趣。▲ 台积电在欧合资成熟制程晶圆厂 ESMC 概念图相关阅读：《ESMC 股东英飞凌：台积电需再（在欧洲）建设一座晶圆厂》", "summary_zh": "IT之家 9 月 2 日消息，台积电资深副总经理、副联席首席运营官侯永清昨日表示，该企业会否选择在欧洲建设先进制程工艺晶圆厂，取决于当地市场是否存在长期的先进制程需求这一基本面。▲ 侯永清侯永清表示，先进制程晶圆厂项目需要长期运作才能真正创造效益，政府补贴仅能降低前期成本，没有稳定的需求必然失败。此外，先进晶圆厂需要法规、土地、水力、电力、人才、供应链的全方位支持。欧洲在半导体商业制造上的存在主要体现在在模拟器件领域，先进逻辑制程工艺属于其传统弱势领域。台积电乐见欧洲半导体初创企业投入先进芯片设计，正通过特殊专案合作提升欧洲芯片需求。他还表示，欧洲《芯片法案 2.0》应扩大半导体供应链激励广度，台积电正通过训练计划在全球范围内培养学生对半导体的兴趣。▲ 台积电在欧合资成熟制程晶圆厂 ESMC 概念图相关阅读：《ESMC 股东英飞凌：台积电需再（在欧洲）建设一座晶圆厂》", "pub_date": "2026-09-02T03:53:05+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "微软称符合条件 Win11 设备 10 月默认启用内存完整性保护，拦截恶意驱动劫持", "title_zh": "微软称符合条件 Win11 设备 10 月默认启用内存完整性保护，拦截恶意驱动劫持", "summary": "IT之家 9 月 2 日消息，科技媒体 Neowin 昨日（9 月 1 日）发布博文，报道称针对符合条件的 Windows 11 设备，微软计划 2026 年 10 月开始，默认启用内存完整性保护（Memory Integrity）。IT之家援引博文介绍，内存完整性保护（Memory Integrity）也称受虚拟机监控程序保护的代码完整性（Hypervisor-protected Code Integrity，HVCI），建立在基于虚拟化的安全（VBS）之上。该功能利用硬件虚拟化创建隔离环境，验证内核模式代码和驱动程序。Windows 内核处于操作系统底层，驱动程序可拥有较高系统权限。微软表示，该功能只允许受信任的内核模式代码和驱动运行，从而降低恶意程序借助底层驱动接管设备的风险。微软 Windows 11 系统此前已经内置内存完整性保护功能，不过默认情况下处于关闭状态。针对符合条件的 Windows 11 设备，微软计划 2026 年 10 月（预计对应 10 月 13 日的“周二补丁日”）开始默认启用。", "summary_zh": "IT之家 9 月 2 日消息，科技媒体 Neowin 昨日（9 月 1 日）发布博文，报道称针对符合条件的 Windows 11 设备，微软计划 2026 年 10 月开始，默认启用内存完整性保护（Memory Integrity）。IT之家援引博文介绍，内存完整性保护（Memory Integrity）也称受虚拟机监控程序保护的代码完整性（Hypervisor-protected Code Integrity，HVCI），建立在基于虚拟化的安全（VBS）之上。该功能利用硬件虚拟化创建隔离环境，验证内核模式代码和驱动程序。Windows 内核处于操作系统底层，驱动程序可拥有较高系统权限。微软表示，该功能只允许受信任的内核模式代码和驱动运行，从而降低恶意程序借助底层驱动接管设备的风险。微软 Windows 11 系统此前已经内置内存完整性保护功能，不过默认情况下处于关闭状态。针对符合条件的 Windows 11 设备，微软计划 2026 年 10 月（预计对应 10 月 13 日的“周二补丁日”）开始默认启用。", "pub_date": "2026-09-02T03:43:34+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "攻坚国产“小光刻机”，惠然微电子发布国内首台 14/22nm CD-SEM 关键尺寸量测设备", "title_zh": "攻坚国产“小光刻机”，惠然微电子发布国内首台 14/22nm CD-SEM 关键尺寸量测设备", "summary": "IT之家 9 月 2 日消息，据爱集微 8 月 31 日报道，半导体量测设备是芯片制造过程中的“眼睛”，贯穿光刻、刻蚀、沉积等全部核心工艺环节，直接决定晶圆良率水平与制程迭代速度。电子束关键尺寸量测设备（CD-SEM）又是先进制程晶圆良率控制的核心装备之一，也是目前国产化率第二低的半导体设备品类，仅次于光刻机，在业内有“小光刻机”之称，是我国半导体产业链自主可控进程中亟待突破的关键短板。惠然微电子技术有限公司是国内专注于半导体量检测设备领域的创新企业，在 8 月 31 日 ~9 月 2 日的第十四届半导体设备材料及核心部件展（CSEAC 2026）上发布多款重磅新品，其中就包括 14 纳米研发级和 22 纳米量产级 12 英寸晶圆 CD-SEM eMILO-FW300、光掩模版关键尺寸量测设备 Mask CD-SEM eMILO-FR7，以及 AI-电子束量测技术平台 RMS 等。报道称，这些产品均已达到国内领先水平，可与国际同类产品对标，甚至部分产品属于国内首创。下一步，惠然微电子将力争实现国内首台光掩模版关键尺寸量测设备的产品化落地。", "summary_zh": "IT之家 9 月 2 日消息，据爱集微 8 月 31 日报道，半导体量测设备是芯片制造过程中的“眼睛”，贯穿光刻、刻蚀、沉积等全部核心工艺环节，直接决定晶圆良率水平与制程迭代速度。电子束关键尺寸量测设备（CD-SEM）又是先进制程晶圆良率控制的核心装备之一，也是目前国产化率第二低的半导体设备品类，仅次于光刻机，在业内有“小光刻机”之称，是我国半导体产业链自主可控进程中亟待突破的关键短板。惠然微电子技术有限公司是国内专注于半导体量检测设备领域的创新企业，在 8 月 31 日 ~9 月 2 日的第十四届半导体设备材料及核心部件展（CSEAC 2026）上发布多款重磅新品，其中就包括 14 纳米研发级和 22 纳米量产级 12 英寸晶圆 CD-SEM eMILO-FW300、光掩模版关键尺寸量测设备 Mask CD-SEM eMILO-FR7，以及 AI-电子束量测技术平台 RMS 等。报道称，这些产品均已达到国内领先水平，可与国际同类产品对标，甚至部分产品属于国内首创。下一步，惠然微电子将力争实现国内首台光掩模版关键尺寸量测设备的产品化落地。", "pub_date": "2026-09-02T03:41:59+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "vivo 创作者盛典定档 9 月 7 日，X500 系列旗舰新机官宣“本月见”", "title_zh": "vivo 创作者盛典定档 9 月 7 日，X500 系列旗舰新机官宣“本月见”", "summary": "IT之家 9 月 2 日消息，vivo 产品副总裁黄韬今日宣布，vivo 创作者盛典定档 9 月 7 日 19:00 举行。黄韬称，做影像的这些年，有一件事越来越确定：创作者，永远是影像的核心。风景再美、技术再极致，真正赋予影像灵魂的，始终是镜头背后的创作者。所以今年，vivo 正式把「影像盛典」更名为「创作者盛典」，一场为创作者的盛典。他表示，蓝图影像也做了全面的战略升级：表达越来越多元的今天，单点的技术突破，已经不够了 —— 蓝图影像要从“影像技术品牌”，升级为真正“为创作者服务”的影像品牌。vivo X500 系列是为所有创作者准备的影像旗舰，更是满配旗舰。IT之家注意到，黄韬还宣布，vivo X500 系列旗舰新机“本月见”。", "summary_zh": "IT之家 9 月 2 日消息，vivo 产品副总裁黄韬今日宣布，vivo 创作者盛典定档 9 月 7 日 19:00 举行。黄韬称，做影像的这些年，有一件事越来越确定：创作者，永远是影像的核心。风景再美、技术再极致，真正赋予影像灵魂的，始终是镜头背后的创作者。所以今年，vivo 正式把「影像盛典」更名为「创作者盛典」，一场为创作者的盛典。他表示，蓝图影像也做了全面的战略升级：表达越来越多元的今天，单点的技术突破，已经不够了 —— 蓝图影像要从“影像技术品牌”，升级为真正“为创作者服务”的影像品牌。vivo X500 系列是为所有创作者准备的影像旗舰，更是满配旗舰。IT之家注意到，黄韬还宣布，vivo X500 系列旗舰新机“本月见”。", "pub_date": "2026-09-02T03:33:01+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "流媒体平台 Roku 首次推出自有品牌 OLED 电视，起价 999 美元", "title_zh": "流媒体平台 Roku 首次推出自有品牌 OLED 电视，起价 999 美元", "summary": "IT之家 9 月 2 日消息，流媒体平台 Roku 美国加利福尼亚州当地时间 1 日宣布首次推出自有品牌 OLED 电视，提供 Roku Pro Series OLED 和 Roku Pro Series LX OLED 两个产品系列，均包含 55\" 和 65\" 款式。Roku Pro Series (LX) OLED 采用 \"4K\" 分辨率面板，支持杜比视界、HDR10+、HLG 格式的 HDR 内容，提供 4 个 HDMI 2.1（其中 1 个支持 eARC）、USB-A、USB-C。Roku Pro Series OLED 刷新率可达 120Hz，支持 Wi-Fi 5 规范；Roku Pro Series LX OLED 在提高更明亮范围、更广泛色彩与低反射偏振层的同时升级至 144Hz 刷新率与 Wi-Fi 6，遥控器采用可充电电池供电并支持免提语音。Roku Pro Series OLED 电视 55\" 款定价 999 美元（IT之家注：现汇率约合 6,730 元人民币）、65\" 款则是 1,199 美元（现汇率约合 8,078 元人民币）；", "summary_zh": "IT之家 9 月 2 日消息，流媒体平台 Roku 美国加利福尼亚州当地时间 1 日宣布首次推出自有品牌 OLED 电视，提供 Roku Pro Series OLED 和 Roku Pro Series LX OLED 两个产品系列，均包含 55\" 和 65\" 款式。Roku Pro Series (LX) OLED 采用 \"4K\" 分辨率面板，支持杜比视界、HDR10+、HLG 格式的 HDR 内容，提供 4 个 HDMI 2.1（其中 1 个支持 eARC）、USB-A、USB-C。Roku Pro Series OLED 刷新率可达 120Hz，支持 Wi-Fi 5 规范；Roku Pro Series LX OLED 在提高更明亮范围、更广泛色彩与低反射偏振层的同时升级至 144Hz 刷新率与 Wi-Fi 6，遥控器采用可充电电池供电并支持免提语音。Roku Pro Series OLED 电视 55\" 款定价 999 美元（IT之家注：现汇率约合 6,730 元人民币）、65\" 款则是 1,199 美元（现汇率约合 8,078 元人民币）；", "pub_date": "2026-09-02T03:23:36+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "活跃租户使用比例不足 5%：微软官宣未来 2 年 2 阶段移除经典 SharePoint 页面", "title_zh": "活跃租户使用比例不足 5%：微软官宣未来 2 年 2 阶段移除经典 SharePoint 页面", "summary": "IT之家 9 月 2 日消息，微软于 8 月 31 日发布公告，将分为 2 个阶段，在未来 2 年内，逐步从 Microsoft 365 中移除 SharePoint Online 中的经典 SharePoint 页面和自定义脚本添加 / 更新功能。IT之家查询官方公告，这里的经典版 SharePoint 并非一个独立产品 SKU 或单一版本，是微软在 2016 年推出 Modern SharePoint 和 SharePoint Framework（SPFx）时，对原有“发布（publishing）与用户体验扩展（UX extensibility）体系”的统称。经典版 SharePoint 产品血统可追溯至 2001 年 3 月 28 日发布的 Microsoft SharePoint Portal Server 2001，微软本次计划移除 SharePoint Online 中的旧式页面与定制机制，官方表示活跃租户使用比例不足 5%。微软目前规划分为 2 个阶段推进经典版 SharePoint 退役，第 1 阶段从 2027 年 3 月 1 日开始。", "summary_zh": "IT之家 9 月 2 日消息，微软于 8 月 31 日发布公告，将分为 2 个阶段，在未来 2 年内，逐步从 Microsoft 365 中移除 SharePoint Online 中的经典 SharePoint 页面和自定义脚本添加 / 更新功能。IT之家查询官方公告，这里的经典版 SharePoint 并非一个独立产品 SKU 或单一版本，是微软在 2016 年推出 Modern SharePoint 和 SharePoint Framework（SPFx）时，对原有“发布（publishing）与用户体验扩展（UX extensibility）体系”的统称。经典版 SharePoint 产品血统可追溯至 2001 年 3 月 28 日发布的 Microsoft SharePoint Portal Server 2001，微软本次计划移除 SharePoint Online 中的旧式页面与定制机制，官方表示活跃租户使用比例不足 5%。微软目前规划分为 2 个阶段推进经典版 SharePoint 退役，第 1 阶段从 2027 年 3 月 1 日开始。", "pub_date": "2026-09-02T03:22:53+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "启境 GT7 采用八大冗余设计，产品总经理轩伟称目标让这套架构五年不过时", "title_zh": "启境 GT7 采用八大冗余设计，产品总经理轩伟称目标让这套架构五年不过时", "summary": "IT之家 9 月 2 日消息，启境汽车产品总经理轩伟今日发文，谈及了车辆安全兜底的重要性。他表示，启境汽车的八大冗余设计，不单单服务未来 L3 场景，更希望把这份安全能力给到真实的通勤、城市、高速出行中。据轩伟分享，适配 L3 / L4 的国标计划在明年 7 月 1 号就正式实施。他表示，启境 GT7 把冗余算力、传感器全部预埋到位，目标很明确：让这套架构五年不过时，在保证技术代际领先的同时，也尽可能减少用户未来因为软硬件迭代换车而带来的损失。据IT之家此前报道，启境 GT7 已满足国家 L3 级自动驾驶架构的设计标准，并且完成了 L3 的准入测试与申报。官方介绍称是 20 万级唯一搭载 L3 级自动驾驶架构的量产车型，后续 L3 的规划应用还需等待未来国家部委审核及相关法规要求。", "summary_zh": "IT之家 9 月 2 日消息，启境汽车产品总经理轩伟今日发文，谈及了车辆安全兜底的重要性。他表示，启境汽车的八大冗余设计，不单单服务未来 L3 场景，更希望把这份安全能力给到真实的通勤、城市、高速出行中。据轩伟分享，适配 L3 / L4 的国标计划在明年 7 月 1 号就正式实施。他表示，启境 GT7 把冗余算力、传感器全部预埋到位，目标很明确：让这套架构五年不过时，在保证技术代际领先的同时，也尽可能减少用户未来因为软硬件迭代换车而带来的损失。据IT之家此前报道，启境 GT7 已满足国家 L3 级自动驾驶架构的设计标准，并且完成了 L3 的准入测试与申报。官方介绍称是 20 万级唯一搭载 L3 级自动驾驶架构的量产车型，后续 L3 的规划应用还需等待未来国家部委审核及相关法规要求。", "pub_date": "2026-09-02T03:20:12+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "小米智能开关 2 发布：有机玻璃面板，支持单零火自适应", "title_zh": "小米智能开关 2 发布：有机玻璃面板，支持单零火自适应", "summary": "IT之家 9 月 2 日消息，小米智能开关 2 今日正式发布，目前已上线众筹预约，众筹价 69 元起（IT之家附小米有品官方地址：点此购买），将于下周一开启众筹。该系列提供单键、双键、三键三种按键规格，有白色、深空灰两款面板配色，采用有机玻璃面板。产品适配国标 86 型墙壁底盒，面板厚度 11mm，入墙基座深度 21.2mm。其外壳采用 V-0 级防火阻燃 PC 材质，可耐受 850℃ 高温阻燃测试。按键采用短键程硅胶缓冲轻音结构以降低操作噪音，每路按键下方均配有状态指示灯，可直观显示回路通断状态。小米智能开关 2 支持单火 / 零火自适应兼容，无论是新房预留零线还是老房仅火线布线场景均可直接安装，设备通电后自动识别电路模式并切换工作逻辑，无需人工拨码设置。继电器机械开合寿命可达 100 万次，内部搭载动态自适应过零通断检测技术，在交流电电压最低点完成通断动作，以降低继电器冲击、延长器件寿命。电路针对低功率 LED 灯具做了专项优化，可减少待机微电流带来的灯具间歇闪烁现象。内置温度检测模块，当机身内部出现过热异常时自动切断回路，实现过热断电保护。", "summary_zh": "IT之家 9 月 2 日消息，小米智能开关 2 今日正式发布，目前已上线众筹预约，众筹价 69 元起（IT之家附小米有品官方地址：点此购买），将于下周一开启众筹。该系列提供单键、双键、三键三种按键规格，有白色、深空灰两款面板配色，采用有机玻璃面板。产品适配国标 86 型墙壁底盒，面板厚度 11mm，入墙基座深度 21.2mm。其外壳采用 V-0 级防火阻燃 PC 材质，可耐受 850℃ 高温阻燃测试。按键采用短键程硅胶缓冲轻音结构以降低操作噪音，每路按键下方均配有状态指示灯，可直观显示回路通断状态。小米智能开关 2 支持单火 / 零火自适应兼容，无论是新房预留零线还是老房仅火线布线场景均可直接安装，设备通电后自动识别电路模式并切换工作逻辑，无需人工拨码设置。继电器机械开合寿命可达 100 万次，内部搭载动态自适应过零通断检测技术，在交流电电压最低点完成通断动作，以降低继电器冲击、延长器件寿命。电路针对低功率 LED 灯具做了专项优化，可减少待机微电流带来的灯具间歇闪烁现象。内置温度检测模块，当机身内部出现过热异常时自动切断回路，实现过热断电保护。", "pub_date": "2026-09-02T03:16:02+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "阿里千问 Qwen3.8-Max-0902 版本模型发布，拿下前端编程总榜冠军", "title_zh": "阿里千问 Qwen3.8-Max-0902 版本模型发布，拿下前端编程总榜冠军", "summary": "IT之家 9 月 2 日消息，阿里千问今日宣布 Qwen3.8-Max 模型升级到 0902 版本。官方围绕编程（Coding）和专业办公（Cowork），对 Qwen3.8-Max 进行了进一步的后训练，使得模型整体性能再度突破，更适合企业真实复杂任务、科研、长周期任务等。在 CodeArena 前端编程总榜中，Qwen3.8-Max 提升 22 分至 1691 分夺得冠军。这说明，Qwen3.8-Max 拥有更强的智能体编程能力，在多步推理、工具调用、端到端 app 生成方面均刷新了全球模型的新上限。同时，CodeArena 更新的模型性价比榜单（帕累托前沿）显示，Qwen3.8-Max-0902 新版本每百万 Tokens 综合平均价格为 5 美元（IT之家注：现汇率约合 33.7 元人民币），而当前性能排名第二和第三的模型百万 Tokens 综合价格分别为 20 美元（现汇率约合 134.7 元人民币）和 12 美元（现汇率约合 80.8 元人民币）。", "summary_zh": "IT之家 9 月 2 日消息，阿里千问今日宣布 Qwen3.8-Max 模型升级到 0902 版本。官方围绕编程（Coding）和专业办公（Cowork），对 Qwen3.8-Max 进行了进一步的后训练，使得模型整体性能再度突破，更适合企业真实复杂任务、科研、长周期任务等。在 CodeArena 前端编程总榜中，Qwen3.8-Max 提升 22 分至 1691 分夺得冠军。这说明，Qwen3.8-Max 拥有更强的智能体编程能力，在多步推理、工具调用、端到端 app 生成方面均刷新了全球模型的新上限。同时，CodeArena 更新的模型性价比榜单（帕累托前沿）显示，Qwen3.8-Max-0902 新版本每百万 Tokens 综合平均价格为 5 美元（IT之家注：现汇率约合 33.7 元人民币），而当前性能排名第二和第三的模型百万 Tokens 综合价格分别为 20 美元（现汇率约合 134.7 元人民币）和 12 美元（现汇率约合 80.8 元人民币）。", "pub_date": "2026-09-02T03:11:18+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "饭山 PC 推出自带可折叠支架游戏本，185H + 5050/5060 配置", "title_zh": "饭山 PC 推出自带可折叠支架游戏本，185H + 5050/5060 配置", "summary": "IT之家 9 月 2 日消息，日本企业 UNITCOM 昨日发布 iiyama PC（饭山 PC）新款 LEVEL∞ 游戏笔记本电脑。其搭载英特尔酷睿 Ultra 9 处理器 185H + NVIDIA GeForce RTX 5050 / 5060 笔记本电脑 GPU。该设备的最大特色是直接在后端集成有可折叠式支架：支架展开后能为这款笔电创造更流畅的气流路径从而改善游戏性能，还能提升键盘输入的人体工学体验。此型号配备 15.6\" FHD 144Hz 显示面板，搭配 RGB 背光键盘，内置英特尔 Wi-Fi 7 无线网卡，整机质量约 2.35kg。其搭载 GeForce RTX 5060 笔记本电脑 GPU，配备 16GB + 1TB 存储器组合的款式定价 28.47 万日元（IT之家注：现汇率约合 11,974 元人民币）；RTX 5050 + 16GB + 512GB 则是 26.48 万日元（现汇率约合 11,137 元人民币）。", "summary_zh": "IT之家 9 月 2 日消息，日本企业 UNITCOM 昨日发布 iiyama PC（饭山 PC）新款 LEVEL∞ 游戏笔记本电脑。其搭载英特尔酷睿 Ultra 9 处理器 185H + NVIDIA GeForce RTX 5050 / 5060 笔记本电脑 GPU。该设备的最大特色是直接在后端集成有可折叠式支架：支架展开后能为这款笔电创造更流畅的气流路径从而改善游戏性能，还能提升键盘输入的人体工学体验。此型号配备 15.6\" FHD 144Hz 显示面板，搭配 RGB 背光键盘，内置英特尔 Wi-Fi 7 无线网卡，整机质量约 2.35kg。其搭载 GeForce RTX 5060 笔记本电脑 GPU，配备 16GB + 1TB 存储器组合的款式定价 28.47 万日元（IT之家注：现汇率约合 11,974 元人民币）；RTX 5050 + 16GB + 512GB 则是 26.48 万日元（现汇率约合 11,137 元人民币）。", "pub_date": "2026-09-02T03:07:09+00:00", "time_str": "2小时前"}, {"source": "IT之家", "source_key": "it之家_13", "cat": "cn_tech", "color": "#1e88e5", "title": "马斯克预告 Grok 4.7 十天后上线：参数量增 40%，性能表现将超越所有 AI 竞品", "title_zh": "马斯克预告 Grok 4.7 十天后上线：参数量增 40%，性能表现将超越所有 AI 竞品", "summary": "IT之家 9 月 2 日消息，全球首富埃隆 · 马斯克（Elon Musk）今天（9 月 2 日）在 X 平台发布推文，预告将会在未来 10 天后发布 Grok 4.7 模型，预计上线时间为 2026 年 9 月 12 日。在参数规模方面，马斯克此前已透露称 Grok 4.7 模型参数规模达到 2.1 万亿，相比较 Grok 4.6（1.5 万亿）增涨 40%。IT之家附上推文内容如下：“Grok 4.7 参数规模达到 2.1T，除了服务速度略慢之外，在各方面表现均优于 Grok 4.6，且 Token 效率更高”Cognition 于 8 月 13 日发布推文，表示：“相比较 Grok 4.5 模型，Grok 4.6 有了显著的改进，超越了 GPT-5.6 Sol，仅次于 Opus 5 和 Fable 5。”马斯克随后转发该推文，并表示：“Grok 4.7 上线后，将会超越所有模型。”", "summary_zh": "IT之家 9 月 2 日消息，全球首富埃隆 · 马斯克（Elon Musk）今天（9 月 2 日）在 X 平台发布推文，预告将会在未来 10 天后发布 Grok 4.7 模型，预计上线时间为 2026 年 9 月 12 日。在参数规模方面，马斯克此前已透露称 Grok 4.7 模型参数规模达到 2.1 万亿，相比较 Grok 4.6（1.5 万亿）增涨 40%。IT之家附上推文内容如下：“Grok 4.7 参数规模达到 2.1T，除了服务速度略慢之外，在各方面表现均优于 Grok 4.6，且 Token 效率更高”Cognition 于 8 月 13 日发布推文，表示：“相比较 Grok 4.5 模型，Grok 4.6 有了显著的改进，超越了 GPT-5.6 Sol，仅次于 Opus 5 和 Fable 5。”马斯克随后转发该推文，并表示：“Grok 4.7 上线后，将会超越所有模型。”", "pub_date": "2026-09-02T05:47:02+00:00", "time_str": "15分钟前"}]}, {"key": "月光博客_15", "name": "月光博客", "cat": "cn_tech", "color": "#e53935", "items": [{"source": "月光博客", "source_key": "月光博客_15", "cat": "cn_tech", "color": "#e53935", "title": "Hugo搭建静态网站教程", "title_zh": "Hugo搭建静态网站教程", "summary": "之前我介绍了Cloudflare Pages，GitHub Pages等静态网站托管平台，那么，用户如果想搭建一个静态网站，还需要一个静态网站生成软件，在大量的同类工具里，例如Hexo、Jekyll等等，Hugo是速度最快，而且上手也最容易的一个选择，由于Hugo是Go语言编写，速度极快，几千页的网站能在几秒钟生成完毕，这也是目前个人网站搭建平台最优的选择之一，下面我就介绍一下如何使用Hugo搭建一个静态网站。\n\n第一步：安装Hugo\n\n安装Hugo之前，首先要先从下面的两个地址来安装Git和Go：\n\nGit下载地址：https://git-scm.com/install/\n\nGo下载地址：https://go.dev/dl/\n\n安装完成之后，就可以从下面的地址来安装Hugo：\n\nHugo下载地址：https://github.com/gohugoio/hugo/releases/latest\n\n地址里有很多个Hugo版本，建议选择下载 Hugo Extended 这个版本，大多数包管理器默认安装的就是这个版本。", "summary_zh": "之前我介绍了Cloudflare Pages，GitHub Pages等静态网站托管平台，那么，用户如果想搭建一个静态网站，还需要一个静态网站生成软件，在大量的同类工具里，例如Hexo、Jekyll等等，Hugo是速度最快，而且上手也最容易的一个选择，由于Hugo是Go语言编写，速度极快，几千页的网站能在几秒钟生成完毕，这也是目前个人网站搭建平台最优的选择之一，下面我就介绍一下如何使用Hugo搭建一个静态网站。\n\n第一步：安装Hugo\n\n安装Hugo之前，首先要先从下面的两个地址来安装Git和Go：\n\nGit下载地址：https://git-scm.com/install/\n\nGo下载地址：https://go.dev/dl/\n\n安装完成之后，就可以从下面的地址来安装Hugo：\n\nHugo下载地址：https://github.com/gohugoio/hugo/releases/latest\n\n地址里有很多个Hugo版本，建议选择下载 Hugo Extended 这个版本，大多数包管理器默认安装的就是这个版本。", "pub_date": "2026-08-30T22:14:30+08:00", "time_str": "2天前"}]}, {"key": "理想生活实验室_18", "name": "理想生活实验室", "cat": "cn_tech", "color": "#43a047", "items": [{"source": "理想生活实验室", "source_key": "理想生活实验室_18", "cat": "cn_tech", "color": "#43a047", "title": "今日消费资讯：《牛来》将延长上映到 10 月 4 日、张凌赫成为巴黎欧莱雅美发代言人", "title_zh": "今日消费资讯：《牛来》将延长上映到 10 月 4 日、张凌赫成为巴黎欧莱雅美发代言人", "summary": "《牛来》将延长上映到 10 月 4 日8 月 31 日消息，从 8 月 5 日开始公映的《牛来》密钥确认延期，影片将延长上映到 10 月 4 日结束。截止到 8 月 31 日，影片累计票房已达 5979.8 万元。% ARABICA 科威特贾贝尔购物中心“得来速”店开业8 月 29 日，% ARABICA 在科威特贾贝尔·艾哈迈德城（Jaber Al Ahmad City）的贾贝尔购物中心（Jaber Mal
