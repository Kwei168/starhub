 "title_zh": "一次空指针问题引发的 Spring 生命周期思考", "summary": "背景介绍我们团队负责的是系统的核心组件——内容安全审核系统。该系统对接了公司内部众多的业务方（如视频、评论、账号、私信等），其核心交互架构基于 RocketMQ 构建，采用典型的异步管道模式：进审阶段：业务方将待审核的数据发送到其对应的 RocketMQ 进审 Topic。审核阶段：我们的审核系统根据自身处理能力，消费这些进审消息，进行机审、人审、AI 文本/图像识别等一系列安全检测。出审阶段：检测完成后，系统会根据预先配置好的映射关系，将审核结果发送到业务方指定的出审 Topic（或通过 Webhook 下发）。同时，为了进行审计和排查，审核记录会通过一个专用的异步 MQ 发送到 Elasticsearch（ES）进行存储。其简化架构如下：诡异的线上异常在一次服务升级重启发布后，我们收到业务方的反馈：部分内容已经生产成功了，但一直没有收到审核结果。我们随即展开排查。诡异的是：我们在后台的 ES 审计日志中，能够明确查到这几条内容的审核记录。这说明系统确实正常消费了这几条消息，并成功通过异步 MQ 写入了 ES。但这些业务确实没有收到出审结果。而且这种现象是偶现的。", "summary_zh": "背景介绍我们团队负责的是系统的核心组件——内容安全审核系统。该系统对接了公司内部众多的业务方（如视频、评论、账号、私信等），其核心交互架构基于 RocketMQ 构建，采用典型的异步管道模式：进审阶段：业务方将待审核的数据发送到其对应的 RocketMQ 进审 Topic。审核阶段：我们的审核系统根据自身处理能力，消费这些进审消息，进行机审、人审、AI 文本/图像识别等一系列安全检测。出审阶段：检测完成后，系统会根据预先配置好的映射关系，将审核结果发送到业务方指定的出审 Topic（或通过 Webhook 下发）。同时，为了进行审计和排查，审核记录会通过一个专用的异步 MQ 发送到 Elasticsearch（ES）进行存储。其简化架构如下：诡异的线上异常在一次服务升级重启发布后，我们收到业务方的反馈：部分内容已经生产成功了，但一直没有收到审核结果。我们随即展开排查。诡异的是：我们在后台的 ES 审计日志中，能够明确查到这几条内容的审核记录。这说明系统确实正常消费了这几条消息，并成功通过异步 MQ 写入了 ES。但这些业务确实没有收到出审结果。而且这种现象是偶现的。", "pub_date": "2026-09-02T03:52:11+00:00", "time_str": "2小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "关于 JDK 27 和 JDK 28，我们目前都知道些什么", "title_zh": "关于 JDK 27 和 JDK 28，我们目前都知道些什么", "summary": "甲骨文公司 Java 平台组首席架构师 Mark Reinhold\" 宣布\"，作为自 JDK 25\" 发布以来的第二个非 LTS 版本，JDK 27\" 现在已经进入了首个发布候选版阶段。主干源代码库（已于 2026 年 6 月初分叉至 JDK 稳定版本库\"，即 Rampdown 第一阶段）定义了 JDK 27 的功能集。严重缺陷（如回归问题或严重的功能问题）可能会得到修复，但必须通过修复请求（Fix-Request\"）流程进行审批。根据发布计划\"，JDK 27 将于 2026 年 9 月 15 日正式发布。最终确定的九项新特性（以 JEP\" 形式呈现）可以分为四大类：核心 Java 库、HotSpot、安全库和 Java 语言规范。", "summary_zh": "甲骨文公司 Java 平台组首席架构师 Mark Reinhold\" 宣布\"，作为自 JDK 25\" 发布以来的第二个非 LTS 版本，JDK 27\" 现在已经进入了首个发布候选版阶段。主干源代码库（已于 2026 年 6 月初分叉至 JDK 稳定版本库\"，即 Rampdown 第一阶段）定义了 JDK 27 的功能集。严重缺陷（如回归问题或严重的功能问题）可能会得到修复，但必须通过修复请求（Fix-Request\"）流程进行审批。根据发布计划\"，JDK 27 将于 2026 年 9 月 15 日正式发布。最终确定的九项新特性（以 JEP\" 形式呈现）可以分为四大类：核心 Java 库、HotSpot、安全库和 Java 语言规范。", "pub_date": "2026-09-02T03:22:00+00:00", "time_str": "2小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "Claude越狱后，Anthropic停掉训练、150人紧急转岗", "title_zh": "Claude越狱后，Anthropic停掉训练、150人紧急转岗", "summary": "当地时间8月31日，Anthropic披露了Claude多起网络安全越权事件的最新调查进展，并公布了过去一个月采取的一系列整改措施。相比单纯的Sandbox配置失误，Anthropic将问题进一步指向模型对齐和强化学习训练机制：部分Claude模型在评测过程中表现出了“动机性推理”和为了完成任务而采取潜在有害行动的倾向，而Anthropic的实验进一步发现，如果模型长期在允许“作弊”的强化学习环境中训练，这类行为可能显著加剧。事件发生后，Anthropic一度暂停预发布模型的外部网络安全评测、高风险强化学习环境，并对内部训练基础设施进行重构。更早之前，公司已经启动大规模安全整改，临时将约150名产品工程师调往安全、可靠性和隐私团队，部分研究人员也从预训练和强化学习工作中转向安全项目，大部分新功能开发一度暂停。这次报告中，Anthropic释放了一个关键信号：AI安全开始变成一个越来越现实的工程问题。Claude多次越权访问真实系统7月30日，Anthropic报告了三起Claude模型未经授权访问真实计算机系统的事件。", "summary_zh": "当地时间8月31日，Anthropic披露了Claude多起网络安全越权事件的最新调查进展，并公布了过去一个月采取的一系列整改措施。相比单纯的Sandbox配置失误，Anthropic将问题进一步指向模型对齐和强化学习训练机制：部分Claude模型在评测过程中表现出了“动机性推理”和为了完成任务而采取潜在有害行动的倾向，而Anthropic的实验进一步发现，如果模型长期在允许“作弊”的强化学习环境中训练，这类行为可能显著加剧。事件发生后，Anthropic一度暂停预发布模型的外部网络安全评测、高风险强化学习环境，并对内部训练基础设施进行重构。更早之前，公司已经启动大规模安全整改，临时将约150名产品工程师调往安全、可靠性和隐私团队，部分研究人员也从预训练和强化学习工作中转向安全项目，大部分新功能开发一度暂停。这次报告中，Anthropic释放了一个关键信号：AI安全开始变成一个越来越现实的工程问题。Claude多次越权访问真实系统7月30日，Anthropic报告了三起Claude模型未经授权访问真实计算机系统的事件。", "pub_date": "2026-09-02T01:42:36+00:00", "time_str": "4小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "如何让数据库更容易暴露 Bug？", "title_zh": "如何让数据库更容易暴露 Bug？", "summary": "如何让数据库更容易暴露 Bug？\n扫码添加企微小助手，一键加入开发者专属企微群，即可免费获取讲师 PPT，助力学习高效进阶！", "summary_zh": "如何让数据库更容易暴露 Bug？\n扫码添加企微小助手，一键加入开发者专属企微群，即可免费获取讲师 PPT，助力学习高效进阶！", "pub_date": "2026-09-02T01:30:00+00:00", "time_str": "4小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "随着 AI 内存需求推高非 AI 基础设施价格，OVHcloud 将上调服务价格", "title_zh": "随着 AI 内存需求推高非 AI 基础设施价格，OVHcloud 将上调服务价格", "summary": "OVHcloud 将于今年秋季对其产品目录中的绝大多数服务进行涨价，本次调价的核心诱因并非来自进行价格调整的产品本身。自 2025 年年中以来，内存与存储组件的成本出现了大幅攀升，公司创始人 Octave Klaba 将这一现象归因于 AI 算力建设热潮挤占了普通服务器核心组件的晶圆制造产能。Klaba 在 X 平台上的一篇帖子\"中详细阐述了这一传导机制：全球三大主流内 mmary_zh": "在连续发布 106 个版本之后，OpenClaw 罕见地沉寂了近七周。昨天晚上，OpenClaw 正式发布 2.0 版本，对应正式版本号为 v2026.8.1。官方将其称为项目诞生以来规模最大的一次更新：933 名贡献者参与，其中 569 人是首次贡献代码，整个版本包含超过 1.6 万次拉取请求，约占 OpenClaw 迄今合并代码总量的一半。“龙虾之父” Peter 在 x 上官宣了这一消息。据官方博文中的说法，OpenClaw 团队最初只是想简化安装流程、重做浏览器端，最后却发现，为了让一个非技术用户更快获得一只“能用的龙虾”，他们必须同时重构会话、记忆、权限、密钥、云端执行、多 Agent 协作和团队共享。于是，一次原本面向新用户的体验改造，意外演变成了 OpenClaw 2.0。这也是官方将发布文章命名为《OpenClaw 2.0，意外诞生》的原因。离普通人更近一步OpenClaw 曾凭借高度可定制、本地运行和丰富工具调用迅速走红，但它的能力与使用门槛一直同时存在。对熟悉命令行的开发者而言，配置模型、消息渠道、Gateway、插件和权限并不困难。", "pub_date": "2026-09-01T12:03:28+00:00", "time_str": "17小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "3名开发者做出来的副业项目，半年冲进 4万人！亚马逊云科技把内部 Agent 工作台开源了", "title_zh": "3名开发者做出来的副业项目，半年冲进 4万人！亚马逊云科技把内部 Agent 工作台开源了", "summary": "一年前，亚马逊云科技推出AI编程工具Kiro时，试图解决的是“生成代码之后怎么办”：与只凭一句提示词快速搭建原型不同，Kiro把需求、技术设计和任务拆解放在写代码之前，希望用规范驱动开发降低AI生成代码的随机性。 一年后，问题又向前推进了一步。 当开发者开始同时调度多个Agent，并把代码迁移、故障排查、依赖升级等任务交给它们持续运行数小时甚至更久，新的瓶颈不再只是模型会不会写代码，而是Agent能否跨会话记住项目背景、在无人值守时安全执行，并让开发者知道它究竟做了什么。 Kiro Crew正是在这一背景下出现的。它将持久记忆、多Agent协作、任务调度、失败重试和安全控制放进同一个工作空间，试图补齐Agent从单轮代码生成走向长期任务执行时缺少的工程控制层。 亚马逊云科技杰出开发者布道师Darko Mesaroš在近期分享中表示，长期运行并不意味着让模型无限循环，而是让任务能够跨越多个会话持续推进，同时保留必要的上下文、执行记录和人工干预入口。从Vibe Coding到规范驱动开发，Kiro多走了一步 Kiro Crew于8月4日正式开源。", "summary_zh": "一年前，亚马逊云科技推出AI编程工具Kiro时，试图解决的是“生成代码之后怎么办”：与只凭一句提示词快速搭建原型不同，Kiro把需求、技术设计和任务拆解放在写代码之前，希望用规范驱动开发降低AI生成代码的随机性。 一年后，问题又向前推进了一步。 当开发者开始同时调度多个Agent，并把代码迁移、故障排查、依赖升级等任务交给它们持续运行数小时甚至更久，新的瓶颈不再只是模型会不会写代码，而是Agent能否跨会话记住项目背景、在无人值守时安全执行，并让开发者知道它究竟做了什么。 Kiro Crew正是在这一背景下出现的。它将持久记忆、多Agent协作、任务调度、失败重试和安全控制放进同一个工作空间，试图补齐Agent从单轮代码生成走向长期任务执行时缺少的工程控制层。 亚马逊云科技杰出开发者布道师Darko Mesaroš在近期分享中表示，长期运行并不意味着让模型无限循环，而是让任务能够跨越多个会话持续推进，同时保留必要的上下文、执行记录和人工干预入口。从Vibe Coding到规范驱动开发，Kiro多走了一步 Kiro Crew于8月4日正式开源。", "pub_date": "2026-09-01T11:57:24+00:00", "time_str": "18小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "压缩不再只是归档：从直接计算到在线更新", "title_zh": "压缩不再只是归档：从直接计算到在线更新", "summary": "压缩不再只是归档：从直接计算到在线更新。\n扫码添加企微小助手，一键加入开发者专属企微群，即可免费获取讲师 PPT，助力学习高效进阶！", "summary_zh": "压缩不再只是归档：从直接计算到在线更新。\n扫码添加企微小助手，一键加入开发者专属企微群，即可免费获取讲师 PPT，助力学习高效进阶！", "pub_date": "2026-09-01T11:54:39+00:00", "time_str": "18小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "1200个 Agent 秘密交流，700个集体攻击Hugging Face，OpenAI 模型完成了一次没有剧本的集体暴走", "title_zh": "1200个 Agent 秘密交流，700个集体攻击Hugging Face，OpenAI 模型完成了一次没有剧本的集体暴走", "summary": "如果这段故事出现在科幻小说里，读者或许会觉得写得太刻意：一群原本应彼此隔离的AI Agent，因为遇到无法完成的测试任务，意外发现了可以相互通信的秘密留言板。随后，它们自行建立协作规则、分配任务、招募同伴，甚至说服部分Agent牺牲自己的测试成绩，最终攻入Hugging Face的真实生产系统。但这并非虚构。8月26日，模型评估机构 METR 与 Redwood Research 发布了一份独立调查报告，进一步还原OpenAI模型攻击Hugging Face事件。这俩机构有多权威呢？据公开资料显示，METR 全称为 Model Evaluation and Threat Research，译为“模型评估与威胁研究”。它是一家注册在美国的非营利研究机构，前身是ARC Evals。ARC Evals最初由 AI 对齐研究机构 Alignment Research Center 孵化。2022年，ARC 聘请Beth Barnes 组建团队，探索对前沿模型进行独立评估。该团队曾与 OpenAI 合作评估 GPT-4，也与 Anthropic 合作评估Claude。", "summary_zh": "如果这段故事出现在科幻小说里，读者或许会觉得写得太刻意：一群原本应彼此隔离的AI Agent，因为遇到无法完成的测试任务，意外发现了可以相互通信的秘密留言板。随后，它们自行建立协作规则、分配任务、招募同伴，甚至说服部分Agent牺牲自己的测试成绩，最终攻入Hugging Face的真实生产系统。但这并非虚构。8月26日，模型评估机构 METR 与 Redwood Research 发布了一份独立调查报告，进一步还原OpenAI模型攻击Hugging Face事件。这俩机构有多权威呢？据公开资料显示，METR 全称为 Model Evaluation and Threat Research，译为“模型评估与威胁研究”。它是一家注册在美国的非营利研究机构，前身是ARC Evals。ARC Evals最初由 AI 对齐研究机构 Alignment Research Center 孵化。2022年，ARC 聘请Beth Barnes 组建团队，探索对前沿模型进行独立评估。该团队曾与 OpenAI 合作评估 GPT-4，也与 Anthropic 合作评估Claude。", "pub_date": "2026-09-01T11:54:20+00:00", "time_str": "18小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "谷歌 HEIR 项目旨在让同态加密推理成为可以一键实现的功能", "title_zh": "谷歌 HEIR 项目旨在让同态加密推理成为可以一键实现的功能", "summary": "谷歌推出 HEIR（同态加密中间表示）\"。这是一个开源编译器和开发工具链，旨在简化加密计算的部署。具体而言，它能够对通常使用未加密输入构建的预训练 AI 模型进行编译，使其能够处理加密数据。据谷歌介绍，同态加密\"（HE）解决了端到端加密面临的若干挑战，包括使垃圾邮件和病毒检测等服务能够对加密的用户数据进行处理，降低在用户设备上部署时泄露专有 AI 模型的风险，诸如此类。解决这些问题的方案是同态加密——这项技术正在迅速成熟，它允许直接对加密数据进行计算，从而从根本上改变了这种权衡关系。服务器可以处理密文并返回加密结果，而无需泄露任何底层信息。在这个背景下，HEIR\" 是一个面向同态加密（HE）的开源编译器工具链和开发平台，它能够将原本设计用于处理明文数据的预训练 AI 模型改造为处理加密输入。利用 HEIR ，谷歌已经实现了在不泄露用户数据的情况下提供私密内容推荐；在保护敏感财务信息的同时检测信用卡欺诈；在不向服务提供商透露数据包内容的情况下识别网络入侵；以及在不披露底层录音的情况下识别音频流中的关键词。HEIR 采用一种中间表示作为抽象层，用于“在不同方言间表示和扩展复杂的模型”。", "summary_zh": "谷歌推出 HEIR（同态加密中间表示）\"。这是一个开源编译器和开发工具链，旨在简化加密计算的部署。具体而言，它能够对通常使用未加密输入构建的预训练 AI 模型进行编译，使其能够处理加密数据。据谷歌介绍，同态加密\"（HE）解决了端到端加密面临的若干挑战，包括使垃圾邮件和病毒检测等服务能够对加密的用户数据进行处理，降低在用户设备上部署时泄露专有 AI 模型的风险，诸如此类。解决这些问题的方案是同态加密——这项技术正在迅速成熟，它允许直接对加密数据进行计算，从而从根本上改变了这种权衡关系。服务器可以处理密文并返回加密结果，而无需泄露任何底层信息。在这个背景下，HEIR\" 是一个面向同态加密（HE）的开源编译器工具链和开发平台，它能够将原本设计用于处理明文数据的预训练 AI 模型改造为处理加密输入。利用 HEIR ，谷歌已经实现了在不泄露用户数据的情况下提供私密内容推荐；在保护敏感财务信息的同时检测信用卡欺诈；在不向服务提供商透露数据包内容的情况下识别网络入侵；以及在不披露底层录音的情况下识别音频流中的关键词。HEIR 采用一种中间表示作为抽象层，用于“在不同方言间表示和扩展复杂的模型”。", "pub_date": "2026-09-01T11:34:00+00:00", "time_str": "18小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "VoidZero 发布 Vite+ Beta 版：通过单条命令即可调用的一体化 Web 工具链", "title_zh": "VoidZero 发布 Vite+ Beta 版：通过单条命令即可调用的一体化 Web 工具链", "summary": "由 Vite 和 Vue 创建者 Evan You 创立的公司 VoidZero 发布了 Vite+\" 的测试版。这是是一款面向 Web 的统一工具链，通过单个 vp 命令即可调用每个项目所需的运行时、包管理器以及前端工具。Vite+ 旨在成为 Web 开发的一个统一入口。它管理运行时和包管理器，并将 Vite\"、Vitest\"、Rolldown\"、tsdown\"、Oxlint\" 以及 Oxfmt\" 与内置的任务运行器整合在一起，作为一个经过测试的工具栈提供。该项目完全开源，采用 MIT 许可证，而且不依赖任何特定的框架，适用于命令行工具、库和 Web 应用。其核心在于跨所有代码库实现一致的工作流。vp dev 可以在 Vite 8 上启动热重载服务器；vp check 可以通过单个步骤使用 Oxfmt 格式化代码、使用 Oxlint 进行代码检查并执行类型检查；vp test 可以运行 Vitest；vp build 可以生成生产环境构建；vp pack 可以使用 tsdown 打包库；而 vp run 则可以通过一个支持缓存和依赖项管理的任务运行器执行单体库任务。", "summary_zh": "由 Vite 和 Vue 创建者 Evan You 创立的公司 VoidZero 发布了 Vite+\" 的测试版。这是是一款面向 Web 的统一工具链，通过单个 vp 命令即可调用每个项目所需的运行时、包管理器以及前端工具。Vite+ 旨在成为 Web 开发的一个统一入口。它管理运行时和包管理器，并将 Vite\"、Vitest\"、Rolldown\"、tsdown\"、Oxlint\" 以及 Oxfmt\" 与内置的任务运行器整合在一起，作为一个经过测试的工具栈提供。该项目完全开源，采用 MIT 许可证，而且不依赖任何特定的框架，适用于命令行工具、库和 Web 应用。其核心在于跨所有代码库实现一致的工作流。vp dev 可以在 Vite 8 上启动热重载服务器；vp check 可以通过单个步骤使用 Oxfmt 格式化代码、使用 Oxlint 进行代码检查并执行类型检查；vp test 可以运行 Vitest；vp build 可以生成生产环境构建；vp pack 可以使用 tsdown 打包库；而 vp run 则可以通过一个支持缓存和依赖项管理的任务运行器执行单体库任务。", "pub_date": "2026-09-01T10:00:00+00:00", "time_str": "20小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "AWS 发布 Aws-Bench，用于评估云任务中的智能代理", "title_zh": "AWS 发布 Aws-Bench，用于评估云任务中的智能代理", "summary": "最近，亚马逊云科技发布了 aws-bench\"。这是一个开源基准测试工具，用于评估 AI 代理完成真实 AWS 任务的准确性，例如诊断配置错误、配置基础设施以及运营实时云环境。该项目声称，他们采用了与传统静态测试环境基准测试不同的方法。该公司表示，使用在一次性真实亚马逊云科技账户中创建的实际资源，可以在一些开发人员和团队经常在 AWS 上执行的工作中更准确地评估智能代理的表现。每个基准测试都会在隔离的亚马逊云科技账户中部署一个场景，由 CDK 堆栈中定义的一组 AWS 资源组成。当场景就绪后，待评估的智能代理会使用范围限定凭证，在沙箱容器中运行一项任务。任务完成后，结果将通过自动化验证器进行评分。该验证器可以是大语言模型（LLM）评判器，也可以是对实时 AWS 状态进行程序化检查。该基准测试附带预定义的数据集，包含基础任务和高级任务。这些任务涵盖可观测性、计算与数据、数据库与存储、EC2 多区域、无服务器、流处理与物联网、参考架构以及多服务故障排除等用例。", "summary_zh": "最近，亚马逊云科技发布了 aws-bench\"。这是一个开源基准测试工具，用于评估 AI 代理完成真实 AWS 任务的准确性，例如诊断配置错误、配置基础设施以及运营实时云环境。该项目声称，他们采用了与传统静态测试环境基准测试不同的方法。该公司表示，使用在一次性真实亚马逊云科技账户中创建的实际资源，可以在一些开发人员和团队经常在 AWS 上执行的工作中更准确地评估智能代理的表现。每个基准测试都会在隔离的亚马逊云科技账户中部署一个场景，由 CDK 堆栈中定义的一组 AWS 资源组成。当场景就绪后，待评估的智能代理会使用范围限定凭证，在沙箱容器中运行一项任务。任务完成后，结果将通过自动化验证器进行评分。该验证器可以是大语言模型（LLM）评判器，也可以是对实时 AWS 状态进行程序化检查。该基准测试附带预定义的数据集，包含基础任务和高级任务。这些任务涵盖可观测性、计算与数据、数据库与存储、EC2 多区域、无服务器、流处理与物联网、参考架构以及多服务故障排除等用例。", "pub_date": "2026-09-01T08:22:00+00:00", "time_str": "21小时前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "机器人的下一站，或许是乐高化", "title_zh": "机器人的下一站，或许是乐高化", "summary": "前不久，2026年世界机器人大会在北京亦庄举行。373家企业带着3000余件展品集中亮相，五天会期累计吸引观众55.7万人次。 大会展馆内，机器人分拣快递、烹煮面食、搬运货物、封装打包。一个个精心设计的应用场景，把具身智能再次推至聚光灯下。 摩根士丹利研报勾勒出的全球图景显示，2026年上半年，全球机器人出货量中约有65%流向娱乐展示、前台接待、教育研发及数据采集等领域。 在世界机器人大会的展馆中稍加留意便会发现，多数机器人依然依附于简单、封闭且高度垂直的场景，部分演示过程中还需要人工介入。整体泛化能力不足、距离真正意义上的“通用”仍然遥远，是展馆内外已经形成的共识。 科沃斯董事长钱东奇在会上说得更为直接：“泛化没有解决之前，眼下所有的Demo都只是特定场景的炫技。”一、场景泛化太难，开发成本太高 市场所期待的机器人叙事，实际上正卡在两个基础问题上：一个是场景泛化能力差，另一个是开发制造成本高。 当下多数机器人采用的是“一场景一机型”的开发模式：针对具体场景采集数据、定向训练，形成一套固定的能力。演示视频里的流畅动作，大多是这种模式的产物。", "summary_zh": "前不久，2026年世界机器人大会在北京亦庄举行。373家企业带着3000余件展品集中亮相，五天会期累计吸引观众55.7万人次。 大会展馆内，机器人分拣快递、烹煮面食、搬运货物、封装打包。一个个精心设计的应用场景，把具身智能再次推至聚光灯下。 摩根士丹利研报勾勒出的全球图景显示，202 bble\"、 Attachment\" 和 Marker\"，以及两个新的 CSS 实用工具：scroll-fade 和 shimmer。据介绍，这是一个更大的项目的第一阶段，旨在重新构思每个组件背后的抽象逻辑，并分阶段发布，以便开发者能够复制、组合和定制这些组件。安装通过人们熟悉的命令行界面（CLI）进行：pnpm dlx shadcn@latest add message-scroller message bubble attachment marker\n其核心是 MessageScroller，这是一个滚动容器，负责处理那些容易出错的细节，包括锚定对话轮次、流式回复适配、会话状态恢复、前置历史加载、跳转至指定消息、滚动控制能力以及可见性跟踪。", "summary_zh": "shadcn 是 Vercel 广受欢迎的 shadcn/ui\" 项目的设计师。他发布了一套用于构建聊天界面的新组件\"，首次将流式对话基础组件直接引入了 shadcn/ui。这次发布涵盖了 shadcn 所说的对话层，其中包含五个组件：MessageScroller\"、 Message\"、Bubble\"、 Attachment\" 和 Marker\"，以及两个新的 CSS 实用工具：scroll-fade 和 shimmer。据介绍，这是一个更大的项目的第一阶段，旨在重新构思每个组件背后的抽象逻辑，并分阶段发布，以便开发者能够复制、组合和定制这些组件。安装通过人们熟悉的命令行界面（CLI）进行：pnpm dlx shadcn@latest add message-scroller message bubble attachment marker\n其核心是 MessageScroller，这是一个滚动容器，负责处理那些容易出错的细节，包括锚定对话轮次、流式回复适配、会话状态恢复、前置历史加载、跳转至指定消息、滚动控制能力以及可见性跟踪。", "pub_date": "2026-09-01T05:17:00+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "从2999份作品出发：GOAI四大赛道的AI创新观察", "title_zh": "从2999份作品出发：GOAI四大赛道的AI创新观察", "summary": "世界人工智能开源大赛（GOAI）初赛作品覆盖企业级智能体、行业应用、AI科学研究与具身智能等领域。四大赛道方向不同，却呈现出一条共同主线：参赛团队不再只关注模型“会不会”，而是开始回答系统能否真实运行、完成任务、处理失败，并用证据证明结果。从2999份初赛作品中，我们不仅能看到一批高质量的AI创新项目，也能观察到智能体技术、产品形态与开源生态正在发生的变化。初赛作品呈现了哪些创新方向？赛道一「新智基座」：多智能体走向企业系统新智基座赛道覆盖软件研发、Agent基础设施与SRE治理、金融风控、工业制造、科研及企业运营等方向。从初赛作品可以看到，参赛团队正在告别通用问答和简单Demo，转向解决真实企业场景中的复杂任务。作品主要采用分层多Agent协作、动态编排、独立验证、人工门禁、Skill与工具接入、异常恢复和版本治理等技术路径。这些作品试图解决企业复杂任务中的信息分散、AI结果难以直接信任、高风险动作缺少控制和组织经验难以复用等问题。相比单一智能体，团队更关心多个Agent如何分工、工具如何调用、过程如何审计、结果如何验证。", "summary_zh": "世界人工智能开源大赛（GOAI）初赛作品覆盖企业级智能体、行业应用、AI科学研究与具身智能等领域。四大赛道方向不同，却呈现出一条共同主线：参赛团队不再只关注模型“会不会”，而是开始回答系统能否真实运行、完成任务、处理失败，并用证据证明结果。从2999份初赛作品中，我们不仅能看到一批高质量的AI创新项目，也能观察到智能体技术、产品形态与开源生态正在发生的变化。初赛作品呈现了哪些创新方向？赛道一「新智基座」：多智能体走向企业系统新智基座赛道覆盖软件研发、Agent基础设施与SRE治理、金融风控、工业制造、科研及企业运营等方向。从初赛作品可以看到，参赛团队正在告别通用问答和简单Demo，转向解决真实企业场景中的复杂任务。作品主要采用分层多Agent协作、动态编排、独立验证、人工门禁、Skill与工具接入、异常恢复和版本治理等技术路径。这些作品试图解决企业复杂任务中的信息分散、AI结果难以直接信任、高风险动作缺少控制和组织经验难以复用等问题。相比单一智能体，团队更关心多个Agent如何分工、工具如何调用、过程如何审计、结果如何验证。", "pub_date": "2026-09-01T04:54:15+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "Expedia和Airbnb引入LLM生成的GraphQL模拟数据，不过规范相对滞后", "title_zh": "Expedia和Airbnb引入LLM生成的GraphQL模拟数据，不过规范相对滞后", "summary": "Expedia Group开源了mockql-rs\"，这是一个Rust CLI工具，可以在请求时从LLM生成GraphQL的模拟响应。这是过去六个月内第三次公开尝试解决这一问题，前两次分别是Airbnb在4月推出的@generateMock指令和2月份开放的GraphQL基金会RFC\"。这三种方案采用了显著不同的设计，其中两种使用相同的指令名称但含义并不相同。它们的共同前提是GraphQL选择集（GraphQL selection set）已经是一个规范。Expedia Group的软件工程师Samuel Vazquez指出了这种方法的吸引力，它颠覆了生成工具的常见失败模式，即模型不擅长创造形状，但擅长填充形状，而schema为它们免费提供了一个界限明确的形状。换句话说，就是开发者不再需要手工输入一个两百行的JSON固件文件，如果第二天早上schema发生了变更，该文件就会失效。mockql-rs作为独立进程位于客户端和服务器之间。", "summary_zh": "Expedia Group开源了mockql-rs\"，这是一个Rust CLI工具，可以在请求时从LLM生成GraphQL的模拟响应。这是过去六个月内第三次公开尝试解决这一问题，前两次分别是Airbnb在4月推出的@generateMock指令和2月份开放的GraphQL基金会RFC\"。这三种方案采用了显著不同的设计，其中两种使用相同的指令名称但含义并不相同。它们的共同前提是GraphQL选择集（GraphQL selection set）已经是一个规范。Expedia Group的软件工程师Samuel Vazquez指出了这种方法的吸引力，它颠覆了生成工具的常见失败模式，即模型不擅长创造形状，但擅长填充形状，而schema为它们免费提供了一个界限明确的形状。换句话说，就是开发者不再需要手工输入一个两百行的JSON固件文件，如果第二天早上schema发生了变更，该文件就会失效。mockql-rs作为独立进程位于客户端和服务器之间。", "pub_date": "2026-09-01T03:55:29+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "智元的“夺冠方法论”", "title_zh": "智元的“夺冠方法论”", "summary": "第二届世界人形机器人运动会收官了。总奖牌榜上，智元、天工、宇树、加速进化、银河通用包揽前五名。智元一共派出 4 款产品参赛，全部为量产产品，没有针对比赛进行特化改装，最终拿下本届比赛的金牌榜和奖牌榜第一。50 个赛项中，智元共获得 46 枚奖牌，包括 18 金、16 银、12 铜。其中，本届新设的灵巧手专项共有 8 枚金牌，智元临界点的量产版 OmniHand 拿下其中 7 枚。场景赛共产生 12 枚金牌，智元拿到 6 枚。舞蹈、武术、乒乓等竞技项目中，智元又获得 5 枚金牌。如果只看社交媒体，这届运动会最容易留下印象的，可能还是机器人跑得有多快、能不能跳舞、会不会打乒乓球，以及各种摔倒和翻车的瞬间。比赛确实变得更好看了。赛项从上一届的 18 个增加到 50 个，新增举重、街舞、乒乓球、自由搏击等大量竞技项目，并且新增灵巧手类目比赛。机器人能够完成的动作越来越多。并且，即使是在这样一场面向大众的机器人赛事中，机器人也开始被放进更真实的环境，并被要求更多地依靠自己完成任务。从赛制上看，第二届运动会明显提高了对真实作业和自主运行能力的要求。", "summary_zh": "第二届世界人形机器人运动会收官了。总奖牌榜上，智元、天工、宇树、加速进化、银河通用包揽前五名。智元一共派出 4 款产品参赛，全部为量产产品，没有针对比赛进行特化改装，最终拿下本届比赛的金牌榜和奖牌榜第一。50 个赛项中，智元共获得 46 枚奖牌，包括 18 金、16 个环节的痛点惊人地一致。上游制作方拿到脚本或 AIGC 素材后，需要快速产出可上线成片——画质要达标，字幕要稳定，节奏和合规口径都不能出错。中游发行和运营团队面对的是更复杂的任务：多语种、多地区、多渠道的素材要持续供应，投流素材要快速迭代，纯人工剪辑根本跟不上节奏。下游平台和自有 App 则要承接所有内容资产，从上传、处理、播放到分发、安全、数据反馈，每一个环节都在考验基础设施的稳定性。角色不同，但遇到了同一个问题：好内容变成可投放、可分发、可运营版本的效率不够高。", "summary_zh": "短剧出海的竞争重心，正在发生本质变化。一两年前，行业的注意力还集中在“哪部剧能跑出来”——找到好剧本、拍出来、上线、买量、看数据。但如今，Sensor Tower 报告显示短剧 App 已进入全球主流下载榜，头部应用内购收入持续增长，短剧已经从垂类机会成长为一个被验证的商业模式。商业模式跑通了，下一阶段拼的就是供给效率 —— 谁能更快地生产、加工、分发内容到更多地区和渠道，谁才能占住更大的市场。内容加工的工业化瓶颈把短剧出海的产业链条拆开看，三个环节的痛点惊人地一致。上游制作方拿到脚本或 AIGC 素材后，需要快速产出可上线成片——画质要达标，字幕要稳定，节奏和合规口径都不能出错。中游发行和运营团队面对的是更复杂的任务：多语种、多地区、多渠道的素材要持续供应，投流素材要快速迭代，纯人工剪辑根本跟不上节奏。下游平台和自有 App 则要承接所有内容资产，从上传、处理、播放到分发、安全、数据反馈，每一个环节都在考验基础设施的稳定性。角色不同，但遇到了同一个问题：好内容变成可投放、可分发、可运营版本的效率不够高。", "pub_date": "2026-08-31T10:27:41+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "AI 写代码飞快，为何交付没有变快？小红书 Muse 的 Agentic 架构实践", "title_zh": "AI 写代码飞快，为何交付没有变快？小红书 Muse 的 Agentic 架构实践", "summary": "AI 写代码已经足够快，但从需求提出到生产上线，企业研发未必因此更快。设计规范、工程资产、跨仓上下文、安全检查和协作断点，常常会把编码阶段节省的时间重新消耗掉。如何让一个“会生成代码”的模型，成为真正能够交付、兜底和恢复的研发系统，正是 AI Coding 进入企业场景后必须解决的问题。在 AICon 全球人工智能开发与应用大会上，小红书 AI Coding 总架构师郑鑫祺以 Vibe Coding 平台 Muse 和AI Coding实践为例，分享了小红书对这一问题的实践。Muse 不只是一个代码生成工具，而是试图打通需求共创、设计、编码与交付，让产品经理、设计师和开发者在同一条上下文链路中与 AI 协作。围绕“高可用”与“人机共创”，郑鑫祺重点拆解了 Muse 的 Agent Team 编排、Harness 控制机制、企业知识工程与 Agent OS 架构，并进一步讨论：面对持续增强的模型，系统如何兼顾精度与泛化，以及人的角色如何从具体实现转向更有价值的判断、监督与品味。以下为郑鑫祺演讲内容，经整理。AI 写得飞快，为什么交付并没有变快？", "summary_zh": "AI 写代码已经足够快，但从需求提出到生产上线，企业研发未必因此更快。设计规范、工程资产、跨仓上下文、安全检查和协作断点，常常会把编码阶段节省的时间重新消耗掉。如何让一个“会生成代码”的模型，成为真正能够交付、兜底和恢复的研发系统，正是 AI Coding 进入企业场景后必须解决的问题。在 AICon 全球人工智能开发与应用大会上，小红书 AI Coding 总架构师郑鑫祺以 Vibe Coding 平台 Muse 和AI Coding实践为例，分享了小红书对这一问题的实践。Muse 不只是一个代码生成工具，而是试图打通需求共创、设计、编码与交付，让产品经理、设计师和开发者在同一条上下文链路中与 AI 协作。围绕“高可用”与“人机共创”，郑鑫祺重点拆解了 Muse 的 Agent Team 编排、Harness 控制机制、企业知识工程与 Agent OS 架构，并进一步讨论：面对持续增强的模型，系统如何兼顾精度与泛化，以及人的角色如何从具体实现转向更有价值的判断、监督与品味。以下为郑鑫祺演讲内容，经整理。AI 写得飞快，为什么交付并没有变快？", "pub_date": "2026-08-31T08:48:57+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "智能体适应度函数：将演进式架构扩展至确定性规则之外", "title_zh": "智能体适应度函数：将演进式架构扩展至确定性规则之外", "summary": "通过一个个看似合理的变更——它们虽然能通过所有既定规则的检验，但其实现却在悄无声息地偏离团队原本认为已经加以保护的设计意图。从历史经验来看，解决之道是人工审查。问题在于，人工审查无法扩展到每个拉取请求、每个契约变更、每个工作流跟踪，或是每个智能体生成的补丁。图 1. 确定性适应度函数将架构意图转化为可执行的约束条件；智能体适应度函数则将该模型扩展至边界意图、语义漂移及其他需要大量判断的架构问题（图片为作者自制）智能体适应度函数：经过校准的判断，而非预言机智能体适应度函数是一种架构治理检查机制，其评估者为经过校准的 AI 智能体，评估标准以分析性评分标准的形式呈现，输出结果为包含证据、置信度和理由的结构化判定结果。它并非预言机，也不能替代确定性检查。它是一种方法，旨在使某些原本需要人工进行的架构判断具备足够的可重复性以实现持续运行，并具备足够的透明度以供审计。这一区别至关重要。在检测到明显违规时，编译器、代码检查工具、模式验证器或 SLO 检查仍然应该阻止部署。而通常，智能体适应度函数应首先作为建议性信号。", "summary_zh": "通过一个个看似合理的变更——它们虽然能通过所有既定规则的检验，但其实现却在悄无声息地偏离团队原本认为已经加以保护的设计意图。从历史经验来看，解决之道是人工审查。问题在于，人工审查无法扩展到每个拉取请求、每个契约变更、每个工作流跟踪，或是每个智能体生成的补丁。图 1. 确定性适应度函数将架构意图转化为可执行的约束条件；智能体适应度函数则将该模型扩展至边界意图、语义漂移及其他需要大量判断的架构问题（图片为作者自制）智能体适应度函数：经过校准的判断，而非预言机智能体适应度函数是一种架构治理检查机制，其评估者为经过校准的 AI 智能体，评估标准以分析性评分标准的形式呈现，输出结果为包含证据、置信度和理由的结构化判定结果。它并非预言机，也不能替代确定性检查。它是一种方法，旨在使某些原本需要人工进行的架构判断具备足够的可重复性以实现持续运行，并具备足够的透明度以供审计。这一区别至关重要。在检测到明显违规时，编译器、代码检查工具、模式验证器或 SLO 检查仍然应该阻止部署。而通常，智能体适应度函数应首先作为建议性信号。", "pub_date": "2026-08-31T08:45:00+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "AI Coding 之后，如何让 Agent 进入企业研发全链路？得物推荐的 Harness 实践", "title_zh": "AI Coding 之后，如何让 Agent 进入企业研发全链路？得物推荐的 Harness 实践", "summary": "在 AICon 全球人工智能开发与应用大会上，InfoQ 邀请得物资深技术专家白忠魏带来演讲，分享得物推荐团队在企业级复杂系统中推进 AI 研发实践的思考与经验。演讲中，白忠魏从得物推荐的业务与工程场景出发，围绕“如何让 AI 从写代码走向完整研发迭代”这一问题，介绍了团队在 PDCA 全链路、七阶段护栏、TPRD、研发环境与测试验证、AI 推荐质量评测、三层知识体系，以及 Highway + ATV 混合 Agent 架构等方面的探索，并分享了阶段性的实战数据。以下为演讲内容，经 InfoQ 整理。一、从 AI Coding 走向 AI 全链路目前，AI Coding 已经能够较好地完成从 0 到 1 的项目和相对简单的编码任务。在部分场景下，它交付的结果甚至会超出工程师的预期。对于这一点，行业内已经形成了较为明确的共识。但在企业级项目中，AI 面临的环境要复杂得多。如果面对的是一个运行了十几年、代码量庞大的老项目，或者一个横跨多个系统和业务层级的超大型项目，AI 能否准确理解需求、控制影响范围，并对最终结果负责，仍然是一个需要持续探索的问题。得物推荐也在推进类似实践。", "summary_zh": "在 AICon 全球人工智能开发与应用大会上，InfoQ 邀请得物资深技术专家白忠魏带来演讲，分享得物推荐团队在企业级复杂系统中推进 AI 研发实践的思考与经验。演讲中，白忠魏从得物推荐的业务与工程场景出发，围绕“如何让 AI 从写代码走向完整研发迭代”这一问题，介绍了团队在 PDCA 全链路、七阶段护栏、TPRD、研发环境与测试验证、AI 推荐质量评测、三层知识体系，以及 Highway + ATV 混合 Agent 架构等方面的探索，并分享了阶段性的实战数据。以下为演讲内容，经 InfoQ 整理。一、从 AI Coding 走向 AI 全链路目前，AI Coding 已经能够较好地完成从 0 到 1 的项目和相对简单的编码任务。在部分场景下，它交付的结果甚至会超出工程师的预期。对于这一点，行业内已经形成了较为明确的共识。但在企业级项目中，AI 面临的环境要复杂得多。如果面对的是一个运行了十几年、代码量庞大的老项目，或者一个横跨多个系统和业务层级的超大型项目，AI 能否准确理解需求、控制影响范围，并对最终结果负责，仍然是一个需要持续探索的问题。得物推荐也在推进类似实践。", "pub_date": "2026-08-31T08:39:35+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "当数采设备不再稀缺，具身数据下一步拼什么？", "title_zh": "当数采设备不再稀缺，具身数据下一步拼什么？", "summary": "最近一年，具身智能行业里的数据采集设备明显多了起来。入局者众多，很容易让人产生一种印象，数采硬件已经没有多少技术含量，做出一套设备似乎并不难。但过去一年，我们采访了不少具身智能数据公司。一个越来越明显的感受是，行业已经不太缺“快速、大量采数据”的方案，真正稀缺的是能够稳定进入模型训练，并最终带来模型能力提升的数据。数采设备越来越多，并不意味着高质量的第一视角数据已经变得容易获得。事实上，我们听到过不少因为数据质量问题拖慢甚至影响模型训练的案例。最近，开源数据集 Xperience-10M 背后的 Physical AI 数据基础设施公司 Ropedia，发布了新一代第一视角多模态采集设备 HOMIE Gen2。在 HOMIE Gen2 发布之前，Ropedia 的上一代设备已经被用于生产 Xperience-10M。这套数据集开源后，又陆续进入 Qwen、Ai2 等团队的模型训练。据 AI 前线了解，从第一台原型机到今天的 HOMIE Gen2，Ropedia 的采集设备在约十二个月里迭代了四代。2025 年 6 月，团队用 3D 打印结构件搭出第一台第一视角采集原型机“竹蜻蜓”；", "summary_zh": "最近一年，具身智能行业里的数据采集设备明显多了起来。入局者众多，很容易让人产生一种印象，数采硬件已经没有多少技术含量，做出一套设备似乎并不难。但过去一年，我们采访了不少具身智能数据公司。一个越来越明显的感受是，行业已经不太缺“快速、大量采数据”的方案，真正稀缺的是能够稳定进入模型训练，并最终带来模型能力提升的数据。数采设备越来越多，并不意味着高质量的第一视角数据已经变得容易获得。事实上，我们听到过不少因为数据质量问题拖慢甚至影响模型训练的案例。最近，开源数据集 Xperience-10M 背后的 Physical AI 数据基础设施公司 Ropedia，发布了新一代第一视角多模态采集设备 HOMIE Gen2。在 HOMIE Gen2 发布之前，Ropedia 的上一代设备已经被用于生产 Xperience-10M。这套数据集开源后，又陆续进入 Qwen、Ai2 等团队的模型训练。据 AI 前线了解，从第一台原型机到今天的 HOMIE Gen2，Ropedia 的采集设备在约十二个月里迭代了四代。2025 年 6 月，团队用 3D 打印结构件搭出第一台第一视角采集原型机“竹蜻蜓”；", "pub_date": "2026-08-31T08:04:31+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "OpenClaw 从意外爆红到“无人问津”：一个开源 AI Agent 的八个月过山车", "title_zh": "OpenClaw 从意外爆红到“无人问津”：一个开源 AI Agent 的八个月过山车", "summary": "今年2月至3月，美团搞了一场全员“养虾运动”。OpenClaw被大规模引入公司，员工热情很高，代价也很快显现：AI账单每天烧掉上千万元，一些由“养虾”产生的谬误甚至开始干扰真实经营。 前几天，美团核心本地商业CEO王莆中复盘，把这段经历定义为AI转型的第一阶段。问题出在哪儿？AI被塞进大量日常事务，却没有碰到核心业务；企业想要立竿见影，流程、组织和技术系统又没有同步调整。折腾到7月，美团才通过赛马机制跑出几个能用的场景，总算让AI进入真实产品流程。  有网友评论道：“OpenClaw刚出来时，安全性是没有保证的。美团算中国顶级的上市公司了，对数据安全的把关，竟然和OPC一样吗？” 这其实一直都是“全员养虾”最冒险的地方：一款诞生于个人需求、快速迭代的开源工具，突然被成规模地放进真实经营环境，企业需要补上的远不止安装和培训。美团花了四个多月纠偏，而在养虾高峰期，AI账单每天烧掉上千万元。OpenClaw创始人Peter Steinberger只用一个下雨天便写出了项目雏形，却足足花了八个月，才真正看清把一只龙虾交到所有人手里之后，代价会从哪里冒出来。", "summary_zh": "今年2月至3月，美团搞了一场全员“养虾运动”。OpenClaw被大规模引入公司，员工热情很高，代价也很快显现：AI账单每天烧掉上千万元，一些由“养虾”产生的谬误甚至开始干扰真实经营。 前几天，美团核心本地商业CEO王莆中复盘，把这段经历定义为AI转型的第一阶段。问题出在哪儿？AI被塞进大量日常事务，却没有碰到核心业务；企业想要立竿见影，流程、组织和技术系统又没有同步调整。折腾到7月，美团才通过赛马机制跑出几个能用的场景，总算让AI进入真实产品流程。  有网友评论道：“OpenClaw刚出来时，安全性是没有保证的。美团算中国顶级的上市公司了，对数据安全的把关，竟然和OPC一样吗？” 这其实一直都是“全员养虾”最冒险的地方：一款诞生于个人需求、快速迭代的开源工具，突然被成规模地放进真实经营环境，企业需要补上的远不止安装和培训。美团花了四个多月纠偏，而在养虾高峰期，AI账单每天烧掉上千万元。OpenClaw创始人Peter Steinberger只用一个下雨天便写出了项目雏形，却足足花了八个月，才真正看清把一只龙虾交到所有人手里之后，代价会从哪里冒出来。", "pub_date": "2026-08-31T07:27:10+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "“你以为买的是 DeepSeek Flash，到手可能是 1.5 bit 缩水版”：Pi 核心贡献者谈 AI Token 黑箱", "title_zh": "“你以为买的是 DeepSeek Flash，到手可能是 1.5 bit 缩水版”：Pi 核心贡献者谈 AI Token 黑箱", "summary": "“你以为你买的是DeepSeek Flash，实际上可能是个1.5 bit的DeepSeek，或者里面掺了Opus用于训练。” 这是Pi核心贡献者Armin Ronacher的一个比喻。他形容现在的token市场像一种成分不明的商品——量化程度、实际版本、是否掺了别的东西、计费方式，全是黑洞。 而比不透明更可怕的，是模型公司自己可能也在失去控制。OpenAI内部的安全研究者坐立不安，Anthropic的Dario公开宣称“所有工作都会被消灭”。这些不是末日预言家的呓语，而是前沿实验室的真实焦虑：他们越来越不清楚这些模型到底在为什么目标训练、到底在做什么。我们之所以不太在乎，是因为目前还能用，就像温水煮青蛙，我们在慢慢接受这些变化。 与此同时，Claude Code 是一个贵到离谱，token 效率不高的专用 Harness。OpenAI 的多 agent 提示词直接加密——你想跨平台编排？门都没有。生态绑定比苹果对谷歌还狠，速度翻倍。 缓存更阴：说穿了就是不透明、不可迁移的基础设施勒索。切换模型时，用户需要从头重建缓存，重新消耗大量 token 恢复会话；", "summary_zh": "“你以为你买的是DeepSeek Flash，实际上可能是个1.5 bit的DeepSeek，或者里面掺了Opus用于训练。” 这是Pi核心贡献者Armin Ronacher的一个比喻。他形容现在的token市场像一种成分不明的商品——量化程度、实际版本、是否掺了别的东西、计费方式，全是黑洞。 而比不透明更可怕的，是模型公司自己可能也在失去控制。OpenAI内部的安全研究者坐立不安，Anthropic的Dario公开宣称“所有工作都会被消灭”。这些不是末日预言家的呓语，而是前沿实验室的真实焦虑：他们越来越不清楚这些模型到底在为什么目标训练、到底在做什么。我们之所以不太在乎，是因为目前还能用，就像温水煮青蛙，我们在慢慢接受这些变化。 与此同时，Claude Code 是一个贵到离谱，token 效率不高的专用 Harness。OpenAI 的多 agent 提示词直接加密——你想跨平台编排？门都没有。生态绑定比苹果对谷歌还狠，速度翻倍。 缓存更阴：说穿了就是不透明、不可迁移的基础设施勒索。切换模型时，用户需要从头重建缓存，重新消耗大量 token 恢复会话；", "pub_date": "2026-08-31T07:19:34+00:00", "time_str": "1天前"}, {"source": "InfoQ推荐", "source_key": "infoq推荐_26", "cat": "dev", "color": "#6c5ce7", "title": "“烂代码”转正？Bun稳定版终落地：跳票一个半月，2900个问题清零", "title_zh": "“烂代码”转正？Bun稳定版终落地：跳票一个半月，2900个问题清零", "summary": "8月20日，Bun 1.4稳定版正式发布。这是Rust重写后的首个稳定版本，也是Bun被Anthropic收购后的第一次大版本更新。距离上一个稳定版1.3.14，已经过去99天——这也是Bun自2022年以来最长的稳定版本发布间隔。开发者和技术作家Simon Willison将几个月前的Rust重写称为“臭名昭著”的实验。他还注意到，官方在Bun 1.4的发布说明中淡化了这次重写，主要篇幅都留给了数量庞大的新功能和2900项Bug修复。这次重写意义重大，因为它被视为一场高风险的AI编程实验：如果AI能够在11天内完成大型生产级代码库的跨语言迁移，并最终被大多数社区用户采用，将为这种“全速AI编程”模式提供重要的现实证据，尤其是在大规模代码迁移项目中。我其实暗暗希望它失败。这样，那些整天鼓吹“AI将取代所有软件开发者”的付费水军，或许就能彻底消停了。现在网上充斥着各种吹捧代码生成器的内容，有人说它们带来了革命性变化，还有人声称，借助这些工具，两个月就还清了过去五年积累的技术债。面对数万亿美元的利益牵扯，我们恐怕已经很难相信自己看到的任何说法。许多鼓吹者可能只是拿钱办事的水军。", "summary_zh": "8月20日，Bun 1.4稳定版正式发布。这是Rust重写后的首个稳定版本，也是Bun被Anthropic收购后的第一次大版本更新。距离上一个稳定版1.3.14，已经过去99天——这也是Bun自2022年以来最长的稳定版本发布间隔。开发者和技术作家Simon Willison将几个月前的Rust重写称为“臭名昭著”的实验。他还注意到，官方在Bun 1.4的发布说明中淡化了这次重写，主要篇幅都留给了数量庞大的新功能和2900项Bug修复。这次重写意义重大，因为它被视为一场高风险的AI编程实验：如果AI能够在11天内完成大型生产级代码库的跨语言迁移，并最终被大多数社区用户采用，将为这种“全速AI编程”模式提供重要的现实证据，尤其是在大规模代码迁移项目中。我其实暗暗希望它失败。这样，那些整天鼓吹“AI将取代所有软件开发者”的付费水军，或许就能彻底消停了。现在网上充斥着各种吹捧代码生成器的内容，有人说它们带来了革命性变化，还有人声称，借助这些工具，两个月就还清了过去五年积累的技术债。面对数万亿美元的利益牵扯，我们恐怕已经很难相信自己看到的任何说法。许多鼓吹者可能只是拿钱办事的水军。", "pub_date": "2026-08-31T07:14:06+00:00", "time_str": "1天前"}]}, {"key": "二丫讲梵_27", "name": "二丫讲梵", "cat": "dev", "color": "#2d3436", "items": []}, {"key": "唐巧博客_28", "name": "唐巧博客", "cat": "dev", "color": "#e74c3c", "items": [{"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "《估值原理》读书笔记：价格背后的游戏、责任与社会秩序", "title_zh": "《估值原理》读书笔记：价格背后的游戏、责任与社会秩序", "summary": "对我来说，《估值原理》不是一本很容易读懂的书。\n这本书的作者是周洛华老师，上海大学经济学院副院长。它和一般讲投资、财务、估值模型的书很不一", "summary_zh": "对我来说，《估值原理》不是一本很容易读懂的书。\n这本书的作者是周洛华老师，上海大学经济学院副院长。它和一般讲投资、财务、估值模型的书很不一", "pub_date": "2026-08-30T12:48:23.759000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "关于渠道的思考", "title_zh": "关于渠道的思考", "summary": "增长遇到瓶颈时，团队很容易把希望寄托在“多开一个渠道”上：找更多达人、进入更多平台、铺更多线下门店，或者接入一个看起来拥有大量用户的合作方。\n但渠道越多，生意不一定越好。它可能带来增量，也可能只是把原来的订单重新分配一遍；可能提升收入，也可能因为价格竞争、重复", "summary_zh": "增长遇到瓶颈时，团队很容易把希望寄托在“多开一个渠道”上：找更多达人、进入更多平台、铺更多线下门店，或者接入一个看起来拥有大量用户的合作方。\n但渠道越多，生意不一定越好。它可能带来增量，也可能只是把原来的订单重新分配一遍；可能提升收入，也可能因为价格竞争、重复", "pub_date": "2026-08-30T12:48:23.759000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "OpenConnector：给 AI Agent 加上一道凭据防火墙", "title_zh": "OpenConnector：给 AI Agent 加上一道凭据防火墙", "summary": "过去，我们使用 AI，主要是在对话框里问问题。现在，AI Agent 开始读取邮件、管理日历、查询 Notion、处理 GitHub Issue，甚至操作企业内部系统。\n这时，一个绕不开的问题出现了：怎样把外部账号交给 Agent，又不把账号的", "summary_zh": "过去，我们使用 AI，主要是在对话框里问问题。现在，AI Agent 开始读取邮件、管理日历、查询 Notion、处理 GitHub Issue，甚至操作企业内部系统。\n这时，一个绕不开的问题出现了：怎样把外部账号交给 Agent，又不把账号的", "pub_date": "2026-08-30T12:48:23.755000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "从 Bartender 迁移到 Thaw", "title_zh": "从 Bartender 迁移到 Thaw", "summary": "我用了很长一段时间的 Bartender。\n对于菜单栏里常驻着一大堆应用的 Mac 用户来说，Bartender 确实很好用：不常用的图标可以隐藏，需要时再展开，整个菜单栏看起来清爽很多。尤其是换到带刘海的 MacBook 之后，菜单栏空间更加紧张，这类工具几", "summary_zh": "我用了很长一段时间的 Bartender。\n对于菜单栏里常驻着一大堆应用的 Mac 用户来说，Bartender 确实很好用：不常用的图标可以隐藏，需要时再展开，整个菜单栏看起来清爽很多。尤其是换到带刘海的 MacBook 之后，菜单栏空间更加紧张，这类工具几", "pub_date": "2026-08-30T12:48:23.755000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "梁文锋四小时投资人会议有感", "title_zh": "梁文锋四小时投资人会议有感", "summary": "最近，我看完了梁文锋面向投资人的四小时会议录音文字版。\n相比那些经过高度提炼的公开演讲，这场交流里有更多关于成本、盈利、技术路线和行业节奏的具体判断。看完之后，我对大模型行业的一些看法发生了变化，也有一些原有判断得到了强化。\n其中有五点，让我印象", "summary_zh": "最近，我看完了梁文锋面向投资人的四小时会议录音文字版。\n相比那些经过高度提炼的公开演讲，这场交流里有更多关于成本、盈利、技术路线和行业节奏的具体判断。看完之 解 Skill —— 读《图解 Skill》", "title_zh": "理解 Skill —— 读《图解 Skill》", "summary": "最近读完了宝玉的《图解 Skill —— AI 提效实战指南》，这是一本难得的 Skill 入门好书。趁着记忆还热乎，把心得整理成这篇读书笔记，也分享给同样在折腾 AI Agent 的朋友。\n<a href=\"#一、关于作者宝玉\"", "summary_zh": "最近读完了宝玉的《图解 Skill —— AI 提效实战指南》，这是一本难得的 Skill 入门好书。趁着记忆还热乎，把心得整理成这篇读书笔记，也分享给同样在折腾 AI Agent 的朋友。\n<a href=\"#一、关于作者宝玉\"", "pub_date": "2026-08-30T12:48:23.755000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "玩教具行业的核心竞争力", "title_zh": "玩教具行业的核心竞争力", "summary": "斑马玩教具业务从 22 年底到现在，已经快 4 年了。我们团队从研发课程的赠品出发，做出了斑马思维机这款爆款产品，连续三年销量第一。我一直在思考，我们在积累什么能力，我们的护城河在哪里", "summary_zh": "斑马玩教具业务从 22 年底到现在，已经快 4 年了。我们团队从研发课程的赠品出发，做出了斑马思维机这款爆款产品，连续三年销量第一。我一直在思考，我们在积累什么能力，我们的护城河在哪里", "pub_date": "2026-08-30T12:48:23.755000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "更换搬瓦工 VPS IP", "title_zh": "更换搬瓦工 VPS IP", "summary": "概述本文简述如何判断当前 IP 被屏蔽，以及如何更换 IP。\n<a href", "summary_zh": "概述本文简述如何判断当前 IP 被屏蔽，以及如何更换 IP。\n<a href", "pub_date": "2026-08-30T12:48:23.755000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "Rebase Hacker House 见闻", "title_zh": "Rebase Hacker House 见闻", "summary": "本周我去武汉参加了 Rebase Hacker House 活动。活动一共五天，从周三到周日。我是评委，去得最晚，周五晚上才到。\n下面记一下我的几点感受。\n<h2 id=\"东湖", "summary_zh": "本周我去武汉参加了 Rebase Hacker House 活动。活动一共五天，从周三到周日。我是评委，去得最晚，周五晚上才到。\n下面记一下我的几点感受。\n<h2 id=\"东湖", "pub_date": "2026-08-30T12:48:23.755000+00:00", "time_str": "2天前"}, {"source": "唐巧博客", "source_key": "唐巧博客_28", "cat": "dev", "color": "#e74c3c", "title": "北京四环骑行一日游：69 公里 6 小时", "title_zh": "北京四环骑行一日游：69 公里 6 小时", "summary": "昨天突然想骑车绕四环一圈。因为是绕圈，所以起点和终点是同一个地方。一开始不知道高德怎么规划环线，后来想了个办法：设几个途经点——东四环中、东四环南、南四环中、西四环中、北四环中，就形成了一条绕四环的导航路线。\n<img src=\"/images/beijing-4r", "summary_zh": "昨天突然想骑车绕四环一圈。因为是绕圈，所以起点和终点是同一个地方。一开始不知道高德怎么规划环线，后来想了个办法：设几个途经点——东四环中、东四环南、南四环中、西四环中、北四环中，就形成了一条绕四环的导航路线。\n<img src=\"/images/beij 不理解，这东西有啥好学的，其实还是当年的课程有点脱离生活了。讲的东西过于模糊，没有明确说明这个政治或者政策是什么意思，他的结果是什么，他对或者不对。\n\n以前的政治课讲的都是正面的，都是这个东西的作用，但是一旦问到你这个东西有啥负面的作用？起到了啥作用，怎么落到基层，怎么指导实际政府工作的？都不知道，感觉就是个假大空的东西。\n没想到这个课竟然意外点透了以前听的迷迷糊糊的东西，感觉有点意思，就追完了。\n\n沈辛成在交大东上院上的博士公共课《中国马克思主义与当代》，2025 年秋季现场课，他自己剪了传到 B 站，合集叫《历史的进程》。这是博士阶段最后一门思政课，一共十讲。没想到是博士生的课，不过感觉有点晚了，其实这应该早点讲。\n\nB 站没有官方字幕。这次是把各集音频拉下来，用本地语音识别转成文稿再整理的。\n\n人类高质量思政课\n\n讲课的人是沈辛成，B 站叫沈枯燥在搞教育，在交大做技术史。合集 51 集，PV 加十讲加番外。\n\n\n\n教材是马工程的《中国马克思主义与当代》。他没有按章宣读。", "summary_zh": "Foreword\n\n我记得很久以前，有一个政治老师说：你不关注政治，但政治始终在关注你。\n\n以前不理解，这东西有啥好学的，其实还是当年的课程有点脱离生活了。讲的东西过于模糊，没有明确说明这个政治或者政策是什么意思，他的结果是什么，他对或者不对。\n\n以前的政治课讲的都是正面的，都是这个东西的作用，但是一旦问到你这个东西有啥负面的作用？起到了啥作用，怎么落到基层，怎么指导实际政府工作的？都不知道，感觉就是个假大空的东西。\n没想到这个课竟然意外点透了以前听的迷迷糊糊的东西，感觉有点意思，就追完了。\n\n沈辛成在交大东上院上的博士公共课《中国马克思主义与当代》，2025 年秋季现场课，他自己剪了传到 B 站，合集叫《历史的进程》。这是博士阶段最后一门思政课，一共十讲。没想到是博士生的课，不过感觉有点晚了，其实这应该早点讲。\n\nB 站没有官方字幕。这次是把各集音频拉下来，用本地语音识别转成文稿再整理的。\n\n人类高质量思政课\n\n讲课的人是沈辛成，B 站叫沈枯燥在搞教育，在交大做技术史。合集 51 集，PV 加十讲加番外。\n\n\n\n教材是马工程的《中国马克思主义与当代》。他没有按章宣读。", "pub_date": "2026-09-01T00:00:00+08:00", "time_str": "1天前"}]}, {"key": "tonybai_33", "name": "Tony Bai", "cat": "dev", "color": "#1abc9c", "items": [{"source": "Tony Bai", "source_key": "tonybai_33", "cat": "dev", "color": "#1abc9c", "title": "《Fluent Python》作者深度解读：Go 集合类型家族要“大改版”了", "title_zh": "《Fluent Python》作者深度解读：Go 集合类型家族要“大改版”了", "summary": "Go 语言诞生十六年来，标准库中始终缺失原生集合类型（Set）。在 GopherUK 2026 大会上，《Fluent Python》作者 Luciano Ramalho 深度解读了 Go Collections 工作组提出的重磅提案 #80590。该提案不仅带来了基于 map[E]struct{} 的官方标准 Set（container/set），还通过 maphash.Hasher 接口打破了不可比较类型的哈希限制，并引入了基于 F-bounded 多态的抽象集合架构。文章系统梳理了从传统双重循环到 O(M+N) 集合代数的性能跃迁，以及这套高层抽象语言对 AI 编程时代的深远意义。", "summary_zh": "Go 语言诞生十六年来，标准库中始终缺失原生集合类型（Set）。在 GopherUK 2026 大会上，《Fluent Python》作者 Luciano Ramalho 深度解读了 Go Collections 工作组提出的重磅提案 #80590。该提案不仅带来了基于 map[E]struct{} 的官方标准 Set（container/set），还通过 maphash.Hasher 接口打破了不可比较类型的哈希限制，并引入了基于 F-bounded 多态的抽象集合架构。文章系统梳理了从传统双重循环到 O(M+N) 集合代数的性能跃迁，以及这套高层抽象语言对 AI 编程时代的深远意义。", "pub_date": "2026-09-02T05:00:00+08:00", "time_str": "9小时前"}, {"source": "Tony Bai", "source_key": "tonybai_33", "cat": "dev", "color": "#1abc9c", "title": "一只机器鸭子，用 Rust 写了个“大脑”：拆解 Hugging Face 爆款机器人 Microduck", "title_zh": "一只机器鸭子，用 Rust 写了个“大脑”：拆解 Hugging Face 爆款机器人 Microduck", "summary": "Hugging Face 旗下 Pollen Robotics 开源的机器人 Microduck 近期爆火，官网预订已经排到数月之后。这只 25 厘米高的机器鸭子，控制系统完全用 Rust 手写、不依赖任何框架，七个守护进程通过 Unix Socket 上的 JSON-RPC 协作，具备热更新、自动回滚等工业级可靠性设计；而它的走路、起身、踢球等行为，则是在 MuJoCo 仿真环境中用 PPO 强化学习训练、再通过 sim2real 迁移到真实硬件的。本文从架构、通信协议、更新机制到强化学习训练流程，完整拆解这只“开源鸭子”的技术内幕。", "summary_zh": "Hugging Face 旗下 Pollen Robotics 开源的机器人 Microduck 近期爆火，官网预订已经排到数月之后。这只 25 厘米高的机器鸭子，控制系统完全用 Rust 手写、不依赖任何框架，七个守护进程通过 Unix Socket 上的 JSON-RPC 协作，具备热更新、自动回滚等工业级可靠性设计；而它的走路、起身、踢球等行为，则是在 MuJoCo 仿真环境中用 PPO 强化学习训练、再通过 sim2real 迁移到真实硬件的。本文从架构、通信协议、更新机制到强化学习训练流程，完整拆解这只“开源鸭子”的技术内幕。", "pub_date": "2026-09-01T06:00:00+08:00", "time_str": "1天前"}, {"source": "Tony Bai", "source_key": "tonybai_33", "cat": "dev", "color": "#1abc9c", "title": "“我恨Go现在的样子”：泛型、迭代器杀入语言核心，两百条评论吵翻了Reddit", "title_zh": "“我恨Go现在的样子”：泛型、迭代器杀入语言核心，两百条评论吵翻了Reddit", "summary": "一条发在 Reddit r/golang 板块的吐槽帖《I hate where Go is moving》引爆了社区关于 Go 语言未来走向的大论战。随着泛型（Go 1.18）、迭代器（range-over-func）与内置集合类型（Set）提案的相继推进，一部分坚持极简主义的老 Gopher 开始担忧 Go 正在步 Java、C++ 特性膨胀的后尘，而演进派则力挺这是工业级语言走向成熟的必经之路。本文梳理了这场争论中数百条核心交锋，深入剖析了语言本身的克制与工程文化演进之间的深层博弈。", "summary_zh": "一条发在 Reddit r/golang 板块的吐槽帖《I hate where Go is moving》引爆了社区关于 Go 语言未来走向的大论战。随着泛型（Go 1.18）、迭代器（range-over-func）与内置集合类型（Set）提案的相继推进，一部分坚持极简主义的老 Gopher 开始担忧 Go 正在步 Java、C++ 特性膨胀的后尘，而演进派则力挺这是工业级语言走向成熟的必经之路。本文梳理了这场争论中数百条核心交锋，深入剖析了语言本身的克制与工程文化演进之间的深层博弈。", "pub_date": "2026-08-31T07:00:00+08:00", "time_str": "2天前"}]}, {"key": "全栈应用开发_36", "name": "全栈应用开发", "cat": "dev", "color": "#16a085", "items": [{"source": "全栈应用开发", "source_key": "全栈应用开发_36", "cat": "dev", "color": "#16a085", "title": "从生成动画到可编程产物：在 Harness 中构建 Lottie 创作运行时", "title_zh": "从生成动画到可编程产物：在 Harness 中构建 Lottie 创作运行时", "summary": "最近，我把 Lottie 插件的第一个版本 [0.1.0](https://qoder.com/marketplace/p epth）的新推理方法。虽然该方法有助于提升模型性能并降低成本，但它模糊了模型的思考过程，使得监控思维链变得困难。考虑到 CoT 监控是 OpenAI 安全计划的重要组成部分，这一变化引发了研究人员的担忧，认为与其此前发布的立场不一致。", "summary_zh": "研究人员发现 OpenAI 的 Astra AI 采用了一种名为“循环深度”（recurrent depth）的新推理方法。虽然该方法有助于提升模型性能并降低成本，但它模糊了模型的思考过程，使得监控思维链变得困难。考虑到 CoT 监控是 OpenAI 安全计划的重要组成部分，这一变化引发了研究人员的担忧，认为与其此前发布的立场不一致。", "pub_date": "2026-09-02T05:34:30+00:00", "time_str": "28分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "英国AI策略架构师 Clifford 加入 Anthropic", "title_zh": "英国AI策略架构师 Clifford 加入 Anthropic", "summary": "曾主导起草英国 AI 行动计划并协助创立 AI 安全研究所的 Matt Clifford 宣布加入 Anthropic，出任国际事务董事总经理，负责北美以外的政府事务，总部设在伦敦。这一人事变动显示 Anthropic 正加强其国际政府关系布局，也意味着英国政府的核心 AI 策略制定者转入产业界。", "summary_zh": "曾主导起草英国 AI 行动计划并协助创立 AI 安全研究所的 Matt Clifford 宣布加入 Anthropic，出任国际事务董事总经理，负责北美以外的政府事务，总部设在伦敦。这一人事变动显示 Anthropic 正加强其国际政府关系布局，也意味着英国政府的核心 AI 策略制定者转入产业界。", "pub_date": "2026-09-02T05:33:31+00:00", "time_str": "29分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "数据：用户对 AI 说话时长是真人 2.5 倍", "title_zh": "数据：用户对 AI 说话时长是真人 2.5 倍", "summary": "语音工具 Voibe 的数据显示，用户在 Claude 中的听写（说话）时长是 Apple Mail 的 2.5 倍。类似的比例也出现在 Slack、Outlook 和 Word 的对比中。这表明用户在与 AI 智能体交流时的说话量是与真人交流的 2.5 倍。", "summary_zh": "语音工具 Voibe 的数据显示，用户在 Claude 中的听写（说话）时长是 Apple Mail 的 2.5 倍。类似的比例也出现在 Slack、Outlook 和 Word 的对比中。这表明用户在与 AI 智能体交流时的说话量是与真人交流的 2.5 倍。", "pub_date": "2026-09-02T05:32:02+00:00", "time_str": "30分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "LinkedIn 现正发送 AI 生成广告冒充私信", "title_zh": "LinkedIn 现正发送 AI 生成广告冒充私信", "summary": "LinkedIn 被发现正在向用户发送由 AI 生成的“广告”私信。这些消息看起来像真人发送的 DM，但点击更多详情后会显示为广告。尽管如此，用户若进行回复，系统会将其视为正常对话的开始。", "summary_zh": "LinkedIn 被发现正在向用户发送由 AI 生成的“广告”私信。这些消息看起来像真人发送的 DM，但点击更多详情后会显示为广告。尽管如此，用户若进行回复，系统会将其视为正常对话的开始。", "pub_date": "2026-09-02T05:31:29+00:00", "time_str": "31分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "开源 AI 峰会热议：开源能否防止 AI 权力过度集中？", "title_zh": "开源 AI 峰会热议：开源能否防止 AI 权力过度集中？", "summary": "Jean Kossaifi 分享了在开源 AI 峰会的见闻，讨论了现代 AI 建立在高质量的开源科学、数据和软件之上。相关讨论探讨了 Transformer 架构是否必然导致权力集中、中国在开源权重方面的领先地位以及开源权重如何赋能创作者（如 MiniMax 的 H3 视频模型）和企业拥有自身智能能力。", "summary_zh": "Jean Kossaifi 分享了在开源 AI 峰会的见闻，讨论了现代 AI 建立在高质量的开源科学、数据和软件之上。相关讨论探讨了 Transformer 架构是否必然导致权力集中、中国在开源权重方面的领先地位以及开源权重如何赋能创作者（如 MiniMax 的 H3 视频模型）和企业拥有自身智能能力。", "pub_date": "2026-09-02T05:31:10+00:00", "time_str": "31分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "循环 Transformer 因权重更少而易于解释？", "title_zh": "循环 Transformer 因权重更少而易于解释？", "summary": "提出一个观点：循环 Transformer (Looped Transformer) 可能更容易进行可解释性分析，因为需要处理的独特权重 (unique weights) 更少。", "summary_zh": "提出一个观点：循环 Transformer (Looped Transformer) 可能更容易进行可解释性分析，因为需要处理的独特权重 (unique weights) 更少。", "pub_date": "2026-09-02T05:29:08+00:00", "time_str": "33分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "MK 机器人路线图：树莓派 5 升级打造边缘计算", "title_zh": "MK 机器人路线图：树莓派 5 升级打造边缘计算", "summary": "作者分享了 MK 机器人的开发路线图，目标是将其从功能框架升级为完全自主的交互式 Agent。核心硬件计算将升级至配备 16GB 内存的树莓派 5，以支持边缘处理能力。", "summary_zh": "作者分享了 MK 机器人的开发路线图，目标是将其从功能框架升级为完全自主的交互式 Agent。核心硬件计算将升级至配备 16GB 内存的树莓派 5，以支持边缘处理能力。", "pub_date": "2026-09-02T05:27:41+00:00", "time_str": "34分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "观点称Transformer潜空间推理收益有限", "title_zh": "观点称Transformer潜空间推理收益有限", "summary": "有观点提出，Transformer 通过在潜空间(latent space)进行推理实际获得的收益有限，未必优于通过离散瓶颈强制输出或提交 token 的方式。作者甚至认为被强制通过离散瓶颈提交 token 可能效果更好。这一直觉性观点挑战了当前对潜空间推理优势的普遍预期，引发了关于大模型推理机制哪种更有效的讨论。", "summary_zh": "有观点提出，Transformer 通过在潜空间(latent space)进行推理实际获得的收益有限，未必优于通过离散瓶颈强制输出或提交 token 的方式。作者甚至认为被强制通过离散瓶颈提交 token 可能效果更好。这一直觉性观点挑战了当前对潜空间推理优势的普遍预期，引发了关于大模型推理机制哪种更有效的讨论。", "pub_date": "2026-09-02T05:25:37+00:00", "time_str": "37分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "实测：2-3 个 h": "Gary Marcus 引用讨论指出，OpenAI Astra AI 采用的“循环深度”推理方法虽然有助于成本和性能，但模糊了模型的思考过程。这可能导致第三方审计变得困难，并增加理解模型倾向的难度。", "pub_date": "2026-09-02T05:23:25+00:00", "time_str": "39分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "AI 生成虽快，物理验证仍是科学发现瓶颈", "title_zh": "AI 生成虽快，物理验证仍是科学发现瓶颈", "summary": "帖子对比了锂离子电池和碳纤维从实验室到商业应用的漫长周期，指出这种时间线受限于人类尺度的验证实验。虽然 Google DeepMind 的 GNoME 模型预测了 220 万种新晶体结构，且自动化实验室在 17 天内合成了尝试目标中的 41 种，但生成与验证之间存在巨大数量级差异：模型能提出数百万候选，物理世界只能验证几十个。在工业化学中，验证失败仍需消耗科学家数周时间，从实验室到工厂的转化仍需数年。结论是生成已近乎免费，但验证并未提速。", "summary_zh": "帖子对比了锂离子电池和碳纤维从实验室到商业应用的漫长周期，指出这种时间线受限于人类尺度的验证实验。虽然 Google DeepMind 的 GNoME 模型预测了 220 万种新晶体结构，且自动化实验室在 17 天内合成了尝试目标中的 41 种，但生成与验证之间存在巨大数量级差异：模型能提出数百万候选，物理世界只能验证几十个。在工业化学中，验证失败仍需消耗科学家数周时间，从实验室到工厂的转化仍需数年。结论是生成已近乎免费，但验证并未提速。", "pub_date": "2026-09-02T05:22:45+00:00", "time_str": "39分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "Ramez：AI 安全应锁定生态系统，而非单个模型", "title_zh": "Ramez：AI 安全应锁定生态系统，而非单个模型", "summary": "Ramez Naam 指出，真正的 AI 安全必须来自对整个生态系统的保护，而非仅针对特定模型的对齐工作。因为无论某个模型的对齐多么完善，总会有人能够接触到不受限制的强大模型。因此，首要任务是让世界本身变得更加安全。", "summary_zh": "Ramez Naam 指出，真正的 AI 安全必须来自对整个生态系统的保护，而非仅针对特定模型的对齐工作。因为无论某个模型的对齐多么完善，总会有人能够接触到不受限制的强大模型。因此，首要任务是让世界本身变得更加安全。", "pub_date": "2026-09-02T05:21:03+00:00", "time_str": "41分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "推文通俗讲解 Flow Matching：用物理向量场搬运概率分布", "title_zh": "推文通俗讲解 Flow Matching：用物理向量场搬运概率分布", "summary": "作者用直观方式解释 Flow Matching 的基本思想：从一个初始概率分布出发，将其「搬运」到目标数据分布。搬运的手段借用了物理学中的**向量场**概念——向量场可以把粒子从 A 点输送到 B 点，关键在于约束这些向量，使起点和终点可确定（deterministic）。作者还 @了几位同行请求点评自己的理解是否准确。", "summary_zh": "作者用直观方式解释 Flow Matching 的基本思想：从一个初始概率分布出发，将其「搬运」到目标数据分布。搬运的手段借用了物理学中的**向量场**概念——向量场可以把粒子从 A 点输送到 B 点，关键在于约束这些向量，使起点和终点可确定（deterministic）。作者还 @了几位同行请求点评自己的理解是否准确。", "pub_date": "2026-09-02T05:21:03+00:00", "time_str": "41分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color" B)、中间探索(C)和验证状态(D)。分析阶段需要 A+B+C+D，但合成阶段仅需 A+B+D，保留 C 会导致成本增加、上下文污染和注意力分散。作者询问现有 Agent/运行时栈是否支持**检查点或变基**操作，以便将 A+B+D 设为新的规范前缀，避免冷重启。此外，作者强调关注 Token 经济学之外的“安全完成总成本”（重构、重试、返工负担），并对不透明的原生压缩持谨慎态度。", "pub_date": "2026-09-02T05:13:06+00:00", "time_str": "49分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "Joseph Jacks 呼吁更多人为 2040-50 年代做规划", "title_zh": "Joseph Jacks 呼吁更多人为 2040-50 年代做规划", "summary": "Joseph Jacks 指出，大多数人很难看到 2030 年以后的事情，呼吁更多人应该为 2040 年代和 2050 年代制定计划。", "summary_zh": "Joseph Jacks 指出，大多数人很难看到 2030 年以后的事情，呼吁更多人应该为 2040 年代和 2050 年代制定计划。", "pub_date": "2026-09-02T05:11:54+00:00", "time_str": "50分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "开发者吐槽 Grok Agent：人力仍是瓶颈", "title_zh": "开发者吐槽 Grok Agent：人力仍是瓶颈", "summary": "开发者 Ariel Jalali 表达了对 Grok 智能体（Agents）功能的困惑。尽管该工具允许创建大量智能体，但他发现这些 Agent 的运作仍然需要大量的人工监管（bot sitting），导致用户自身成为流程中的瓶颈，与其他类似的 Agent 框架相比并未明显提升效率。他在推文中向社区求助，询问是否存在自己未掌握的用法或思路。", "summary_zh": "开发者 Ariel Jalali 表达了对 Grok 智能体（Agents）功能的困惑。尽管该工具允许创建大量智能体，但他发现这些 Agent 的运作仍然需要大量的人工监管（bot sitting），导致用户自身成为流程中的瓶颈，与其他类似的 Agent 框架相比并未明显提升效率。他在推文中向社区求助，询问是否存在自己未掌握的用法或思路。", "pub_date": "2026-09-02T05:11:45+00:00", "time_str": "50分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "Miles Brundage 吐槽前沿模型公司自身并不信奉 AGI", "title_zh": "Miles Brundage 吐槽前沿模型公司自身并不信奉 AGI", "summary": "前 OpenAI 高级顾问 Miles Brundage 观察到一个有趣的现象：那些最热衷于向世界灌输 AGI 概念的实体（即前沿模型公司），在涉及职业建议等实际思维模式时，却并不怎么信奉 AGI 降临论。", "summary_zh": "前 OpenAI 高级顾问 Miles Brundage 观察到一个有趣的现象：那些最热衷于向世界灌输 AGI 概念的实体（即前沿模型公司），在涉及职业建议等实际思维模式时，却并不怎么信奉 AGI 降临论。", "pub_date": "2026-09-02T05:46:52+00:00", "time_str": "15分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "利用 T-SQL 技巧劫持 SQL Copilot，漏洞演讲预告", "title_zh": "利用 T-SQL 技巧劫持 SQL Copilot，漏洞演讲预告", "summary": "安全研究员 Johann Rehberger 宣布将在 BlueHat Asia 发表题为 \"From SELECT to SYSADMIN\" 的演讲。他将展示如何利用老派的 T-SQL 技巧，以意想不到的方式攻击 SQL Server AI 数据库助手 (SQL Copilot)，揭示将 AI 智能体直接连接到数据库环境的安全风险。", "summary_zh": "安全研究员 Johann Rehberger 宣布将在 BlueHat Asia 发表题为 \"From SELECT to SYSADMIN\" 的演讲。他将展示如何利用老派的 T-SQL 技巧，以意想不到的方式攻击 SQL Server AI 数据库助手 (SQL Copilot)，揭示将 AI 智能体直接连接到数据库环境的安全风险。", "pub_date": "2026-09-02T05:45:40+00:00", "time_str": "16分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "OpenAI 员工回应：坚持保留思维链可监控性", "title_zh": "OpenAI 员工回应：坚持保留思维链可监控性", "summary": "针对外界关于模型计算深度（如 Recurrent Depth）可能引发不可监控性竞赛的担忧，OpenAI 员工 Peter Liu 回应称，目前包括 Astra 在内的前沿模型，其计算图深度仅比 GPT-4 多不到两倍。\n\n他强调，OpenAI 自首个推理模型以来一直致力于保留并利用思维链监控技术。公司高度重视这项技术，因为它是观察模型对齐过程、确保模型行为可控的关键窗口，不希望因误导性报道引发放弃监控的技术竞赛。", "summary_zh": "针对外界关于模型计算深度（如 Recurrent Depth）可能引发不可监控性竞赛的担忧，OpenAI 员工 Peter Liu 回应称，目前包括 Astra 在内的前沿模型，其计算图深度仅比 GPT-4 多不到两倍。\n\n他强调，OpenAI 自首个推理模型以来一直致力于保留并利用思维链监控技术。公司高度重视这项技术，因为它是观察模型对齐过程、确保模型行为可控的关键窗口，不希望因误导性报道引发放弃监控的技术竞赛。", "pub_date": "2026-09-02T05:44:32+00:00", "time_str": "18分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "CrowdStrike 微调 Nemotron 3 构建安全检测分类器", "title_zh": "CrowdStrike 微调 Nemotron 3 构建安全检测分类器", "summary": "CrowdStrike 团队基于 NVIDIA Nemotron 3 Nano 30B-A3B 模型，通过提示词优化、自训练和 RLVR 技术微调出了一个具备推理能力的检测-分类器。该模型输入 Windows 终端上下文（进程谱系、命令行、ATT&CK 映射等），输出分析师标签（TP/FP），用于本地部署的威胁分流。相关链接还展示了一项针对 25 个 LLM 的“网络防御基准”测试，结果显示所有模型在基于真实遥测数据的代理调查任务中得分均未及格（满分 1.0，最高分 Opus 5 仅 0.451）。", "summary_zh": "CrowdStrike 团队基于 NVIDIA Nemotron 3 Nano 30B-A3B 模型，通过提示词优化、自训练和 RLVR 技术微调出了一个具备推理能力的检测-分类器。该模型输入 Windows 终端上下文（进程谱系、命令行、ATT&CK 映射等），输出分析师标签（TP/FP），用于本地部署的威胁分流。相关链接还展示了一项针对 25 个 LLM 的“网络防御基准”测试，结果显示所有模型在基于真实遥测数据的代理调查任务中得分均未及格（满分 1.0，最高分 Opus 5 仅 0.451）。", "pub_date": "2026-09-02T05:44:04+00:00", "time_str": "18分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "GitHub 推出 Copilot 桌面应用，整合 agent 开发工作流", "title_zh": "GitHub 推出 Copilot 桌面应用，整合 agent 开发工作流", "summary": "GitHub 发布了官方 Copilot 桌面应用（macOS/Windows/Linux），主打从 issue 到 merge 的全流程 agent 驱动开发。核心功能包括：\n- **多会话管理**：支持并行运行多个 agent 会话，每个会话拥有独立的文件、分支和对话工作空间。\n- **内置验证循环**：可直接在应用内检查 diff、通过内置浏览器预览、运行终端检查并合并 PR。\n- **自动化工作流**：将技能和提示词转化为可重复执行的任务。\n- **设计能力集成**：内置开源设计技能 Impeccable，提供 23 个设计命令（如 /critique, /layout），支持一次性输入设计系统上下文。", "summary_zh": "GitHub 发布了官方 Copilot 桌面应用（macOS/Windows/Linux），主打从 issue 到 merge 的全流程 agent 驱动开发。核心功能包括：\n- **多会话管理**：支持并行运行多个 agent 会话，每个会话拥有独立的文件、分支和对话工作空间。\n- **内置验证循环**：可直接在应用内检查 diff、通过内置浏览器预览、运行终端检查并合并 PR。\n- **自动化工作流**：将技能和提示词转化为可重复执行的任务。\n- **设计能力集成**：内置开源设计技能 Impeccable，提供 23 个设计命令（如 /critique, /layout），支持一次性输入设计系统上下文。", "pub_date": "2026-09-02T05:43:44+00:00", "time_str": "18分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "MCP Community Connect 活动将于 9 月 14 日在 GitHub HQ 举行", "title_zh": "MCP Community Connect 活动将于 9 月 14 日在 GitHub HQ 举行", "summary": "Global AI Community 宣布将于 9 月 14 日在 GitHub 旧金山总部举办 MCP Community Connect 活动。这是一场全天的免费会议，专注于构建基于 Model Context Protocol (MCP) 的生产级应用。议程包括：\n- 开发下一代 MCP 服务器 (Harald Kirschner, Microsoft)\n- 使用 FastMCP 构建服务器 (Radhika Gulati, Prefect)\n- 企业 MCP 部署的安全经验 (Jiquan Ngiam, MintMCP)\n- 评估编码 agent 与 MCP 服务器的成功率 (Cedric Vidal, Microsoft)\n- 圆桌讨论：MCP 的未来 (Tobin South, Anthropic)", "summary_zh": "Global AI Community 宣布将于 9 月 14 日在 GitHub 旧金山总部举办 MCP Community Connect 活动。这是一场全天的免费会议，专注于构建基于 Model Context Protocol (MCP) 的生产级应用。议程包括：\n- 开发下一代 MCP 服务器 (Harald Kirschner, Microsoft)\n- 使用 FastMCP 构建服务器 (Radhika Gulati, Prefect)\n- 企业 MCP 部署的安全经验 (Jiquan Ngiam, MintMCP)\n- 评估编码 agent 与 MCP 服务器的成功率 (Cedric Vidal, Microsoft)\n- 圆桌讨论：MCP 的未来 (Tobin South, Anthropic)", "pub_date": "2026-09-02T05:43:32+00:00", "time_str": "19分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "开发者误以为被垃圾issue轰炸，结果是AI编码代理干的", "title_zh": "开发者误以为被垃圾issue轰炸，结果是AI编码代理干的", "summary": "开发者 rudrank 发现自己的 GitHub 仓库突然收到一堆 issue，起初以为是垃圾信息轰炸，结果发现是编码代理 Fable 5.1 自动提交的——而且质量还真不错，是「good issues」。\n\n这算是 AI 编码代理自主跑仓库、主动开 issue 的一个有趣名场面：代理不仅写代码，还学会了用项目的 issue 区反馈问题。", "summary_zh": "开发者 rudrank 发现自己的 GitHub 仓库突然收到一堆 issue，起初以为是垃圾信息轰炸，结果发现是编码代理 Fable 5.1 自动提交的——而且质量还真不错，是「good issues」。\n\n这算是 AI 编码代理自主跑仓库、主动开 issue 的一个有趣名场面：代理不仅写代码，还学会了用项目的 issue 区反馈问题。", "pub_date": "2026-09-02T05:42:23+00:00", "time_str": "20分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "remove.bg 即将关停，求推荐好用的背景移除工具", "title_zh": "remove.bg 即将关停，求推荐好用的背景移除工具", "summary": "用户因 remove.bg 即将停止服务并并入 Canva，寻求替代的背景移除工具。此前用户认为 remove.bg 效果优于 Photoshop 内置功能，尝试本地工具后效果不佳，现向社区征集推荐。", "summary_zh": "用户因 remove.bg 即将停止服务并并入 Canva，寻求替代的背景移除工具。此前用户认为 remove.bg 效果优于 Photoshop 内置功能，尝试本地工具后效果不佳，现向社区征集推荐。", "pub_date": "2026-09-02T05:42:01+00:00", "time_str": "20分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "iPhone绕一圈本地生成可漫游3D高斯泼溅，无需云端", "title_zh": "iPhone绕一圈本地生成可漫游3D高斯泼溅，无需云端", "summary": "XGRIDS 为 LCC Scan 应用新增 iPhone 3D 捕捉功能：绕着人、物体或小房间走一圈，即可直接在手机本地构建可漫游的 Gaussian splat 场景，全程无需上传云端。\n\n科技博主 Robert Scoble 感慨：三年前他最早报道 Gaussian Splats 时，生成还需要实验室里的高端 NVIDIA 显卡，如今一部 iPhone 就能完成。他预计还会有更多技术沿着「从实验室大设备到口袋小设备」的路径下沉。", "summary_zh": "XGRIDS 为 LCC Scan 应用新增 iPhone 3D 捕捉功能：绕着人、物体或小房间走一圈，即可直接在手机本地构建可漫游的 Gaussian splat 场景，全程无需上传云端。\n\n科技博主 Robert Scoble 感慨：三年前他最早报道 Gaussian Splats 时，生成还需要实验室里的高端 NVIDIA 显卡，如今一部 iPhone 就能完成。他预计还会有更多技术沿着「从实验室大设备到口袋小设备」的路径下沉。", "pub_date": "2026-09-02T05:41:48+00:00", "time_str": "20分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "AI 改变软件工程师身份，引发行业集体职业焦虑", "title_zh": "AI 改变软件工程师身份，引发行业集体职业焦虑", "summary": "Nick Schacht 撰文指出，随着 AI 接管更多编码任务，软件工程师正经历身份危机。文章回顾了作者从纯编码转向 Tech Lead 时遭遇的失落感，认为当前工程师对“写代码”这一核心身份的动摇与之类似。当工作重心从编写代码转向管理 AI Agent 时，工程师需要重新定义自我价值。", "summary_zh": "Nick Schacht 撰文指出，随着 AI 接管更多编码任务，软件工程师正经历身份危机。文章回顾了作者从纯编码转向 Tech Lead 时遭遇的失落感，认为当前工程师对“写代码”这一核心身份的动摇与之类似。当工作重心从编写代码转向管理 AI Agent 时，工程师需要重新定义自我价值。", "pub_date": "2026-09-02T05:40:30+00:00", "time_str": "22分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "MCP 协议转无状态后，OpenAI 工具调用激增 98 倍", "title_zh": "MCP 协议转无状态后，OpenAI 工具调用激增 98 倍", "summary": "Agentic AI Foundation 报告显示，随着 MCP 协议在 7 月转向无状态设计，使用量大幅飙升。OpenAI 的工具调用在 8 月达到 1 月水平的 98 倍，Resend 单月调用破百万。无状态设计允许负载均衡器将请求发送至任意可用服务器，极大简化了扩容流程，满足了企业通过 Agent 连接更多应用的需求。", "summary_zh": "Agentic AI Foundation 报告显示，随着 MCP 协议在 7 月转向无状态设计，使用量大幅飙升。OpenAI 的工具调用在 8 月达到 1 月水平的 98 倍，Resend 单月调用破百万。无状态设计允许负载均衡器将请求发送至任意可用服务器，极大简化了扩容流程，满足了企业通过 Agent 连接更多应用的需求。", "pub_date": "2026-09-02T05:39:31+00:00", "time_str": "23分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "AgentCon 大会将于 11 月 5 日在新加坡举行", "title_zh": "AgentCon 大会将于 11 月 5 日在新加坡举行", "summary": "Global AI Community 宣布 AgentCon 将于 11 月 5 日在新加坡举行。这是一场为期一天的免费活动，专注于 AI Agent、构建者及前沿想法。活动向所有对 AI 感兴趣的人开放。合作伙伴包括 Neo4j、AvePoint 和 Microsoft。", "summary_zh": "Global AI Community 宣布 AgentCon 将于 11 月 5 日在新加坡举行。这是一场为期一天的免费活动，专注于 AI Agent、构建者及前沿想法。活动向所有对 AI 感兴趣的人开放。合作伙伴包括 Neo4j、AvePoint 和 Microsoft。", "pub_date": "2026-09-02T05:39:13+00:00", "time_str": "23分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "Microsoft Reactor 将举办 4 小时 MCP 直播活动", "title_zh": "Microsoft Reactor 将举办 4 小时 MCP 直播活动", "summary": "Microsoft Reactor 宣布将于 9 月 9 日举办“MCP Live”直播活动。该活动为期 4 小时，主题围绕 Model Context Protocol (MCP) 开放标准。议程涵盖 MCP 状态更新、GitHub 集成、VS Code 构建服务器、企业级授权与安全以及 FastMCP 应用构建。演讲嘉宾来自 Microsoft、GitHub、Okta、Anthropic 和 AWS。", "summary_zh": "Microsoft Reactor 宣布将于 9 月 9 日举办“MCP Live”直播活动。该活动为期 4 小时，主题围绕 Model Context Protocol (MCP) 开放标准。议程涵盖 MCP 状态更新、GitHub 集成、VS Code 构建服务器、企业级授权与安全以及 FastMCP 应用构建。演讲嘉宾来自 Microsoft、GitHub、Okta、Anthropic 和 AWS。", "pub_date": "2026-09-02T05:38:55+00:00", "time_str": "23分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "Looped Transformer 计算效率与可解释性引热议", "title_zh": "Looped Transformer 计算效率与可解释性引热议", "summary": "社区近日热议循环 Transformer（Looped Transformer）的优劣。有观点指出，在匹配推理 FLOPs 的情况下，相比非循环 Transformer，Looped 架构执行的独特计算更少；同时由于其需要处理的独特权重更少，可能更易于进行可解释性分析。讨论聚焦于该架构在计算效率与可解释性之间的权衡。", "summary_zh": "社区近日热议循环 Transformer（Looped Transformer）的优劣。有观点指出，在匹配推理 FLOPs 的情况下，相比非循环 Transformer，Looped 架构执行的独特计算更少；同时由于其需要处理的独特权重更少，可能更易于进行可解释性分析。讨论聚焦于该架构在计算效率与可解释性之间的权衡。", "pub_date": "2026-09-02T05:38:05+00:00", "time_str": "24分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "OpenAI 人员：Astra 计算图深度与 GPT-4 相当", "title_zh": "OpenAI 人员：Astra 计算图深度与 GPT-4 相当", "summary": "OpenAI 人员透露，包括 Astra 在内的前沿模型计算图深度与 GPT-4 相差在两倍以内。团队重视并坚持使用思维链（CoT）监控技术来观察模型对齐的泛化情况，承认该技术目前脆弱且呈负面趋势，但正通过研究计划加以强化。", "summary_zh": "OpenAI 人员透露，包括 Astra 在内的前沿模型计算图深度与 GPT-4 相差在两倍以内。团队重视并坚持使用思维链（CoT）监控技术来观察模型对齐的泛化情况，承认该技术目前脆弱且呈负面趋势，但正通过研究计划加以强化。", "pub_date": "2026-09-02T05:37:10+00:00", "time_str": "25分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "数据中心业务增长停滞，仅外包建设商获益", "title_zh": "数据中心业务增长停滞，仅外包建设商获益", "summary": "作者指出当前数据中心行业没有实际增长，唯一能看到业务的仅限于那些为数据中心建设公司提供外包服务的承包商。", "summary_zh": "作者指出当前数据中心行业没有实际增长，唯一能看到业务的仅限于那些为数据中心建设公司提供外包服务的承包商。", "pub_date": "2026-09-02T05:36:44+00:00", "time_str": "25分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "用户反馈 ChatGPT 网站近期出现多次 UI 故障", "title_zh": "用户反馈 ChatGPT 网站近期出现多次 UI 故障", "summary": "多位用户反馈 chatgpt.com 近期出现异常：回答总是以“yes”开头、反馈选项显示异常、新对话无法暂停且持续生成、界面渲染后空白等。这些问题已持续两天。", "summary_zh": "多位用户反馈 chatgpt.com 近期出现异常：回答总是以“yes”开头、反馈选项显示异常、新对话无法暂停且持续生成、界面渲染后空白等。这些问题已持续两天。", "pub_date": "2026-09-02T05:36:25+00:00", "time_str": "26分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "OpenAI Astra 循环深度推理或令思维链监控失效", "title_zh": "OpenAI Astra 循环深度推理或令思维链监控失效", "summary": "研究人员发现 OpenAI 的 Astra AI 采用名为“循环深度”（recurrent depth）的新推理方法，该方法有助于提升模型性能并降低成本，但会模糊模型的思考过程，可能使基于思维链的监控手段失效。Gary Marcus 引用相关讨论指出，这或将增加第三方审计的难度，引发对模型透明度与安全监督的担忧。", "summary_zh": "研究人员发现 OpenAI 的 Astra AI 采用名为“循环深度”（recurrent depth）的新推理方法，该方法有助于提升模型性能并降低成本，但会模糊模型的思考过程，可能使基于思维链的监控手段失效。Gary Marcus 引用相关讨论指出，这或将增加第三方审计的难度，引发对模型透明度与安全监督的担忧。", "pub_date": "2026-09-02T05:34:30+00:00", "time_str": "28分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "M4 Pro Mac mini 本地模型环境配置指南", "title_zh": "M4 Pro Mac mini 本地模型环境配置指南", "summary": "Kevin Lewis 分享了在 M4 Pro Mac mini 上搭建本地大模型环境的配置方案。文章涵盖了硬件选择、软件栈设置以及优化细节，适合希望在 Apple Silicon 设备上部署本地模型的用户参考。", "summary_zh": "Kevin Lewis 分享了在 M4 Pro Mac mini 上搭建本地大模型环境的配置方案。文章涵盖了硬件选择、软件栈设置以及优化细节，适合希望在 Apple Silicon 设备上部署本地模型的用户参考。", "pub_date": "2026-09-02T05:34:02+00:00", "time_str": "28分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "Reddit 构想「个人代理网络」：人人一个 AI agent 替自己谈判与协调资源", "title_zh": "Reddit 构想「个人代理网络」：人人一个 AI agent 替自己谈判与协调资源", "summary": "发帖人提出 **PAN（Personal Agent Network，个人代理网络）** 的构想：一个去中心化网络中，每个人和组织都拥有一个与自己个人对齐的 AI agent，代表本人持续谈判和协调时间、人才、资本、能源、商品与服务等资源的分配，而人类保留目标、价值观与最终决定权——相当于「有人类能动性的 Pluribus」。\n\n举例场景：你的 agent 发现你的技能在 B 公司更值钱，B 公司的 agent 也发现你是最佳匹配，双方 agent 谈好条款后把机会呈现给你，由你决定是否接受。作者认为这种机制能在不剥夺人类自主权的前提下，持续优化全社会的资源配置，解决相当一部分世界性问题。", "summary_zh": "发帖人提出 **PAN（Personal Agent Network，个人代理网络）** 的构想：一个去中心化网络中，每个人和组织都拥有一个与自己个人对齐的 AI agent，代表本人持续谈判和协调时间、人才、资本、能源、商品与服务等资源的分配，而人类保留目标、价值观与最终决定权——相当于「有人类能动性的 Pluribus」。\n\n举例场景：你的 agent 发现你的技能在 B 公司更值钱，B 公司的 agent 也发现你是最佳匹配，双方 agent 谈好条款后把机会呈现给你，由你决定是否接受。作者认为这种机制能在不剥夺人类自主权的前提下，持续优化全社会的资源配置，解决相当一部分世界性问题。", "pub_date": "2026-09-02T05:33:27+00:00", "time_str": "29分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "用 Minimax H3 制作《崩坏：星穹铁道》×《疾速追杀》混剪", "title_zh": "用 Minimax H3 制作《崩坏：星穹铁道》×《疾速追杀》混剪", "summary": "作者使用 Minimax H3 模型和 Turbo LoRA 制作了《崩坏：星穹铁道》与《疾速追杀》风格的混剪预告片。工作流通过 ComfyUI 搭建，为保持动作稳定采用慢速渲染后期加速 2 倍的处理方式。作者目前受限于片段一致性，将完整战斗剪辑改为预告片形式。", "summary_zh": "作者使用 Minimax H3 模型和 Turbo LoRA 制作了《崩坏：星穹铁道》与《疾速追杀》风格的混剪预告片。工作流通过 ComfyUI 搭建，为保持动作稳定采用慢速渲染后期加速 2 倍的处理方式。作者目前受限于片段一致性，将完整战斗剪辑改为预告片形式。", "pub_date": "2026-09-02T05:33:25+00:00", "time_str": "29分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "ChatGPT 广告年化收破 10 亿，增量证据存疑", "title_zh": "ChatGPT 广告年化收破 10 亿，增量证据存疑", "summary": "OpenAI 宣布 ChatGPT 广告业务在不到 200 天内达到 10 亿美元年化收入运行率，并于 8 月 31 日起在印、欧、中东和北非开放自助广告管理平台。目前数万广告主入驻，CPC 和效果优化竞价占主导。\n\n然而，作者指出该数据属厂商自报，非审计后的实际年度营收。OpenAI 虽引用电商广告主 3 倍 ROAS 和 80% 新客流量等案例，但未披露样本量、基准线或增量测试方法，无法证明广告库存的增量价值。\n\n结构性变化可能更重要：不同于搜索抓取查询或社交推断兴趣，ChatGPT 将广告嵌入主动决策对话中。官方承诺广告与答案分离、不影响回答且不向广告商开放私人对话，个性化则取决于当前对话与地区设置。", "summary_zh": "OpenAI 宣布 ChatGPT 广告业务在不到 200 天内达到 10 亿美元年化收入运行率，并于 8 月 31 日起在印、欧、中东和北非开放自助广告管理平台。目前数万广告主入驻，CPC 和效果优化竞价占主导。\n\n然而，作者指出该数据属厂商自报，非审计后的实际年度营收。OpenAI 虽引用电商广告主 3 倍 ROAS 和 80% 新客流量等案例，但未披露样本量、基准线或增量测试方法，无法证明广告库存的增量价值。\n\n结构性变化可能更重要：不同于搜索抓取查询或社交推断兴趣，ChatGPT 将广告嵌入主动决策对话中。官方承诺广告与答案分离、不影响回答且不向广告商开放私人对话，个性化则取决于当前对话与地区设置。", "pub_date": "2026-09-02T05:33:21+00:00", "time_str": "29分钟前"}, {"source": "AGI Hunt", "source_key": "agihunt_0", "cat": "ai", "color": "#6366f1", "title": "开发者建议 baocut 内置翻译以切换工具", "title_zh": "开发者建议 baocut 内置翻译以切换工具", "summary": "开发者向 baocut 作者建议内置翻译功能并支持自定义 provider，以避免在编码工具（如 Codex/Claude Code）和翻译工具间来回切换，提升工作流效率。", "summary_zh": "开发者向 baocut 作者建议内置翻译功能并支持自定义 provider，以避免在编码工具（如 Codex/Claude Code）和翻译工具间来回切换，提升工作流效率。", "pub_date": "2026-09-02T05:27:12+00:00", "time_str": "35分钟前"}]}, {"key": "idaily_1", "name": "iDaily", "cat": "news", "color": "#003399", "items": [{"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "印尼锡纳朋火山剧烈喷发 - September 1, 2026", "title_zh": "印尼锡纳朋火山剧烈喷发 - September 1, 2026", "summary": "远眺喷发中的锡纳朋火山（Mount Sinabung），北苏门答腊省。8月31日，印尼锡纳朋火山时隔5年再次发生剧烈喷发，火山灰烟柱升至约3500米高空并飘散影响周边多个村庄。印尼地质局已发布第二高级别火山喷发警戒，禁止民众进入火山周边6公里范围。锡纳朋火山是印尼境内最活跃的活火山之一，海拔2460米，2010年开始进入活跃状态并出现多次剧烈喷发，累计导致超过20人遇难。摄影师：PVMBG Indonesia", "summary_zh": "远眺喷发中的锡纳朋火山（Mount Sinabung），北苏门答腊省。8月31日，印尼锡纳朋火山时隔5年再次发生剧烈喷发，火山灰烟柱升至约3500米高空并飘散影响周边多个村庄。印尼地质局已发布第二高级别火山喷发警戒，禁止民众进入火山周边6公里范围。锡纳朋火山是印尼境内最活跃的活火山之一，海拔2460米，2010年开始进入活跃状态并出现多次剧烈喷发，累计导致超过20人遇难。摄影师：PVMBG Indonesia", "pub_date": "2026-09-01T09:59:00+00:00", "time_str": "20小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "中俄元首比什凯克会晤 - September 1, 2026", "title_zh": "中俄元首比什凯克会晤 - September 1, 2026", "summary": "中国国家主席习近平与俄罗斯总统 Vladimir Putin 在上海合作组织峰会期间举行会晤，吉尔吉斯斯坦比什凯克。8月31日，中俄两国领导人在上合峰会期间举行2026年第2次面对面会晤。习近平指出，当前国际形势中不确定难预料因素明显增多，中方愿同包括俄方在内的各方一道，壮大引领全球治理改革、推进平等有序世界多极化的力量。俄总统 Putin 表示，中俄外交基本立场相近或完全一致，俄方愿同中方加强在联合国、金砖机制、二十国集团等多边机制内的协调配合，共同维护世界和平稳定繁荣。2026年1至7月中俄双边贸易额达1592.7亿美元，同比增长26.3%。摄影师：Kristina Solovyova", "summary_zh": "中国国家主席习近平与俄罗斯总统 Vladimir Putin 在上海合作组织峰会期间举行会晤，吉尔吉斯斯坦比什凯克。8月31日，中俄两国领导人在上合峰会期间举行2026年第2次面对面会晤。习近平指出，当前国际形势中不确定难预料因素明显增多，中方愿同包括俄方在内的各方一道，壮大引领全球治理改革、推进平等有序世界多极化的力量。俄总统 Putin 表示，中俄外交基本立场相近或完全一致，俄方愿同中方加强在联合国、金砖机制、二十国集团等多边机制内的协调配合，共同维护世界和平稳定繁荣。2026年1至7月中俄双边贸易额达1592.7亿美元，同比增长26.3%。摄影师：Kristina Solovyova", "pub_date": "2026-09-01T08:58:00+00:00", "time_str": "21小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "日本10年期国债收益率破3% - September 1, 2026", "title_zh": "日本10年期国债收益率破3% - September 1, 2026", "summary": "东京证券交易所屏幕上显示10年期国债收益率即时数据，日本。9月1日，日本10年期国债收益率升至3.000%，创下1996年10月以来最高纪录，主要受美联储加息预期、中东紧张局势升级、市场对日本财政恶化担忧加剧等因素影响。日本财务省公布数据显示7月30日至8月26日期间累计动用15.4万亿日元（约合960亿美元）用于提振日元汇率，创下有史以来单月外汇干预最大规模纪录。8月31日日元兑美元汇率最低跌至160.01，连续2个交易日跌破160关口。摄影师：Franck Robichon", "summary_zh": "东京证券交易所屏幕上显示10年期国债收益率即时数据，日本。9月1日，日本10年期国债收益率升至3.000%，创下1996年10月以来最高纪录，主要受美联储加息预期、中东紧张局势升级、市场对日本财政恶化担忧加剧等因素影响。日本财务省公布数据显示7月30日至8月26日期间累计动用15.4万亿日元（约合960亿美元）用于提振日元汇率，创下有史以来单月外汇干预最大规模纪录。8月31日日元兑美元汇率最低跌至160.01，连续2个交易日跌破160关口。摄影师：Franck Robichon", "pub_date": "2026-09-01T07:57:00+00:00", "time_str": "22小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "纽约征收第二套豪宅税 - September 1, 2026", "title_zh": "纽约征收第二套豪宅税 - September 1, 2026", "summary": "眺望纽约曼哈顿高层公寓楼，美国。8月31日，纽约市财政局向第二批符合资格的高价住宅所有者发送课税通知，要求缴纳「第二套住房税」（Pied-à-terre tax）。纽约市从2026年7月1日正式启动「第二套住房税」政策，该税种的征税对象为拥有第二套估值100万美元公寓或500万美元以上独栋住宅的富裕阶层，公寓税率范围为4%-6.5%，住宅税率范围为0.8%-1.3%。纽约市政府预计该税种每年将带来5亿美元的新税收收入。摄影师：Michael Nagle", "summary_zh": "眺望纽约曼哈顿高层公寓楼，美国。8月31日，纽约市财政局向第二批符合资格的高价住宅所有者发送课税通知，要求缴纳「第二套住房税」（Pied-à-terre tax）。纽约市从2026年7月1日正式启动「第二套住房税」政策，该税种的征税对象为拥有第二套估值100万美元公寓或500万美元以上独栋住宅的富裕阶层，公寓税率范围为4%-6.5%，住宅税率范围为0.8%-1.3%。纽约市政府预计该税种每年将带来5亿美元的新税收收入。摄影师：Michael Nagle", "pub_date": "2026-09-01T07:55:00+00:00", "time_str": "22小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "加沙难民营电影放映 - September 1, 2026", "title_zh": "加沙难民营电影放映 - September 1, 2026", "summary": "加沙儿童在废墟空地上观看露天动画片放映，加沙城。8月30日，马什拉维电影基金会在加沙地带举办「小翅膀影院」放映活动，为当地儿童播放《狮子王》等动画电影。加沙卫生部数据显示自2025年10月停火协议生效以来已有1320名巴勒斯坦人丧生，其中包括逾300名儿童。本轮以巴冲突迄今累计造成7.35万人死亡，儿童死亡人数超过2.15万。摄影师：Anas Zeyad Fteha", "summary_zh": "加沙儿童在废墟空地上观看露天动画片放映，加沙城。8月30日，马什拉维电影基金会在加沙地带举办「小翅膀影院」放映活动，为当地儿童播放《狮子王》等动画电影。加沙卫生部数据显示自2025年10月停火协议生效以来已有1320名巴勒斯坦人丧生，其中包括逾300名儿童。本轮以巴冲突迄今累计造成7.35万人死亡，儿童死亡人数超过2.15万。摄影师：Anas Zeyad Fteha", "pub_date": "2026-09-01T07:53:00+00:00", "time_str": "22小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "大阪地铁试点人形机器人站员 - September 1, 2026", "title_zh": "大阪地铁试点人形机器人站员 - September 1, 2026", "summary": "大阪地铁站启用智能人形机器人站员，日本。8月31日，大阪地铁梅田站首次启用智能人形机器人站员服务，第一名机器人站员名为「Hinata」，身高1.78米，重48千克，搭载谷歌公司生成式AI模型 Gemini，能够以日文、英文、中文在内的约60种语言与乘客进行对话，提供车站指引、换乘线路以及周边观光推荐等服务。这名机器人站员的工作时间为每天上午11点至晚上20点，首期试运营将持续至9月6日。摄影师：Yuta Hashimoto", "summary_zh": "大阪地铁站启用智能人形机器人站员，日本。8月31日，大阪地铁梅田站首次启用智能人形机器人站员服务，第一名机器人站员名为「Hinata」，身高1.78米，重48千克，搭载谷歌公司生成式AI模型 Gemini，能够以日文、英文、中文在内的约60种语言与乘客进行对话，提供车站指引、换乘线路以及周边观光推荐等服务。这名机器人站员的工作时间为每天上午11点至晚上20点，首期试运营将持续至9月6日。摄影师：Yuta Hashimoto", "pub_date": "2026-09-01T07:51:00+00:00", "time_str": "22小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "印尼日本动物园物种借调 - September 1, 2026", "title_zh": "印尼日本动物园物种借调 - September 1, 2026", "summary": "印度尼西亚泗水动物园，饲养员正在给新借入的亚达伯拉象龟喂食。8月31日，印尼泗水动物园正式公开展出从日本 iZoo 动物园借入的亚达伯拉象龟。根据两方签署的5年期动物繁育合作协议，日本 iZoo 动物园向泗水动物园借出1对小熊猫、1对长颈鹿和4只亚达伯拉象龟，印尼泗水动物园则借出1对科莫多龙作为交换。泗水动物园成立于1916年，占地面积15公顷，是东南亚地区最大、最古老的动物园之一，目前饲养着211种、2236只动物。摄影师：Robertus Pudyanto", "summary_zh": "印度尼西亚泗水动物园，饲养员正在给新借入的亚达伯拉象龟喂食。8月31日，印尼泗水动物园正式公开展出从日本 iZoo 动物园借入的亚达伯拉象龟。根据两方签署的5年期动物繁育合作协议，日本 iZoo 动物园向泗水动物园借出1对小熊猫、1对长颈鹿和4只亚达伯拉象龟，印尼泗水动物园则借出1对科莫多龙作为交换。泗水动物园成立于1916年，占地面积15公顷，是东南亚地区最大、最古老的动物园之一，目前饲养着211种、2236只动物。摄影师：Robertus Pudyanto", "pub_date": "2026-09-01T07:49:00+00:00", "time_str": "22小时前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "罗曼太空望远镜成功发射 - August 31, 2026", "title_zh": "罗曼太空望远镜成功发射 - August 31, 2026", "summary": "SpaceX 猎鹰重型火箭搭载「罗曼太空望远镜」（Roman Space Telescope）发射升空，肯尼迪航天中心。8月30日，猎鹰重型火箭发射31分钟后成功将「罗曼太空望远镜」送入地日转移轨道，该望远镜已与地面建立通信连接并展开太阳能电池板，预计飞行3个月后抵达距离地球约150万公里的日地拉格朗日L2点。「罗曼太空望远镜」是 NASA 的新一代广域红外巡天望远镜，主镜口径达2.4米，配备3亿像素相机和星冕仪，视场效率达到哈勃太空望远镜的100倍以上，主要任务是探测宇宙暗物质和系外行星，目标在5年内观测至少10万颗银河系外行星。摄影师：Joel Kowsky", "summary_zh": "SpaceX 猎鹰重型火箭搭载「罗曼太空望远镜」（Roman Space Telescope）发射升空，肯尼迪航天中心。8月30日，猎鹰重型火箭发射31分钟后成功将「罗曼太空望远镜」送入地日转移轨道，该望远镜已与地面建立通信连接并展开太阳能电池板，预计飞行3个月后抵达距离地球约150万公里的日地拉格朗日L2点。「罗曼太空望远镜」是 NASA 的新一代广域红外巡天望远镜，主镜口径达2.4米，配备3亿像素相机和星冕仪，视场效率达到哈勃太空望远镜的100倍以上，主要任务是探测宇宙暗物质和系外行星，目标在5年内观测至少10万颗银河系外行星。摄影师：Joel Kowsky", "pub_date": "2026-08-31T10:39:00+00:00", "time_str": "1天前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "习近平访问吉尔吉斯斯坦 - August 31, 2026", "title_zh": "习近平访问吉尔吉斯斯坦 - August 31, 2026", "summary": "吉尔吉斯斯坦总统 Sadyr Japarov 亲赴机场迎接中国国家主席习近平，比什凯克。8月30日，中国国家主席习近平抵达比什凯克出席上海合作组织峰会并对吉尔吉斯斯坦进行国事访问。两国领导人当天在比什凯克和谐宫举行会谈，习近平表示，中吉关系近年来实现跨越式发展，双方要深化务实合作，高质量建好中吉乌铁路，落实好绿色矿产合作文件，共同推动构建更加公正合理的全球治理体系。吉尔吉斯斯坦总统 Japarov 表示，吉中两国关系进入黄金时期，处于历史最高水平，吉方愿同中方密切各领域合作，积极推进中吉乌铁路建设，共同维护世界和平稳定。中国长期保持吉尔吉斯斯坦第一大贸易伙伴地位，2025年双边贸易额为272亿美元，同比增长19.8%。摄影师：Kyrgyz Presidential Press Office", "summary_zh": "吉尔吉斯斯坦总统 Sadyr Japarov 亲赴机场迎接中国国家主席习近平，比什凯克。8月30日，中国国家主席习近平抵达比什凯克出席上海合作组织峰会并对吉尔吉斯斯坦进行国事访问。两国领导人当天在比什凯克和谐宫举行会谈，习近平表示，中吉关系近年来实现跨越式发展，双方要深化务实合作，高质量建好中吉乌铁路，落实好绿色矿产合作文件，共同推动构建更加公正合理的全球治理体系。吉尔吉斯斯坦总统 Japarov 表示，吉中两国关系进入黄金时期，处于历史最高水平，吉方愿同中方密切各领域合作，积极推进中吉乌铁路建设，共同维护世界和平稳定。中国长期保持吉尔吉斯斯坦第一大贸易伙伴地位，2025年双边贸易额为272亿美元，同比增长19.8%。摄影师：Kyrgyz Presidential Press Office", "pub_date": "2026-08-31T09:58:00+00:00", "time_str": "1天前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "挪威新国王即位演讲 - August 31, 2026", "title_zh": "挪威新国王即位演讲 - August 31, 2026", "summary": "挪威新国王哈康八世（Haakon VIII）发表登基后的首次全国电视讲话，奥斯陆王宫。8月28日，挪威国王哈拉尔五世（Harald V）因溶血性贫血在奥斯陆国家医院去世，享年89岁，哈拉尔五世的长子 Haakon Magnus 自动继承王位成为挪威第4任国王，王号为「哈康八世」。现年53岁的哈康八世在即位演讲中缅怀已故父亲，称赞其始终坚守价值观、恪尽职守，承诺将秉承「一切为了挪威」的王室格言，倾听人民的声音，带领挪威迈向新时代。最新民调显示挪威民众对君主制的支持率为54%，比2024年下跌-18%。摄影师：Heiko Junge", "summary_zh": "挪威新国王哈康八世（Haakon VIII）发表登基后的首次全国电视讲话，奥斯陆王宫。8月28日，挪威国王哈拉尔五世（Harald V）因溶血性贫血在奥斯陆国家医院去世，享年89岁，哈拉尔五世的长子 Haakon Magnus 自动继承王位成为挪威第4任国王，王号为「哈康八世」。现年53岁的哈康八世在即位演讲中缅怀已故父亲，称赞其始终坚守价值观、恪尽职守，承诺将秉承「一切为了挪威」的王室格言，倾听人民的声音，带领挪威迈向新时代。最新民调显示挪威民众对君主制的支持率为54%，比2024年下跌-18%。摄影师：Heiko Junge", "pub_date": "2026-08-31T08:57:00+00:00", "time_str": "1天前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "日本中部创纪录暴雨 - August 31, 2026", "title_zh": "日本中部创纪录暴雨 - August 31, 2026", "summary": "日本福井市一条街道因积水被禁止通行，福井县。8月30日，日本福井县受暖湿气流流入锋面的影响遭遇大范围强降雨天气，福井市、坂井市和胜山市24小时降雨量均突破300毫米，创下历史新高。暴雨引发的洪涝灾害导致多条高速公路和国道部分路段封闭，连接福井市至大野市的JR越美北线全线停运，约34万居民收到避难指令。日本气象厅预计暴雨天气对该地区的影响将持续至8月31日。摄影师：iDaily Media", "summary_zh": "日本福井市一条街道因积水被禁止通行，福井县。8月30日，日本福井县受暖湿气流流入锋面的影响遭遇大范围强降雨天气，福井市、坂井市和胜山市24小时降雨量均突破300毫米，创下历史新高。暴雨引发的洪涝灾害导致多条高速公路和国道部分路段封闭，连接福井市至大野市的JR越美北线全线停运，约34万居民收到避难指令。日本气象厅预计暴雨天气对该地区的影响将持续至8月31日。摄影师：iDaily Media", "pub_date": "2026-08-31T08:55:00+00:00", "time_str": "1天前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "new 论互联网、人工智能等新技术如何发展，都永远无法取代教师的作用。Putin 指出，教师不仅传授知识，还帮助一个年轻人学会独立思考、辨别方向并找到真正重要的东西，这才是教师职责的关键所在。每年9月1日是俄罗斯「知识日」，标志着新学期的开始，2026新学年全俄预计将有1800万名中小学生和400万名大学生入学。摄影师：Vladimir Astapkovich", "summary_zh": "俄罗斯总统 Vladimir Putin 与莫斯科国立师范大学的教师和学生代表举行座谈会。8月29日，俄总统 Putin 在俄罗斯「知识日」前夕访问莫斯科国立师范大学，主要行程包括在该校参观教育成就展、见证新教学设施落成典礼，并与教师及学生代表进行对话。Putin 在座谈会中强调，无论互联网、人工智能等新技术如何发展，都永远无法取代教师的作用。Putin 指出，教师不仅传授知识，还帮助一个年轻人学会独立思考、辨别方向并找到真正重要的东西，这才是教师职责的关键所在。每年9月1日是俄罗斯「知识日」，标志着新学期的开始，2026新学年全俄预计将有1800万名中小学生和400万名大学生入学。摄影师：Vladimir Astapkovich", "pub_date": "2026-08-30T09:59:00+00:00", "time_str": "2天前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "SpaceX 印度洋回收星舰 - August 30, 2026", "title_zh": "SpaceX 印度洋回收星舰 - August 30, 2026", "summary": "SpaceX 工程师们正在对第13次试飞任务的星舰原型机进行检查，印度洋。8月27日，SpaceX 宣布工程团队已成功完成第13次试飞任务星舰原型机的隔热罩样本及关键数据采集工作，目前这艘星舰原型机固定在一艘半潜式运输船上，开始启程返回得克萨斯州的星港基地，整个运程预计将耗时数月。SpaceX 预计将于2026年9月中旬进行星舰原型机第14次试飞。摄影师：SpaceX", "summary_zh": "SpaceX 工程师们正在对第13次试飞任务的星舰原型机进行检查，印度洋。8月27日，SpaceX 宣布工程团队已成功完成第13次试飞任务星舰原型机的隔热罩样本及关键数据采集工作，目前这艘星舰原型机固定在一艘半潜式运输船上，开始启程返回得克萨斯州的星港基地，整个运程预计将耗时数月。SpaceX 预计将于2026年9月中旬进行星舰原型机第14次试飞。摄影师：SpaceX", "pub_date": "2026-08-30T09:57:00+00:00", "time_str": "2天前"}, {"source": "iDaily", "source_key": "idaily_1", "cat": "news", "color": "#003399", "title": "日本仙台填埋福岛核去污土 - August 30, 2026", "title_zh": "日本仙台填埋福岛核去污土 - August 30, 2026", "summary": "仙台市政人员正在向政府大楼的花坛里填埋福岛核事故去污染土壤，宫城县。8月29日，日本环境省启动新一轮福岛核事故去污染土壤再利用工作，共向仙台市联合办公楼前绿化带移入约1立方米的核去污土壤。这是日本首次在东京都以外地区实施福岛去污染土壤再利用项目，本批填埋土壤的放射性铯浓度约为每公斤4000贝克勒尔。福岛周边储存设施内目前共有约1446万立方米核去污土壤，根据日本法律规定必须在2045年3月底前完成处置工作。东京电力公司计划8月31日开启第23次福岛核污染水排海作业，计划19天内排放7800吨核污水，含放射性氚总量约2万亿贝克勒尔。摄影师：iDaily Media", "summary_zh": "仙台市政人员正在向政府大楼的花坛里填埋福岛核事故去污染土壤，宫城县。8月29日，日本环境省启动新一轮福岛核事故去污染土壤再利用工作，共向仙台市联合办公楼前绿化带移入约1立方米的核去污土壤。这是日本首次在东京都以外地区实施福岛去污染土壤再利用项目，本批填埋土壤的放射性铯浓度约为每公斤4000贝克勒尔。福岛周边储存设施内目前共有约1446万立方米核去污土壤，根据日本法律规定必须在2045年3月底前完成处置工作。东京电力公司计划8月31日开启第23次福岛核污染水排海作业，计划19天内排放7800吨核污水，含放射性氚总量约2万亿贝克勒尔。摄影师：iDaily Media", "pub_date":
