<style>
:root {
  --bg:#faf8f4; --card:#fffdf9; --card-2:#f3efe6; --card-3:#ebe6db;
  --ink:#1f1c17; --muted:#6f6860; --faint:#857e74;
  --line:#e4ddd0; --line-strong:#b9b0a2;
  --brand:#8fb3d9; --brand-strong:#b0cbe6; --brand-line:#3d5a78; --brand-weak:#22303f;
  --accent-solid:#9db8d4;
  --display:"Georgia","Times New Roman","Songti SC","SimSun","STSong",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Fira Code","Fira Mono","Roboto Mono","Consolas",monospace;
  --radius:10px;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  --shadow-lift:0 8px 22px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.06);
}
[data-theme="dark"] {
  --bg:#161412; --card:#1d1a17; --card-2:#262019; --card-3:#2f2820;
  --ink:#ece7df; --muted:#a59d90; --faint:#8a8275;
  --line:#37312a; --line-strong:#4a4339;
  --brand:#8fb3d9; --brand-strong:#b0cbe6; --brand-line:#3d5a78; --brand-weak:#22303f;
  --accent-solid:#9db8d4;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lift:0 8px 22px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
html { scroll-behavior:smooth; }
body {
  font-family:var(--body); background:var(--bg); color:var(--ink);
  line-height:1.55; -webkit-font-smoothing:antialiased; font-size:14px;
  display:flex; flex-direction:column; overflow:hidden;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; }

/* ── Header ── */
header {
  position:relative; z-index:50; flex:none;
  background:rgba(250,248,244,.95);
  backdrop-filter:saturate(120%) blur(10px);
  -webkit-backdrop-filter:saturate(120%) blur(10px);
  border-bottom:1px solid var(--line);
}
[data-theme="dark"] header { background:rgba(22,20,18,.95); }
.hd {
  max-width:100%; margin:0 auto; padding:8px 16px;
  display:flex; align-items:center; gap:12px;
}
.hd .logo {
  display:flex; align-items:center; gap:8px; flex:none;
  font-family:var(--display); font-weight:900; font-size:16px;
}
.hd .logo .t b { color:var(--ink); }
.hd .logo .t span { font-size:11px; color:var(--muted); font-weight:400; margin-left:3px; font-family:var(--body); }
.hd .nav-links { display:flex; align-items:center; gap:2px; flex:1; }
.hd .nav-links a {
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:500;
  border:1px solid transparent; transition:all .15s;
}
.hd .nav-links a:hover { background:var(--card); border-color:var(--line); }
.hd .nav-links a.active {
  background:var(--brand-weak); border-color:var(--brand-line); color:var(--brand-strong); font-weight:600;
}
.hd .nav-links a .icon { width:13px; height:13px; }
.hd .acts { display:flex; align-items:center; gap:4px; flex:none; }
.hd .acts .btn {
  width:30px; height:30px; border-radius:999px; background:var(--card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--ink); transition:all .15s;
}
.hd .acts .btn:hover { border-color:var(--brand-line); color:var(--brand-strong); }
.hd .acts .btn svg { width:14px; height:14px; }

/* ── Main Layout: 3 columns ── */
.app {
  display:flex; flex:1; overflow:hidden;
}

/* Left sidebar: source list */
.sidebar {
  width:240px; flex:none; border-right:1px solid var(--line);
  background:var(--card); overflow-y:auto; display:flex; flex-direction:column;
}
.sidebar-header {
  padding:12px 14px 8px; border-bottom:1px solid var(--line); flex:none;
}
.sidebar-header h2 {
  font-family:var(--display); font-size:14px; font-weight:700; margin-bottom:8px;
}
.sidebar-search {
  display:flex; align-items:center; gap:4px;
  padding:5px 10px; border-radius:8px; background:var(--card-2); border:1px solid var(--line);
}
.sidebar-search svg { width:13px; height:13px; color:var(--faint); flex:none; }
.sidebar-search input {
  border:0; background:transparent; outline:none; font-size:12px; color:var(--ink);
  font-family:var(--body); width:100%;
}
.sidebar-search input::placeholder { color:var(--faint); }

/* Category groups */
.cat-group { flex:none; }
.cat-title {
  padding:8px 14px 4px; font-size:11px; font-weight:700; color:var(--faint);
  text-transform:uppercase; letter-spacing:.05em; cursor:pointer;
  display:flex; align-items:center; gap:4px; user-select:none;
}
.cat-title .arrow { transition:transform .15s; font-size:10px; }
.cat-title.collapsed .arrow { transform:rotate(-90deg); }
.cat-sources { display:flex; flex-direction:column; }
.cat-sources.hidden { display:none; }

.source-item {
  display:flex; align-items:center; gap:8px;
  padding:7px 14px 7px 20px; font-size:13px; cursor:pointer;
  transition:background .1s; border-left:3px solid transparent;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.source-item:hover { background:var(--card-2); }
.source-item.active {
  background:var(--card-3); border-left-color:var(--brand-line); font-weight:600;
}
.source-dot {
  width:8px; height:8px; border-radius:50%; flex:none;
}
.source-name { overflow:hidden; text-overflow:ellipsis; }
.source-count {
  font-family:var(--mono); font-size:10px; color:var(--faint); margin-left:auto; flex:none;
}

/* Middle: article list */
.article-list {
  width:340px; flex:none; border-right:1px solid var(--line);
  background:var(--bg); overflow-y:auto; display:flex; flex-direction:column;
}
.article-list-header {
  padding:10px 14px; border-bottom:1px solid var(--line); flex:none;
  display:flex; align-items:center; gap:8px;
}
.article-list-header h3 {
  font-family:var(--display); font-size:14px; font-weight:700; flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.article-list-header .count {
  font-family:var(--mono); font-size:11px; color:var(--faint);
}
.article-list-header .view-all {
  font-size:11px; color:var(--brand-strong); cursor:pointer;
}
.article-list-header .view-toggle {
  font-size:11px; color:var(--brand-strong); cursor:pointer;
  padding:2px 8px; border-radius:4px; border:1px solid var(--brand-line);
  background:var(--brand-weak); font-weight:600; white-space:nowrap;
  transition:all .15s;
}
.article-list-header .view-toggle:hover {
  background:var(--brand-line); color:#fff;
}

.article-item {
  padding:10px 14px; border-bottom:1px solid var(--line);
  cursor:pointer; transition:background .1s;
}
.article-item:hover { background:var(--card); }
.article-item.active { background:var(--card-3); border-left:3px solid var(--brand-line); }
.article-item .a-title {
  font-size:13px; font-weight:600; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  margin-bottom:4px;
}
.article-item .a-meta {
  display:flex; align-items:center; gap:6px; font-size:11px; color:var(--faint);
}
.article-item .a-meta .src-tag {
  display:inline-flex; align-items:center; gap:3px;
  padding:1px 6px; border-radius:999px; font-size:10px; font-weight:600; color:#fff;
}
.article-item .a-meta .time { font-family:var(--mono); margin-left:auto; }

/* Right: reading area */
.reader {
  flex:1; overflow-y:auto; background:var(--bg);
  display:flex; flex-direction:column;
}
.reader-empty {
  flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--faint); font-size:14px; flex-direction:column; gap:8px;
}
.reader-empty svg { width:48px; height:48px; opacity:.3; }

.reader-content { padding:24px 32px; max-width:720px; margin:0 auto; width:100%; }
.reader-content .rc-title {
  font-family:var(--display); font-size:22px; font-weight:700; line-height:1.4;
  margin-bottom:12px;
}
.reader-content .rc-title a { color:var(--ink); }
.reader-content .rc-title a:hover { color:var(--brand-strong); }
.reader-content .rc-meta {
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--faint);
  margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);
}
.reader-content .rc-meta .src-tag {
  display:inline-flex; align-items:center; gap:3px;
  padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff;
}
.reader-content .rc-summary {
  font-size:15px; line-height:1.8; color:var(--ink);
}
.reader-content .rc-link {
  display:inline-flex; align-items:center; gap:4px;
  margin-top:20px; padding:8px 18px; border-radius:8px;
  background:var(--brand-weak); color:var(--brand-strong);
  font-size:13px; font-weight:600; transition:all .15s;
}
.reader-content .rc-link:hover { background:var(--brand-line); color:#fff; }

/* ── Responsive ── */
@media (max-width:900px) {
  .sidebar { width:200px; }
  .article-list { width:280px; }
}
@media (max-width:700px) {
  body { overflow:auto; }
  .app { flex-direction:column; overflow:visible; }
  .sidebar {
    width:100%; max-height:200px; border-right:none; border-bottom:1px solid var(--line);
    flex-direction:row; overflow-x:auto; overflow-y:hidden;
  }
  .sidebar-header { display:none; }
  .cat-group { display:flex; flex-direction:row; flex:none; }
  .cat-title { display:none; }
  .cat-sources { flex-direction:row; }
  .cat-sources.hidden { display:flex; }
  .source-item {
    padding:6px 10px; border-left:none; border-bottom:3px solid transparent;
    white-space:nowrap; font-size:12px;
  }
  .source-item.active { border-left:none; border-bottom-color:var(--brand-line); }
  .source-count { display:none; }
  .article-list {
    width:100%; max-height:300px; border-right:none; border-bottom:1px solid var(--line);
  }
  .reader { min-height:400px; }
  .reader-content { padding:16px; }
}
</style>

加势头、30 多岁女性人口增加，以及婚姻及生育的观念变化。", "pub_date": "2026-08-29T22:15:15+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "日韩上半年人口都出现增长", "summary_zh": "韩国和日本两国今年上半年人口都恢复了增长：\n韩国上半年累计出生人口为 14.5804 万人，同比增加 1.943 万人，增幅为 15.4%，出生人口规模为近7年同期之最，增加规模和增幅双双创下历史最高纪录。分析认为出生人数增加主要是因为婚姻登记数自疫后的 2023 年 5 月起呈现增加势头、30 多岁女性人口增加，以及婚姻及生育的观念变化。", "time_str": "1天前"}, {"title": "Debian 项目将允许以负责任的方式使用生成式 AI", "link": "https://www.solidot.org/story?sid=85229", "summary": "Debian 项目对是否允许使用 AI 进行了投票表决，投票采用孔多塞投票法，共有 9 个选项，最终结果是第 5 选项“负责任的使用生成式 AI”获胜。Debian 项目表示，它既不反对也不支持在软件、包、文档等的开发和维护中使用生成式 AI 工具。但项目也认识到，如果能负责任的使用 AI 工具，将能显著提高贡献者的效率，使他们将有限的时间投入到需要技术专长、判断力、审核和协作的工作中。", "pub_date": "2026-08-29T21:37:00+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "Debian 项目将允许以负责任的方式使用生成式 AI", "summary_zh": "Debian 项目对是否允许使用 AI 进行了投票表决，投票采用孔多塞投票法，共有 9 个选项，最终结果是第 5 选项“负责任的使用生成式 AI”获胜。Debian 项目表示，它既不反对也不支持在软件、包、文档等的开发和维护中使用生成式 AI 工具。但项目也认识到，如果能负责任的使用 AI 工具，将能显著提高贡献者的效率，使他们将有限的时间投入到需要技术专长、判断力、审核和协作的工作中。", "time_str": "1天前"}, {"title": "人形机器人的跑步方式与人类不同", "link": "https://www.solidot.org/story?sid=85228", "summary": "北京人形机器人创新中心研发的通用人形机器人天工在世界人形机器人运动会上跑出了 100 米 8.64 秒的成绩，远超博尔特（Usain Bolt）于 2009 年创下的 100 米 9.58 秒的人类世界纪录。机器人的平均速度接近 42 公里/时。专家表示，这一成绩凸显了机器人的强大，也凸显了它们在决策和感知等方面的不足——人形机器人都是靠撞软垫的方式刹车的。", "pub_date": "2026-08-29T18:46:44+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "人形机器人的跑步方式与人类不同", "summary_zh": "北京人形机器人创新中心研发的通用人形机器人天工在世界人形机器人运动会上跑出了 100 米 8.64 秒的成绩，远超博尔特（Usain Bolt）于 2009 年创下的 100 米 9.58 秒的人类世界纪录。机器人的平均速度接近 42 公里/时。专家表示，这一成绩凸显了机器人的强大，也凸显了它们在决策和感知等方面的不足——人形机器人都是靠撞软垫的方式刹车的。", "time_str": "1天前"}, {"title": "程序员在公司厕所猝死，人社局以电脑没开不认定工伤", "link": "https://www.solidot.org/story?sid=85227", "summary": "39 岁的深圳程序员邢志（化名）于 2026 年 4 月 23 日 8 时 56 分驾车进入公司所在办公楼负 2 楼停车，9 时步行至电梯厅询问值班安保 2 楼卫生间位置，1 分钟后，其到达卫生间一直未出，直至 11 时 28 分被发现失去意识躺坐在马桶上。公司随即用 AED 进行急救并拨打 120。12 时 50 分，医生停止急救，确认邢志死亡。", "pub_date": "2026-08-29T17:57:06+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "程序员在公司厕所猝死，人社局以电脑没开不认定工伤", "summary_zh": "39 岁的深圳程序员邢志（化名）于 2026 年 4 月 23 日 8 时 56 分驾车进入公司所在办公楼负 2 楼停车，9 时步行至电梯厅询问值班安保 2 楼卫生间位置，1 分钟后，其到达卫生间一直未出，直至 11 时 28 分被发现失去意识躺坐在马桶上。公司随即用 AED 进行急救并拨打 120。12 时 50 分，医生停止急救，确认邢志死亡。", "time_str": "1天前"}, {"title": "澳大利亚有望在未来十年消灭宫颈癌", "link": "https://www.solidot.org/story?sid=85226", "summary": "宫颈癌是女性第四大常见癌症，而 99% 的宫颈癌病例是由高危型人乳头瘤病毒（HPV）引起的。2006 年澳大利亚在全球率先推出首款宫颈癌疫苗，至今已有 20 年。该疫苗除了预防宫颈癌，还能预防咽喉癌、生殖器癌和肛门癌。因此男女都能从接种疫苗上受益。", "pub_date": "2026-08-29T00:41:00+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "澳大利亚有望在未来十年消灭宫颈癌", "summary_zh": "宫颈癌是女性第四大常见癌症，而 99% 的宫颈癌病例是由高危型人乳头瘤病毒（HPV）引起的。2006 年澳大利亚在全球率先推出首款宫颈癌疫苗，至今已有 20 年。该疫苗除了预防宫颈癌，还能预防咽喉癌、生殖器癌和肛门癌。因此男女都能从接种疫苗上受益。", "time_str": "2天前"}, {"title": "一次性纸杯会释放大量微塑料", "link": "https://www.solidot.org/story?sid=85225", "summary": "一次性纸杯虽然主要是纸做的，但并非没有使用塑料，为提高防水性和结构完整性，纸杯内有一层薄塑料内衬，使用的材料可能是聚乙烯或可生物降解的聚乳酸。昆士兰大学的研究人员发现，一次性纸杯在接触热水时会释放大量的微米级和纳米级塑料物质。测量发现，聚乳酸内衬纸杯每毫升含有约 430 万个纳米颗粒，而聚乙烯内衬纸杯每毫升含有约 270 万个纳米颗粒。聚乳酸纸杯释放的塑料颗粒总数是聚乙烯纸杯的 12 倍。", "pub_date": "2026-08-28T23:26:43+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "一次性纸杯会释放大量微塑料", "summary_zh": "一次性纸杯虽然主要是纸做的，但并非没有使用塑料，为提高防水性和结构完整性，纸杯内有一层薄塑料内衬，使用的材料可能是聚乙烯或可生物降解的聚乳酸。昆士兰大学的研究人员发现，一次性纸杯在接触热水时会释放大量的微米级和纳米级塑料物质。测量发现，聚乳酸内衬纸杯每毫升含有约 430 万个纳米颗粒，而聚乙烯内衬纸杯每毫升含有约 270 万个纳米颗粒。聚乳酸纸杯释放的塑料颗粒总数是聚乙烯纸杯的 12 倍。", "time_str": "2天前"}, {"title": "无人机拍下了引发中尼边境致命泥石流的冰川崩塌", "link": "https://www.solidot.org/story?sid=85224", "summary": "根据网友在小红书上发布、由 BBC 验证真实性的两则无人机拍摄视频，视频记录了喜马拉雅山脉蓝塘里壤峰冰川崩塌的瞬间，中尼边境的致命泥石流灾害正是由其引发的。蓝塘里壤峰海拔约 7200 米，冰川崩塌扬起的尘土直冲云霄。", "pub_date": "2026-08-28T22:39:21+08:00", "source": "Solidot", "source_key": "solidot", "cat": "cn_tech", "title_zh": "无人机拍下了引发中尼边境致命泥石流的冰川崩塌", "summary_zh": "根据网友在小红书上发布、由 BBC 验证真实性的两则无人机拍摄视频，视频记录了喜马拉雅山脉蓝塘里壤峰冰川崩塌的瞬间，中尼边境的致命泥石流灾害正是由其引发的。蓝塘里壤峰海拔约 7200 米，冰川崩塌扬起的尘土直冲云霄。", "time_str": "2天前"}, { 。在中国国家主席习近平批示后，总理李强赶赴灾区。", "time_str": "2天前"}, {"title": "「因古老而安全」：為何舊技術有時更能防範黑客攻擊？", "link": "https://www.bbc.com/zhongwen/articles/c5yd3r9rzyzo/simp?at_medium=RSS&at_campaign=rss", "summary": "Reuters你或许不会想到，一名世界知名的网络安全专家竟然依赖一款老旧、可能存在漏洞的电子邮件软件。但多年来，米克·海波宁（Mikko Hyppönen）确实如此。与Hotmail和Gmail等主流选项保持距离，他反而选用了名为Eudora的过时电邮软件。“即使它早已停止（技术）支援，我仍持续使用了许多年，”这名芬兰电脑安全专家说。", "pub_date": "2026-08-28T09:14:33+00:00", "source": "BBC 中文", "source_key": "bbc", "cat": "news", "title_zh": "「因古老而安全」：為何舊技術有時更能防範黑客攻擊？", "summary_zh": "Reuters你或许不会想到，一名世界知名的网络安全专家竟然依赖一款老旧、可能存在漏洞的电子邮件软件。但多年来，米克·海波宁（Mikko Hyppönen）确实如此。与Hotmail和Gmail等主流选项保持距离，他反而选用了名为Eudora的过时电邮软件。“即使它早已停止（技术）支援，我仍持续使用了许多年，”这名芬兰电脑安全专家说。", "time_str": "2天前"}, {"title": "中國科技公司新嘗試：「性愛」機器人，瞄準「陪伴經濟」", "link": "https://www.bbc.com/zhongwen/articles/c9v9pkd7ejpo/simp?at_medium=RSS&at_campaign=rss", "summary": "Getty Images / 一些人形机器人能做到微表情和人类高度相似8月23日在北京闭幕的世界机器人大会上，一批外形高度接近真人的仿生机器人亮相：骨骼立体、皮肤柔软，甚至能做出人类的微表情。与过去主要展示跳舞、行走等功能的人形机器人不同，这一批新产品把重点放在微表情、声音、触觉，以及与人工智慧（AI，人工智能）结合的情感互动上。", "pub_date": "2026-08-28T08:51:11+00:00", "source": "BBC 中文", "source_key": "bbc", "cat": "news", "title_zh": "中國科技公司新嘗試：「性愛」機器人，瞄準「陪伴經濟」", "summary_zh": "Getty Images / 一些人形机器人能做到微表情和人类高度相似8月23日在北京闭幕的世界机器人大会上，一批外形高度接近真人的仿生机器人亮相：骨骼立体、皮肤柔软，甚至能做出人类的微表情。与过去主要展示跳舞、行走等功能的人形机器人不同，这一批新产品把重点放在微表情、声音、触觉，以及与人工智慧（AI，人工智能）结合的情感互动上。", "time_str": "2天前"}, {"title": "追溯西藏尼泊爾致命山洪如何發生", "link": "https://www.bbc.com/zhongwen/articles/c980e6r9jzgo/simp?at_medium=RSS&at_campaign=rss", "summary": "追溯西藏尼泊尔致命山洪发生路径一场灾难性山洪和泥石流席卷了尼泊尔与中国西藏交界的边境地区，吞噬了城镇、冲毁了桥梁，并导致两地数百人死亡，许多人仍下落不明。那么，这场山洪究竟是如何发生的？它为何如此猛烈？BBC Verify利用已核实的影片和卫星图像，追踪这场致命山洪的发展路径。梅林·托马斯（Merlyn Thomas）报道。制片：艾莎·森比（Aisha Sembhi）；", "pub_date": "2026-08-28T08:14:57+00:00", "source": "BBC 中文", "source_key": "bbc", "cat": "news", "title_zh": "追溯西藏尼泊爾致命山洪如何發生", "summary_zh": "追溯西藏尼泊尔致命山洪发生路径一场灾难性山洪和泥石流席卷了尼泊尔与中国西藏交界的边境地区，吞噬了城镇、冲毁了桥梁，并导致两地数百人死亡，许多人仍下落不明。那么，这场山洪究竟是如何发生的？它为何如此猛烈？BBC Verify利用已核实的影片和卫星图像，追踪这场致命山洪的发展路径。梅林·托马斯（Merlyn Thomas 此，两地时间不能直接拿来比较。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "我们看天上的太阳是8分钟前的太阳，还是此时的太阳？如果是8分钟前的，那么是否代表我们可以亲眼看到历史？", "summary_zh": "曹天元 Capo，Bayesian\n查看知乎原文\n\n\n\n所谓“我们看到的是 8 分钟之前的太阳”，从科普简化的角度来说当然是没问题的，不过，如果你想稍微深入探究的话，这里面其实有不少有趣的门道。在这里，我们来简单地普及一些关于相对论的知识。\n相比牛顿力学，相对论最重要的思想之一就是：时间和空间不是“绝对”的，它们在不同的地方有可能“不一样”，因此，两地时间不能直接拿来比较。", "time_str": ""}, {"title": "瞎扯 · 如何正确地吐槽", "link": "https://daily.zhihu.com/story/9792191", "summary": "瞎扯 · 见过哪些离大谱的翻译？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：见过哪些离大谱的翻译？\n\n@安在\n ：相信所有在烟台待过的人，都知道这个梗\n\n\n\nQ：你见过最惊艳的公司名称是什么？\n \n@李相霖\n ：惊不惊艳的不好说，但是多少是有点儿文化。\n\n\n\n\n\n\nQ：是只有中国影视剧的服化道不严谨吗？还是全世界都这样？", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "瞎扯 · 如何正确地吐槽", "summary_zh": "瞎扯 · 见过哪些离大谱的翻译？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：见过哪些离大谱的翻译？\n\n@安在\n ：相信所有在烟台待过的人，都知道这个梗\n\n\n\nQ：你见过最惊艳的公司名称是什么？\n \n@李相霖\n ：惊不惊艳的不好说，但是多少是有点儿文化。\n\n\n\n\n\n\nQ：是只有中国影视剧的服化道不严谨吗？还是全世界都这样？", "time_str": ""}, {"title": "为什么高端狼人杀已经公式化了？", "link": "https://daily.zhihu.com/story/9792161", "summary": "司马懿，三国英雄士，四朝经济臣\n查看知乎原文\n\n\n\n狼人杀是在现实中基本上很少遇到的，需要短时间内在无数的贝叶斯均衡中试图实施其中一个相对较好的均衡的例子。\n什么是贝叶斯均衡呢？说白了就是群体的信念和行为的自洽。\n比如说市场期待美联储降息 25 个点，已经开始做了各种各样的准备，然后美联储一看，既然市场都这么认为了，如果我偏离了好像就会造成市场更大的恐慌，那我就降 25 个点吧。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "为什么高端狼人杀已经公式化了？", "summary_zh": "司马懿，三国英雄士，四朝经济臣\n查看知乎原文\n\n\n\n狼人杀是在现实中基本上很少遇到的，需要短时间内在无数的贝叶斯均衡中试图实施其中一个相对较好的均衡的例子。\n什么是贝叶斯均衡呢？说白了就是群体的信念和行为的自洽。\n比如说市场期待美联储降息 25 个点，已经开始做了各种各样的准备，然后美联储一看，既然市场都这么认为了，如果我偏离了好像就会造成市场更大的恐慌，那我就降 25 个点吧。", "time_str": ""}, {"title": "黑洞的内部是什么样子的？", "link": "https://daily.zhihu.com/story/9792171", "summary": "Bright Summer，徜徉于自然科学之海\n查看知乎原文\n\n\n\n这是一个很有趣的问题。广义相对论场方程能够告诉我们时空如何因引力而弯曲，黑洞也是其所预言的产物，因此通过求解场方程理论上可以获得关于时空结构的一切信息。我们甚至可以据此分析出，进入黑洞的旅行会是一场怎样的经历。\n为了把事情说得清楚和便于理解，彭罗斯图是一个很好的可视化工具。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "黑洞 前提下加快速度，不能因为追求速度而忽视质量。”\n小王看了一眼领导，把头点得像小鸡啄米。\n第一个月\n按照领导的意思，小王挖了一口很深的竖直圆井，把火箭直接架在井口的上面。", "time_str": ""}, {"title": "为什么说 CPU 是人造物的巅峰？", "link": "https://daily.zhihu.com/story/9792142", "summary": "Dunkirk，世界是由原子组成的\n查看知乎原文\n\n\n\n沙子的主要成分是二氧化硅。\n把它提纯、熔化、再结晶，就可以得到一根硅柱。只不过这个提纯的要求有点高，1/1000000000，意思是每十亿个硅原子里，杂质不能超过一个。\n这根硅柱随后被切成薄薄的圆片，直径约 30 厘米，厚度不到 1 毫米，叫做晶圆。它就是 CPU 的白纸，后续所有都发生在这张纸上。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "为什么说 CPU 是人造物的巅峰？", "summary_zh": "Dunkirk，世界是由原子组成的\n查看知乎原文\n\n\n\n沙子的主要成分是二氧化硅。\n把它提纯、熔化、再结晶，就可以得到一根硅柱。只不过这个提纯的要求有点高，1/1000000000，意思是每十亿个硅原子里，杂质不能超过一个。\n这根硅柱随后被切成薄薄的圆片，直径约 30 厘米，厚度不到 1 毫米，叫做晶圆。它就是 CPU 的白纸，后续所有都发生在这张纸上。", "time_str": ""}, {"title": "我们平时在餐桌上吃的香菜，原本的学名是什么？", "link": "https://daily.zhihu.com/story/9792141", "summary": "大宝，随缘素位\n查看知乎原文\n\n\n\n郑州有一家做豫菜的小店，叫做二广餐馆，他有一道特色菜，叫做盐爆散丹，说是从 1931 年传下来的老菜。我第一次见的时候，特别惊讶。\n因为芫爆散丹本身是道鲁菜，在北京做的非常火，就是炒牛百叶临出锅的时候撒入香菜杆，让香菜的味道融入百叶里，香菜特有的辛香可以中和百叶的腥膻，大火爆炒也可以让香菜杆保持清脆多汁，和百叶筋韧耐嚼形成口感对比，吃起来爽而不腻。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "我们平时在餐桌上吃的香菜，原本的学名是什么？", "summary_zh": "大宝，随缘素位\n查看知乎原文\n\n\n\n郑州有一家做豫菜的小店，叫做二广餐馆，他有一道特色菜，叫做盐爆散丹，说是从 1931 年传下来的老菜。我第一次见的时候，特别惊讶。\n因为芫爆散丹本身是道鲁菜，在北京做的非常火，就是炒牛百叶临出锅的时候撒入香菜杆，让香菜的味道融入百叶里，香菜特有的辛香可以中和百叶的腥膻，大火爆炒也可以让香菜杆保持清脆多汁，和百叶筋韧耐嚼形成口感对比，吃起来爽而不腻。", "time_str": ""}, {"title": "瞎扯 · 如何正确地吐槽", "link": "https://daily.zhihu.com/story/9792150", "summary": "瞎扯 · 为啥卸载软件要叫「残忍卸载」，付一百是「小额支付」，领一毛红包却是「大额补贴」？这是什么文字套路？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：为啥卸载软件要叫「残忍卸载」，付一百是「小额支付」，领一毛红包却是「大额补贴」？这是什么文字套路？\n\n@白熊君\n ：本人被吓到。。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "瞎扯 · 如何正确地吐槽", "summary_zh": "瞎扯 · 为啥卸载软件要叫「残忍卸载」，付一百是「小额支付」，领一毛红包却是「大额补贴」？这是什么文字套路？\n\n\n\n\n\n知乎日报\n查看知乎原文\n\n\n\nQ：为啥卸载软件要叫「残忍卸载」，付一百是「小额支付」，领一毛红包却是「大额补贴」？这是什么文字套路？\n\n@白熊君\n ：本人被吓到。。", "time_str": ""}, {"title": "为何科名尾字为「猴」的生物里，只有猕猴亚科的狒狒属、狮尾狒属、山魈属，其规范中文种名尾字非「猴」？", "link": "https://daily.zhihu.com/story/9792106", "summary": "赵学浩，东亚海域史/都市传说/未解之谜/太阳系第一帅\n查看知乎原文\n\n\n\n简而言之，“狒狒”其实是清末时，和“猩猩”竞争上岗“红毛猩猩”（Orangutan）的译名失败，退而求其次，当了狒狒（Baboon）的译名。而“山魈”则是“狒狒”译名的衍生物。\n首先，“狒狒”和“猩猩”都是我国上古传说中出现的、产自南方的介于猴与人之间的大型类人猿生物。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "为何科名尾字为「猴」的生物里，只有猕猴亚科的狒狒属、狮尾狒属、山魈属，其规范中文种名尾字非「猴」？", "summary_zh": "赵学浩，东亚海域史/都市传说/未解之谜/太阳系第一帅\n查看知乎原文\n\n\n\n简而言之，“狒狒”其实是清末时，和“猩猩”竞争上岗“红毛猩猩”（Orangutan）的译名失败，退而求其次，当了狒狒（Baboon）的译名。而“山魈”则是“狒狒”译名的衍生物。\n首先，“狒狒”和“猩猩”都是我国上古传说中出现的、产自南方的介于猴与人之间的大型类人猿生物。", "time_str": ""}, {"title": "概率（Probability）的本质是什么？", "link": "https://daily.zhihu.com/story/9792123", "summary": "北冥有鱼，北大理论物理博士，互联网从业\n查看知乎原文\n\n\n\n概率已经被彻底公理化了，也就是说它的逻辑已经研究透了，但是公理化里面一定会存在一些基本概念，它没有定义，只能依赖你对世界本身的理解。\n公理化是一种特殊的数学思维方式。它的做法是：\n先选出几个不加定义的「原始概念」，再规定这些概念之间必须满足的几条规则（公理），整套理论的全部内容都从公理纯逻辑推出来。\n这种思路的鼻祖是欧几里得。", "pub_date": null, "source": "知乎日报", "source_key": "zhihudaily", "cat": "news", "title_zh": "概率（Probability）的本质是什么？", "summary_zh": "北冥有鱼，北大理论物理博士，互联网从业\n查看知乎原文\n\n\n\n概率已经被彻底公理化了，也就是说它的逻辑已经研究透了，但是公理化里面一定会存在一些基本概念，它没有定义，只能依赖你对世界本身的理解。\n公理化是一种特殊的数学思维方式。它的做法是：\n先选出几个不加定义的「原始概念」，再规定这些概念之间必须满足的几条规则（公理），整套理论的全部内容都从公理纯逻辑推出来。\n这种思路的鼻祖是欧几里得。", "time_str": ""}]}, {"key": "sv101", "name": "硅谷101", "cat": "podcast", "color": "#7c3aed", "items": []}, {"key": "latetalk", "name": "晚点聊 LateTalk", "cat": "podcast", "color": "#0891b2", "items": []}, {"key": "42sec", "name": "42章经", "cat": "podcast", "color": "#1e40af", "items": [{"title": "一个人、两周、数百美元，如何训出登顶 Hugging Face 的模型 | 对谈研究员逯雨鑫", "link": "https://www.xiaoyuzhoufm.com/episode/6a8ed6e7ef65145dfcc5d249?utm_source=rss", "summary": "活动预告🥳：9 月 12 日，我们会请到雨鑫做一场线上活动，大家记得翻到 shownotes 末尾查看报名信息！最近硅谷有了新热点：主权 AI 和 Personal Intelligence。简单来说，就是很多人开始相信，未来会有越来越多的应用公司和个人，训练自己的模型。", "pub_date": "2026-08-29T13:00:00+00:00", "source": "42章经", "source_key": "42sec", "cat": "podcast", "title_zh": "一个人、两周、数百美元，如何训出登顶 Hugging Face 的模型 | 对谈研究员逯雨鑫", "summary_zh": "活动预告🥳：9 月 12 日，我们会请到雨鑫做一场线上活 的故事都有了很多意想不到的改变。", "time_str": "2020-01-23"}, {"title": "No.58：听到的是什么，这期节目就是什么", "link": "https://www.xiaoyuzhoufm.com/episode/5e74543a418a84a046c4e51d?utm_source=rss", "summary": "这是《得意忘形》播客的第 58 期节目，是我一次随意的新尝试。本期节目由两段现场录音拼接而成，分别为网球运动员拉法尔&middot;纳达尔和罗杰&middot;费德勒在 2020 年澳大利亚网球公开赛第一轮的比赛片段。当然，也许这段录音听起来像是网球比赛，但它也完全可以是音乐、舞蹈、散文诗、冥想背景音乐......或是一段记忆。总之，你可以按照自己的理解——或者干脆不去理解，而得意忘形。", "pub_date": "2020-01-23T04:08:44+00:00", "source": "得意忘形", "source_key": "dewx", "cat": "podcast", "title_zh": "No.58：听到的是什么，这期节目就是什么", "summary_zh": "这是《得意忘形》播客的第 58 期节目，是我一次随意的新尝试。本期节目由两段现场录音拼接而成，分别为网球运动员拉法尔&middot;纳达尔和罗杰&middot;费德勒在 2020 年澳大利亚网球公开赛第一轮的比赛片段。当然，也许这段录音听起来像是网球比赛，但它也完全可以是音乐、舞蹈、散文诗、冥想背景音乐......或是一段记忆。总之，你可以按照自己的理解——或者干脆不去理解，而得意忘形。", "time_str": "2020-01-23"}, {"title": "No.57：当你准备好了，你就准备好了", "link": "https://www.xiaoyuzhoufm.com/episode/5e74543a418a84a046c4e51e?utm_source=rss", "summary": "这是《得意忘形》播客的第 57 期节目，我又来找 Jade 老师聊天。本期节目我们从上次录完节目之后各自的变化说起，再次聊了聊我们一直感兴趣的那些话题：旅行、教育、游戏、如何放飞自我和寻找心灵的平静、怎样打造一个去中心化的组织......并顺便担忧了一下人类的未来。", "pub_date": "2020-01-23T04:00:38+00:00", "source": "得意忘形", "source_key": "dewx", "cat": "podcast", "title_zh": "No.57：当你准备好了，你就准备好了", "summary_zh": "这是《得意忘形》播客的第 57 期节目，我又来找 Jade 老师聊天。本期节目我们从上次录完节目之后各自的变化说起，再次聊了聊我们一直感兴趣的那些话题：旅行、教育、游戏、如何放飞自我和寻找心灵的平静、怎样打造一个去中心化的组织......并顺便担忧了一下人类的未来。", "time_str": "2020-01-23"}, {"title": "No.56：做一个废物也是没那么容易的", "link": "https://www.xiaoyuzhoufm.com/episode/5e74543a418a84a046c4e520?utm_source=rss", "summary": "这是《得意忘形》播客的第 56 期节目，我和二怪再次相聚。生活总是这样无法预料，本以为 2019 年会是我们工作和生活上各种改变、全面进步的一年，但没想到这反而是我们「反抗」最激烈的一年。在这期节目里，二怪和我就来说说这些意想不到，以及在这种困惑中我们是如何自处的。", "pub_date": "2020-01-23T03:46:29+00:00", "source": "得意忘形", "source_key": "dewx", "cat": "podcast", "title_zh": "No.56：做一个废物也是没那么容易的", "summary_zh": "这是《得意忘形》播客的第 56 期节目，我和二怪再次相聚。生活总是这样无法预料，本以为 2019 年会是我们工作和生活上各种改变、全面进步的一年，但没想到这反而是我们「反抗」最激烈的一年。在这期节目里，二怪和我就来说说这些意想不到，以及在这种困惑中我们是如何自处的。", "time_str": "2020-01-23"}, {"title": "No.55：我可以借你的奶茶喝一口吗？", "link": "https://www.xiaoyuzhoufm.com/episode/5e74   var CAT_LABELS = {"tech": "科技资讯", "cn_tech": "中文科技", "dev": "开发者", "news": "综合新闻", "podcast": "播客"};

  // ── State ──
  var activeSourceKey = null;
  var activeArticleIdx = -1;
  var searchQuery = '';
  var viewMode = 'source'; // 'source' | 'timeline'
  var timelineItems = [];  // merged + sorted items for timeline view

  // ── DOM refs ──
  var sidebarEl = document.getElementById('sidebar');
  var articleListEl = document.getElementById('articleList');
  var articleListHeaderEl = document.getElementById('articleListHeader');
  var readerEl = document.getElementById('reader');
  var searchInput = document.getElementById('sidebarSearch');

  // ── Render sidebar ──
  function renderSidebar() {
    var html = '';
    var cats = {};
    SOURCES.forEach(function(src) {
      if (!cats[src.cat]) cats[src.cat] = [];
      cats[src.cat].push(src);
    });
    var catOrder = ['tech','cn_tech','dev','news','podcast'];
    catOrder.forEach(function(catKey) {
      var srcs = cats[catKey];
      if (!srcs) return;
      var label = CAT_LABELS[catKey] || catKey;
      html += '<div class="cat-group">';
      html += '<div class="cat-title" data-cat="'+catKey+'"><span class="arrow">▼</span> '+esc(label)+'</div>';
      html += '<div class="cat-sources">';
      srcs.forEach(function(src) {
        var cls = 'source-item' + (src.key === activeSourceKey ? ' active' : '');
        html += '<div class="'+cls+'" data-key="'+esc(src.key)+'">';
        html += '<span class="source-dot" style="background:'+esc(src.color)+'"></span>';
        html += '<span class="source-name">'+esc(src.name)+'</span>';
        html += '<span class="source-count">'+src.items.length+'</span>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    sidebarEl.innerHTML = html;

    // Category collapse
    sidebarEl.querySelectorAll('.cat-title').forEach(function(el) {
      el.addEventListener('click', function() {
        this.classList.toggle('collapsed');
        var panel = this.nextElementSibling;
        if (panel) panel.classList.toggle('hidden');
      });
    });

    // Source click
    sidebarEl.querySelectorAll('.source-item').forEach(function(el) {
      el.addEventListener('click', function() {
        selectSource(this.dataset.key);
      });
    });
  }

  // ── Select source ──
  function selectSource(key) {
    activeSourceKey = key;
    activeArticleIdx = -1;
    renderSidebar();
    renderArticleList();
    renderReader();
  }

  // ── Build timeline (merge all sources, sort by pub_date desc) ──
  function buildTimeline() {
    var all = [];
    SOURCES.forEach(function(src) {
      src.items.forEach(function(it) {
        all.push({ src: src, item: it });
      });
    });
    all.sort(function(a, b) {
      var da = new Date(a.item.pub_date || 0).getTime();
      var db = new Date(b.item.pub_date || 0).getTime();
      return db - da;
    });
    timelineItems = all;
  }

  // ── Render article list ──
  function renderArticleList() {
    if (viewMode === 'timeline') {
      renderTimelineList();
      return;
    }
    var src = SOURCES.find(function(s){ return s.key === activeSourceKey; });
    if (!src) {
      articleListHeaderEl.innerHTML = '<h3>选择一个信源</h3>';
      articleListEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--faint);font-size:13px">点击左侧信源查看文章</div>';
      return;
    }
    var items = filterItems(src.items);
    articleListHeaderEl.innerHTML = '<h3>'+esc(src.name)+'</h3><span class="count">'+items.length+' 篇</span><span class="view-toggle" data-mode="timeline">时间线</span>';

    if (items.length === 0) {
      articleListEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--faint);font-size:13px">暂无匹配文章</div>';
      return;
    }

    var html = '';
    items.forEach(function(item, idx) {
      var cls = 'article-item' + (idx === activeArticleIdx ? ' active' : '');
      html += '<div class="'+cls+'" data-idx="'+idx+'">';
      html += '<div class="a-title">'+esc(item.title_zh || item.title)+'</div>';
      html += '<div class="a-meta">';
      html += '<span class="src-tag" style="background:'+esc(src.color)+'">'+esc(src.name)+'</span>';
      html += '<span class="time">'+esc(item.time_str)+'</span>';
      html += '</div></div>';
    });
    articleListEl.innerHTML = html;

    articleListEl.querySelectorAll('.article-item').forEach(function(el) {
      el.addEventListener('click', function() {
        activeArticleIdx = parseInt(this.dataset.idx);
        renderArticleList();
        renderReader();
      });
    });
    bindViewToggle();
  }

  // ── Render timeline list ──
  function renderTimelineList() {
    var filtered = timelineItems;
    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      filtered = timelineItems.filter(function(o) {
        var t = (o.item.title_zh || o.item.title).toLowerCase();
        var s = (o.item.summary_zh || o.item.summary || '').toLowerCase();
        return t.indexOf(q) >= 0 || s.indexOf(q) >= 0;
      });
    }
    articleListHeaderEl.innerHTML = '<h3>时间线</h3><span class="count">'+filtered.length+' 篇</span><span class="view-toggle" data-mode="source">信源</span>';

    if (filtered.length === 0) {
      articleListEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--faint);font-size:13px">暂无匹配文章</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(o, idx) {
      var cls = 'article-item' + (idx === activeArticleIdx ? ' active' : '');
      html += '<div class="'+cls+'" data-tidx="'+idx+'">';
      html += '<div class="a-title">'+esc(o.item.title_zh || o.item.title)+'</div>';
      html += '<div class="a-meta">';
      html += '<span class="src-tag" style="background:'+esc(o.src.color)+'">'+esc(o.src.name)+'</span>';
      html += '<span class="time">'+esc(o.item.time_str)+'</span>';
      html += '</div></div>';
    });
    articleListEl.innerHTML = html;

    articleListEl.querySelectorAll('.article-item').forEach(function(el) {
      el.addEventListener('click', function() {
        activeArticleIdx = parseInt(this.dataset.tidx);
        renderTimelineList();
        renderTimelineReader();
      });
    });
    bindViewToggle();
  }

  // ── Render reader for timeline ──
  function renderTimelineReader() {
    if (activeArticleIdx < 0 || activeArticleIdx >= timelineItems.length) {
      readerEl.innerHTML = '<div class="reader-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>从列表选择一篇文章开始阅读</span></div>';
      return;
    }
    var o = timelineItems[activeArticleIdx];
    if (!o) return;
    var html = '<div class="reader-content">';
    html += '<h1 class="rc-title"><a href="'+esc(o.item.link)+'" target="_blank" rel="noopener">'+esc(o.item.title_zh || o.item.title)+'</a></h1>';
    html += '<div class="rc-meta">';
    html += '<span class="src-tag" style="background:'+esc(o.src.color)+'">'+esc(o.src.name)+'</span>';
    html += '<span>'+esc(o.item.time_str)+'</span>';
    html += '</div>';
    if (o.item.summary_zh || o.item.summary) {
      html += '<div class="rc-summary">'+esc(o.item.summary_zh || o.item.summary)+'</div>';
    }
    html += '<a class="rc-link" href="'+esc(o.item.link)+'" target="_blank" rel="noopener">阅读原文 →</a>';
    html += '</div>';
    readerEl.innerHTML = html;
  }

  // ── View toggle ──
  function bindViewToggle() {
    var toggle = articleListHeaderEl.querySelector('.view-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        viewMode = this.dataset.mode;
        activeArticleIdx = -1;
        if (viewMode === 'timeline') buildTimeline();
        renderArticleList();
        if (viewMode === 'timeline') renderTimelineReader();
        else renderReader();
      });
    }
  }

  // ── Render reader ──
  function renderReader() {
    if (!activeSourceKey || activeArticleIdx < 0) {
      readerEl.innerHTML = '<div class="reader-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>从左侧选择一篇文章开始阅读</span></div>';
      return;
    }
    var src = SOURCES.find(function(s){ return s.key === activeSourceKey; });
    if (!src) return;
    var items = filterItems(src.items);
    var item = items[activeArticleIdx];
    if (!item) return;

    var html = '<div class="reader-content">';
    html += '<h1 class="rc-title"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">'+esc(item.title_zh || item.title)+'</a></h1>';
    html += '<div class="rc-meta">';
    html += '<span class="src-tag" style="background:'+esc(src.color)+'">'+esc(src.name)+'</span>';
    html += '<span>'+esc(item.time_str)+'</span>';
    if (item.title_zh && item.title_zh !== item.title) {
      html += '<span style="font-size:11px;color:var(--faint)">（已翻译）</span>';
    }
    html += '</div>';
    if (item.summary_zh || item.summary) {
      html += '<div class="rc-summary">'+esc(item.summary_zh || item.summary)+'</div>';
    }
    html += '<a class="rc-link" href="'+esc(item.link)+'" target="_blank" rel="noopener">阅读原文 →</a>';
    html += '</div>';
    readerEl.innerHTML = html;
  }

  // ── Filter ──
  function filterItems(items) {
    if (!searchQuery) return items;
    var q = searchQuery.toLowerCase();
    return items.filter(function(it) {
      var t = (it.title_zh || it.title).toLowerCase();
      var s = (it.summary_zh || it.summary || '').toLowerCase();
      return t.indexOf(q) >= 0 || s.indexOf(q) >= 0;
    });
  }

  // ── Search ──
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      searchQuery = this.value.trim();
      renderArticleList();
      if (activeArticleIdx >= filterItems(SOURCES.find(function(s){return s.key===activeSourceKey;})?.items || []).length) {
        activeArticleIdx = -1;
      }
      renderReader();
    });
  }

  // ── Helpers ──
  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  // ── Init ──
  renderSidebar();
  // Auto-select first source with items
  var firstSrc = SOURCES.find(function(s){ return s.items.length > 0; });
  if (firstSrc) selectSource(firstSrc.key);

  // ── Live RSS update ──
  setTimeout(function(){
    fetch('/api/rss').then(function(r){
      if(!r.ok) throw new Error('API '+r.status);
      return r.json();
    }).then(function(data){
      if(!data.sources) return;
      var updated = 0;
      data.sources.forEach(function(live){
        if(!live.items||!live.items.length) return;
        var src = SOURCES.find(function(s){ return s.key === live.key; });
        if(!src) return;
        live.items.forEach(function(it){
          it.title_zh = it.title;
          it.summary_zh = it.summary || '';
        });
        src.items = live.items;
        updated++;
      });
      if(updated > 0){
        renderSidebar();
        if(viewMode === 'timeline') buildTimeline();
        renderArticleList();
        renderReader();
        // Show live update time in sidebar header
        var sidebar = document.getElementById('sidebar');
        if(sidebar){
          var old = document.getElementById('rssLiveTime');
          if(old) old.remove();
          var span = document.createElement('span');
          span.id = 'rssLiveTime';
          span.style.cssText = 'font-size:10px;color:var(--faint);font-family:var(--mono);display:block;padding:4px 12px;';
          var now = new Date();
          span.textContent = '✓ 已更新 ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
          sidebar.appendChild(span);
        }
        console.log('[RSS] Live updated:', updated, 'sources');
      }
    }).catch(function(e){ console.warn('[RSS] Live update failed:', e.message); });
  }, 800);
})();
</script>
</body>
</html>
