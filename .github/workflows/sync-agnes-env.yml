# 一次性工具：将 AGNES_API_KEY 同步到 Vercel 项目环境变量并触发生产重新部署。
# 用途：api/translate.js（Agnes 翻译代理）依赖 Vercel 侧 AGNES_API_KEY；
#       key 轮换或首次配置时手动触发本 workflow 即可，无需登录 Vercel CLI。
# 前提：仓库 Secrets 已配置 VERCEL_TOKEN（需 env 写入权限）与 AGNES_API_KEY。
name: Sync Agnes Env to Vercel
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout：CLI 从当前目录上传部署，缺 checkout 会用空目录覆盖生产
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── 部署守门（2026-10-08 P1：消掉 Vercel 的第二个写者风险）──────────────
      # 为什么需要：本 workflow 与 update.yml 都会 `vercel --prod`，但**两者喂给 Vercel 的输入不同**——
      # update.yml 是在 Prune 步删掉大产物之后才部署（update.yml:538-549），而本 workflow 部署的是
      # 一份未 prune 的 checkout。所以只要有一场 update 正在跑，本步就可能把生产 API 主机换成
      # "另一种输入"的版本（同 10-07 Pages 双写者的形状：不是谁改错了，是两条链路各自整棵覆盖）。
      # 收法照抄本仓已有先例 repo-trim.yml:137-139：不发明新机制，只做"期间有别人在动 ⇒ 中止让人重跑"。
      - name: Guard — no hourly build in flight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          running=$(gh api "repos/Kwei168/starhub/actions/runs?workflow=update.yml&status=in_progress&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="Update Star Hub")] | length')
          if [ "$running" != "0" ]; then
            echo "::error::有 $running 场 update.yml 正在跑，现在部署会和它争同一个 Vercel 生产版本；等它结束再重跑本 workflow"
            exit 1
          fi
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upsert AGNES_API_KEY on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VERCEL_PROJECT_ID: prj_7gK5d3EOJYTC8AmUxR2cNuHi7arB
        run: |
          payload=$(jq -n --arg k "AGNES_API_KEY" --arg v "$AGNES_API_KEY" \
            '{key:$k, value:$v, type:"encrypted", target:["production","preview","development"]}')
          resp=$(curl -s -o /tmp/env_resp.json -w "%{http_code}" -X POST \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "upsert http: $resp"
          head -c 300 /tmp/env_resp.json; echo
          if [ "$resp" != "200" ] && [ "$resp" != "201" ]; then exit 1; fi

      - name: Trigger production redeploy (vercel CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # CLI 必需：scope 与项目定位（缺失时 scoped token 报 User not found）
          VERCEL_ORG_ID: team_iovvEy0us9KkCNkuMRLQrIeA
          VERCEL_PROJECT_ID: prj_7gK5d3EOJYTC8AmUxR2cNuHi7arB
        run: |
          set -o pipefail
          npx --yes vercel --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tail -n 5

      # 部署期间 main 若前进了，说明我刚上传的那份已经过期（小时场可能已经推了新代码），
      # 生产就停在"旧代码 + 新 env"的组合上。不静默接受：报红让人重跑一次（同 repo-trim 的口径）。
      - name: Guard — main did not move during deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIVE=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LIVE" != "$BASE_SHA" ]; then
            echo "::error::部署期间 main 已前进（${BASE_SHA:0:10} -> ${LIVE:0:10}），刚上传的版本已过期；请重跑本 workflow"
            exit 1
          fi
          echo "生产版本对应 main=${LIVE:0:10}，部署期间无人推送"
