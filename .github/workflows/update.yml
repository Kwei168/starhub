name: Update Star Hub

on:
  schedule:
    # 每小时一次（UTC :16 触发，与 cron-job.org 整点错开 16 分钟）：构建兜底
    # （原 30 分钟档位经 8-17/8-18 观测多次被 GitHub Actions 跳过，已降级为兜底频率）
    - cron: "16 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: starhub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch stars & build
        run: python fetch_and_build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-daily.html known_categories.json descriptions_zh.json trending_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)"
            # 先拉取远端变更再推，避免并发提交被拒
            git pull --rebase
            git push
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel --prod --yes --token "$VERCEL_TOKEN"
