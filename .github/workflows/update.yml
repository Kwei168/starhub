name: Update Star Hub

on:
  schedule:
    # 每天 UTC 23:35 = 北京时间 07:35
    - cron: "35 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: starhub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch stars & build
        run: python fetch_and_build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html known_categories.json descriptions_zh.json trending_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)"
            # 先拉取远端变更再推，避免并发提交被拒
            git pull --rebase
            git push
          fi
