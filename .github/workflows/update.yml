name: Update Star Hub

on:
  schedule:
    # 每小时一次（UTC :16 触发，与 cron-job.org 整点错开 16 分钟）：构建兜底
    # （原 30 分钟档位经 8-17/8-18 观测多次被 GitHub Actions 跳过，已降级为兜底频率）
    - cron: "16 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: starhub-update
  cancel-in-progress: true  # 新触发取消旧排队，永远只跑最新一次，从根本上消除并发冲突

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，确保 reset 能正确追踪 origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync to latest remote
        run: |
          # 先同步到最新 remote 状态，再构建，确保基于最新数据
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch stars & build
        run: python fetch_and_build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-daily.html rss-aggregator.html known_categories.json descriptions_zh.json trending_snapshot.json translations.json rss_cache.json rss_history.json rss_sources.json rss_api_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)"
            # 基于最新 remote 构建，直接 push；cancel-in-progress:true 保证无并发
            # --force-with-lease 作为最后安全网：如果 remote 在 fetch 后被他人更新则拒绝
            git push --force-with-lease || {
              echo "Lease check failed, remote changed. Re-fetching and retrying..."
              git fetch origin main
              git reset --hard origin/main
              python fetch_and_build.py
              git add index.html ai-daily.html rss-aggregator.html known_categories.json descriptions_zh.json trending_snapshot.json translations.json rss_cache.json rss_history.json rss_sources.json rss_api_snapshot.json
              git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)" --allow-empty
              git push --force-with-lease
            }
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 项目链接通过环境变量生效（Vercel CLI 不支持 --project-id 命令行参数）
          VERCEL_PROJECT_ID: prj_7gK5d3EOJYTC8AmUxR2cNuHi7arB
          VERCEL_ORG_ID: team_iovvEy0us9KkCNkuMRLQrIeA
        run: npx --yes vercel --prod --yes --token "$VERCEL_TOKEN"
