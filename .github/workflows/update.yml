name: Update Star Hub

on:
  schedule:
    # UTC 21:00 = 北京 05:00 → 凌晨全量构建
    - cron: "0 21 * * *"
    # UTC 2/6/10/14 = 北京 10/14/18/22 → 白天增量构建
    - cron: "0 2,6,10,14 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full build (re-fetch all RSS sources)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: starhub-update
  cancel-in-progress: true  # 新触发取消旧排队，永远只跑最新一次，从根本上消除并发冲突

jobs:
  update:
    runs-on: ubuntu-latest
    # env 提升到 job 级：push 冲突重试分支在 "Commit & push" 步骤里重新跑构建，
    # 步骤级 env 会让重试构建拿不到翻译 key（退化）与 GitHub API 配额（403）
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      ZEN_API_KEY: ${{ secrets.ZEN_API_KEY || secrets.OPENCODE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGIHUNT_API_KEY: ${{ secrets.AGIHUNT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 完整历史，确保 reset 能正确追踪 origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync to latest remote
        run: |
          # 先同步到最新 remote 状态，再构建，确保基于最新数据
          git fetch origin main
          git reset --hard origin/main

      - name: Determine build mode
        run: |
          # workflow_dispatch 可强制 full；UTC 21:00 (北京 05:00) → full，其余 → incremental
          if [ "${{ github.event.inputs.force_full }}" = "true" ]; then
            echo "MODE=full" >> $GITHUB_ENV
            echo "构建模式: 全量 (full) [forced by workflow_dispatch]"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "21" ]; then
              echo "MODE=full" >> $GITHUB_ENV
              echo "构建模式: 全量 (full)"
            else
              echo "MODE=incremental" >> $GITHUB_ENV
              echo "构建模式: 增量 (incremental)"
            fi
          fi

      - name: Install insight engine dependencies
        run: pip install llama-index-core llama-index-embeddings-fastembed fastembed faiss-cpu rank-bm25

      - name: Restore embedding cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            daily_insight_vectors.npy
            daily_insight_chunks.json
            daily_insight_faiss.index
          key: emb-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            emb-cache-${{ runner.os }}-

      - name: Diagnose embedding cache restore
        run: |
          echo "=== Cache restore diagnostics ==="
          echo "  cache-key: emb-cache-${{ runner.os }}-${{ github.run_id }}"
          echo "  cache-hit: ${{ steps.cache-restore.outputs.cache-hit }}"
          echo "  matched-key: ${{ steps.cache-restore.outputs.matched-key }}"
          for f in daily_insight_vectors.npy daily_insight_chunks.json daily_insight_faiss.index; do
            if [ -f "$f" ]; then
              echo "  ✓ $f ($(du -h "$f" | cut -f1))"
            else
              echo "  ✗ $f MISSING"
            fi
          done

      - name: Fetch stars & build
        run: python fetch_and_build.py $MODE

      - name: Cleanup old build logs
        run: |
          python -c "
          import build_logger
          removed = build_logger.cleanup(14)
          print('[日志] 已清理 %d 个过期日志文件: %s' % (len(removed), removed) if removed else '[日志] 无过期日志需要清理')
          "

      - name: Log trigger event
        run: |
          python -c "
          import json, os
          from datetime import datetime, timezone, timedelta
          BJT = timezone(timedelta(hours=8))
          trigger = 'schedule' if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' else 'workflow_dispatch'
          entry = {
              'ts': datetime.now(BJT).isoformat(),
              'type': 'trigger',
              'trigger': trigger,
              'mode': os.environ.get('MODE', 'unknown'),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'sha': os.environ.get('GITHUB_SHA', '')[:12],
          }
          os.makedirs('build_logs', exist_ok=True)
          today = datetime.now(BJT).strftime('%Y-%m-%d')
          with open(f'build_logs/{today}.jsonl', 'a') as f:
              f.write(json.dumps(entry, ensure_ascii=False) + '\n')
          print(f'[日志] trigger 事件已记录: {trigger} / {os.environ.get(\"MODE\", \"?\")}')
          "

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-daily.html rss-aggregator.html rss-data-*.js known_categories.json descriptions_zh.json trending_snapshot.json translations.json rss_history.json rss_sources.json hot_snapshot.json analysis_snapshot.json rss_trend_history.json build_logs/ insight_tracking_history.jsonl build_rss_aggregator.py insight_engine.py build_daily_insight.py test_daily_insight.py daily-insight-history.html
          if [ -f hot_history.json ]; then git add hot_history.json; fi
          if [ -f daily-insight.json ]; then git add daily-insight.json; fi
          if [ -f daily_insight_history.json ]; then git add daily_insight_history.json; fi
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)"
            # 普通 push；cancel-in-progress:true 保证无并发
            # 如果 remote 在 fetch 后被更新，reset --soft 吸收后重试，无需 force
            git push || {
              echo "Push failed, remote changed. Trying fast retry..."
              git fetch origin main
              # git reset --soft 保留工作区（含构建产物），将 HEAD 对齐到最新 origin/main
              git reset --soft origin/main
              # 重新 stage 所有产物 + 日志（现在也包含 remote 带来的变更）
              git add index.html ai-daily.html rss-aggregator.html rss-data-*.js known_categories.json descriptions_zh.json trending_snapshot.json translations.json rss_history.json rss_sources.json hot_snapshot.json analysis_snapshot.json rss_trend_history.json build_logs/ insight_tracking_history.jsonl build_rss_aggregator.py insight_engine.py build_daily_insight.py test_daily_insight.py daily-insight-history.html
              if [ -f hot_history.json ]; then git add hot_history.json; fi
              if [ -f daily-insight.json ]; then git add daily-insight.json; fi
              if [ -f daily_insight_history.json ]; then git add daily_insight_history.json; fi
              git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)" --allow-empty
              if git push; then
                echo "Rebase retry succeeded — no re-fetch needed."
              else
                echo "Rebase retry also failed. Falling back to full rebuild..."
                git reset --hard origin/main
                python fetch_and_build.py $MODE
                git add index.html ai-daily.html rss-aggregator.html rss-data-*.js known_categories.json descriptions_zh.json trending_snapshot.json translations.json rss_history.json rss_sources.json hot_snapshot.json analysis_snapshot.json rss_trend_history.json build_logs/ insight_tracking_history.jsonl build_rss_aggregator.py insight_engine.py build_daily_insight.py test_daily_insight.py daily-insight-history.html
                if [ -f hot_history.json ]; then git add hot_history.json; fi
                if [ -f daily-insight.json ]; then git add daily-insight.json; fi
                if [ -f daily_insight_history.json ]; then git add daily_insight_history.json; fi
                git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)" --allow-empty
                git push
              fi
            }
          fi

      - name: Save embedding cache (before prune deletes .npy)
        uses: actions/cache/save@v4
        with:
          path: |
            daily_insight_vectors.npy
            daily_insight_chunks.json
            daily_insight_faiss.index
          key: emb-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Prune large build artifacts before Vercel deploy
        run: |
          # 构建产物只供 GitHub Pages 加载，Vercel 只需要 api/ + HTML 入口 + vercel.json
          # 直接删除避免 .vercelignore glob 不可靠导致 367MB 上传超限
          rm -f rss-data-*.js rss_api_snapshot*.json
          rm -f rss_cache.json rss_history.json hot_history.json hot_snapshot.json
          rm -f analysis_snapshot.json translations.json trending_snapshot.json
          rm -f source_quality.json rss_trend_history.json known_categories.json descriptions_zh.json
          rm -f daily-insight.json daily_insight_history.json daily_insight_snapshot.json
          rm -f daily_insight_tracking_history.jsonl daily_insight_faiss.index daily_insight_chunks.json daily_insight_vectors.npy
          rm -f emb_cache.json
          rm -rf .deploy-tmp .workbuddy .zcode __pycache__ .pytest_cache build_logs docs
          echo "Pruned. Remaining size:"
          du -sh .

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 项目链接通过环境变量生效（Vercel CLI 不支持 --project-id 命令行参数）
          VERCEL_PROJECT_ID: prj_7gK5d3EOJYTC8AmUxR2cNuHi7arB
          VERCEL_ORG_ID: team_iovvEy0us9KkCNkuMRLQrIeA
        run: |
          # Vercel CLI 上传后偶发网络瞬时故障（fetch failed），退避重试 5 次
          ok=0
          for i in 1 2 3 4 5; do
            echo "Vercel deploy attempt $i/5..."
            if npx --yes vercel --prod --yes --token "$VERCEL_TOKEN"; then ok=1; break; fi
            if [ "$i" != "5" ]; then sleep $((i*15)); fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Vercel deploy failed after 5 attempts"
            exit 1
          fi

      - name: Log deploy result
        if: always()
        run: |
          python -c "
          import json, os
          from datetime import datetime, timezone, timedelta
          BJT = timezone(timedelta(hours=8))
          entry = {
              'ts': datetime.now(BJT).isoformat(),
              'type': 'deploy',
              'status': 'success' if '${{ job.status }}' == 'success' else 'failed',
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
          }
          os.makedirs('build_logs', exist_ok=True)
          today = datetime.now(BJT).strftime('%Y-%m-%d')
          with open(f'build_logs/{today}.jsonl', 'a') as f:
              f.write(json.dumps(entry, ensure_ascii=False) + '\n')
          print(f'[日志] deploy 事件已记录: {entry[\"status\"]}')
          "

      - name: Generate daily summary
        run: |
          python -c "
          import build_logger
          from datetime import datetime, timezone, timedelta
          BJT = timezone(timedelta(hours=8))
          today = datetime.now(BJT).strftime('%Y-%m-%d')
          s = build_logger.summary(today)
          import json
          with open(f'build_logs/summary_{today}.json', 'w') as f:
              json.dump(s, f, ensure_ascii=False, indent=2)
          print(f'[日志] 当日摘要已生成: {s[\"builds\"]} 次构建, {s[\"total_items_latest\"]} 篇')
          "
