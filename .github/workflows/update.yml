name: Update Star Hub

on:
  schedule:
    # 每小时一次（UTC :16 触发，与 cron-job.org 整点错开 16 分钟）：构建兜底
    # （原 30 分钟档位经 8-17/8-18 观测多次被 GitHub Actions 跳过，已降级为兜底频率）
    - cron: "16 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: starhub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch stars & build
        run: python fetch_and_build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-daily.html known_categories.json descriptions_zh.json trending_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)"
            # --autostash: 自动暂存未提交变更再 rebase，解决并发构建冲突
            git pull --rebase --autostash || {
              echo "Rebase conflict, resetting to remote and re-committing..."
              git rebase --abort 2>/dev/null; git stash drop 2>/dev/null
              git reset --hard origin/main
              git add index.html ai-daily.html known_categories.json descriptions_zh.json trending_snapshot.json
              git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)" --allow-empty
            }
            # push 重试 3 次，应对并发 push 窗口竞争
            for i in 1 2 3; do
              git push && break
              echo "Push failed (attempt $i), retrying..."
              git pull --rebase --autostash || git reset --hard origin/main
              sleep 3
            done
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel --prod --yes --token "$VERCEL_TOKEN"
